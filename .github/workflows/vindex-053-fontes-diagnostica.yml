# Diagnostica unica casus G2 post migrationem fontium.
name: VINDEX 0.53 — Diagnostica fontium

on:
  push:
    branches: [chatgpt/vindex-053-compilator-dynamicus]
    paths:
      - '.github/workflows/vindex-053-fontes-diagnostica.yml'

permissions:
  contents: write

jobs:
  diagnostica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/vindex-053-compilator-dynamicus
          fetch-depth: 0
      - shell: bash
        run: |
          set +e
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          R=/tmp/diag
          : >"$R"
          chmod 755 "$RADIX/compilator_vindex"
          python3 - <<'PY' >>"$R" 2>&1
          from pathlib import Path
          p=Path('Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex')
          t=p.read_text(encoding='utf-8')
          q=t.replace('213001','524289').replace('213000','524288').replace('212999','524287')
          Path('/tmp/pontis.vindex').write_text(q,encoding='utf-8')
          PY
          "$RADIX/compilator_vindex" /tmp/pontis.vindex /tmp/pontis >>"$R" 2>&1
          chmod 755 /tmp/pontis
          python3 "$RADIX/instrumenta/applica_fontes_dynamicos_053.py" >>"$R" 2>&1
          /tmp/pontis "$RADIX/src/compilator_vindex.vindex" /tmp/g1 >>"$R" 2>&1
          chmod 755 /tmp/g1
          printf '%s\n' '--- G1 metadata ---' >>"$R"
          file /tmp/g1 >>"$R" 2>&1
          stat -c 'g1=%s octeta' /tmp/g1 >>"$R" 2>&1
          sha256sum /tmp/g1 >>"$R" 2>&1

          printf '%s\n' '--- Executio ordinaria G1 -> G2 ---' >>"$R"
          /tmp/g1 "$RADIX/src/compilator_vindex.vindex" /tmp/g2 >>"$R" 2>&1
          S=$?
          printf 'STATUS=%s.\n' "$S" >>"$R"
          if [ -e /tmp/g2 ]; then
            stat -c 'g2=%s octeta' /tmp/g2 >>"$R" 2>&1
            sha256sum /tmp/g2 >>"$R" 2>&1
          else
            printf '%s\n' 'G2 deest.' >>"$R"
          fi

          if command -v strace >/dev/null 2>&1; then
            printf '%s\n' '--- STRACE ---' >>"$R"
            strace -f -o /tmp/strace /tmp/g1 "$RADIX/src/compilator_vindex.vindex" /tmp/g2_strace >/tmp/stdout_strace 2>&1
            SS=$?
            printf 'STATUS STRACE=%s.\n' "$SS" >>"$R"
            tail -n 80 /tmp/strace >>"$R" 2>&1
          else
            printf '%s\n' 'STRACE deest.' >>"$R"
          fi

          if command -v gdb >/dev/null 2>&1; then
            printf '%s\n' '--- GDB ---' >>"$R"
            gdb -q -batch \
              -ex 'set pagination off' \
              -ex 'run' \
              -ex 'info registers rip rsp rbp rax rbx rcx rdx rsi rdi r11' \
              -ex 'x/12i $rip-16' \
              --args /tmp/g1 "$RADIX/src/compilator_vindex.vindex" /tmp/g2_gdb >>"$R" 2>&1
          else
            printf '%s\n' 'GDB deest.' >>"$R"
          fi

          printf '%s\n' '--- Pila illimitata ---' >>"$R"
          (ulimit -s unlimited; /tmp/g1 "$RADIX/src/compilator_vindex.vindex" /tmp/g2_stack) >>"$R" 2>&1
          SU=$?
          printf 'STATUS PILA ILLIMITATA=%s.\n' "$SU" >>"$R"

          cd "$GITHUB_WORKSPACE"
          F="$RADIX/instrumenta/RELATIO-DIAGNOSTICA-FONTIUM-053.md"
          { printf '%s\n\n' '# VINDEX 0.53 — Diagnostica fontium'; printf '%s\n' '```text'; cat "$R"; printf '%s\n' '```'; } >"$F"
          git config user.name 'VINDEX Centurio'; git config user.email 'actions@users.noreply.github.com'
          git add "$F"
          if ! git diff --cached --quiet; then
            git commit -m 'VINDEX 0.53: casum fontium diagnostica'
            git push origin HEAD:chatgpt/vindex-053-compilator-dynamicus
          fi
          exit 0
