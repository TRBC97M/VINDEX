name: VINDEX — Canonizatio ORDO DE LITTERA

on:
  pull_request:
    paths:
      - 'instrumenta/applica_ordo_littera_patch.py'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/proba_ordo_littera.vindex'
      - '.github/workflows/vindex-ordo-littera-canoniza.yml'

permissions:
  contents: write

jobs:
  canoniza:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ramum ipsum accipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Correctio ORDO DE LITTERA applica
        shell: bash
        run: |
          set -euo pipefail
          python3 instrumenta/applica_ordo_littera_patch.py

      - name: Compilatorem auto-hospitem ad punctum fixum regenera
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          chmod +x compilator_vindex
          ./compilator_vindex src/compilator_vindex.vindex /tmp/g2
          chmod +x /tmp/g2
          /tmp/g2 src/compilator_vindex.vindex /tmp/g3
          chmod +x /tmp/g3
          cmp /tmp/g2 /tmp/g3
          cp /tmp/g3 compilator_vindex
          chmod +x compilator_vindex
          ./compilator_vindex src/compilator_vindex.vindex /tmp/g4
          cmp compilator_vindex /tmp/g4
          echo 'RECTE: G2 = G3 = compilator canonicus.'

      - name: Regressionem ORDO DE LITTERA ante commit proba
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex tests/proba_ordo_littera.vindex /tmp/proba_ordo_littera
          chmod +x /tmp/proba_ordo_littera
          /tmp/proba_ordo_littera

      - name: Mutationem canonicam in ramum repone
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex' \
                  'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
          if git diff --cached --quiet; then
            echo 'RECTE: nihil novum commitendum est.'
            exit 0
          fi
          git commit -m 'P9: ORDO DE LITTERA byte-addressatum canoniza'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
