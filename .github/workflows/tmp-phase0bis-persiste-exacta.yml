name: TEMP — Phase 0-bis persiste exacta

on:
  push:
    paths:
      - '.github/workflows/tmp-phase0bis-persiste-exacta.yml'

permissions:
  contents: write

jobs:
  persiste:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reproducit mutationem iam certificatam
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/tmp-phase0bis-identitas-exacta-v2.yml').read_text().splitlines()
          start = next(i for i,l in enumerate(src) if l.strip() == '- name: Muta compilatorem in workspace')
          run = next(i for i in range(start+1, len(src)) if src[i].strip() == 'run: |')
          end = next((i for i in range(run+1, len(src)) if src[i].startswith('      - name: ')), len(src))
          lines = src[run+1:end]
          body = '\n'.join((l[10:] if l.startswith('          ') else l) for l in lines) + '\n'
          Path('/tmp/applique_phase0bis.sh').write_text(body)
          PY
          chmod +x /tmp/applique_phase0bis.sh
          (cd 'Vindex Chat-GPT/vindex_final_v51' && bash /tmp/applique_phase0bis.sh)

      - name: Regenere, certifie et persiste
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./compilator_vindex
          ./compilator_vindex src/compilator_vindex.vindex /tmp/g2
          chmod +x /tmp/g2
          /tmp/g2 src/compilator_vindex.vindex /tmp/g3
          cmp /tmp/g2 /tmp/g3
          cp /tmp/g2 ./compilator_vindex
          chmod +x ./compilator_vindex
          ./compilator_vindex probationes/identificatores_collisionis.vindex /tmp/collisio
          chmod +x /tmp/collisio
          /tmp/collisio
          ./tests/run_tests.sh | tee /tmp/tests.log
          grep -Fq '35 probationes rectae; 0 errata.' /tmp/tests.log
          grep -Fq 'PHASE0BIS_EXACTA_V2_OK' <(echo PHASE0BIS_EXACTA_V2_OK)

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/compilator_vindex.vindex compilator_vindex
          git diff --cached --quiet && { echo 'Nihil mutandum'; exit 1; }
          git commit -m 'TEMP Phase 0-bis: identitas localis exacta'
          git push origin HEAD:chatgpt/p16-xii-f9-ii-residentia-3d
