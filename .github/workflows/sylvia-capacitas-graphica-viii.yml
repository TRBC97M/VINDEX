name: Sylvia OS — Capacitas Graphica VIII

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_graphica_viii.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_graphica_viii_superficies.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_damage_viii.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_typographia_viii.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/capacitas_graphica_viii.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/capacitas_graphica_viii_superficies.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_graphica_vii.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/imago_raster_vii.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/imago_raster_partes_vii.vindex'
      - 'documenta/sylvia/GRAPHICA_VIII.md'
      - '.github/workflows/sylvia-capacitas-graphica-viii.yml'
  push:
    branches:
      - main
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_graphica_viii.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_graphica_viii_superficies.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_damage_viii.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_typographia_viii.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/capacitas_graphica_viii.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/capacitas_graphica_viii_superficies.vindex'
      - 'documenta/sylvia/GRAPHICA_VIII.md'
      - '.github/workflows/sylvia-capacitas-graphica-viii.yml'

permissions:
  contents: read

jobs:
  graphica-viii:
    name: Clipping, damage, scaling, 9-slice et typographia
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v5

      - name: Compilator exsecutabilis sit
        shell: bash
        run: chmod +x 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'

      - name: Puritatem Sylviae verifica
        shell: bash
        run: |
          set -euo pipefail
          python3 instrumenta/verifica_puritatem_sylviae.py

      - name: Contractus Graphica VIII custodi
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          g='bibliotheca/fenestrale_graphica_viii.vindex'
          s='bibliotheca/fenestrale_graphica_viii_superficies.vindex'
          d='bibliotheca/fenestrale_damage_viii.vindex'
          t='bibliotheca/fenestrale_typographia_viii.vindex'
          for signum in \
            'FUNCTIO GVIII_RECT_SECA REDDENS NUMERUS' \
            'FUNCTIO GVIII_RECT_ROTUNDUS_FB REDDENS NUMERUS' \
            'FUNCTIO GVIII_RECT_ROTUNDUS_S REDDENS NUMERUS' \
            'FUNCTIO GVIII_SIMG_REGIONEM_SCALA_FB REDDENS NUMERUS' \
            'FUNCTIO GVIII_SUPERFICIES_SCALA_LINEARIS_FB REDDENS NUMERUS' \
            'FUNCTIO GVIII_SIMG_NOVEM_PARTES_FB REDDENS NUMERUS'
          do grep -Fq "$signum" "$g"; done
          grep -Fq 'FUNCTIO GVIII_SUPERFICIES_COPIA_RECT REDDENS NUMERUS' "$s"
          grep -Fq 'FUNCTIO GVIII_SIMG_NOVEM_PARTES_S REDDENS NUMERUS' "$s"
          grep -Fq 'FUNCTIO DVIII_ADDE REDDENS NUMERUS' "$d"
          grep -Fq 'FUNCTIO DVIII_COLLAPSA REDDENS NUMERUS' "$d"
          grep -Fq 'FUNCTIO TVIII_GLYPHUM_FB REDDENS NUMERUS' "$t"
          grep -Fq 'FUNCTIO TVIII_TEXTUM_S REDDENS NUMERUS' "$t"
          for f in "$g" "$s" "$d" "$t"; do ! grep -Eq '(^|[^A-Z0-9_])POLLE\(\)' "$f"; done
          printf '%s\n' 'RECTE: contractus Graphica VIII adsunt et nullum POLLE occultum continetur.'

      - name: Primitivas Graphica VIII compila et exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex probationes/capacitas_graphica_viii.vindex /tmp/graphica-viii
          chmod +x /tmp/graphica-viii
          timeout 15s /tmp/graphica-viii
          printf '%s\n' 'RECTE: clipping, damage, scaling math et typographiae contractus transeunt.'

      - name: Superficies Graphica VIII compila et exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex probationes/capacitas_graphica_viii_superficies.vindex /tmp/graphica-viii-superficies
          chmod +x /tmp/graphica-viii-superficies
          timeout 15s /tmp/graphica-viii-superficies
          printf '%s\n' 'RECTE: rectangulum rotundum anti-aliased et copia superficierum vere exercentur.'

      - name: Regressio Graphica VII compila et exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex probationes/capacitas_graphica_vii.vindex /tmp/graphica-vii
          chmod +x /tmp/graphica-vii
          timeout 15s /tmp/graphica-vii
          printf '%s\n' 'RECTE: fundamentum P16-VII non regressum est.'
