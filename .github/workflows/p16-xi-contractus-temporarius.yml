name: P16-XI — Contractus temporarius

on:
  push:
    branches:
      - chatgpt/p16-xi-bureau-lucidum-ii
    paths:
      - '.github/workflows/p16-xi-contractus-temporarius.yml'

permissions:
  contents: write

jobs:
  adapta:
    name: Contractum canonicum ad P16-XI adapta
    runs-on: ubuntu-24.04
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v5
        with:
          ref: chatgpt/p16-xi-bureau-lucidum-ii
          fetch-depth: 0

      - name: Contractum P16-XI confirma
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/sylvia-fenestrale-vindex-purus-i.yml')
          s = p.read_text(encoding='utf-8')

          ancora = "      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_compositor_ix.vindex'\n"
          addita = ancora + (
              "      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_graphica_viii.vindex'\n"
              "      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_typographia_viii.vindex'\n"
              "      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fons_ui_viii.vindex'\n"
              "      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/materia_ui_viii.vindex'\n"
              "      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_bureau_xi.vindex'\n"
              "      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_compositor_xi.vindex'\n"
          )
          if ancora not in s:
              raise SystemExit('DEFECIT: ancora viarum P16-IX deest')
          s = s.replace(ancora, addita, 1)

          vetus = "          uix='bibliotheca/fenestrale_compositor_ix.vindex'\n"
          novum = vetus + "          uxi='bibliotheca/fenestrale_compositor_xi.vindex'\n"
          if vetus not in s:
              raise SystemExit('DEFECIT: variabile compositoris IX deest')
          s = s.replace(vetus, novum, 1)

          vetus = "          grep -Fq 'IVIX_REDDE(s,s[37],s[36],s[39]' \"$s\"\n"
          novum = "          grep -Fq 'IVXI_REDDE(s,s[37],s[36],s[39]' \"$s\"\n"
          if vetus not in s:
              raise SystemExit('DEFECIT: contractus systematis P16-IX deest')
          s = s.replace(vetus, novum, 1)

          ancora = "          grep -Fq 'CIX_TASKBAR_REDDE(s,fenestrae,clientes,applicationes)' \"$uix\"\n"
          addita = ancora + (
              "          grep -Fq 'FUNCTIO IVXI_REDDE REDDENS NUMERUS' \"$uxi\"\n"
              "          grep -Fq 'CXI_BUREAU_REDDE(s,applicationes)' \"$uxi\"\n"
              "          grep -Fq 'CVIII_FENESTRA(fenestrae,clientes,applicationes,n)' \"$uxi\"\n"
              "          grep -Fq 'CIX_INITIUM_REDDE(s,applicationes)' \"$uxi\"\n"
              "          grep -Fq 'CIX_TASKBAR_REDDE(s,fenestrae,clientes,applicationes)' \"$uxi\"\n"
          )
          if ancora not in s:
              raise SystemExit('DEFECIT: finis contractuum compositoris IX deest')
          s = s.replace(ancora, addita, 1)

          vetus = '"$cviii" "$uviii" "$cix" "$uix" "$v"'
          novum = '"$cviii" "$uviii" "$cix" "$uix" "$uxi" "$v"'
          if vetus not in s:
              raise SystemExit('DEFECIT: catalogus puritatis compositorum deest')
          s = s.replace(vetus, novum, 1)

          s = s.replace(
              'RECTE: Fenestrale P16-IX super P16-VIII, TERMINALE et OFFICINA P19-II contractibus dynamicis respondent.',
              'RECTE: Fenestrale P16-XI super P16-VIII et testa P16-IX, TERMINALE et OFFICINA P19-II contractibus dynamicis respondent.',
          )
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name 'TRBC97M'
          git config user.email 'trbc97m@protonmail.com'
          git add '.github/workflows/sylvia-fenestrale-vindex-purus-i.yml'
          git diff --cached --check
          git commit -m 'P16-XI: contractum canonicum ad compositorem XI promove'
          git push origin HEAD:chatgpt/p16-xi-bureau-lucidum-ii
