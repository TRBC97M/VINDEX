name: Sylvia OS — Fenestrale II Purus D canonicus

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_ii_purus.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_ii_superficies.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/fenestrale_ii_purus_d.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/fenestrale_purus_d_*.vindex'
      - 'documenta/sylvia/FENESTRALE_II_PVRVS_D.md'
      - '.github/workflows/sylvia-fenestrale-vindex-purus-d.yml'

jobs:
  vindex-purus-d:
    name: Superficies privata Fenestralis D VINDEX certificatur
    runs-on: ubuntu-24.04
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v4

      - name: Puritatem Sylviae verifica
        shell: bash
        run: |
          set -euo pipefail
          python3 instrumenta/verifica_puritatem_sylviae.py

      - name: Fontes VINDEX verifica
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          python3 instrumenta/vindex_verifica.py systema/fenestrale_ii_purus_d.vindex
          python3 instrumenta/vindex_verifica.py probationes/fenestrale_purus_d_superficies.vindex

      - name: Contractum superficiei verifica
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          s='bibliotheca/fenestrale_ii_superficies.vindex'
          f='systema/fenestrale_ii_purus_d.vindex'
          for signum in \
            'FUNCTIO FS_CREA' 'RESERVA_OCTETA' 'FUNCTIO FS_PIXEL' \
            'FUNCTIO FS_RECT' 'FUNCTIO FS_TEXTUM' 'FUNCTIO FS_BLIT' \
            'FUNCTIO FS_PROGRAMMATA_RENDE'
          do
            grep -Fq "$signum" "$s" || { echo "ERRATUM: $signum deest"; exit 1; }
          done
          for signum in \
            'IMPORTA "bibliotheca/fenestrale_ii_superficies.vindex"' \
            's[30]=FS_CREA(496,260)' 'FS_PROGRAMMATA_RENDE(s[30])' \
            'FUNCTIO FD_PROGRAMMATA' 'FS_BLIT(s[30]' 'FUNCTIO FD_REDDE' \
            'FUNCTIO PRINCIPALIS'
          do
            grep -Fq "$signum" "$f" || { echo "ERRATUM: $signum deest"; exit 1; }
          done
          ! grep -Eq '(^|[^A-Z0-9_])POLLE\(\)' "$s"
          ! grep -Eq '(^|[^A-Z0-9_])POLLE\(\)' "$f"

      - name: Probationem superficiei compila
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          chmod +x compilator_vindex
          ./compilator_vindex probationes/fenestrale_purus_d_superficies.vindex /tmp/fenestrale_purus_d_superficies.elf
          file /tmp/fenestrale_purus_d_superficies.elf | grep -q 'ELF 64-bit'

      - name: Fenestrale D totum compila
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex systema/fenestrale_ii_purus_d.vindex /tmp/fenestrale_ii_purus_d.elf
          file /tmp/fenestrale_ii_purus_d.elf | grep -q 'ELF 64-bit'
          test "$(stat -c '%s' /tmp/fenestrale_ii_purus_d.elf)" -lt 196608
          printf '%s\n' 'RECTE: Fenestrale II Purus D superficiem privatam VINDEX certificat.'
