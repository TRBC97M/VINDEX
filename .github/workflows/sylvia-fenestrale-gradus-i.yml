name: Sylvia OS — Fenestrale II Gradus I

on:
  pull_request:
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/systema/uefi/fenestrale_native_i.c'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/uefi/construe_fenestrale_native_i.sh'
      - 'Vindex Chat-GPT/vindex_final_v51/src/programmata_fenestrale_ii_h.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/src/tabula_fenestrale_ii_i.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/proba_fenestrale_ii_i.py'
      - 'documenta/sylvia/FENESTRALE_II_GRADUS_I.md'
      - '.github/workflows/sylvia-fenestrale-gradus-i.yml'
  push:
    branches: [main]
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/systema/uefi/fenestrale_native_i.c'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/uefi/construe_fenestrale_native_i.sh'
      - 'Vindex Chat-GPT/vindex_final_v51/src/tabula_fenestrale_ii_i.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/proba_fenestrale_ii_i.py'
      - '.github/workflows/sylvia-fenestrale-gradus-i.yml'

jobs:
  constructio:
    name: PROGRAMMATA et TABULA simul construuntur
    runs-on: ubuntu-latest
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v4
      - name: ABI D verifica
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: python3 tests/proba_fenestrale_ii_abi_d.py
      - name: Mailbox G verifica
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: python3 tests/proba_fenestrale_ii_compositor_g.py
      - name: Gradum H verifica
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: python3 tests/proba_fenestrale_ii_h.py
      - name: Gradum I verifica
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: python3 tests/proba_fenestrale_ii_i.py
      - name: Compositorium I construe
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          bash systema/uefi/construe_fenestrale_native_i.sh \
            /tmp/FENESTRALEI.EFI \
            /tmp/fenestrale_i_uefi.img
      - name: Exitus verifica
        run: |
          file /tmp/FENESTRALEI.EFI
          objdump -p /tmp/FENESTRALEI.EFI | grep 'Subsystem.*EFI application'
          test -s /tmp/fenestrale_i_uefi.img
          test "$(stat -c %s /tmp/fenestrale_i_uefi.img)" -ge 67108864
