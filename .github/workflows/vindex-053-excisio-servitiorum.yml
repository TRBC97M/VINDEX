# Custodia externa ad vestigia servitiorum historicorum e nucleo exscindenda.
name: VINDEX 0.53 — Excisio servitiorum

on:
  pull_request:
    branches:
      - infrastructura/vindex-053-ci-purificatio

permissions:
  contents: write

jobs:
  praepara:
    if: github.event.pull_request.head.ref == 'infrastructura/vindex-053-excisio-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Ramum excisionis accipe
        uses: actions/checkout@v5
        with:
          ref: chatgpt/vindex-053-excisio-servitiorum

      - name: Vestigia historica e fonte exscinde
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          via = Path('src/compilator_vindex.vindex')
          lines = via.read_text(encoding='utf-8').splitlines(keepends=True)

          def remove_outer_if(needle: str) -> None:
              global lines
              matches = [i for i, line in enumerate(lines) if needle in line]
              if len(matches) != 1:
                  raise SystemExit(f'ERRATUM: {needle!r} inventum {len(matches)} vicibus')
              idx = matches[0]
              start = None
              for j in range(idx, -1, -1):
                  if lines[j].startswith('    SI '):
                      start = j
                      break
              if start is None:
                  raise SystemExit(f'ERRATUM: initium SI deest pro {needle!r}')
              depth = 0
              end = None
              for j in range(start, len(lines)):
                  s = lines[j].strip()
                  if s.startswith('SI ') and s.endswith(' TUNC'):
                      depth += 1
                  elif s == 'FIN-SI.':
                      depth -= 1
                      if depth == 0:
                          end = j + 1
                          break
              if end is None:
                  raise SystemExit(f'ERRATUM: finis SI deest pro {needle!r}')
              del lines[start:end]

          def remove_function(name: str) -> None:
              global lines
              signum = f'FUNCTIO {name} REDDENS NUMERUS.\n'
              matches = [i for i, line in enumerate(lines) if line == signum]
              if len(matches) != 1:
                  raise SystemExit(f'ERRATUM: functio {name} inventa {len(matches)} vicibus')
              start = matches[0]
              end = None
              for j in range(start + 1, len(lines)):
                  if lines[j].strip() == 'FIN-FUNCTIO.':
                      end = j + 1
                      break
              if end is None:
                  raise SystemExit(f'ERRATUM: finis functionis {name} deest')
              del lines[start:end]
              if start < len(lines) and lines[start].strip() == '':
                  del lines[start]

          for needle in (
              'CONTENTUM(pos_codicis) = COMPONE_CURRE(',
              'CONTENTUM(pos_codicis) = COMPONE_TUBUS(',
              'CONTENTUM(pos_codicis) = COMPONE_CAMBIA_DIRECTORIUM(',
              'DECLARA ig_ex SICUT NUMERUS VALENS IGNORA_SPATIA',
              'DECLARA ig_exc SICUT NUMERUS VALENS IGNORA_SPATIA',
              '50333704',
          ):
              remove_outer_if(needle)

          for name in ('COMPONE_CURRE', 'COMPONE_TUBUS', 'COMPONE_CAMBIA_DIRECTORIUM'):
              remove_function(name)

          text = ''.join(lines)
          text = text.replace(
              '// Continet omnes functiones ex prioribus experimentis collectas.\n',
              '// Continet functiones nuclei canonici VINDEX 0.53.\n',
              1,
          )

          prohibita = (
              'COMPONE_CURRE', 'COMPONE_TUBUS', 'COMPONE_CAMBIA_DIRECTORIUM',
              '50333704', 'ig_ex SICUT', 'ig_exc SICUT',
          )
          for nomen in prohibita:
              if nomen in text:
                  raise SystemExit(f'ERRATUM: vestigium remanet: {nomen}')

          via.write_text(text, encoding='utf-8', newline='\n')
          print('RECTE: CURRE, TUBUS, CAMBIA, EXSEQUERE, EXSEQUERE_CAPTURA et POLLE e fonte excisa sunt.')
          PY

      - name: Punctum fixum novum construe
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 ./compilator_vindex
          F='src/compilator_vindex.vindex'
          ./compilator_vindex "$F" "$RUNNER_TEMP/gen1"
          chmod 755 "$RUNNER_TEMP/gen1"
          "$RUNNER_TEMP/gen1" "$F" "$RUNNER_TEMP/gen2"
          chmod 755 "$RUNNER_TEMP/gen2"
          "$RUNNER_TEMP/gen2" "$F" "$RUNNER_TEMP/gen3"
          chmod 755 "$RUNNER_TEMP/gen3"
          cmp "$RUNNER_TEMP/gen2" "$RUNNER_TEMP/gen3"
          "$RUNNER_TEMP/gen2" tests/compara_fasciculos_053.vindex "$RUNNER_TEMP/compara_fasciculos"
          chmod 755 "$RUNNER_TEMP/compara_fasciculos"
          "$RUNNER_TEMP/compara_fasciculos" "$RUNNER_TEMP/gen2" "$RUNNER_TEMP/gen3"
          cp "$RUNNER_TEMP/gen2" ./compilator_vindex
          chmod 755 ./compilator_vindex
          sha256sum ./compilator_vindex | sed 's#  ./#  #' > SIGILLA_SHA256.txt
          ./compilator_vindex "$F" "$RUNNER_TEMP/gen_finalis"
          chmod 755 "$RUNNER_TEMP/gen_finalis"
          "$RUNNER_TEMP/compara_fasciculos" ./compilator_vindex "$RUNNER_TEMP/gen_finalis"
          sha256sum ./compilator_vindex

      - name: Contractum semanticum comproba
        shell: bash
        run: |
          set -euo pipefail
          C='./compilator_vindex'
          proba() {
            nomen="$1"; fons="$2"; exspectatum="$3"; shift 3
            exe="$RUNNER_TEMP/$nomen"
            "$C" "tests/casus/$fons" "$exe"
            chmod 755 "$exe"
            set +e
            productum="$($exe "$@")"
            status=$?
            set -e
            test "$status" -eq 0
            test "$productum" = "$exspectatum"
            printf 'RECTE  %s\n' "$nomen"
          }
          proba salve salve.vindex 'Salve, VINDEX!'
          proba calculus calculus.vindex "$(printf '42\n1\n2\n3\n-42\n2')"
          proba fluitans fluitans.vindex "$(printf '4.640000\n1')"
          proba importa importa.vindex '49'
          proba structura-acus structura_acus.vindex "$(printf '150\n99')"
          proba recursio recursio.vindex '720'
          proba argumenta argumenta.vindex "$(printf '2\n90')" Zeta
          proba argumenta-septem argumenta_septem.vindex '28'
          proba ordo-partem ordo_partem.vindex "$(printf '83\n65\n76\n86\n69')"
          proba vocationes-nullae vocationes_nullae.vindex '7168'
          proba desine-imbrique desine_imbrique.vindex '48'
          proba lectio-contextus lectio_contextus.vindex '66'

      - name: Diagnostica et CRLF comproba
        shell: bash
        run: |
          set -euo pipefail
          C='./compilator_vindex'
          reice() {
            nomen="$1"; fons="$2"; fragmentum="$3"
            exe="$RUNNER_TEMP/$nomen"
            log="$RUNNER_TEMP/$nomen.log"
            set +e
            "$C" "tests/casus/$fons" "$exe" >"$log" 2>&1
            status=$?
            set -e
            test "$status" -ne 0
            test ! -e "$exe"
            grep -Fq "$fragmentum" "$log"
          }
          reice nativum-principalis erratum_principalis.vindex 'FUNCTIO PRINCIPALIS deest'
          reice nativum-functio erratum_functio.vindex 'functio vocata non inventa est'
          reice nativum-importa erratum_importa.vindex 'fons importatus aperiri non potest'
          sed 's/$/\r/' src/compilator_vindex.vindex > "$RUNNER_TEMP/compilator_crlf.vindex"
          "$C" "$RUNNER_TEMP/compilator_crlf.vindex" "$RUNNER_TEMP/compilator_crlf"
          chmod 755 "$RUNNER_TEMP/compilator_crlf"

      - name: PE construe et VINDEX verificet
        shell: bash
        run: |
          set -euo pipefail
          C='./compilator_vindex'
          "$C" tests/proba_pe_structuram_053.vindex "$RUNNER_TEMP/proba_pe"
          chmod 755 "$RUNNER_TEMP/proba_pe"
          cat > "$RUNNER_TEMP/proclama_finalis.vindex" <<'VINDEX'
          FUNCTIO PRINCIPALIS REDDENS NUMERUS.
              PROCLAMA "Initium".
              PROCLAMA 999.
              PROCLAMA -2.71828.
              DECLARA x SICUT FLUITANS VALENS 3.14.
              PROCLAMA x.
              PROCLAMA "Finis".
              REDDE 7.
          FIN-FUNCTIO.
          VINDEX
          "$C" "$RUNNER_TEMP/proclama_finalis.vindex" "$RUNNER_TEMP/proclama_finalis.exe" pe
          "$C" tests/casus/fasciculi_portabiles.vindex "$RUNNER_TEMP/fasciculi_finalis.exe" pe
          "$RUNNER_TEMP/proba_pe" "$RUNNER_TEMP/proclama_finalis.exe"
          "$RUNNER_TEMP/proba_pe" "$RUNNER_TEMP/fasciculi_finalis.exe"

      - name: Mutationem conserva
        uses: actions/upload-artifact@v4
        with:
          name: vindex-excisio-mutatio
          path: |
            src/compilator_vindex.vindex
            compilator_vindex
            SIGILLA_SHA256.txt
          if-no-files-found: error

      - name: PE conserva
        uses: actions/upload-artifact@v4
        with:
          name: vindex-excisio-pe
          path: |
            ${{ runner.temp }}/proclama_finalis.exe
            ${{ runner.temp }}/fasciculi_finalis.exe
          if-no-files-found: error

  windows:
    if: github.event.pull_request.head.ref == 'infrastructura/vindex-053-excisio-trigger'
    needs: praepara
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: PE accipe
        uses: actions/download-artifact@v4
        with:
          name: vindex-excisio-pe
          path: pe

      - name: Exsecutionem realem verifica
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Exsequere-Vindex([string]$via) {
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = $via
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $p = [System.Diagnostics.Process]::new()
            $p.StartInfo = $psi
            [void]$p.Start()
            $stdout = $p.StandardOutput.ReadToEnd()
            $stderr = $p.StandardError.ReadToEnd()
            $p.WaitForExit()
            return @($p.ExitCode, $stdout, $stderr)
          }
          $r = Exsequere-Vindex (Join-Path $PWD 'pe\proclama_finalis.exe')
          $status = [int]$r[0]
          $out = ([string]$r[1] -replace "`r`n", "`n").TrimEnd("`n")
          if ($status -ne 7) { throw "ERRATUM: PROCLAMA status $status." }
          if ($out -ne "Initium`n999`n-2.718280`n3.140000`nFinis") { throw "ERRATUM: PROCLAMA exitus differt: [$out]" }
          $dir = Join-Path $PWD 'fasciculi-finales'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item (Join-Path $PWD 'pe\fasciculi_finalis.exe') (Join-Path $dir 'fasciculi_finalis.exe')
          $pf = Start-Process -FilePath (Join-Path $dir 'fasciculi_finalis.exe') -WorkingDirectory $dir -Wait -PassThru -NoNewWindow
          if ($pf.ExitCode -ne 0) { throw "ERRATUM: fasciculi status $($pf.ExitCode)." }
          $textus = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes((Join-Path $dir 'vindex-pe-io.tmp')))
          if ($textus -ne 'VINX') { throw "ERRATUM: fasciculus continet [$textus]." }
          Write-Host 'RECTE: excisio sub Windows vero confirmata est.'

  publica:
    if: github.event.pull_request.head.ref == 'infrastructura/vindex-053-excisio-trigger'
    needs: [praepara, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ramum destinationis accipe
        uses: actions/checkout@v5
        with:
          ref: chatgpt/vindex-053-excisio-servitiorum
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mutationem accipe
        uses: actions/download-artifact@v4
        with:
          name: vindex-excisio-mutatio
          path: mutatio

      - name: Mutationem publica
        shell: bash
        run: |
          set -euo pipefail
          cp mutatio/src/compilator_vindex.vindex src/compilator_vindex.vindex
          cp mutatio/compilator_vindex compilator_vindex
          cp mutatio/SIGILLA_SHA256.txt SIGILLA_SHA256.txt
          chmod 755 compilator_vindex
          git config user.name 'TRBC97M'
          git config user.email 'trbc97m@protonmail.com'
          git add src/compilator_vindex.vindex compilator_vindex SIGILLA_SHA256.txt
          git diff --cached --quiet && { echo 'ERRATUM: nulla mutatio'; exit 1; }
          git commit -m 'VINDEX 0.53: servitia historica e nucleo exscinde'
          git push origin HEAD:chatgpt/vindex-053-excisio-servitiorum
          echo 'RECTE: fons, binarium et sigillum simul publicata sunt.'
