name: VINDEX — ATMOS Terminal Depth POC III

on:
  pull_request:
    paths:
      - 'PROGRAMMATA/ATMOS_TERMINAL_DEPTH/POC_III/**'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/win32_ffi.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
      - '.github/workflows/vindex-atmos-poc-iii.yml'

jobs:
  genera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ATMOS graphica ex VINDEX compila
        working-directory: PROGRAMMATA/ATMOS_TERMINAL_DEPTH/POC_III
        shell: bash
        run: |
          set -euo pipefail
          COMP='../../../Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
          chmod +x "$COMP"
          "$COMP" graphica.vindex /tmp/atmos_graphicum.exe pe 2>/dev/null || \
            "$COMP" graphicum.vindex /tmp/atmos_graphicum.exe pe
          file /tmp/atmos_graphicum.exe
      - uses: actions/upload-artifact@v4
        with:
          name: atmos-graphicum-poc-iii
          path: /tmp/atmos_graphicum.exe
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: genera
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atmos-graphicum-poc-iii
          path: atmos
      - name: Fenestram et framebuffer sub Windows vero proba
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path '.\atmos\atmos_graphicum.exe').Path
          $out = & $exe smoke 2>&1
          $code = $LASTEXITCODE
          $text = ($out -join "`n")
          Write-Host $text
          if ($code -ne 0) { throw "atmos_graphicum exitus $code" }
          if ($text -notmatch 'RECTE: ATMOS GRAPHICA WIN64') { throw 'confirmatio graphica deest' }
          $numeri = @($out | Where-Object { $_ -match '^\d+$' })
          if ($numeri.Count -lt 2) { throw 'HWND/lineae probationis desunt' }
          if ([int64]$numeri[-2] -le 0) { throw 'HWND invalidum est' }
          if ([int64]$numeri[-1] -le 0) { throw 'StretchDIBits nihil praesentavit' }
