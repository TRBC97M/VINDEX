# Probatio unica fasciculorum pilae exacte dimensatorum et per paginas probatorum.
name: VINDEX 0.53 — Pila functionum

on:
  push:
    branches:
      - chatgpt/vindex-053-compilator-dynamicus
    paths:
      - '.github/workflows/vindex-053-pila-functionum-unica.yml'
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/applica_pilam_functionum_053.py'
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/genera_probationem_pilae_053.py'

permissions:
  contents: write

jobs:
  pila-functionum:
    runs-on: ubuntu-latest
    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5
        with:
          ref: chatgpt/vindex-053-compilator-dynamicus
          fetch-depth: 0

      - name: Pilam functionum comproba
        shell: bash
        run: |
          set +e
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          RELATIO=/tmp/relatio_pilae_053
          : > "$RELATIO"
          SUCCESSUS=0

          integrum() {
            VIA="$1"
            [ -s "$VIA" ] || return 1
            A=$(stat -c '%s' "$VIA" 2>/dev/null)
            B=$(od -An -tu8 -j96 -N8 "$VIA" 2>/dev/null | tr -d '[:space:]')
            [ -n "$A" ] && [ "$A" = "$B" ]
          }

          proba() {
            chmod 755 "$RADIX/compilator_vindex"
            python3 "$RADIX/instrumenta/applica_pilam_functionum_053.py" >> "$RELATIO" 2>&1 || return 1

            grep -q 'FUNCTIO COMPONE_RESERVA_PILA_PROBATA REDDENS NUMERUS' "$RADIX/src/compilator_vindex.vindex" || return 1
            if grep -q 'spatium_necessarium[12].*+ 10000' "$RADIX/src/compilator_vindex.vindex"; then
              printf '%s\n' 'ERRATUM: margo fixus X milium octetorum adhuc manet.' >> "$RELATIO"
              return 1
            fi
            if grep -q 'pos = COMPONE_ONERA(codex, pos, 0, 30000)' "$RADIX/src/compilator_vindex.vindex"; then
              printf '%s\n' 'ERRATUM: subtractio veteris prologi adhuc manet.' >> "$RELATIO"
              return 1
            fi
            printf '%s\n' 'RECTE: fasciculi pilae ex usu reali ad XVI octeta ordinantur.' >> "$RELATIO"
            printf '%s\n' 'RECTE: reservatio pilae singulas paginas IV KiB tangit.' >> "$RELATIO"

            "$RADIX/compilator_vindex" "$RADIX/src/compilator_vindex.vindex" /tmp/g1 >> "$RELATIO" 2>&1
            S1=$?
            printf 'STATUS G1: %s.\n' "$S1" >> "$RELATIO"
            [ "$S1" -eq 0 ] && integrum /tmp/g1 || return 1

            chmod 755 /tmp/g1
            /tmp/g1 "$RADIX/src/compilator_vindex.vindex" /tmp/g2 >> "$RELATIO" 2>&1
            S2=$?
            printf 'STATUS G2: %s.\n' "$S2" >> "$RELATIO"
            [ "$S2" -eq 0 ] && integrum /tmp/g2 || return 1

            chmod 755 /tmp/g2
            /tmp/g2 "$RADIX/src/compilator_vindex.vindex" /tmp/g3 >> "$RELATIO" 2>&1
            S3=$?
            printf 'STATUS G3: %s.\n' "$S3" >> "$RELATIO"
            [ "$S3" -eq 0 ] && integrum /tmp/g3 || return 1
            cmp -s /tmp/g2 /tmp/g3 || return 1
            printf '%s\n' 'RECTE: pila functionum punctum fixum compilatoris servat.' >> "$RELATIO"

            cp /tmp/g3 "$RADIX/compilator_vindex"
            chmod 755 "$RADIX/compilator_vindex"

            python3 "$RADIX/instrumenta/genera_probationem_pilae_053.py" /tmp/pila_magna_053.vindex >> "$RELATIO" 2>&1 || return 1
            "$RADIX/compilator_vindex" /tmp/pila_magna_053.vindex /tmp/pila_magna_053 >> "$RELATIO" 2>&1
            SP=$?
            printf 'COMPILATIO PILAE MAIORIS UNO MIB: status=%s.\n' "$SP" >> "$RELATIO"
            [ "$SP" -eq 0 ] && integrum /tmp/pila_magna_053 || return 1
            chmod 755 /tmp/pila_magna_053
            OP=$(/tmp/pila_magna_053 2>>"$RELATIO"); EP=$?
            printf 'EXECUTIO PILAE MAGNAE: status=%s exitus=[%s].\n' "$EP" "$OP" >> "$RELATIO"
            [ "$EP" -eq 0 ] || return 1
            EXPECTATUM=$(printf '39\n777')
            [ "$OP" = "$EXPECTATUM" ] || return 1

            python3 - /tmp/pila_magna_053 >> "$RELATIO" 2>&1 <<'PY'
          from pathlib import Path
          import struct
          import sys

          data = Path(sys.argv[1]).read_bytes()
          finis = bytes.fromhex(
              '49 81 fb 00 10 00 00 76 1c '
              '48 81 ec 00 10 00 00 48 83 0c 24 00 '
              '49 81 eb 00 10 00 00 49 81 fb 00 10 00 00 77 e4 '
              '4c 29 dc 48 83 0c 24 00'
          )
          mensurae = []
          i = 0
          while True:
              i = data.find(b'\x49\xbb', i)
              if i < 0:
                  break
              if data[i + 10:i + 10 + len(finis)] == finis:
                  mensurae.append(struct.unpack_from('<Q', data, i + 2)[0])
              i += 2
          if not mensurae:
              raise SystemExit('ERRATUM: series probationis pilae in binario non inventa est.')
          if any(m % 16 for m in mensurae):
              raise SystemExit(f'ERRATUM: fasciculus non ordinatus: {mensurae}')
          if max(mensurae) < 1024 * 1024:
              raise SystemExit(f'ERRATUM: probatio fasciculum unum MiB non superat: {mensurae}')
          print('RECTE: prologi probati in binario inventi sunt; mensurae=' + ','.join(map(str, mensurae)))
          PY
            [ $? -eq 0 ] || return 1

            cd "$RADIX" || return 1
            ./compilator_vindex src/officina_vindex.vindex /tmp/officina_nova >> "$RELATIO" 2>&1 || return 1
            ./compilator_vindex src/salutatio_vindex.vindex /tmp/salutatio_nova >> "$RELATIO" 2>&1 || return 1
            cp /tmp/officina_nova ./officina_vindex
            cp /tmp/salutatio_nova ./salutatio_vindex

            find . -type f -name '*.sh' -exec chmod 755 {} +
            chmod 755 ./vindexc ./vindex_graphica ./officina_vindex ./salutatio_vindex ./compilator_vindex ./vindex-officina ./vindex-salutatio ./vindex-systema
            bash ./systema/construe_systema.sh >> "$RELATIO" 2>&1 || return 1
            bash ./systema/uefi/construe_uefi.sh >> "$RELATIO" 2>&1 || return 1
            printf '%s\n' 'RECTE: Systema BIOS et UEFI post mutationem pilae regenerata sunt.' >> "$RELATIO"

            bash ./tests/run_tests.sh >> "$RELATIO" 2>&1
            SR=$?
            printf 'PROBATIONES REGRESSIONALES: status=%s.\n' "$SR" >> "$RELATIO"
            [ "$SR" -eq 0 ] || return 1
            return 0
          }

          proba
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            SUCCESSUS=1
          else
            printf 'ERRATUM: pila functionum nondum canonica est; status=%s.\n' "$STATUS" >> "$RELATIO"
          fi

          cd "$GITHUB_WORKSPACE" || exit 0
          VIA_RELATIONIS="$RADIX/instrumenta/RELATIO-PILA-FUNCTIONUM-053.md"
          {
            printf '%s\n\n' '# VINDEX 0.53 — Relatio pilae functionum'
            printf '%s\n\n' 'Fasciculi pilae ex usu reali dimensantur, ad XVI octeta ordinantur et per paginas IV KiB probantur.'
            printf '%s\n' '```text'
            cat "$RELATIO"
            printf '%s\n' '```'
          } > "$VIA_RELATIONIS"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$SUCCESSUS" -eq 1 ]; then
            git add "$RADIX/src/compilator_vindex.vindex" "$RADIX/compilator_vindex" "$RADIX/officina_vindex" "$RADIX/salutatio_vindex" "$RADIX/nucleus_systema.elf" "$RADIX/systema_vindex.img" "$RADIX/BOOTX64.EFI" "$RADIX/systema_vindex_uefi.img" "$VIA_RELATIONIS"
          else
            git checkout -- "$RADIX/src/compilator_vindex.vindex" "$RADIX/compilator_vindex" "$RADIX/officina_vindex" "$RADIX/salutatio_vindex" "$RADIX/nucleus_systema.elf" "$RADIX/systema_vindex.img" "$RADIX/BOOTX64.EFI" "$RADIX/systema_vindex_uefi.img" 2>/dev/null || true
            git add "$VIA_RELATIONIS"
          fi
          if ! git diff --cached --quiet; then
            if [ "$SUCCESSUS" -eq 1 ]; then
              git commit -m 'VINDEX 0.53: pilam functionum comproba'
            else
              git commit -m 'VINDEX 0.53: pilam functionum diagnostica'
            fi
            git push origin HEAD:chatgpt/vindex-053-compilator-dynamicus
          fi
          exit 0
