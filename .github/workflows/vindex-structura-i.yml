name: VINDEX — STRUCTURA I

on:
  workflow_dispatch:
  push:
    branches:
      - 'chatgpt/structura-i'
    paths:
      - '.github/workflows/vindex-structura-i.yml'
      - 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/structura_i_*.vindex'
  pull_request:
    paths:
      - '.github/workflows/vindex-structura-i.yml'
      - 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/structura_i_*.vindex'

permissions:
  contents: read

jobs:
  structura:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Oracula STRUCTURA I
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -uo pipefail
          chmod +x ./compilator_vindex
          status=0

          proba_executa() {
            nomen="$1"
            fons="$2"
            expectatum="$3"
            bin="/tmp/${nomen}"
            echo "=== ${nomen} ==="
            if ! ./compilator_vindex "$fons" "$bin"; then
              echo 'COMPILATIO=ERRATUM'
              status=1
              return
            fi
            chmod +x "$bin"
            set +e
            exitus=$("$bin")
            codex=$?
            set -e
            printf 'STATUS=%s\nEXITUS<<FIN\n%s\nFIN\n' "$codex" "$exitus"
            if [ "$codex" -ne 0 ] || [ "$exitus" != "$expectatum" ]; then
              echo 'ORACULUM=ERRATUM'
              status=1
            else
              echo 'ORACULUM=RECTUM'
            fi
          }

          proba_reiecta() {
            nomen="$1"
            fons="$2"
            nuntius="$3"
            bin="/tmp/${nomen}"
            log="/tmp/${nomen}.log"
            echo "=== ${nomen} ==="
            set +e
            ./compilator_vindex "$fons" "$bin" >"$log" 2>&1
            codex=$?
            set -e
            cat "$log"
            echo "STATUS=${codex}"
            if [ "$codex" -ne 65 ] || ! grep -Fq "$nuntius" "$log"; then
              echo 'ORACULUM=ERRATUM'
              status=1
            else
              echo 'ORACULUM=RECTUM'
            fi
          }

          proba_executa basica probationes/structura_i_basica.vindex $'16\n11\n22'
          proba_executa collisionis probationes/structura_i_collisionis.vindex $'24\n111\n333\n222'
          proba_executa duae probationes/structura_i_duae.vindex $'41\n42\n51\n52'
          proba_reiecta campus_ignotus probationes/structura_i_campus_ignotus.vindex 'ERRATUM: campus STRUCTURAE non inventus est'
          proba_reiecta acus_ex_deest probationes/structura_i_acus_ex_deest.vindex 'ERRATUM: ACUS_EX requiritur ad ACUS<STRUCTURA>'
          proba_reiecta per_valorem probationes/structura_i_per_valorem.vindex 'ERRATUM: STRUCTURA per valorem nondum licet'

          exit "$status"

      - name: Auto-hospitium fixum conserva
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex src/compilator_vindex.vindex /tmp/g2
          chmod +x /tmp/g2
          /tmp/g2 src/compilator_vindex.vindex /tmp/g3
          cmp /tmp/g2 /tmp/g3

      - name: Regressionem canonicam conserva
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          ./tests/run_tests.sh | tee /tmp/tests.log
          grep -Fq '35 probationes rectae; 0 errata.' /tmp/tests.log
