name: TEMP CONSILIUM F9-II v2

on:
  push:
    paths:
      - '.github/workflows/tmp-consilium-f9ii-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Actualise CONSILIUM
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_consilium.py
          python3 /tmp/patch_consilium.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CONSILIUM.md
          git commit -m 'CONSILIUM: F9-II et Phase 0-bis canonica'
          git push origin HEAD:chatgpt/tmp-consilium-f9ii
