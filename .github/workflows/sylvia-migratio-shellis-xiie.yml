name: Sylvia OS — Migratio Shellis XII-E

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_shell_xiie.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/migratio_shellis_xiie*.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/fenestrale_ii_purus_i.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/proba_shell_xiie*'
      - 'documenta/sylvia/JL_UX_FUNDAMENTUM_GRAPHICUM_MODERNUM.md'
      - '.github/workflows/sylvia-migratio-shellis-xiie.yml'
  push:
    branches:
      - main
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_shell_xiie.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/migratio_shellis_xiie*.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/fenestrale_ii_purus_i.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/proba_shell_xiie*'
      - 'documenta/sylvia/JL_UX_FUNDAMENTUM_GRAPHICUM_MODERNUM.md'
      - '.github/workflows/sylvia-migratio-shellis-xiie.yml'

permissions:
  contents: read

jobs:
  migratio-shellis:
    name: Pontes FS GX et motus shellis probantur
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v5

      - name: Compilatorem para
        shell: bash
        run: |
          chmod +x 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'

      - name: Puritatem Sylviae verifica
        shell: bash
        run: |
          set -euo pipefail
          python3 instrumenta/verifica_puritatem_sylviae.py

      - name: Pontem FS GX solum exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex probationes/migratio_shellis_xiie_pons.vindex /tmp/migratio-shellis-xiie-pons
          file /tmp/migratio-shellis-xiie-pons | grep -q 'ELF 64-bit'
          chmod +x /tmp/migratio-shellis-xiie-pons
          timeout 30s /tmp/migratio-shellis-xiie-pons
          printf '%s\n' 'RECTE: pons FS-GX et conversio GOP separatim probata sunt.'

      - name: Textum GX solum exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex probationes/migratio_shellis_xiie_textus.vindex /tmp/migratio-shellis-xiie-textus
          file /tmp/migratio-shellis-xiie-textus | grep -q 'ELF 64-bit'
          chmod +x /tmp/migratio-shellis-xiie-textus
          timeout 30s /tmp/migratio-shellis-xiie-textus
          printf '%s\n' 'RECTE: textus GX alpha canonicum separatim probatus est.'

      - name: Migrationem shellis native VINDEX exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex probationes/migratio_shellis_xiie.vindex /tmp/migratio-shellis-xiie
          file /tmp/migratio-shellis-xiie | grep -q 'ELF 64-bit'
          chmod +x /tmp/migratio-shellis-xiie
          timeout 30s /tmp/migratio-shellis-xiie
          printf '%s\n' 'RECTE: pons FS-GX, textus GX et motus shellis probati sunt.'

      - name: Regressionem canonicam VINDEX exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          bash tests/run_tests.sh
