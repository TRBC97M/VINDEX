      - 'Vindex Chat-GPT/vindex_final_v51/probationes/fenestrale_purus_i_*.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/applicationes_registrum_iv.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/terminale_i.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/terminale_ii.vindex'
