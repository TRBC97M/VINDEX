# Stratum fasciculorum Win64 in fonte temporario applicat, auto-hospitium et Windows verum probat.
name: VINDEX 0.53 — Fasciculi Win64

on:
  push:
    branches:
      - chatgpt/pe-fasciculi-053
  pull_request:
    branches:
      - claude/pe-integration-053-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5

      - name: Instrumentum verifica
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          python3 -m py_compile "$RADIX/instrumenta/applica_fasciculos_win64_053.py"

      - name: Fontem Win64 transforma
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          python3 "$RADIX/instrumenta/applica_fasciculos_win64_053.py" \
              "$RADIX/src/compilator_vindex.vindex" \
              "$RUNNER_TEMP/compilator_fasciculi.vindex"
          grep -Fq 'numerus_functionum_pe SICUT NUMERUS VALENS 7' "$RUNNER_TEMP/compilator_fasciculi.vindex"
          grep -Fq 'COMPONE_APERI_FASCICULUM_PE' "$RUNNER_TEMP/compilator_fasciculi.vindex"
          grep -Fq 'COMPONE_TRANSFER_FASCICULUM_PE' "$RUNNER_TEMP/compilator_fasciculi.vindex"
          grep -Fq 'COMPONE_CLAUDE_FASCICULUM_PE' "$RUNNER_TEMP/compilator_fasciculi.vindex"

      - name: Auto-hospitium ad punctum fixum
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          chmod 755 "$RADIX/compilator_vindex"
          "$RADIX/compilator_vindex" "$RUNNER_TEMP/compilator_fasciculi.vindex" "$RUNNER_TEMP/gen1"
          chmod 755 "$RUNNER_TEMP/gen1"
          "$RUNNER_TEMP/gen1" "$RUNNER_TEMP/compilator_fasciculi.vindex" "$RUNNER_TEMP/gen2"
          chmod 755 "$RUNNER_TEMP/gen2"
          "$RUNNER_TEMP/gen2" "$RUNNER_TEMP/compilator_fasciculi.vindex" "$RUNNER_TEMP/gen3"
          chmod 755 "$RUNNER_TEMP/gen3"
          cmp "$RUNNER_TEMP/gen2" "$RUNNER_TEMP/gen3"
          sha256sum "$RUNNER_TEMP/gen2"
          printf '%s\n' 'RECTE: auto-hospitium fasciculorum ad punctum fixum pervenit.'

      - name: Contractum fasciculorum ELF custodi
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          EXE="$RUNNER_TEMP/fasciculi_elf"
          "$RUNNER_TEMP/gen2" "$RADIX/tests/casus/fasciculi_portabiles.vindex" "$EXE"
          chmod 755 "$EXE"
          mkdir -p "$RUNNER_TEMP/elf-run"
          (
            cd "$RUNNER_TEMP/elf-run"
            "$EXE"
            python3 - <<'PY'
          from pathlib import Path
          data = Path('vindex-pe-io.tmp').read_bytes()
          assert data == b'VINX', data
          print('RECTE: fasciculi ELF VINX servant et relegunt.')
          PY
          )

      - name: PE fasciculorum construe
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          "$RUNNER_TEMP/gen2" "$RADIX/tests/casus/fasciculi_portabiles.vindex" "$RUNNER_TEMP/fasciculi_windows.exe" pe
          file "$RUNNER_TEMP/fasciculi_windows.exe"
          strings "$RUNNER_TEMP/fasciculi_windows.exe" | grep -F 'CreateFileA'
          strings "$RUNNER_TEMP/fasciculi_windows.exe" | grep -F 'ReadFile'
          strings "$RUNNER_TEMP/fasciculi_windows.exe" | grep -F 'CloseHandle'

      - name: PE fasciculorum conserva
        uses: actions/upload-artifact@v4
        with:
          name: vindex-fasciculi-win64
          path: ${{ runner.temp }}/fasciculi_windows.exe
          if-no-files-found: error

  windows:
    needs: construe
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: PE fasciculorum accipe
        uses: actions/download-artifact@v4
        with:
          name: vindex-fasciculi-win64
          path: pe

      - name: Fasciculos sub Windows vero proba
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'vindex-fasciculi-run'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item (Join-Path $PWD 'pe\fasciculi_windows.exe') (Join-Path $dir 'fasciculi_windows.exe')
          $processus = Start-Process -FilePath (Join-Path $dir 'fasciculi_windows.exe') -WorkingDirectory $dir -Wait -PassThru -NoNewWindow
          if ($processus.ExitCode -ne 0) {
            throw "ERRATUM: fasciculi PE status $($processus.ExitCode) reddit."
          }
          $via = Join-Path $dir 'vindex-pe-io.tmp'
          if (-not (Test-Path $via)) { throw 'ERRATUM: fasciculus vindex-pe-io.tmp non creatus est.' }
          $octeta = [System.IO.File]::ReadAllBytes($via)
          $expectata = [byte[]](86,73,78,88)
          if ($octeta.Length -ne 4) { throw "ERRATUM: longitudo $($octeta.Length), 4 exspectabatur." }
          for ($i = 0; $i -lt 4; $i++) {
            if ($octeta[$i] -ne $expectata[$i]) { throw "ERRATUM: octetum $i = $($octeta[$i])." }
          }
          Write-Host 'RECTE: APERI/MITTE/CLAUDE/LEGE/OCTETUS sub Windows vero VINX servant et relegunt.'
