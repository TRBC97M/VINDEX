name: VINDEX — FFI Win64

on:
  pull_request:
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/win32_ffi.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/proba_win32_ffi.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/proba_pe_structuram_053.vindex'
      - '.github/workflows/vindex-win32-ffi.yml'

jobs:
  pe-genera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probationem FFI PE32+ genera
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          chmod +x compilator_vindex
          ./compilator_vindex tests/proba_win32_ffi.vindex /tmp/proba_win32_ffi.exe pe
          ./compilator_vindex tests/proba_pe_structuram_053.vindex /tmp/proba_pe_structuram
          chmod +x /tmp/proba_pe_structuram
          /tmp/proba_pe_structuram /tmp/proba_win32_ffi.exe
      - uses: actions/upload-artifact@v4
        with:
          name: proba-win32-ffi
          path: /tmp/proba_win32_ffi.exe
          if-no-files-found: error
          retention-days: 1

  windows:
    needs: pe-genera
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: proba-win32-ffi
          path: proba
      - name: FFI sub Windows vero exerce
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path '.\proba\proba_win32_ffi.exe').Path
          $out = & $exe 2>&1
          $code = $LASTEXITCODE
          $text = ($out -join "`n")
          Write-Host $text
          if ($code -ne 0) { throw "proba_win32_ffi exitus $code" }
          if ($text -notmatch 'RECTE: WIN32 FFI VINDEX') { throw 'confirmatio FFI deest' }
          $numeri = @($out | Where-Object { $_ -match '^\d+$' })
          if ($numeri.Count -lt 1 -or [int64]$numeri[-1] -le 0) { throw 'latitudo screen invalida est' }
