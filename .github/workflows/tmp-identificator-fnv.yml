name: TEMP — identitas localis fortis
on:
  push:
    paths:
      - '.github/workflows/tmp-identificator-fnv.yml'
permissions:
  contents: write
jobs:
  corrige:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Separa identitatem localem ab signo historico
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./compilator_vindex
          python3 - <<'PY'
          from pathlib import Path
          import re
          from textwrap import dedent
          p=Path('src/compilator_vindex.vindex')
          s=p.read_text()

          pat_extra=r'''FUNCTIO EXTRAHE_ET_SIGNA REDDENS NUMERUS\.\n.*?\nFIN-FUNCTIO\.'''
          new_extra=dedent('''\
          FUNCTIO EXTRAHE_ET_SIGNA REDDENS NUMERUS.
              ACCIPIT fons SICUT ACUS<LITTERA>.
              ACCIPIT pos SICUT ACUS<NUMERUS>.
              ACCIPIT n SICUT NUMERUS.
              // Contractus compatibilitatis:
              // - nomina typorum/functionum (maiuscula initiali) servant signum historicum base XXXI;
              // - localia grammatice minuscula utuntur FNV-1a LXIV, ne collisiones sicut vp/x2 lateant.
              DECLARA initium_signi SICUT NUMERUS VALENS CONTENTUM(pos).
              DECLARA signum SICUT NUMERUS VALENS 0.
              DECLARA identitas_localis SICUT NUMERUS VALENS 0.
              SI initium_signi < n && fons[initium_signi] >= 97 && fons[initium_signi] <= 122 TUNC
                  identitas_localis = 1.
                  signum = 0 - 3750763034362895579.
              FIN-SI.
              DUM CONTENTUM(pos) < n && ((fons[CONTENTUM(pos)] >= 65 && fons[CONTENTUM(pos)] <= 90) || (fons[CONTENTUM(pos)] >= 97 && fons[CONTENTUM(pos)] <= 122) || fons[CONTENTUM(pos)] == 95 || (fons[CONTENTUM(pos)] >= 48 && fons[CONTENTUM(pos)] <= 57)) PERFICE
                  SI identitas_localis == 1 TUNC
                      signum = (signum ^ fons[CONTENTUM(pos)]) * 1099511628211.
                  ALITER
                      signum = signum * 31 + fons[CONTENTUM(pos)].
                  FIN-SI.
                  CONTENTUM(pos) = CONTENTUM(pos) + 1.
              FIN-DUM.
              REDDE signum.
          FIN-FUNCTIO.''')
          s,n1=re.subn(pat_extra,new_extra,s,count=1,flags=re.S)
          if n1!=1:
              raise SystemExit(f'EXTRAHE_ET_SIGNA non unice inventa: {n1}')

          pat_pos=r'''FUNCTIO SIGNUM_AB_POSITIONE REDDENS NUMERUS\.\n.*?\nFIN-FUNCTIO\.'''
          new_pos=dedent('''\
          FUNCTIO SIGNUM_AB_POSITIONE REDDENS NUMERUS.
              ACCIPIT fons SICUT ACUS<LITTERA>.
              ACCIPIT pos SICUT NUMERUS.
              ACCIPIT n SICUT NUMERUS.
              DECLARA signum SICUT NUMERUS VALENS 0.
              DECLARA idx SICUT NUMERUS VALENS pos.
              DECLARA identitas_localis SICUT NUMERUS VALENS 0.
              SI pos < n && fons[pos] >= 97 && fons[pos] <= 122 TUNC
                  identitas_localis = 1.
                  signum = 0 - 3750763034362895579.
              FIN-SI.
              DUM idx < n && ((fons[idx] >= 65 && fons[idx] <= 90) || (fons[idx] >= 97 && fons[idx] <= 122) || fons[idx] == 95 || (fons[idx] >= 48 && fons[idx] <= 57)) PERFICE
                  SI identitas_localis == 1 TUNC
                      signum = (signum ^ fons[idx]) * 1099511628211.
                  ALITER
                      signum = signum * 31 + fons[idx].
                  FIN-SI.
                  idx = idx + 1.
              FIN-DUM.
              REDDE signum.
          FIN-FUNCTIO.''')
          s,n2=re.subn(pat_pos,new_pos,s,count=1,flags=re.S)
          if n2!=1:
              raise SystemExit(f'SIGNUM_AB_POSITIONE non unice inventa: {n2}')

          p.write_text(s)
          PY

          ./compilator_vindex src/compilator_vindex.vindex /tmp/g2
          chmod +x /tmp/g2
          /tmp/g2 src/compilator_vindex.vindex /tmp/g3
          chmod +x /tmp/g3
          cmp /tmp/g2 /tmp/g3
          echo 'FIXPOINT_G2_G3=RECTE'

          /tmp/g2 probationes/identificatores_collisionis.vindex /tmp/collisio
          chmod +x /tmp/collisio
          /tmp/collisio
          echo 'COLLISIO_VP_X2=RECTE'

          cp /tmp/g2 ./compilator_vindex
          chmod +x ./compilator_vindex
          ./compilator_vindex src/compilator_vindex.vindex /tmp/g4
          cmp ./compilator_vindex /tmp/g4
          echo 'FIXPOINT_CANONICUS=RECTE'

          ./tests/run_tests.sh | tee /tmp/tests.log
          grep -Fq '35 probationes rectae; 0 errata.' /tmp/tests.log
          echo 'REGRESSIONES_35_35=RECTE'
          git diff --check

      - name: Committe correctionem si omnia viridia sunt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TRBC97M'
          git config user.email 'trbc97m@protonmail.com'
          git add 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex' \
                  'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
          git commit -m 'Compilator: distingue localia sine ABI frangenda'
          git push origin HEAD:chatgpt/p16-xii-f9-ii-residentia-3d
