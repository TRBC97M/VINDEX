name: TEMP — identificatores FNV-1a LXIII
on:
  push:
    paths:
      - '.github/workflows/tmp-identificator-fnv.yml'
permissions:
  contents: write
jobs:
  corrige:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Limita signaturam, auto-hospita et recertifica
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./compilator_vindex
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/compilator_vindex.vindex')
          s=p.read_text()
          old='''        signum = (signum ^ fons[CONTENTUM(pos)]) * 1099511628211.\n        CONTENTUM(pos) = CONTENTUM(pos) + 1.\n    FIN-DUM.\n    REDDE signum.\nFIN-FUNCTIO.'''
          new='''        signum = (signum ^ fons[CONTENTUM(pos)]) * 1099511628211.\n        CONTENTUM(pos) = CONTENTUM(pos) + 1.\n    FIN-DUM.\n    // Descriptorum historicum nomen non-negativum exspectat.\n    signum = signum & 9223372036854775807.\n    REDDE signum.\nFIN-FUNCTIO.'''
          if s.count(old)!=1:
              raise SystemExit(f'cauda FNV non unica: {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY

          ./compilator_vindex src/compilator_vindex.vindex /tmp/g2
          chmod +x /tmp/g2
          /tmp/g2 src/compilator_vindex.vindex /tmp/g3
          chmod +x /tmp/g3
          cmp /tmp/g2 /tmp/g3
          echo 'FIXPOINT_G2_G3=RECTE'

          /tmp/g2 probationes/identificatores_collisionis.vindex /tmp/collisio
          chmod +x /tmp/collisio
          /tmp/collisio
          echo 'COLLISIO_VP_X2=RECTE'

          cp /tmp/g2 ./compilator_vindex
          chmod +x ./compilator_vindex
          ./compilator_vindex src/compilator_vindex.vindex /tmp/g4
          cmp ./compilator_vindex /tmp/g4
          echo 'FIXPOINT_CANONICUS=RECTE'

          ./tests/run_tests.sh | tee /tmp/tests.log
          grep -Fq '35 probationes rectae; 0 errata.' /tmp/tests.log
          echo 'REGRESSIONES_35_35=RECTE'
          git diff --check

      - name: Committe correctionem LXIII
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TRBC97M'
          git config user.email 'trbc97m@protonmail.com'
          git add 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex' \
                  'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
          git commit -m 'Compilator: serva signaturas identificatorum positivas'
          git push origin HEAD:chatgpt/p16-xii-f9-ii-residentia-3d
