name: VINDEX — PE GUI canoniza

on:
  push:
    branches:
      - chatgpt/atmos-restitutio-totalis
    paths:
      - 'instrumenta/applica_pe_gui.py'
      - 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'
      - '.github/workflows/vindex-pe-gui-canoniza.yml'

permissions:
  contents: write

jobs:
  canoniza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/atmos-restitutio-totalis
          fetch-depth: 0

      - name: Target GUI in fonte applica
        shell: bash
        run: |
          set -euo pipefail
          python3 instrumenta/applica_pe_gui.py

      - name: Compilatorem ad punctum fixum regenera
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          chmod +x compilator_vindex
          ./compilator_vindex src/compilator_vindex.vindex /tmp/g2
          chmod +x /tmp/g2
          /tmp/g2 src/compilator_vindex.vindex /tmp/g3
          chmod +x /tmp/g3
          /tmp/g3 src/compilator_vindex.vindex /tmp/g4
          chmod +x /tmp/g4
          cmp /tmp/g3 /tmp/g4
          cp /tmp/g4 compilator_vindex

      - name: Target GUI structuram PE proba
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/gui_min.vindex <<'EOF'
          FUNCTIO PRINCIPALIS REDDENS NUMERUS.
              ACCIPIT argc SICUT NUMERUS.
              ACCIPIT argv SICUT ACUS<NUMERUS>.
              REDDE 0.
          FIN-FUNCTIO.
          EOF
          ./compilator_vindex /tmp/gui_min.vindex /tmp/gui_min.exe gui
          objdump -p /tmp/gui_min.exe | grep -E 'Subsystem.*Windows GUI'
          ./compilator_vindex /tmp/gui_min.vindex /tmp/console_min.exe pe
          objdump -p /tmp/console_min.exe | grep -E 'Subsystem.*Windows CUI'
          echo 'RECTE: PE GUI=2 et PE console=3 distincta sunt.'

      - name: Mutationem canonicam committe
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex' 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'; then
            echo 'Nihil canonizandum.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex' 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
          git commit -m 'P11-F2: target PE GUI canoniza'
          git push origin HEAD:chatgpt/atmos-restitutio-totalis
