permissions:
  contents: read

jobs:
  catena-uefi:
    name: OVMF ad Sylviam sine C
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v5

      - name: Instrumenta necessaria institue
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf file

      - name: Compilator exsecutabilis sit
        shell: bash
        run: chmod +x 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'

      - name: Auto-hospitium punctum fixum
        shell: bash
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        run: |
          set -euo pipefail
          ./compilator_vindex src/compilator_vindex.vindex /tmp/gen2
          chmod +x /tmp/gen2
          /tmp/gen2 src/compilator_vindex.vindex /tmp/gen3
          chmod +x /tmp/gen3
          cmp -s /tmp/gen2 /tmp/gen3 || {
            printf '%s\n' 'DEFECIT: generationes G2 et G3 non sunt identicae.' >&2
            exit 1
          }
          cmp -s ./compilator_vindex /tmp/gen3 || {
            printf '%s\n' 'DEFECIT: compilator canonicus fonti non respondet.' >&2
            exit 1
          }
          printf '%s\n' 'RECTE: compilator canonicus = G2 = G3.'

      - name: Probationes canonicas linguae et Sylviae
        shell: bash
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        run: bash ./tests/run_tests.sh

      - name: Target UEFI structuram validam generat
        shell: bash
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        run: |
          set -euo pipefail
          printf 'FUNCTIO PRINCIPALIS REDDENS NUMERUS.\n    REDDE 0.\nFIN-FUNCTIO.\n' > /tmp/uefi.vindex
          ./compilator_vindex /tmp/uefi.vindex /tmp/uefi.efi uefi
          file /tmp/uefi.efi | grep -q 'PE32+.*EFI application' || {
            printf '%s\n' 'DEFECIT: target UEFI PE32+ EFI application non generavit.' >&2
            exit 1
          }
          printf '%s\n' 'RECTE: target UEFI PE32+ EFI application generat.'

      - name: Puritas Sylviae absoluta
        shell: bash
        run: python3 instrumenta/verifica_puritatem_sylviae.py

      - name: Catena historica sub QEMU et OVMF
        shell: bash
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        env:
          MORA_INITII: '28'
        run: bash ./instrumenta/proba_catenam_uefi_053.sh

      - name: Fenestrale II cum PS/2 sub QEMU et OVMF
        shell: bash
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        env:
          MORA_INITII: '28'
        run: bash ./instrumenta/proba_fenestrale_uefi_purum.sh

      - name: Forma P16-IX sub QEMU et OVMF
        shell: bash
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        env:
          MORA_INITII: '28'
          SERVA_CAPTURAS: '${{ github.workspace }}/qemu-captura-p16-ix-forma'
        run: |
          set -euo pipefail
          PROBATOR_FENESTRALIS="$PWD/instrumenta/proba_formam_sylviae_ix.py" \
            bash ./instrumenta/proba_fenestrale_uefi_purum.sh

      - name: INITIUM P16-IX sub QEMU et OVMF
        shell: bash
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        env:
          MORA_INITII: '28'
          SERVA_CAPTURAS: '${{ github.workspace }}/qemu-captura-p16-ix-initium'
        run: |
          set -euo pipefail
          PROBATOR_FENESTRALIS="$PWD/instrumenta/proba_initium_sylviae_ix.py" \
            bash ./instrumenta/proba_fenestrale_uefi_purum.sh

      - name: Bureau functionale sub QEMU et OVMF
        shell: bash
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        env:
          MORA_INITII: '28'
          SERVA_CAPTURAS: '${{ github.workspace }}/qemu-captura-p16-ix-bureau'
        run: |
          set -euo pipefail
          PROBATOR_FENESTRALIS="$PWD/instrumenta/proba_bureau_sylviae_iii.py" \
            bash ./instrumenta/proba_fenestrale_uefi_purum.sh

      - name: Fenestrae P16-VIII sub QEMU et OVMF
        shell: bash
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        env:
          MORA_INITII: '28'
          SERVA_CAPTURAS: '${{ github.workspace }}/qemu-captura-p16-ix-fenestrae'
        run: |
          set -euo pipefail
          PROBATOR_FENESTRALIS="$PWD/instrumenta/proba_fenestras_sylviae_v.py" \
            bash ./instrumenta/proba_fenestrale_uefi_purum.sh

      - name: TERMINALE cum claviatura sub QEMU et OVMF
        shell: bash
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        env:
          MORA_INITII: '28'
        run: |
          set -euo pipefail
          PROBATOR_FENESTRALIS="$PWD/instrumenta/proba_terminale_sylviae_i.py" \
            bash ./instrumenta/proba_fenestrale_uefi_purum.sh

      - name: OFFICINA cum editore sub QEMU et OVMF
        shell: bash
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        env:
          MORA_INITII: '28'
          SERVA_CAPTURAS: '${{ github.workspace }}/qemu-captura-officina'
        run: |
          set -euo pipefail
          PROBATOR_FENESTRALIS="$PWD/instrumenta/proba_officinam_sylviae_i.py" \
            bash ./instrumenta/proba_fenestrale_uefi_purum.sh

      - name: Capturas P16-IX conserva
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-p16-ix-${{ github.sha }}
          path: |
            qemu-captura-p16-ix-forma/*.ppm
            qemu-captura-p16-ix-initium/*.ppm
            qemu-captura-p16-ix-bureau/*.ppm
            qemu-captura-p16-ix-fenestrae/*.ppm
          if-no-files-found: warn
          retention-days: 7

      - name: Capturas OFFICINAE conserva
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-officina-${{ github.sha }}
          path: qemu-captura-officina/*.ppm
          if-no-files-found: warn
          retention-days: 7
      - name: Enumeratio PCI per pontes (P12-III)
        shell: bash
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        run: bash ./instrumenta/proba_pci_pontes_053.sh

      - name: BAR et regiones MMIO (P12-IV)
        shell: bash
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        run: bash ./instrumenta/proba_pci_bar_053.sh
