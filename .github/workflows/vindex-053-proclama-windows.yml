# PROCLAMA PE sub Windows vero: catenae, integri et fluitantes.
name: VINDEX 0.53 — PROCLAMA sub Windows

on:
  push:
    branches:
      - chatgpt/pe-fasciculi-053
  pull_request:
    branches:
      - claude/pe-integration-053-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5

      - name: PE exempla construe
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          chmod 755 "$RADIX/compilator_vindex"
          "$RADIX/compilator_vindex" "$RADIX/examples/proclama_catena_pe_053.vindex" "$RUNNER_TEMP/catena.exe" pe
          "$RADIX/compilator_vindex" "$RADIX/examples/proclama_multi_pe_053.vindex" "$RUNNER_TEMP/multi.exe" pe

          cat >"$RUNNER_TEMP/fluitans.vindex" <<'VINDEX'
          FUNCTIO PRINCIPALIS REDDENS NUMERUS.
              PROCLAMA 3.141589.
              REDDE 6.
          FIN-FUNCTIO.
          VINDEX

          cat >"$RUNNER_TEMP/fluitans_mixtum.vindex" <<'VINDEX'
          FUNCTIO PRINCIPALIS REDDENS NUMERUS.
              PROCLAMA "Initium".
              PROCLAMA 42.
              PROCLAMA 3.141589.
              PROCLAMA "Finis".
              REDDE 8.
          FIN-FUNCTIO.
          VINDEX

          "$RADIX/compilator_vindex" "$RUNNER_TEMP/fluitans.vindex" "$RUNNER_TEMP/fluitans.exe" pe
          "$RADIX/compilator_vindex" "$RUNNER_TEMP/fluitans_mixtum.vindex" "$RUNNER_TEMP/fluitans_mixtum.exe" pe

      - name: PE conserva
        uses: actions/upload-artifact@v4
        with:
          name: vindex-proclama-pe
          path: |
            ${{ runner.temp }}/catena.exe
            ${{ runner.temp }}/multi.exe
            ${{ runner.temp }}/fluitans.exe
            ${{ runner.temp }}/fluitans_mixtum.exe
          if-no-files-found: error

  windows:
    needs: construe
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: PE accipe
        uses: actions/download-artifact@v4
        with:
          name: vindex-proclama-pe
          path: pe

      - name: PROCLAMA omnia exsequere
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Proba-Vindex([string]$nomen, [int]$status, [string]$exspectatum) {
            $exe = Join-Path $PWD ("pe\" + $nomen + ".exe")
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = $exe
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $p = [System.Diagnostics.Process]::new()
            $p.StartInfo = $psi
            [void]$p.Start()
            $stdout = $p.StandardOutput.ReadToEnd()
            $stderr = $p.StandardError.ReadToEnd()
            $p.WaitForExit()
            $out = ($stdout -replace "`r`n", "`n").TrimEnd("`n")
            Write-Host "$nomen -> status $($p.ExitCode), stdout=[$($out -replace "`n", "\\n")]"
            if ($stderr.Length -gt 0) { Write-Host "stderr=[$stderr]" }
            if ($p.ExitCode -ne $status) { throw "ERRATUM: $nomen status $($p.ExitCode); $status exspectabatur." }
            if ($out -ne $exspectatum) { throw "ERRATUM: $nomen exitus [$out], [$exspectatum] exspectabatur." }
          }

          Proba-Vindex 'catena' 33 'Salve ex PE!'
          Proba-Vindex 'multi' 7 "Premier`n999`nDernier"
          Proba-Vindex 'fluitans' 6 '3.141589'
          Proba-Vindex 'fluitans_mixtum' 8 "Initium`n42`n3.141589`nFinis"
          Write-Host 'RECTE: PROCLAMA catenae, integri et fluitantes sub Windows vero recta sunt.'
