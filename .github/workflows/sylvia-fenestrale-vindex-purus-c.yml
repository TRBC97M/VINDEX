name: Sylvia OS — Fenestrale II Purus C canonicus

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_ii_purus.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/fenestrale_ii_purus_c.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/fenestrale_purus_c_*.vindex'
      - 'documenta/sylvia/FENESTRALE_II_PVRVS_C.md'
      - '.github/workflows/sylvia-fenestrale-vindex-purus-c.yml'

jobs:
  vindex-purus-c:
    name: Mutatio mensurae Fenestralis C VINDEX certificatur
    runs-on: ubuntu-24.04
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v4

      - name: Puritatem Sylviae verifica
        shell: bash
        run: |
          set -euo pipefail
          python3 instrumenta/verifica_puritatem_sylviae.py

      - name: Fontes VINDEX verifica
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          python3 instrumenta/vindex_verifica.py systema/fenestrale_ii_purus_c.vindex
          python3 instrumenta/vindex_verifica.py probationes/fenestrale_purus_c_resize.vindex

      - name: Contractum mutationis mensurae verifica
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          f='systema/fenestrale_ii_purus_c.vindex'
          for signum in \
            'FUNCTIO FB_MOUSE_DOWN' 'FUNCTIO FC_RESIZE' 'FUNCTIO FB_DRAG' \
            'FUNCTIO FB_MAX_TOGGLE' 'FUNCTIO FB_MINIMIZA' 'FUNCTIO FB_CLAUDE' \
            'UEFI_VOCA6' 's[27]' \
            'minw SICUT NUMERUS VALENS 520' 'minh SICUT NUMERUS VALENS 340' \
            'minw=420. minh=300'
          do
            grep -Fq "$signum" "$f" || { echo "ERRATUM: $signum deest"; exit 1; }
          done
          ! grep -Eq '(^|[^A-Z0-9_])POLLE\(\)' "$f"

      - name: Probationem resize compila
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          chmod +x compilator_vindex
          ./compilator_vindex probationes/fenestrale_purus_c_resize.vindex /tmp/fenestrale_purus_c_resize.elf
          file /tmp/fenestrale_purus_c_resize.elf | grep -q 'ELF 64-bit'

      - name: Fenestrale C totum compila
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex systema/fenestrale_ii_purus_c.vindex /tmp/fenestrale_ii_purus_c.elf
          file /tmp/fenestrale_ii_purus_c.elf | grep -q 'ELF 64-bit'
          test "$(stat -c '%s' /tmp/fenestrale_ii_purus_c.elf)" -lt 196608
          printf '%s\n' 'RECTE: Fenestrale II Purus C mutationem mensurae VINDEX certificat.'
