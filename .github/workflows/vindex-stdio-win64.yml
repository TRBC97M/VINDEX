name: VINDEX — STDIO Win64

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/tests/proba_stdio_win64.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
      - '.github/workflows/vindex-stdio-win64.yml'

jobs:
  stdio-win64:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v4

      - name: Compilatorem Win64 ex artefacto ELF genera
        shell: bash
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          set -euo pipefail
          chmod +x compilator_vindex
          ./compilator_vindex src/compilator_vindex.vindex compilator_vindex.exe pe

      - name: Probationem stdio compila
        shell: pwsh
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          $ErrorActionPreference = 'Stop'
          .\compilator_vindex.exe tests\proba_stdio_win64.vindex proba_stdio_win64.exe pe
          if ($LASTEXITCODE -ne 0) { throw "compilatio stdio exitus $LASTEXITCODE" }

      - name: STDIN et STDOUT sub Windows vero proba
        shell: pwsh
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          $ErrorActionPreference = 'Stop'
          $output = 'status' | .\proba_stdio_win64.exe 2>&1
          $code = $LASTEXITCODE
          $text = ($output -join "`n")
          Write-Host $text
          if ($code -ne 0) { throw "probatio stdio exitus $code" }
          if ($text -notmatch 'RECTE: STDIO WIN64') { throw 'confirmatio STDIO deest' }
          if ($text -notmatch 'RECTE: STDIO WIN64') { throw 'stdout VINDEX non visum est' }
