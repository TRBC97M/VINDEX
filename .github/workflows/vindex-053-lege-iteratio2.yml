# Probatio unica post correctionem intervalli occulti LEGE.
name: VINDEX 0.53 — LEGE iteratio II

on:
  push:
    branches: [chatgpt/vindex-053-compilator-dynamicus]
    paths:
      - '.github/workflows/vindex-053-lege-iteratio2.yml'

permissions:
  contents: write

jobs:
  proba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/vindex-053-compilator-dynamicus
          fetch-depth: 0
      - name: LEGE dynamicum comproba
        shell: bash
        run: |
          set +e
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          R=/tmp/relatio
          : > "$R"
          OK=0
          integrum(){ A=$(stat -c '%s' "$1" 2>/dev/null); B=$(od -An -tu8 -j96 -N8 "$1" 2>/dev/null|tr -d '[:space:]'); [ -n "$A" ] && [ "$A" = "$B" ]; }

          python3 "$RADIX/instrumenta/applica_lege_dynamicum_053.py" >>"$R" 2>&1
          S=$?
          if [ "$S" -eq 0 ]; then
            M=$(stat -c '%s' "$RADIX/src/compilator_vindex.vindex")
            printf 'MENSURA FONTIS: %s.\n' "$M" >>"$R"
            chmod 755 "$RADIX/compilator_vindex"
            "$RADIX/compilator_vindex" "$RADIX/src/compilator_vindex.vindex" /tmp/g1 >>"$R" 2>&1; S1=$?
            printf 'G1=%s.\n' "$S1" >>"$R"
            [ "$S1" -eq 0 ] && integrum /tmp/g1
            S=$?
          fi
          if [ "$S" -eq 0 ]; then
            chmod 755 /tmp/g1
            /tmp/g1 "$RADIX/src/compilator_vindex.vindex" /tmp/g2 >>"$R" 2>&1; S2=$?
            printf 'G2=%s.\n' "$S2" >>"$R"
            [ "$S2" -eq 0 ] && integrum /tmp/g2
            S=$?
          fi
          if [ "$S" -eq 0 ]; then
            chmod 755 /tmp/g2
            /tmp/g2 "$RADIX/src/compilator_vindex.vindex" /tmp/g3 >>"$R" 2>&1; S3=$?
            printf 'G3=%s.\n' "$S3" >>"$R"
            [ "$S3" -eq 0 ] && integrum /tmp/g3 && cmp -s /tmp/g2 /tmp/g3
            S=$?
          fi
          if [ "$S" -eq 0 ]; then
            cp /tmp/g3 "$RADIX/compilator_vindex"; chmod 755 "$RADIX/compilator_vindex"
            python3 - <<'PY'
          from pathlib import Path
          n=1200123
          d=bytearray(b'A'*n); d[-1]=90
          Path('/tmp/lege_magna.bin').write_bytes(d)
          Path('/tmp/lege_magna.vindex').write_text('FUNCTIO PRINCIPALIS REDDENS NUMERUS.\n    DECLARA fd SICUT NUMERUS VALENS APERI_LEGERE("/tmp/lege_magna.bin").\n    DECLARA n SICUT NUMERUS VALENS LEGE(fd, 1200123).\n    CLAUDE(fd).\n    PROCLAMA n.\n    PROCLAMA OCTETUS(n - 1).\n    REDDE 0.\nFIN-FUNCTIO.\n',encoding='utf-8')
          PY
            "$RADIX/compilator_vindex" /tmp/lege_magna.vindex /tmp/lege_magna >>"$R" 2>&1; C=$?
            chmod 755 /tmp/lege_magna 2>/dev/null
            O=$(/tmp/lege_magna 2>>"$R"); E=$?
            printf 'LEGE_MAGNA compilatio=%s executio=%s exitus=[%s].\n' "$C" "$E" "$O" >>"$R"
            [ "$C" -eq 0 ] && [ "$E" -eq 0 ] && [ "$O" = $'1200123\n90' ]
            S=$?
          fi
          if [ "$S" -eq 0 ]; then
            cd "$RADIX" || S=1
            ./compilator_vindex src/officina_vindex.vindex /tmp/officina_nova >>"$R" 2>&1 && cp /tmp/officina_nova ./officina_vindex || S=1
            ./compilator_vindex src/salutatio_vindex.vindex /tmp/salutatio_nova >>"$R" 2>&1 && cp /tmp/salutatio_nova ./salutatio_vindex || S=1
            find . -type f -name '*.sh' -exec chmod 755 {} +
            chmod 755 ./vindexc ./vindex_graphica ./officina_vindex ./salutatio_vindex ./compilator_vindex ./vindex-officina ./vindex-salutatio ./vindex-systema
            bash ./tests/run_tests.sh >>"$R" 2>&1; T=$?
            printf 'REGRESSIONES=%s.\n' "$T" >>"$R"
            [ "$T" -eq 0 ] || S=1
          fi
          [ "$S" -eq 0 ] && { printf '%s\n' 'RECTE: LEGE dynamicum stabile est.' >>"$R"; OK=1; } || printf 'ERRATUM: LEGE iteratio II status=%s.\n' "$S" >>"$R"

          cd "$GITHUB_WORKSPACE"
          F="$RADIX/instrumenta/RELATIO-VINDEX-053.md"
          { printf '%s\n\n' '# VINDEX 0.53 — Relatio LEGE dynamici'; printf '%s\n' '```text'; cat "$R"; printf '%s\n' '```'; } >"$F"
          git config user.name 'VINDEX Centurio'; git config user.email 'actions@users.noreply.github.com'
          if [ "$OK" -eq 1 ]; then
            git add "$RADIX/src/compilator_vindex.vindex" "$RADIX/compilator_vindex" "$RADIX/officina_vindex" "$RADIX/salutatio_vindex" "$F"
          else
            git checkout -- "$RADIX/src/compilator_vindex.vindex" "$RADIX/compilator_vindex" "$RADIX/officina_vindex" "$RADIX/salutatio_vindex" 2>/dev/null || true
            git add "$F"
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'VINDEX 0.53: LEGE dynamicum iterum comproba'
            git push origin HEAD:chatgpt/vindex-053-compilator-dynamicus
          fi
          exit 0
