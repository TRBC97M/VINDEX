name: TEMP — F9-II nomina inspect
on:
  push:
    paths:
      - '.github/workflows/tmp-f9ii-saltus-inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Extrahe signaturam identitatis
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('src/compilator_vindex.vindex').read_text()
          for name in ['EXTRAHE_ET_SIGNA','SIGNA_NOMEN','CERCA_VARIABILEM']:
              m=re.search(r'(?m)^FUNCTIO\s+'+re.escape(name)+r'\s+REDDENS\s+NUMERUS\.',s)
              if not m:
                  print('ABSENS',name); continue
              end=s.find('\nFIN-FUNCTIO.',m.end())
              print('\n--- '+name+' ---')
              print(s[m.start():end+len('\nFIN-FUNCTIO.')])
          print('\n=== LINEAE SIGNA/HASH ===')
          for i,line in enumerate(s.splitlines(),1):
              if re.search(r'SIGNA|HASH|EMPRE|FNV|IDENT',line,re.I):
                  print(f'{i}: {line}')
          PY
