name: Sylvia OS — Fenestrale II Gradus C

on:
  pull_request:
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/systema/uefi/fenestrale_native_c.c'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/uefi/construe_fenestrale_native_c.sh'
      - 'documenta/sylvia/FENESTRALE_II_GRADUS_C.md'
      - '.github/workflows/sylvia-fenestrale-gradus-c.yml'
  push:
    branches: [main]
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/systema/uefi/fenestrale_native_c.c'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/uefi/construe_fenestrale_native_c.sh'
      - '.github/workflows/sylvia-fenestrale-gradus-c.yml'

jobs:
  constructio:
    name: Administrator fenestrarum minimus construitur
    runs-on: ubuntu-latest
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v4
      - name: Fenestrale Gradus C construe
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          bash systema/uefi/construe_fenestrale_native_c.sh \
            /tmp/FENESTRALEC.EFI \
            /tmp/fenestrale_c_uefi.img
      - name: Exitus verifica
        run: |
          file /tmp/FENESTRALEC.EFI
          objdump -p /tmp/FENESTRALEC.EFI | grep 'Subsystem.*EFI application'
          test -s /tmp/fenestrale_c_uefi.img
          test "$(stat -c %s /tmp/fenestrale_c_uefi.img)" -ge 67108864
