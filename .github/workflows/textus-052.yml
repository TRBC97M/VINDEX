name: TEXTUS 0.52 — Applicatio et probatio

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  textus:
    if: github.head_ref == 'chatgpt/vindex-052-textus'
    runs-on: ubuntu-latest
    steps:
      - name: Fontes accipe
        uses: actions/checkout@v4
        with:
          ref: chatgpt/vindex-052-textus
          fetch-depth: 0

      - name: Compilatorem pristinum proba
        run: |
          cd 'Vindex Chat-GPT/vindex_final_v51'
          chmod +x ./compilator_vindex
          printf 'Magnitudo fontis pristini: '
          wc -c < src/compilator_vindex.vindex
          printf 'Numerus functionum pristinarum: '
          grep -c '^FUNCTIO ' src/compilator_vindex.vindex
          ./compilator_vindex src/compilator_vindex.vindex /tmp/compilator_pristinus
          printf 'Magnitudo binarii pristini reconstructi: '
          stat -c '%s' /tmp/compilator_pristinus
          printf 'Magnitudo binarii distributi: '
          stat -c '%s' ./compilator_vindex

      - name: LONGITUDO sola proba
        run: |
          VIA='Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'
          COMP='./Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
          git checkout -- "$VIA"
          python3 'Vindex Chat-GPT/vindex_final_v51/instrumenta/proba_longitudinem_052.py'
          printf 'Magnitudo cum LONGITUDO sola: '
          wc -c < "$VIA"
          "$COMP" "$VIA" /tmp/compilator_longitudo
          printf '%s\n' 'RECTE: LONGITUDO sola compilata est.'
          git checkout -- "$VIA"

      - name: Gradus I sub vestigio proba
        run: |
          VIA='Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'
          COMP='./Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
          git checkout -- "$VIA"
          VINDEX_TEXTUS_GRADUS=1 python3 'Vindex Chat-GPT/vindex_final_v51/instrumenta/applica_textus_052.py'
          if command -v strace >/dev/null 2>&1; then
            set +e
            strace -f -e trace=write,writev -o /tmp/vestigium "$COMP" "$VIA" /tmp/compilator_gradus_1
            STATUS=$?
            set -e
            cat /tmp/vestigium
            exit "$STATUS"
          else
            "$COMP" "$VIA" /tmp/compilator_gradus_1
          fi

      - name: Gradus mutationum separatim proba
        run: |
          VIA='Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'
          COMP='./Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
          for GRADUS in 1 2 3 4 5; do
            git checkout -- "$VIA"
            printf 'Gradus %s incipit.\n' "$GRADUS"
            VINDEX_TEXTUS_GRADUS="$GRADUS" python3 'Vindex Chat-GPT/vindex_final_v51/instrumenta/applica_textus_052.py'
            printf 'Magnitudo: '
            wc -c < "$VIA"
            "$COMP" "$VIA" "/tmp/compilator_gradus_${GRADUS}"
            printf 'Gradus %s recte compilatus est.\n' "$GRADUS"
          done
          git checkout -- "$VIA"

      - name: Mutationes TEXTUS applica
        run: |
          python3 'Vindex Chat-GPT/vindex_final_v51/instrumenta/applica_textus_052.py'
          git diff --check

      - name: Compilatorem auto-hospitem reconstrue
        run: |
          cd 'Vindex Chat-GPT/vindex_final_v51'
          ./compilator_vindex src/compilator_vindex.vindex /tmp/compilator_vindex_052_1
          chmod +x /tmp/compilator_vindex_052_1
          /tmp/compilator_vindex_052_1 src/compilator_vindex.vindex /tmp/compilator_vindex_052_2
          chmod +x /tmp/compilator_vindex_052_2
          cmp /tmp/compilator_vindex_052_1 /tmp/compilator_vindex_052_2
          cp /tmp/compilator_vindex_052_2 ./compilator_vindex

      - name: TEXTUS litterale proba
        run: |
          cd 'Vindex Chat-GPT/vindex_final_v51'
          ./compilator_vindex examples/textus_litterale_052.vindex /tmp/textus_litterale_052
          chmod +x /tmp/textus_litterale_052
          /tmp/textus_litterale_052 > /tmp/textus_exitus
          printf 'Sylvia\n6\n' > /tmp/textus_exspectatus
          cmp /tmp/textus_exspectatus /tmp/textus_exitus

      - name: Mutationes comprobatas conserva
        run: |
          git config user.name 'VINDEX Centurio'
          git config user.email 'actions@users.noreply.github.com'
          git add 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex' \
                  'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
          if git diff --cached --quiet; then
            printf '%s\n' 'Nihil novum conservandum est.'
          else
            git commit -m 'VINDEX 0.52: TEXTUS litteralis et LONGITUDO in compilatore'
            git push origin HEAD:chatgpt/vindex-052-textus
          fi
