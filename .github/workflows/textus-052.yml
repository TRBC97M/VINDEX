name: VINDEX 0.52 — Fundamenta compilatoris

on:
  push:
    branches:
      - chatgpt/vindex-052-textus
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  textus:
    runs-on: ubuntu-latest
    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5
        with:
          ref: chatgpt/vindex-052-textus
          fetch-depth: 0

      - name: Compilatorem pristinum proba
        run: |
          cd 'Vindex Chat-GPT/vindex_final_v51'
          chmod +x ./compilator_vindex
          ./compilator_vindex src/compilator_vindex.vindex /tmp/compilator_pristinus
          cmp ./compilator_vindex /tmp/compilator_pristinus

      - name: Commentaria linearia corrige
        run: |
          python3 'Vindex Chat-GPT/vindex_final_v51/instrumenta/applica_commentaria_052.py'
          cd 'Vindex Chat-GPT/vindex_final_v51'
          ./compilator_vindex src/compilator_vindex.vindex /tmp/compilator_commentaria_1
          chmod +x /tmp/compilator_commentaria_1
          /tmp/compilator_commentaria_1 src/compilator_vindex.vindex /tmp/compilator_commentaria_2
          chmod +x /tmp/compilator_commentaria_2
          cmp /tmp/compilator_commentaria_1 /tmp/compilator_commentaria_2
          /tmp/compilator_commentaria_2 tests/casus/commentarium_intra_functionem.vindex /tmp/proba_commentarii
          chmod +x /tmp/proba_commentarii
          /tmp/proba_commentarii > /tmp/exitus_commentarii
          printf '42\n' > /tmp/exspectatum_commentarii
          cmp /tmp/exspectatum_commentarii /tmp/exitus_commentarii

      - name: Mutationes ANALYSA_FACTOR sine commentariis proba
        run: |
          VIA='Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'
          COMP='./Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
          git checkout -- "$VIA"
          for VARIANS in 1 3 4; do
            git checkout -- "$VIA"
            printf 'Varians %s incipit.\n' "$VARIANS"
            VINDEX_LONGITUDO_VARIANS="$VARIANS" python3 'Vindex Chat-GPT/vindex_final_v51/instrumenta/proba_longitudinem_052.py'
            "$COMP" "$VIA" "/tmp/compilator_varians_${VARIANS}"
            printf 'Varians %s recte compilata est.\n' "$VARIANS"
          done
          git checkout -- "$VIA"
