name: VINDEX 0.52 — Probatio MITTE et TEXTUS

# Probatio experimentalis tantum manu excitatur. Mutationes rami non debent
# epistulas de defectibus automatice generare.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  textus:
    runs-on: ubuntu-latest
    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5
        with:
          ref: chatgpt/vindex-052-textus
          fetch-depth: 0

      - name: MITTE corrige, TEXTUS applica, auto-hospitium proba
        shell: bash
        run: |
          set +e
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          COMP="$RADIX/compilator_vindex"
          FONS="$RADIX/src/compilator_vindex.vindex"
          chmod +x "$COMP"

          python3 "$RADIX/instrumenta/corrige_mitte_052.py"
          STATUS_MITTE=$?
          python3 "$RADIX/instrumenta/applica_textus_052.py"
          STATUS_TEXTUS_APPLICATIO=$?
          printf 'STATUS_CORRECTIO_MITTE=%s\n' "$STATUS_MITTE"
          printf 'STATUS_APPLICATIO_TEXTUS=%s\n' "$STATUS_TEXTUS_APPLICATIO"
          if [ "$STATUS_MITTE" -ne 0 ] || [ "$STATUS_TEXTUS_APPLICATIO" -ne 0 ]; then
            printf '%s\n' 'RESULTATUM=ERRATUM_APPLICATIO'
            exit 0
          fi

          "$COMP" "$FONS" /tmp/compilator_textus_1
          STATUS_I=$?
          printf 'STATUS_GENERATIO_I=%s\n' "$STATUS_I"
          if [ "$STATUS_I" -ne 0 ] || [ ! -s /tmp/compilator_textus_1 ]; then
            printf '%s\n' 'RESULTATUM=ERRATUM_GENERATIO_I'
            exit 0
          fi

          chmod +x /tmp/compilator_textus_1
          /tmp/compilator_textus_1 "$FONS" /tmp/compilator_textus_2
          STATUS_II=$?
          printf 'STATUS_GENERATIO_II=%s\n' "$STATUS_II"
          if [ "$STATUS_II" -ne 0 ] || [ ! -s /tmp/compilator_textus_2 ]; then
            printf '%s\n' 'RESULTATUM=ERRATUM_GENERATIO_II'
            exit 0
          fi

          cmp /tmp/compilator_textus_1 /tmp/compilator_textus_2
          STATUS_AUTO=$?
          printf 'STATUS_AUTO_HOSPITIUM=%s\n' "$STATUS_AUTO"
          if [ "$STATUS_AUTO" -ne 0 ]; then
            printf '%s\n' 'RESULTATUM=ERRATUM_AUTO_HOSPITIUM'
            exit 0
          fi

          printf '%s\n' 'RESULTATUM=RECTE_AUTO_HOSPITIUM'
          exit 0
