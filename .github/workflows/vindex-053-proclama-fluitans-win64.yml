# Correctionem fluitantis Claudii et alignmentum WriteFile sub Windows vero verificat.
name: VINDEX 0.53 — PROCLAMA fluitans Win64

on:
  push:
    branches:
      - chatgpt/fluitans-win64-053
  pull_request:
    branches:
      - claude/pe-integration-053-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5

      - name: Alignmentum WriteFile applica
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          FONS="$RUNNER_TEMP/compilator_fluitans.vindex"
          python3 -m py_compile "$RADIX/instrumenta/corrige_proclama_fluitans_win64_053.py"
          python3 "$RADIX/instrumenta/corrige_proclama_fluitans_win64_053.py" "$RADIX/src/compilator_vindex.vindex" "$FONS"
          grep -Fq 'p = COMPONE_MOVQ_DE_XMM(codex, p, 15, 0).' "$FONS"
          grep -Fq 'CODEX_SCRIBE(codex, p + 1, 86).' "$FONS"
          grep -Fq 'CODEX_SCRIBE(codex, p + 2, 244).' "$FONS"
          chmod 755 "$RADIX/compilator_vindex"
          timeout 30s "$RADIX/compilator_vindex" "$FONS" "$RUNNER_TEMP/gen1"
          chmod 755 "$RUNNER_TEMP/gen1"

      - name: ELF fluitans canonicum custodi
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          timeout 20s "$RUNNER_TEMP/gen1" "$RADIX/tests/casus/fluitans.vindex" "$RUNNER_TEMP/fluitans_elf"
          chmod 755 "$RUNNER_TEMP/fluitans_elf"
          OUT="$(timeout 10s "$RUNNER_TEMP/fluitans_elf")"
          printf 'ELF=[%s]\n' "$OUT"
          test "$OUT" = $'4.640000\n1'
          printf '%s\n' 'RECTE: PROCLAMA fluitans ELF intactum est.'

      - name: PE fluitantes positivos construe
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          COMP="$RUNNER_TEMP/gen1"
          timeout 20s "$COMP" "$RADIX/tests/casus/fluitans.vindex" "$RUNNER_TEMP/fluitans.exe" pe
          cat >"$RUNNER_TEMP/mixtum.vindex" <<'VINDEX'
          FUNCTIO PRINCIPALIS REDDENS NUMERUS.
              PROCLAMA "Initium".
              PROCLAMA 42.
              DECLARA x SICUT FLUITANS VALENS 3.14.
              PROCLAMA x.
              PROCLAMA "Finis".
              REDDE 8.
          FIN-FUNCTIO.
          VINDEX
          cat >"$RUNNER_TEMP/dimidia.vindex" <<'VINDEX'
          FUNCTIO PRINCIPALIS REDDENS NUMERUS.
              DECLARA x SICUT FLUITANS VALENS 0.5.
              PROCLAMA x.
              REDDE 5.
          FIN-FUNCTIO.
          VINDEX
          timeout 20s "$COMP" "$RUNNER_TEMP/mixtum.vindex" "$RUNNER_TEMP/mixtum.exe" pe
          timeout 20s "$COMP" "$RUNNER_TEMP/dimidia.vindex" "$RUNNER_TEMP/dimidia.exe" pe
          file "$RUNNER_TEMP/fluitans.exe" "$RUNNER_TEMP/mixtum.exe" "$RUNNER_TEMP/dimidia.exe"

      - name: Executabilia conserva
        uses: actions/upload-artifact@v4
        with:
          name: vindex-proclama-fluitans-win64
          path: |
            ${{ runner.temp }}/fluitans.exe
            ${{ runner.temp }}/mixtum.exe
            ${{ runner.temp }}/dimidia.exe
          if-no-files-found: error

  windows:
    needs: construe
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Executabilia accipe
        uses: actions/download-artifact@v4
        with:
          name: vindex-proclama-fluitans-win64
          path: pe
      - name: Fluitantes sub Windows vero verifica
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Proba-Vindex([string]$nomen, [int]$status, [string]$exspectatum) {
            $via = Join-Path $PWD ("pe\" + $nomen + ".exe")
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = $via
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $p = [System.Diagnostics.Process]::new()
            $p.StartInfo = $psi
            [void]$p.Start()
            $stdout = $p.StandardOutput.ReadToEnd()
            $stderr = $p.StandardError.ReadToEnd()
            $p.WaitForExit()
            $out = ($stdout -replace "`r`n", "`n").TrimEnd("`n")
            Write-Host "$nomen -> status $($p.ExitCode), stdout=[$($out -replace "`n", "\\n")]"
            if ($stderr.Length -gt 0) { Write-Host "stderr=[$stderr]" }
            if ($p.ExitCode -ne $status) { throw "ERRATUM: $nomen status $($p.ExitCode); $status exspectabatur." }
            if ($out -ne $exspectatum) { throw "ERRATUM: $nomen exitus [$out], [$exspectatum] exspectabatur." }
          }
          Proba-Vindex 'fluitans' 0 "4.640000`n1"
          Proba-Vindex 'mixtum' 8 "Initium`n42`n3.140000`nFinis"
          Proba-Vindex 'dimidia' 5 '0.500000'
          Write-Host 'RECTE: PROCLAMA fluitans Claudii sub Windows vero confirmatum est.'

  auto-hospitium:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5
      - name: Punctum fixum confirma
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          FONS="$RUNNER_TEMP/compilator_fluitans.vindex"
          python3 "$RADIX/instrumenta/corrige_proclama_fluitans_win64_053.py" "$RADIX/src/compilator_vindex.vindex" "$FONS"
          chmod 755 "$RADIX/compilator_vindex"
          timeout 30s "$RADIX/compilator_vindex" "$FONS" "$RUNNER_TEMP/gen1"
          chmod 755 "$RUNNER_TEMP/gen1"
          timeout 30s "$RUNNER_TEMP/gen1" "$FONS" "$RUNNER_TEMP/gen2"
          chmod 755 "$RUNNER_TEMP/gen2"
          timeout 30s "$RUNNER_TEMP/gen2" "$FONS" "$RUNNER_TEMP/gen3"
          cmp "$RUNNER_TEMP/gen2" "$RUNNER_TEMP/gen3"
          sha256sum "$RUNNER_TEMP/gen2"
          printf '%s\n' 'RECTE: PROCLAMA fluitans punctum fixum servat.'
