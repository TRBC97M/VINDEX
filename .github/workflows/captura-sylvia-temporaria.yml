name: Captura Sylvia realis

on:
  push:
    branches:
      - chatgpt/p16-initium-ii

permissions:
  contents: read

jobs:
  captura:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Instrumenta UEFI institue
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf file

      - name: Sylviam veram sub QEMU pinge
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        env:
          MORA_INITII: '28'
        run: |
          set -euo pipefail
          PROBATOR_FENESTRALIS="$GITHUB_WORKSPACE/.github/captura_initium_realis.py" \
            bash ./instrumenta/proba_fenestrale_uefi_purum.sh
          test -s "$GITHUB_WORKSPACE/sylvia-initium-realis.ppm"

      - name: Capturam realem publica
        uses: actions/upload-artifact@v4
        with:
          name: sylvia-initium-realis
          path: sylvia-initium-realis.ppm
          if-no-files-found: error
          retention-days: 1
