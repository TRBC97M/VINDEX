name: VINDEX — Canonizatio Identificatorum Longorum POC V

on:
  pull_request:
    paths:
      - 'instrumenta/corrige_identificatores_longi_poc_v.py'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/casus/identificatores_longi.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/casus/forma_commentum_non_falsum.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/win32_app.vindex'
      - 'PROGRAMMATA/ATMOS_TERMINAL_DEPTH/POC_V/**'
      - '.github/workflows/vindex-identificatores-longi-poc-v-canoniza.yml'

permissions:
  contents: write

jobs:
  canoniza:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Ramum ipsum accipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Identificatores et scannerem FORMA corrige
        shell: bash
        run: |
          set -euo pipefail
          python3 instrumenta/corrige_identificatores_longi_poc_v.py

      - name: Compilatorem ad punctum fixum regenera
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          chmod +x compilator_vindex
          ./compilator_vindex src/compilator_vindex.vindex /tmp/g2
          chmod +x /tmp/g2
          /tmp/g2 src/compilator_vindex.vindex /tmp/g3
          chmod +x /tmp/g3
          /tmp/g3 src/compilator_vindex.vindex /tmp/g4
          chmod +x /tmp/g4
          /tmp/g4 src/compilator_vindex.vindex /tmp/g5
          cmp /tmp/g3 /tmp/g4
          cmp /tmp/g4 /tmp/g5
          cp /tmp/g5 compilator_vindex
          chmod +x compilator_vindex
          echo 'RECTE: G3 = G4 = G5 post identificatores longos et FORMA.'

      - name: Regressiones scanneris sub ELF proba
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex tests/casus/identificatores_longi.vindex /tmp/identificatores_longi
          chmod +x /tmp/identificatores_longi
          out=$(/tmp/identificatores_longi)
          printf '%s\n' "$out"
          grep -q 'IDENTIFICATORES LONGI RECTE' <<<"$out"
          grep -qx '7' <<<"$out"
          grep -qx '11' <<<"$out"
          grep -qx '22' <<<"$out"

          ./compilator_vindex tests/casus/forma_commentum_non_falsum.vindex /tmp/forma_commentum
          chmod +x /tmp/forma_commentum
          forma=$(/tmp/forma_commentum)
          printf '%s\n' "$forma"
          grep -q 'FORMA COMMENTUM RECTE' <<<"$forma"
          grep -qx '42' <<<"$forma"

      - name: PE clientes qui status 65 excitabant genera
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          VDX="$ROOT/Vindex Chat-GPT/vindex_final_v51"
          COMP="$VDX/compilator_vindex"
          (cd "$VDX" && ./compilator_vindex tests/casus/identificatores_longi.vindex /tmp/identificatores_longi.exe pe)
          (cd "$VDX" && ./compilator_vindex tests/casus/forma_commentum_non_falsum.vindex /tmp/forma_commentum.exe pe)
          (cd "$VDX" && ./compilator_vindex tests/casus/win32_app.vindex /tmp/proba_win32_app.exe pe)
          (cd "$ROOT/PROGRAMMATA/ATMOS_TERMINAL_DEPTH/POC_V" && "$COMP" ludus.vindex /tmp/atmos_poc_v.exe pe)
          file /tmp/identificatores_longi.exe /tmp/forma_commentum.exe /tmp/proba_win32_app.exe /tmp/atmos_poc_v.exe

      - name: Executabilia Windows conserva
        uses: actions/upload-artifact@v4
        with:
          name: identificatores-longi-poc-v-pe
          path: |
            /tmp/identificatores_longi.exe
            /tmp/forma_commentum.exe
            /tmp/proba_win32_app.exe
            /tmp/atmos_poc_v.exe
          retention-days: 2

  windows:
    needs: canoniza
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Executabilia cape
        uses: actions/download-artifact@v4
        with:
          name: identificatores-longi-poc-v-pe
          path: proba

      - name: Regressiones et Win32 App sub Windows vero proba
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $id = & (Resolve-Path '.\proba\identificatores_longi.exe') 2>&1
          $idText = ($id -join "`n")
          Write-Host $idText
          if ($LASTEXITCODE -ne 0 -or $idText -notmatch 'IDENTIFICATORES LONGI RECTE') { throw 'identificatores longi Win64 fallunt' }

          $forma = & (Resolve-Path '.\proba\forma_commentum.exe') 2>&1
          $formaText = ($forma -join "`n")
          Write-Host $formaText
          if ($LASTEXITCODE -ne 0 -or $formaText -notmatch 'FORMA COMMENTUM RECTE') { throw 'scanner FORMA commentarium devoravit' }

          $app = & (Resolve-Path '.\proba\proba_win32_app.exe') 2>&1
          $appText = ($app -join "`n")
          Write-Host $appText
          if ($LASTEXITCODE -ne 0 -or $appText -notmatch 'WIN32 APP RECTE') { throw 'win32_app post correctionem fallit' }

      - name: ATMOS POC V sub Windows vero exerce
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location proba
          Remove-Item atmos.sav, atmos.world -ErrorAction SilentlyContinue
          $out = & .\atmos_poc_v.exe smoke 2>&1
          $code = $LASTEXITCODE
          $text = ($out -join "`n")
          Write-Host $text
          if ($code -ne 0) { throw "ATMOS POC V exitus $code" }
          if ($text -notmatch 'RECTE: ATMOS POC V WIN64') { throw 'confirmatio POC V deest' }
          if (-not (Test-Path atmos.sav) -or -not (Test-Path atmos.world)) { throw 'ATD1/ATW1 desunt' }
          Pop-Location

  repone:
    needs: [canoniza, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ramum ipsum accipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Correctionem iterum applica et compilatorem regenera
        shell: bash
        run: |
          set -euo pipefail
          python3 instrumenta/corrige_identificatores_longi_poc_v.py
          cd 'Vindex Chat-GPT/vindex_final_v51'
          chmod +x compilator_vindex
          ./compilator_vindex src/compilator_vindex.vindex /tmp/g2
          chmod +x /tmp/g2
          /tmp/g2 src/compilator_vindex.vindex /tmp/g3
          chmod +x /tmp/g3
          /tmp/g3 src/compilator_vindex.vindex /tmp/g4
          chmod +x /tmp/g4
          cmp /tmp/g3 /tmp/g4
          cp /tmp/g4 compilator_vindex
          chmod +x compilator_vindex

      - name: Mutationem canonicam repone
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex' \
                  'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
          if git diff --cached --quiet; then
            echo 'RECTE: correctio iam canonica est.'
            exit 0
          fi
          git commit -m 'P11-E: identificatores et scannerem FORMA canoniza'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
