name: TEMP — verifica ARCHIVUM

on:
  push:
    branches:
      - chatgpt/archivum
    paths:
      - .github/workflows/tmp-archivum-secreta.yml

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verifica structuram et secreta
        shell: bash
        run: |
          set -euo pipefail
          test ! -d archivum
          python3 ARCHIVUM-verifica_secreta.py
          test -f ARCHIVUM-INDEX.md
          test -f ARCHIVUM-LEGE-ME.md
          n_claude=$(find . -maxdepth 1 -name 'ARCHIVUM-CLAUDE-*.md' | wc -l)
          n_chatgpt=$(find . -maxdepth 1 -name 'ARCHIVUM-CHATGPT-*.md' | wc -l)
          test "$n_claude" -eq 13
          test "$n_chatgpt" -eq 9
          echo "RECTE: $n_claude Claude + $n_chatgpt ChatGPT, omnia ad radicem."
