name: Sylvia — VirtIO GPU III-D

on:
  push:
    paths:
      - '.github/workflows/sylvia-virtio-gpu-3d.yml'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/rectores/virtio_pci.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/rectores/virtio_gpu_3d.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/virtio_gpu_3d.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/proba_virtio_gpu_3d.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/proba_virtio_gpu_3d_053.sh'
  pull_request:
    paths:
      - '.github/workflows/sylvia-virtio-gpu-3d.yml'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/rectores/virtio_pci.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/rectores/virtio_gpu_3d.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/virtio_gpu_3d.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/proba_virtio_gpu_3d.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/proba_virtio_gpu_3d_053.sh'

permissions:
  contents: read

jobs:
  proba:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Compilatorem et fontes verifica
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./compilator_vindex
          python3 instrumenta/vindex_verifica.py probationes/virtio_gpu_3d.vindex
          (cd systema && python3 ../instrumenta/vindex_verifica.py proba_virtio_gpu_3d.vindex)
          ./compilator_vindex src/compilator_vindex.vindex /tmp/g2
          chmod +x /tmp/g2
          /tmp/g2 src/compilator_vindex.vindex /tmp/g3
          cmp ./compilator_vindex /tmp/g2
          cmp /tmp/g2 /tmp/g3

      - name: Regressionem canonicam et targeta conserva
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex probationes/virtio_gpu_3d.vindex /tmp/f9-native
          chmod +x /tmp/f9-native
          /tmp/f9-native
          ./tests/run_tests.sh | tee /tmp/tests.log
          grep -Fq '35 probationes rectae; 0 errata.' /tmp/tests.log
          python3 ../../instrumenta/verifica_puritatem_sylviae.py
          python3 instrumenta/verifica_abi_graphica_viii.py
          ./compilator_vindex systema/fenestrale_ii_purus_i.vindex /tmp/fenestrale-f9
          file /tmp/fenestrale-f9 | grep -F 'ELF 64-bit'
          ./compilator_vindex tests/casus/salve.vindex /tmp/salve.exe pe
          ./compilator_vindex tests/casus/salve.vindex /tmp/salve-uefi.exe uefi
          file /tmp/salve.exe | grep -F 'PE32+'
          objdump -p /tmp/salve-uefi.exe | grep -E 'Subsystem.*EFI application'

      - name: QEMU et virglrenderer institue
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-system-gui qemu-system-modules-opengl ovmf libvirglrenderer1 libgl1-mesa-dri libegl-mesa0 libegl1 libgbm1 xvfb xauth file

      - name: F8 et F9 in QEMU proba
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./instrumenta/proba_backend_virtio_x_053.sh ./instrumenta/proba_virtio_gpu_3d_053.sh
          ./instrumenta/proba_backend_virtio_x_053.sh | tee /tmp/f8.log
          grep -Fq 'VIO7 T02 P00000002 D000FB000 F00000007 Z000FB000 R' /tmp/f8.log
          ./instrumenta/proba_virtio_gpu_3d_053.sh | tee /tmp/f9.log
          grep -Fq 'backend II-D non fingitur III-D' /tmp/f9.log
          grep -Fq 'capset realis lectus, contextus III-D creatus et deletus' /tmp/f9.log
          grep -Fq 'FUNDAMENTUM VIRTIO GPU III-D PROBATUM' /tmp/f9.log
