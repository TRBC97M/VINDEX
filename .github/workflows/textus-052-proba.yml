name: VINDEX 0.52 — Probatio diagnostica unica

# Haec probatio diagnostica semper viridis manet; exitus verus intra
# RESULTATUM scribitur, ne experimenta epistulas de defectibus generent.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  textus:
    runs-on: ubuntu-latest
    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5
        with:
          ref: chatgpt/vindex-052-textus
          fetch-depth: 0

      - name: MITTE, TEXTUS et auto-hospitium uno cursu proba
        shell: bash
        run: |
          set +e
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          FONS="$RADIX/src/compilator_vindex.vindex"
          COMP="$RADIX/compilator_vindex"
          chmod +x "$COMP"

          python3 "$RADIX/instrumenta/corrige_mitte_052.py"
          STATUS_MITTE=$?
          python3 "$RADIX/instrumenta/applica_textus_052.py"
          STATUS_TEXTUS=$?
          printf 'STATUS_CORRECTIO_MITTE=%s\n' "$STATUS_MITTE"
          printf 'STATUS_APPLICATIO_TEXTUS=%s\n' "$STATUS_TEXTUS"
          if [ "$STATUS_MITTE" -ne 0 ] || [ "$STATUS_TEXTUS" -ne 0 ]; then
            printf '%s\n' 'RESULTATUM=ERRATUM_APPLICATIO'
            exit 0
          fi

          "$COMP" "$FONS" /tmp/compilator_textus_1
          STATUS_I=$?
          printf 'STATUS_GENERATIO_I=%s\n' "$STATUS_I"
          if [ "$STATUS_I" -ne 0 ] || [ ! -s /tmp/compilator_textus_1 ]; then
            printf '%s\n' 'RESULTATUM=ERRATUM_GENERATIO_I'
            exit 0
          fi
          chmod +x /tmp/compilator_textus_1

          /tmp/compilator_textus_1 "$FONS" /tmp/compilator_textus_2
          STATUS_II=$?
          printf 'STATUS_GENERATIO_II=%s\n' "$STATUS_II"
          if [ "$STATUS_II" -ne 0 ] || [ ! -s /tmp/compilator_textus_2 ]; then
            printf '%s\n' 'RESULTATUM=ERRATUM_GENERATIO_II'
            exit 0
          fi
          chmod +x /tmp/compilator_textus_2

          cmp /tmp/compilator_textus_1 /tmp/compilator_textus_2
          STATUS_AUTO=$?
          printf 'STATUS_AUTO_HOSPITIUM=%s\n' "$STATUS_AUTO"
          if [ "$STATUS_AUTO" -ne 0 ]; then
            printf '%s\n' 'RESULTATUM=ERRATUM_AUTO_HOSPITIUM'
            exit 0
          fi

          /tmp/compilator_textus_2 "$RADIX/examples/textus_litterale_052.vindex" /tmp/textus_litterale_052
          STATUS_LITTERALE=$?
          printf 'STATUS_COMPILATIO_LITTERALIS=%s\n' "$STATUS_LITTERALE"
          if [ "$STATUS_LITTERALE" -ne 0 ] || [ ! -s /tmp/textus_litterale_052 ]; then
            printf '%s\n' 'RESULTATUM=ERRATUM_COMPILATIO_LITTERALIS'
            exit 0
          fi
          chmod +x /tmp/textus_litterale_052
          /tmp/textus_litterale_052 > /tmp/exitus_litteralis
          STATUS_EXSEC_LITTERALE=$?
          printf 'STATUS_EXSECUTIO_LITTERALIS=%s\n' "$STATUS_EXSEC_LITTERALE"
          printf 'Sylvia\n' > /tmp/exspectatum_litterale
          cmp /tmp/exspectatum_litterale /tmp/exitus_litteralis
          STATUS_EXITUS_LITTERALE=$?
          printf 'STATUS_EXITUS_LITTERALIS=%s\n' "$STATUS_EXITUS_LITTERALE"
          if [ "$STATUS_EXSEC_LITTERALE" -ne 0 ] || [ "$STATUS_EXITUS_LITTERALE" -ne 0 ]; then
            printf '%s\n' 'RESULTATUM=ERRATUM_LITTERALE'
            cat /tmp/exitus_litteralis
            exit 0
          fi

          pushd "$RADIX" >/dev/null
          /tmp/compilator_textus_2 examples/textus_longitudo_052.vindex /tmp/textus_longitudo_052
          STATUS_LONGITUDO=$?
          popd >/dev/null
          printf 'STATUS_COMPILATIO_LONGITUDO=%s\n' "$STATUS_LONGITUDO"
          if [ "$STATUS_LONGITUDO" -ne 0 ] || [ ! -s /tmp/textus_longitudo_052 ]; then
            printf '%s\n' 'RESULTATUM=ERRATUM_COMPILATIO_LONGITUDO'
            exit 0
          fi
          chmod +x /tmp/textus_longitudo_052
          /tmp/textus_longitudo_052 > /tmp/exitus_longitudo
          STATUS_EXSEC_LONGITUDO=$?
          printf 'STATUS_EXSECUTIO_LONGITUDO=%s\n' "$STATUS_EXSEC_LONGITUDO"
          printf '6\n' > /tmp/exspectatum_longitudo
          cmp /tmp/exspectatum_longitudo /tmp/exitus_longitudo
          STATUS_EXITUS_LONGITUDO=$?
          printf 'STATUS_EXITUS_LONGITUDO=%s\n' "$STATUS_EXITUS_LONGITUDO"
          if [ "$STATUS_EXSEC_LONGITUDO" -ne 0 ] || [ "$STATUS_EXITUS_LONGITUDO" -ne 0 ]; then
            printf '%s\n' 'RESULTATUM=ERRATUM_LONGITUDO'
            cat /tmp/exitus_longitudo
            exit 0
          fi

          printf '%s\n' 'RESULTATUM=RECTE'
          exit 0
