name: VINDEX 0.52 — Probatio diagnostica unica

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  textus:
    runs-on: ubuntu-latest
    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5

      - name: Gradus I II III uno cursu examina
        shell: bash
        run: |
          set +e
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          FONS="$RADIX/src/compilator_vindex.vindex"
          COMP="$RADIX/compilator_vindex"
          chmod +x "$COMP"

          for GRADUS in 1 2 3; do
            git checkout -- "$FONS"
            rm -f "/tmp/compilator_gradus_${GRADUS}"
            VINDEX_TEXTUS_GRADUS="$GRADUS" python3 "$RADIX/instrumenta/applica_textus_052.py"
            STATUS_APPLICATIO=$?
            printf 'GRADUS_%s_STATUS_APPLICATIO=%s\n' "$GRADUS" "$STATUS_APPLICATIO"
            if [ "$STATUS_APPLICATIO" -ne 0 ]; then
              continue
            fi

            "$COMP" "$FONS" "/tmp/compilator_gradus_${GRADUS}"
            STATUS_COMPILATIO=$?
            printf 'GRADUS_%s_STATUS_COMPILATIO=%s\n' "$GRADUS" "$STATUS_COMPILATIO"
            if [ -e "/tmp/compilator_gradus_${GRADUS}" ]; then
              printf 'GRADUS_%s_MAGNITUDO_BINARII=%s\n' "$GRADUS" "$(stat -c '%s' "/tmp/compilator_gradus_${GRADUS}")"
            else
              printf 'GRADUS_%s_MAGNITUDO_BINARII=0\n' "$GRADUS"
            fi
          done

          git checkout -- "$FONS"
          printf '%s\n' 'RESULTATUM=DIAGNOSIS_PERFECTA'
          exit 0
