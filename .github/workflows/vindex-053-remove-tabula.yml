# Migratio semel currenda: vectorem historicum tabula CAPACITAS 3000 omnino delet.
name: VINDEX 0.53 — Tabula nulla

on:
  push:
    branches:
      - chatgpt/vindex-053-compilator-dynamicus
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/remove_tabula_carrier_053.py'
      - '.github/workflows/vindex-053-remove-tabula.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tabula-nulla:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5
        with:
          ref: chatgpt/vindex-053-compilator-dynamicus
          fetch-depth: 0

      - name: Dependencias graphicas para
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          if apt-cache show libgtk-3-0t64 >/dev/null 2>&1; then
            sudo apt-get install -y libgtk-3-0t64
          else
            sudo apt-get install -y libgtk-3-0
          fi

      - name: Tabulam vacuam dele et reconstrue
        id: migratio
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          FONS="$RADIX/src/compilator_vindex.vindex"

          find "$RADIX" -type f -name '*.sh' -exec chmod 755 {} +
          chmod 755 \
            "$RADIX/vindexc" \
            "$RADIX/vindex-officina" \
            "$RADIX/vindex-salutatio" \
            "$RADIX/vindex-systema" \
            "$RADIX/compilator_vindex" \
            "$RADIX/vindex_graphica" \
            "$RADIX/officina_vindex" \
            "$RADIX/salutatio_vindex"

          python3 "$RADIX/instrumenta/remove_tabula_carrier_053.py"
          if git diff --quiet -- "$FONS"; then
            echo 'mutatum=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'mutatum=true' >> "$GITHUB_OUTPUT"

          ! grep -Eq '\btabula\s*\[' "$FONS"
          ! grep -Fq 'DECLARA tabula SICUT ORDO DE NUMERUS CAPACITAS 3000.' "$FONS"
          ! grep -Fq 'ACCIPIT tabula SICUT ORDO DE NUMERUS.' "$FONS"
          python3 "$RADIX/instrumenta/inventaria_tabula_053.py" --verifica "$RADIX/instrumenta/TABULA-LITTERALIA-053.txt"

          timeout 30s bash "$RADIX/bootstrap/reconstruit.sh" /tmp/compilator_vindex_novus
          chmod 755 /tmp/compilator_vindex_novus
          cp /tmp/compilator_vindex_novus "$RADIX/compilator_vindex"
          chmod 755 "$RADIX/compilator_vindex"

      - name: XXV regressiones exsequere
        if: steps.migratio.outputs.mutatum == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd 'Vindex Chat-GPT/vindex_final_v51'
          bash tests/run_tests.sh

      - name: Pilam maiorem uno MiB comproba
        if: steps.migratio.outputs.mutatum == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          python3 "$RADIX/instrumenta/genera_probationem_pilae_053.py" /tmp/pila_magna_053.vindex
          timeout 15s "$RADIX/compilator_vindex" /tmp/pila_magna_053.vindex /tmp/pila_magna_053
          chmod 755 /tmp/pila_magna_053
          EX=$(timeout 5s /tmp/pila_magna_053)
          test "$EX" = "$(printf '39\n777')"
          python3 "$RADIX/instrumenta/verifica_pilam_binariam_053.py" /tmp/pila_magna_053

      - name: CRLF sine tarditate comproba
        if: steps.migratio.outputs.mutatum == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          python3 -c 'from pathlib import Path; import sys; f=Path(sys.argv[1]).read_bytes().replace(b"\r\n",b"\n").replace(b"\r",b"\n"); Path(sys.argv[2]).write_bytes(f.replace(b"\n",b"\r\n"))' \
            "$RADIX/src/compilator_vindex.vindex" /tmp/compilator_crlf.vindex
          timeout 10s "$RADIX/compilator_vindex" /tmp/compilator_crlf.vindex /tmp/compilator_crlf

      - name: Mutationem canonicam committe
        if: steps.migratio.outputs.mutatum == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          git config user.name 'VINDEX Automatum'
          git config user.email 'actions@users.noreply.github.com'
          git add -- "$RADIX/src/compilator_vindex.vindex" "$RADIX/compilator_vindex"
          git commit -m 'VINDEX 0.53: tabulam historicam omnino dele'
          git push origin HEAD:chatgpt/vindex-053-compilator-dynamicus
