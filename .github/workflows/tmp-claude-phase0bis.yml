# Workflow temporaria: se ipsam post reconciliationem delet.
name: TEMP — Clausura Phase 0-bis

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-claude-phase0bis.yml'

permissions:
  contents: write

jobs:
  claude:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: CONSILIUM et ARCHIVUM post fusionem claude
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('CONSILIUM.md')
          s = p.read_text(encoding='utf-8')

          old = "**Phase 0-bis — identitas symbolorum exacta:** `CANONIZANDUM per #198`. Collisiones hash base XXXI vere reproductae sunt pro functionibus (`AP`/`B1`), formis (`AP`/`B1`) et campis (`vp`/`x2`), dum localia F9-II iam recta manebant. Correctio identitatem compactam `[positio:32 | longitudo:32]` generalizat; hash manet filtrum, sed octeta exacta auctoritatem identitatis habent. Probationes #198 servant `G1 = G2 = G3`, quattuor oracula collisionum et XXXV regressiones canonicas. Proximum post canonizationem est `STRUCTURA I` secundum `CONCEPTIO-STRUCTURA-REVISA.md`."
          new = "**Phase 0-bis — identitas symbolorum exacta:** `PERFECTUM per #198`, merge `8e9b6a9b602a127b3c6e04a2a314c3361c5ed1bd`. Collisiones hash base XXXI vere reproductae sunt pro functionibus (`AP`/`B1`), formis (`AP`/`B1`) et campis (`vp`/`x2`), dum localia F9-II iam recta manebant. Correctio identitatem compactam `[positio:32 | longitudo:32]` generalizat; hash manet filtrum, sed octeta exacta auctoritatem identitatis habent. Post fusionem run `34064950925` in `main` probavit `G1 = G2 = G3`, quattuor oracula collisionum et `35 probationes rectae; 0 errata.` Proximum opus linguae est `STRUCTURA I` secundum `CONCEPTIO-STRUCTURA-REVISA.md`."
          if s.count(old) != 1:
              raise SystemExit('ERRATUM: status Phase 0-bis non unicus est')
          s = s.replace(old, new)

          old = "- **P9 Phase 0-bis / #198 est `CANONIZANDUM`; post eam STRUCTURA I est proximum opus linguae ChatGPT**;"
          new = "- **P9 Phase 0-bis / #198 est `PERFECTUM`; STRUCTURA I est nunc proximum opus linguae ChatGPT**;"
          if s.count(old) != 1:
              raise SystemExit('ERRATUM: coordinatio Phase 0-bis non inventa')
          s = s.replace(old, new)

          old = "1. **P9 Phase 0-bis / #198:** identitatem exactam functionum, formarum et camporum canoniza post CI viridem; localia F9-II intacta servantur;\n2. post fusionem #198, **STRUCTURA I** ex `CONCEPTIO-STRUCTURA-REVISA.md` implementa supra hanc identitatis fundamentum, non supra hash fortuitum;\n3. pro mutationibus compilatoris `G2 = G3`, regressiones canonicas et oracula effectus reales conserva;\n4. **P16-XII-F9-IV** manet `PARATUM` ut linea graphica separata; non resumatur nisi prioritas explicite ad Graphica X redit;\n5. PR #183 ATMOS NATIVUM manet draft separatum et probationes humanas/modernizationem suam non confundit cum STRUCTURA;\n6. P14 rete, TERMINALE et Explorator fasciculorum crescere possunt ubi prioritas usus id postulat."
          new = "1. **STRUCTURA I:** `CONCEPTIO-STRUCTURA-REVISA.md` supra identitatem exactam #198 implementa, sine regressione formarum canonicarum neque hash fortuito;\n2. pro mutationibus compilatoris `G2 = G3`, regressiones canonicas et oracula effectus reales conserva;\n3. **P16-XII-F9-IV** manet `PARATUM` ut linea graphica separata; non resumatur nisi prioritas explicite ad Graphica X redit;\n4. PR #183 ATMOS NATIVUM manet draft separatum et probationes humanas/modernizationem suam non confundit cum STRUCTURA;\n5. P14 rete, TERMINALE et Explorator fasciculorum crescere possunt ubi prioritas usus id postulat."
          if s.count(old) != 1:
              raise SystemExit('ERRATUM: Actio proxima vetus non inventa')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          a = Path('ARCHIVUM/CHATGPT-2026-09-06-phase0bis-identitas-exacta.md')
          t = a.read_text(encoding='utf-8')
          add = "\n\n## Canonisation finale\n\nPR #198 a été fusionnée dans `main` par le merge commit `8e9b6a9b602a127b3c6e04a2a314c3361c5ed1bd`.\n\nLa preuve permanente a été réexécutée **après fusion sur ce commit de `main`** : GitHub Actions run `34064950925`, job `identitas`, succès. Les logs attestent explicitement :\n\n- `RECTE: G1 = G2 = G3.` ;\n- locale `vp/x2` : sortie vide, statut 0 ;\n- fonctions `AP/B1` : `111`, puis `222` ;\n- formes `AP/B1` : `1.500000`, puis `7` ;\n- champs `vp/x2` : `111`, puis `222` ;\n- `35 probationes rectae; 0 errata.`\n\nPhase 0-bis est donc close selon la chaîne : implémentation -> preuve -> intégration -> documentation -> mémoire partagée. La prochaine étape canonique est `STRUCTURA I` selon `CONCEPTIO-STRUCTURA-REVISA.md`. F9-IV reste seulement `PARATUM` et ne doit pas être repris implicitement.\n"
          if '## Canonisation finale' not in t:
              a.write_text(t.rstrip() + add + '\n', encoding='utf-8')
          PY
          git diff --check

      - name: Mutationes committe et workflow temporariam remove
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-claude-phase0bis.yml
          git add CONSILIUM.md ARCHIVUM/CHATGPT-2026-09-06-phase0bis-identitas-exacta.md
          git diff --check --cached
          git config user.name 'TRBC97M'
          git config user.email 'trbc97m@protonmail.com'
          git commit -m 'docs: Phase 0-bis post fusionem claude'
          git push origin HEAD:main
