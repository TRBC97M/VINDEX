name: VINDEX 0.53 — Win64 R4

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/casus/argumenta_win64.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/casus/fluitans_win64.vindex'
      - '.github/workflows/vindex-053-win64-r4.yml'

jobs:
  genera:
    name: Exsecutabilia PE sub Linux generantur
    runs-on: ubuntu-latest
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v4
      - name: PE probationum et compilatoris genera
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          chmod +x compilator_vindex
          mkdir -p /tmp/vindex-r4
          ./compilator_vindex tests/casus/argumenta_win64.vindex /tmp/vindex-r4/argumenta_win64.exe pe
          ./compilator_vindex tests/casus/fluitans_win64.vindex /tmp/vindex-r4/fluitans_win64.exe pe
          ./compilator_vindex src/compilator_vindex.vindex /tmp/vindex-r4/compilator_win64.exe pe
          cp tests/casus/argumenta_win64.vindex /tmp/vindex-r4/argumenta_win64.vindex
      - name: PE ad probationem Windows conserva
        uses: actions/upload-artifact@v4
        with:
          name: vindex-r4-win64
          path: /tmp/vindex-r4
          if-no-files-found: error
          retention-days: 1

  windows:
    name: argc argv et runtime sub Windows vero probantur
    needs: genera
    runs-on: windows-latest
    steps:
      - name: PE accipe
        uses: actions/download-artifact@v4
        with:
          name: vindex-r4-win64
          path: r4
      - name: Argumenta cum quotatione proba
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exitus = @(& .\r4\argumenta_win64.exe alpha 'beta gamma' delta)
          if ($LASTEXITCODE -ne 0) { throw "argumenta_win64.exe exitus $LASTEXITCODE" }
          $expectata = @('4','97','98','32','103','100','0')
          if (($exitus -join '|') -ne ($expectata -join '|')) {
            throw "argumenta prava: $($exitus -join '|')"
          }
      - name: Fluitans et WriteFile proba
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exitus = @(& .\r4\fluitans_win64.exe)
          if ($LASTEXITCODE -ne 0) { throw "fluitans_win64.exe exitus $LASTEXITCODE" }
          if (($exitus -join '').Trim() -ne '-1.250000') {
            throw "fluitans pravus: $($exitus -join '|')"
          }
      - name: Compilatorem Win64 se uti proba
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\r4\compilator_win64.exe .\r4\argumenta_win64.vindex .\r4\secundum.exe pe
          if ($LASTEXITCODE -ne 0) { throw "compilator_win64.exe exitus $LASTEXITCODE" }
          if (!(Test-Path .\r4\secundum.exe)) { throw 'secundum.exe non creatum est' }
          $exitus = @(& .\r4\secundum.exe alpha 'beta gamma' delta)
          if ($LASTEXITCODE -ne 0) { throw "secundum.exe exitus $LASTEXITCODE" }
          $expectata = @('4','97','98','32','103','100','0')
          if (($exitus -join '|') -ne ($expectata -join '|')) {
            throw "argumenta secunda prava: $($exitus -join '|')"
          }
      - name: FONS diagnostici R2 sub Win64 proba
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $radix = Join-Path $PWD 'r4\diagnosticum'
          New-Item -ItemType Directory -Force -Path $radix | Out-Null
          $fons = Join-Path $radix 'principalis.vindex'
          $productum = Join-Path $radix 'erratum.exe'
          @(
            'FUNCTIO PRINCIPALIS REDDENS NUMERUS.'
            '    IGNOTUM.'
            '    REDDE 0.'
            'FIN-FUNCTIO.'
          ) | Set-Content -Path $fons -Encoding utf8NoBOM

          $exitus = @(& .\r4\compilator_win64.exe $fons $productum pe 2>&1)
          $status = $LASTEXITCODE
          $exitus | ForEach-Object { Write-Host $_ }
          if ($status -eq 0) { throw 'compilatio errata falso successit' }

          $indexFons = [Array]::IndexOf($exitus, 'FONS')
          if ($indexFons -lt 0 -or $indexFons + 1 -ge $exitus.Count) { throw 'campus FONS deest' }
          if ([string]::IsNullOrWhiteSpace([string]$exitus[$indexFons + 1])) { throw 'campus FONS vacuus est' }
          if ([string]$exitus[$indexFons + 1] -notmatch 'principalis\.vindex$') {
            throw "FONS pravus: $($exitus[$indexFons + 1])"
          }

          $indexLinea = [Array]::IndexOf($exitus, 'LINEA')
          $indexColumna = [Array]::IndexOf($exitus, 'COLUMNA')
          if ($indexLinea -lt 0 -or [string]$exitus[$indexLinea + 1] -ne '2') { throw 'LINEA diagnostici prava est' }
          if ($indexColumna -lt 0 -or [string]$exitus[$indexColumna + 1] -ne '5') { throw 'COLUMNA diagnostici prava est' }
          if (($exitus -join "`n") -notmatch 'ERRATUM: instructio ignota est') { throw 'NUNTIUS diagnostici pravus est' }
          exit 0
