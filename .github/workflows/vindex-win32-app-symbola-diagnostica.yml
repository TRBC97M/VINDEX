name: VINDEX — Diagnostica Symbolorum Win32 App

on:
  pull_request:
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/tests/casus/win32_app_symbola_*.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/win32_app.vindex'
      - 'instrumenta/corrige_identificatores_longi_poc_v.py'
      - '.github/workflows/vindex-win32-app-symbola-diagnostica.yml'

jobs:
  diagnostica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Compilatorem correctum temporaliter genera
        shell: bash
        run: |
          set -euo pipefail
          python3 instrumenta/corrige_identificatores_longi_poc_v.py
          cd 'Vindex Chat-GPT/vindex_final_v51'
          chmod +x compilator_vindex
          ./compilator_vindex src/compilator_vindex.vindex /tmp/g2
          chmod +x /tmp/g2
          /tmp/g2 src/compilator_vindex.vindex /tmp/g3
          chmod +x /tmp/g3
          /tmp/g3 src/compilator_vindex.vindex /tmp/g4
          chmod +x /tmp/g4
          cmp /tmp/g3 /tmp/g4
      - name: Symbolum CREA compila
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: /tmp/g4 tests/casus/win32_app_symbola_superficiei.vindex /tmp/crea.exe pe
      - name: Symbola post CREA compila
        if: always()
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: /tmp/g4 tests/casus/win32_app_symbola_post.vindex /tmp/post.exe pe
