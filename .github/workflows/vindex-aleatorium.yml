name: VINDEX — Aleatorium determinatum

on:
  pull_request:
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/aleatorium.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/casus/aleatorium.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
      - '.github/workflows/vindex-aleatorium.yml'

jobs:
  elf-et-pe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PRNG sub ELF proba et PE genera
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          chmod +x compilator_vindex
          ./compilator_vindex tests/casus/aleatorium.vindex /tmp/proba_aleatorium
          chmod +x /tmp/proba_aleatorium
          /tmp/proba_aleatorium | tee /tmp/alea.log
          grep -F 'ALEATORIUM RECTE' /tmp/alea.log
          ./compilator_vindex tests/casus/aleatorium.vindex /tmp/proba_aleatorium.exe pe
          file /tmp/proba_aleatorium.exe
      - uses: actions/upload-artifact@v4
        with:
          name: proba-aleatorium
          path: /tmp/proba_aleatorium.exe
          if-no-files-found: error
          retention-days: 1

  windows:
    needs: elf-et-pe
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: proba-aleatorium
          path: proba
      - name: PRNG sub Windows vero proba
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path '.\proba\proba_aleatorium.exe').Path
          $out = & $exe 2>&1
          $code = $LASTEXITCODE
          $text = ($out -join "`n")
          Write-Host $text
          if ($code -ne 0) { throw "proba_aleatorium exitus $code" }
          if ($text -notmatch 'ALEATORIUM RECTE') { throw 'confirmatio PRNG deest' }
