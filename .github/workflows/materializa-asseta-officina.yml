name: TEMP — materializa asseta OFFICINA

on:
  push:
    branches:
      - chatgpt/p16-xi-a-asseta-premium-i
    paths:
      - '.github/workflows/materializa-asseta-officina.yml'

permissions:
  contents: write

jobs:
  materializa:
    runs-on: ubuntu-24.04
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Duo PNG exacta materializa et verifica
        shell: bash
        run: |
          set -euo pipefail
          d='Vindex Chat-GPT/vindex_final_v51/res/jlux/assetta/premium-i/png'
          mkdir -p "$d"
          cat .tmp-asseta/officina-1_5x.part* | tr -d '\r\n' | base64 -d > "$d/officina@1_5x.png"
          cat .tmp-asseta/officina-2x.part* | tr -d '\r\n' | base64 -d > "$d/officina@2x.png"
          test "$(git hash-object "$d/officina@1_5x.png")" = 'b52c472ce9226cb141da017258591378725440d3'
          test "$(git hash-object "$d/officina@2x.png")" = 'cde708d197402789afe857ab9b10ae987fb59db1'
          file "$d/officina@1_5x.png" | grep -q 'PNG image data, 72 x 72'
          file "$d/officina@2x.png" | grep -q 'PNG image data, 96 x 96'

      - name: Fontes canonicos committe et instrumenta temporaria dele
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TRBC97M'
          git config user.email 'trbc97m@protonmail.com'
          git add 'Vindex Chat-GPT/vindex_final_v51/res/jlux/assetta/premium-i/png/officina@1_5x.png'
          git add 'Vindex Chat-GPT/vindex_final_v51/res/jlux/assetta/premium-i/png/officina@2x.png'
          git rm -r .tmp-asseta
          git rm .github/workflows/materializa-asseta-officina.yml
          git commit -m 'P16-XI-A: XII fontes PNG premium comple'
          git push origin HEAD:chatgpt/p16-xi-a-asseta-premium-i
