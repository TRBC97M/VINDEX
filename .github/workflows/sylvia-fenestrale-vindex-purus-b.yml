name: Sylvia OS — Fenestrale II Purus B

on:
  push:
    branches:
      - chatgpt/sylvia-fenestrale-vindex-purus-b
  pull_request:
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/systema/fenestrale_ii_purus_b.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/fenestrale_purus_b_graphica_guid.vindex'
      - '.github/workflows/sylvia-fenestrale-vindex-purus-b.yml'

jobs:
  vindex-purus:
    name: Nomen GUID in compositione exploratur
    runs-on: ubuntu-24.04
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v4

      - name: Puritatem Sylviae verifica
        run: python3 instrumenta/verifica_puritatem_sylviae.py

      - name: GUID SOLUS canon diagnosticus compila
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          timeout 15s ./compilator_vindex probationes/fenestrale_purus_b_graphica_guid.vindex /tmp/guid_solus.elf
          file /tmp/guid_solus.elf | grep -q 'ELF 64-bit'

      - name: Eundem fontem nomine PONE compila
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          sed 's/FB_GUID_SOLUS/FB_GUID_PONE/g' probationes/fenestrale_purus_b_graphica_guid.vindex > /tmp/guid_pone.vindex
          timeout 15s ./compilator_vindex /tmp/guid_pone.vindex /tmp/guid_pone.elf
          file /tmp/guid_pone.elf | grep -q 'ELF 64-bit'

      - name: Praefixum reale nomine SOLUS compila
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('systema/fenestrale_ii_purus_b.vindex').read_text(encoding='utf-8')
          a = s.index('FUNCTIO FB_I32 REDDENS NUMERUS.')
          b = s.index('FUNCTIO FB_GUID_PONE REDDENS NUMERUS.')
          s = s[:a] + s[b:]
          s = s[:s.index('FUNCTIO FB_PROTOCOL_LOCATE REDDENS NUMERUS.')]
          s = s.replace('FB_GUID_PONE', 'FB_GUID_SOLUS')
          s += '''FUNCTIO PRINCIPALIS REDDENS NUMERUS.\n    DECLARA guid SICUT ORDO DE LITTERA CAPACITAS 16.\n    REDDE FB_GUID_SOLUS(guid, 1).\nFIN-FUNCTIO.\n'''
          Path('/tmp/praefixum_solus.vindex').write_text(s, encoding='utf-8')
          PY
          timeout 15s ./compilator_vindex /tmp/praefixum_solus.vindex /tmp/praefixum_solus.elf
          file /tmp/praefixum_solus.elf | grep -q 'ELF 64-bit'
