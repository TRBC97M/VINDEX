name: Sylvia OS — Fenestrale II Purus B

on:
  push:
    branches:
      - chatgpt/sylvia-fenestrale-vindex-purus-b
  pull_request:
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_ii_purus.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/fenestrale_ii_purus_b.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/fenestrale_purus_b_*.vindex'
      - '.github/workflows/sylvia-fenestrale-vindex-purus-b.yml'

jobs:
  vindex-purus:
    name: Limen compositionis VINDEX exploratur
    runs-on: ubuntu-24.04
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v4

      - name: Puritatem Sylviae verifica
        run: python3 instrumenta/verifica_puritatem_sylviae.py

      - name: Graphica cum una functione
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          timeout 15s ./compilator_vindex probationes/fenestrale_purus_b_graphica_functio.vindex /tmp/fb_una.elf
          file /tmp/fb_una.elf | grep -q 'ELF 64-bit'

      - name: Graphica cum duabus functionibus
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          timeout 15s ./compilator_vindex probationes/fenestrale_purus_b_graphica_duae.vindex /tmp/fb_duae.elf
          file /tmp/fb_duae.elf | grep -q 'ELF 64-bit'

      - name: Graphica cum sola functione GUID
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          timeout 15s ./compilator_vindex probationes/fenestrale_purus_b_graphica_guid.vindex /tmp/fb_guid.elf
          file /tmp/fb_guid.elf | grep -q 'ELF 64-bit'

      - name: Graphica cum I32 sola
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          timeout 15s ./compilator_vindex probationes/fenestrale_purus_b_i32_nomen.vindex /tmp/fb_i32.elf
          file /tmp/fb_i32.elf | grep -q 'ELF 64-bit'
