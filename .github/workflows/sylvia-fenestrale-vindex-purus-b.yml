name: Sylvia OS — Fenestrale II Purus B

on:
  push:
    branches:
      - chatgpt/sylvia-fenestrale-vindex-purus-b
  pull_request:
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_ii_purus.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/fenestrale_ii_purus_b.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/fenestrale_purus_b_*.vindex'
      - '.github/workflows/sylvia-fenestrale-vindex-purus-b.yml'

jobs:
  vindex-purus:
    name: Fenestrale interactive VINDEX compilatur
    runs-on: ubuntu-24.04
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v4

      - name: Puritatem Sylviae verifica
        run: python3 instrumenta/verifica_puritatem_sylviae.py

      - name: PRINCIPALE reale auxiliis minimis compila
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          timeout 25s ./compilator_vindex probationes/fenestrale_purus_b_principalis.vindex /tmp/fb_principalis.elf
          file /tmp/fb_principalis.elf | grep -q 'ELF 64-bit'

      - name: Gradum I graphica cum input compila
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          awk '/^FUNCTIO FB_RELEGE_ACTIVUM REDDENS NUMERUS\./ {exit} {print}' systema/fenestrale_ii_purus_b.vindex > /tmp/fb_gradus_1.vindex
          cat >> /tmp/fb_gradus_1.vindex <<'VINDEX'
          FUNCTIO PRINCIPALIS REDDENS NUMERUS.
              DECLARA s SICUT ORDO DE NUMERUS CAPACITAS 32.
              DECLARA a SICUT NUMERUS VALENS FB_PROTOCOLA_PARA(s).
              a = FB_CLAVIS_LEGE().
              a = FB_MURUS_ABSOLUTUS(0, s).
              a = FB_MURUS_RELATIVUS(0, s).
              a = FB_STALL().
              REDDE a.
          FIN-FUNCTIO.
          VINDEX
          timeout 30s ./compilator_vindex /tmp/fb_gradus_1.vindex /tmp/fb_gradus_1.elf
          file /tmp/fb_gradus_1.elf | grep -q 'ELF 64-bit'

      - name: Gradum II gestorem adde
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          awk '/^FUNCTIO FB_TASKBAR_CLICK REDDENS NUMERUS\./ {exit} {print}' systema/fenestrale_ii_purus_b.vindex > /tmp/fb_gradus_2.vindex
          cat >> /tmp/fb_gradus_2.vindex <<'VINDEX'
          FUNCTIO PRINCIPALIS REDDENS NUMERUS.
              DECLARA s SICUT ORDO DE NUMERUS CAPACITAS 32.
              DECLARA a SICUT NUMERUS VALENS FB_PROTOCOLA_PARA(s).
              a = FB_HIT(s, 0, 0).
              a = FB_MAX_TOGGLE(s, 1).
              a = FB_CLAUDE(s, 1).
              REDDE a.
          FIN-FUNCTIO.
          VINDEX
          timeout 30s ./compilator_vindex /tmp/fb_gradus_2.vindex /tmp/fb_gradus_2.elf
          file /tmp/fb_gradus_2.elf | grep -q 'ELF 64-bit'

      - name: Gradum III interactionem adde
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          awk '/^FUNCTIO FB_REDDE REDDENS NUMERUS\./ {exit} {print}' systema/fenestrale_ii_purus_b.vindex > /tmp/fb_gradus_3.vindex
          cat >> /tmp/fb_gradus_3.vindex <<'VINDEX'
          FUNCTIO PRINCIPALIS REDDENS NUMERUS.
              DECLARA s SICUT ORDO DE NUMERUS CAPACITAS 32.
              DECLARA a SICUT NUMERUS VALENS FB_PROTOCOLA_PARA(s).
              a = FB_MOUSE_DOWN(s).
              a = FB_DRAG(s).
              a = FB_CLAVIS_AGE(s, 0).
              REDDE a.
          FIN-FUNCTIO.
          VINDEX
          timeout 35s ./compilator_vindex /tmp/fb_gradus_3.vindex /tmp/fb_gradus_3.elf
          file /tmp/fb_gradus_3.elf | grep -q 'ELF 64-bit'

      - name: Gradum IV redditionem adde
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          awk '/^FUNCTIO PRINCIPALIS REDDENS NUMERUS\./ {exit} {print}' systema/fenestrale_ii_purus_b.vindex > /tmp/fb_gradus_4.vindex
          cat >> /tmp/fb_gradus_4.vindex <<'VINDEX'
          FUNCTIO PRINCIPALIS REDDENS NUMERUS.
              DECLARA s SICUT ORDO DE NUMERUS CAPACITAS 32.
              DECLARA a SICUT NUMERUS VALENS FB_PROTOCOLA_PARA(s).
              a = FB_CLAVIS_AGE(s, 0).
              a = FB_REDDE(s).
              REDDE a.
          FIN-FUNCTIO.
          VINDEX
          timeout 40s ./compilator_vindex /tmp/fb_gradus_4.vindex /tmp/fb_gradus_4.elf
          file /tmp/fb_gradus_4.elf | grep -q 'ELF 64-bit'

      - name: Fenestrale B totum compila
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          timeout 60s ./compilator_vindex systema/fenestrale_ii_purus_b.vindex /tmp/fenestrale_ii_purus_b.elf
          file /tmp/fenestrale_ii_purus_b.elf | grep -q 'ELF 64-bit'
          ! grep -R 'POLLE()' bibliotheca/fenestrale_ii_purus.vindex systema/fenestrale_ii_purus_b.vindex
