name: Sylvia OS — Fenestrale II Purus B

on:
  push:
    branches:
      - chatgpt/sylvia-fenestrale-vindex-purus-b
  pull_request:
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_ii_purus.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/fenestrale_ii_purus_b.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/fenestrale_purus_b_*.vindex'
      - '.github/workflows/sylvia-fenestrale-vindex-purus-b.yml'

jobs:
  vindex-purus:
    name: Fenestrale interactive VINDEX compilatur
    runs-on: ubuntu-24.04
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v4

      - name: Puritatem Sylviae verifica
        run: python3 instrumenta/verifica_puritatem_sylviae.py

      - name: Fundamenta separatim compila
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          timeout 20s ./compilator_vindex probationes/fenestrale_purus_b_uefi.vindex /tmp/fb_uefi.elf
          timeout 20s ./compilator_vindex probationes/fenestrale_purus_b_graphica.vindex /tmp/fb_graphica.elf
          timeout 10s ./compilator_vindex probationes/fenestrale_purus_b_parentheses.vindex /tmp/fb_parentheses.elf
          timeout 10s ./compilator_vindex probationes/fenestrale_purus_b_nomen_redde.vindex /tmp/fb_nomen_redde.elf
          file /tmp/fb_uefi.elf /tmp/fb_graphica.elf /tmp/fb_parentheses.elf /tmp/fb_nomen_redde.elf | grep -q 'ELF 64-bit'

      - name: Input UEFI VINDEX compila
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          timeout 20s ./compilator_vindex probationes/fenestrale_purus_b_input.vindex /tmp/fb_input.elf
          file /tmp/fb_input.elf | grep -q 'ELF 64-bit'

      - name: Gestorem fenestrarum VINDEX compila
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          timeout 20s ./compilator_vindex probationes/fenestrale_purus_b_gestor.vindex /tmp/fb_gestor.elf
          file /tmp/fb_gestor.elf | grep -q 'ELF 64-bit'

      - name: Interactionem superiorem compila
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          timeout 20s ./compilator_vindex probationes/fenestrale_purus_b_interactio.vindex /tmp/fb_interactio.elf
          file /tmp/fb_interactio.elf | grep -q 'ELF 64-bit'

      - name: Ansam eventuum compila
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          timeout 20s ./compilator_vindex probationes/fenestrale_purus_b_ansa.vindex /tmp/fb_ansa.elf
          file /tmp/fb_ansa.elf | grep -q 'ELF 64-bit'

      - name: Fenestrale B compila
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          timeout 60s ./compilator_vindex systema/fenestrale_ii_purus_b.vindex /tmp/fenestrale_ii_purus_b.elf
          file /tmp/fenestrale_ii_purus_b.elf | grep -q 'ELF 64-bit'
          test "$(stat -c '%s' /tmp/fenestrale_ii_purus_b.elf)" -lt 196608
          ! grep -R 'POLLE()' bibliotheca/fenestrale_ii_purus.vindex systema/fenestrale_ii_purus_b.vindex
          printf '%s\n' 'RECTE: Fenestrale II Purus B omnino VINDEX compilatur.'