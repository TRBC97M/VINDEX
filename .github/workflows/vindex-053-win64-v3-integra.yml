# Backend Win64 coniunctus super caput Claudii recentissimum probatur.
name: VINDEX 0.53 — Win64 integratio v3

on:
  push:
    branches:
      - chatgpt/pe-fasciculi-053-v3
  pull_request:
    branches:
      - claude/pe-integration-053-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instrumenta Win64 probata accipe
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          git fetch origin chatgpt/pe-fasciculi-053 chatgpt/fluitans-win64-053 chatgpt/pe-verificatio-053
          git show origin/chatgpt/pe-fasciculi-053:"$RADIX/instrumenta/applica_fasciculos_win64_053.py" > "$RUNNER_TEMP/applica_fasciculos.py"
          git show origin/chatgpt/pe-fasciculi-053:"$RADIX/instrumenta/corrige_alignationem_api_win64_053.py" > "$RUNNER_TEMP/corrige_api.py"
          git show origin/chatgpt/fluitans-win64-053:"$RADIX/instrumenta/corrige_proclama_fluitans_win64_053.py" > "$RUNNER_TEMP/corrige_stdout.py"
          git show origin/chatgpt/pe-fasciculi-053:"$RADIX/tests/casus/fasciculi_portabiles.vindex" > "$RUNNER_TEMP/fasciculi_portabiles.vindex"
          git show origin/chatgpt/pe-verificatio-053:"$RADIX/tests/proba_pe_structuram_053.py" > "$RUNNER_TEMP/proba_pe_structuram.py"
          python3 -m py_compile "$RUNNER_TEMP/applica_fasciculos.py" "$RUNNER_TEMP/corrige_api.py" "$RUNNER_TEMP/corrige_stdout.py" "$RUNNER_TEMP/proba_pe_structuram.py"

      - name: Backend Win64 fonti temporario applica
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          FONS="$RUNNER_TEMP/compilator_win64.vindex"
          cp "$RADIX/src/compilator_vindex.vindex" "$FONS"
          python3 "$RUNNER_TEMP/applica_fasciculos.py" "$FONS"
          python3 "$RUNNER_TEMP/corrige_api.py" "$FONS"
          python3 "$RUNNER_TEMP/corrige_stdout.py" "$FONS"
          grep -Fq 'FUNCTIO COMPONE_APERI_FASCICULUM_PE REDDENS NUMERUS.' "$FONS"
          grep -Fq 'FUNCTIO COMPONE_MOVQ_DE_XMM REDDENS NUMERUS.' "$FONS"
          grep -Fq 'pos_prospectus_signatus' "$FONS"
          grep -Fq 'numerus_functionum_pe SICUT NUMERUS VALENS 7' "$FONS"

      - name: Compilatorem ad punctum fixum reconstrue
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          FONS="$RUNNER_TEMP/compilator_win64.vindex"
          chmod 755 "$RADIX/compilator_vindex"
          timeout 45s "$RADIX/compilator_vindex" "$FONS" "$RUNNER_TEMP/gen1"
          chmod 755 "$RUNNER_TEMP/gen1"
          timeout 45s "$RUNNER_TEMP/gen1" "$FONS" "$RUNNER_TEMP/gen2"
          chmod 755 "$RUNNER_TEMP/gen2"
          timeout 45s "$RUNNER_TEMP/gen2" "$FONS" "$RUNNER_TEMP/gen3"
          chmod 755 "$RUNNER_TEMP/gen3"
          cmp "$RUNNER_TEMP/gen2" "$RUNNER_TEMP/gen3"
          sha256sum "$RUNNER_TEMP/gen2"

      - name: XXV probationes canonicas ELF custodi
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          cp "$RUNNER_TEMP/gen2" "$RADIX/compilator_vindex"
          chmod 755 "$RADIX/compilator_vindex" "$RADIX/tests/run_tests.sh" "$RADIX/vindexc"
          "$RADIX/tests/run_tests.sh"

      - name: Fluitantes negativos ELF custodi
        shell: bash
        run: |
          set -euo pipefail
          cat >"$RUNNER_TEMP/negativus_elf.vindex" <<'VINDEX'
          FUNCTIO PRINCIPALIS REDDENS NUMERUS.
              PROCLAMA -2.71828.
              PROCLAMA -0.5.
              REDDE 0.
          FIN-FUNCTIO.
          VINDEX
          "$RUNNER_TEMP/gen2" "$RUNNER_TEMP/negativus_elf.vindex" "$RUNNER_TEMP/negativus_elf"
          chmod 755 "$RUNNER_TEMP/negativus_elf"
          OUT="$($RUNNER_TEMP/negativus_elf)"
          test "$OUT" = $'-2.718280\n-0.500000'
          printf '%s\n' 'RECTE: fluitantes negativi ELF servantur.'

      - name: Executabilia PE coniuncta construe
        shell: bash
        run: |
          set -euo pipefail
          cat >"$RUNNER_TEMP/proclama.vindex" <<'VINDEX'
          FUNCTIO PRINCIPALIS REDDENS NUMERUS.
              PROCLAMA "Initium".
              PROCLAMA 999.
              PROCLAMA -2.71828.
              DECLARA x SICUT FLUITANS VALENS 3.14.
              PROCLAMA x.
              PROCLAMA "Finis".
              REDDE 7.
          FIN-FUNCTIO.
          VINDEX
          "$RUNNER_TEMP/gen2" "$RUNNER_TEMP/proclama.vindex" "$RUNNER_TEMP/proclama.exe" pe
          "$RUNNER_TEMP/gen2" "$RUNNER_TEMP/fasciculi_portabiles.vindex" "$RUNNER_TEMP/fasciculi.exe" pe
          python3 "$RUNNER_TEMP/proba_pe_structuram.py" "$RUNNER_TEMP/proclama.exe" --requirit ExitProcess --requirit VirtualAlloc --requirit GetStdHandle --requirit WriteFile
          python3 "$RUNNER_TEMP/proba_pe_structuram.py" "$RUNNER_TEMP/fasciculi.exe" --requirit ExitProcess --requirit VirtualAlloc --requirit WriteFile --requirit CreateFileA --requirit ReadFile --requirit CloseHandle

      - name: Executabilia conserva
        uses: actions/upload-artifact@v4
        with:
          name: vindex-win64-v3
          path: |
            ${{ runner.temp }}/proclama.exe
            ${{ runner.temp }}/fasciculi.exe
          if-no-files-found: error

  windows:
    needs: construe
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - name: Executabilia accipe
        uses: actions/download-artifact@v4
        with:
          name: vindex-win64-v3
          path: pe

      - name: PROCLAMA et fasciculos sub Windows vero verifica
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Exsequere-Vindex([string]$via) {
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = $via
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $p = [System.Diagnostics.Process]::new()
            $p.StartInfo = $psi
            [void]$p.Start()
            $stdout = $p.StandardOutput.ReadToEnd()
            $stderr = $p.StandardError.ReadToEnd()
            $p.WaitForExit()
            return @($p.ExitCode, $stdout, $stderr)
          }

          $r = Exsequere-Vindex (Join-Path $PWD 'pe\proclama.exe')
          $status = [int]$r[0]
          $out = ([string]$r[1] -replace "`r`n", "`n").TrimEnd("`n")
          Write-Host "PROCLAMA -> status $status, stdout=[$($out -replace "`n", "\\n")]"
          if ($status -ne 7) { throw "ERRATUM: PROCLAMA status $status." }
          $expect = "Initium`n999`n-2.718280`n3.140000`nFinis"
          if ($out -ne $expect) { throw "ERRATUM: PROCLAMA exitus differt." }

          $dir = Join-Path $PWD 'fasciculi-temp'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item (Join-Path $PWD 'pe\fasciculi.exe') (Join-Path $dir 'fasciculi.exe')
          $pf = Start-Process -FilePath (Join-Path $dir 'fasciculi.exe') -WorkingDirectory $dir -Wait -PassThru -NoNewWindow
          Write-Host "FASCICULI -> status $($pf.ExitCode)"
          if ($pf.ExitCode -ne 0) { throw "ERRATUM: fasciculi status $($pf.ExitCode)." }
          $data = [System.IO.File]::ReadAllBytes((Join-Path $dir 'vindex-pe-io.tmp'))
          $textus = [System.Text.Encoding]::ASCII.GetString($data)
          Write-Host "FASCICULI -> data=[$textus]"
          if ($textus -ne 'VINX') { throw 'ERRATUM: fasciculus non continet VINX.' }
          Write-Host 'RECTE: backend Win64 coniunctus sub Windows vero operatur.'
