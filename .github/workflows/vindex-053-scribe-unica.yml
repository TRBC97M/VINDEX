# Probatio unica migrationis bufferi SCRIBE ad memoriam dynamicam.
name: VINDEX 0.53 — SCRIBE dynamicum

on:
  push:
    branches:
      - chatgpt/vindex-053-compilator-dynamicus
    paths:
      - '.github/workflows/vindex-053-scribe-unica.yml'
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/applica_scribe_dynamicum_053.py'

permissions:
  contents: write

jobs:
  scribe-dynamicum:
    runs-on: ubuntu-latest
    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5
        with:
          ref: chatgpt/vindex-053-compilator-dynamicus
          fetch-depth: 0

      - name: SCRIBE dynamicum comproba
        shell: bash
        run: |
          set +e
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          RELATIO=/tmp/relatio_scribe_053
          : > "$RELATIO"
          SUCCESSUS=0

          integrum() {
            VIA="$1"
            [ -s "$VIA" ] || return 1
            A=$(stat -c '%s' "$VIA" 2>/dev/null)
            B=$(od -An -tu8 -j96 -N8 "$VIA" 2>/dev/null | tr -d '[:space:]')
            [ -n "$A" ] && [ "$A" = "$B" ]
          }

          proba() {
            chmod 755 "$RADIX/compilator_vindex"
            python3 "$RADIX/instrumenta/applica_scribe_dynamicum_053.py" >> "$RELATIO" 2>&1 || return 1

            if grep -q '0 - 6000000' "$RADIX/src/compilator_vindex.vindex"; then
              printf '%s\n' 'ERRATUM: bufferum occultum -6000000 adhuc manet.' >> "$RELATIO"
              return 1
            fi
            printf '%s\n' 'RECTE: intervallum occultum -6000000 remotum est.' >> "$RELATIO"

            "$RADIX/compilator_vindex" "$RADIX/src/compilator_vindex.vindex" /tmp/g1 >> "$RELATIO" 2>&1
            S1=$?
            printf 'STATUS G1: %s.\n' "$S1" >> "$RELATIO"
            [ "$S1" -eq 0 ] && integrum /tmp/g1 || return 1

            chmod 755 /tmp/g1
            /tmp/g1 "$RADIX/src/compilator_vindex.vindex" /tmp/g2 >> "$RELATIO" 2>&1
            S2=$?
            printf 'STATUS G2: %s.\n' "$S2" >> "$RELATIO"
            [ "$S2" -eq 0 ] && integrum /tmp/g2 || return 1

            chmod 755 /tmp/g2
            /tmp/g2 "$RADIX/src/compilator_vindex.vindex" /tmp/g3 >> "$RELATIO" 2>&1
            S3=$?
            printf 'STATUS G3: %s.\n' "$S3" >> "$RELATIO"
            [ "$S3" -eq 0 ] && integrum /tmp/g3 || return 1
            cmp -s /tmp/g2 /tmp/g3 || return 1
            printf '%s\n' 'RECTE: SCRIBE dynamicum punctum fixum servat.' >> "$RELATIO"

            cp /tmp/g3 "$RADIX/compilator_vindex"
            chmod 755 "$RADIX/compilator_vindex"

            cat > /tmp/scribe_dynamicum_053.vindex <<'VINDEX'
          FUNCTIO PRINCIPALIS REDDENS NUMERUS.
              DECLARA litterae SICUT ORDO DE NUMERUS CAPACITAS 5.
              litterae[0] = 83.
              litterae[1] = 65.
              litterae[2] = 76.
              litterae[3] = 86.
              litterae[4] = 69.
              SCRIBE litterae CAPACITAS 5.
              SCRIBE litterae CAPACITAS 5.
              REDDE 0.
          FIN-FUNCTIO.
          VINDEX
            "$RADIX/compilator_vindex" /tmp/scribe_dynamicum_053.vindex /tmp/scribe_dynamicum_053 >> "$RELATIO" 2>&1 || return 1
            chmod 755 /tmp/scribe_dynamicum_053
            OS=$(/tmp/scribe_dynamicum_053 2>>"$RELATIO"); ES=$?
            printf 'SCRIBE: status=%s exitus=[%s].\n' "$ES" "$OS" >> "$RELATIO"
            [ "$ES" -eq 0 ] && [ "$OS" = $'SALVE\nSALVE' ] || return 1

            cd "$RADIX" || return 1
            ./compilator_vindex src/officina_vindex.vindex /tmp/officina_nova >> "$RELATIO" 2>&1 || return 1
            ./compilator_vindex src/salutatio_vindex.vindex /tmp/salutatio_nova >> "$RELATIO" 2>&1 || return 1
            cp /tmp/officina_nova ./officina_vindex
            cp /tmp/salutatio_nova ./salutatio_vindex

            find . -type f -name '*.sh' -exec chmod 755 {} +
            chmod 755 ./vindexc ./vindex_graphica ./officina_vindex ./salutatio_vindex ./compilator_vindex ./vindex-officina ./vindex-salutatio ./vindex-systema

            bash ./systema/construe_systema.sh >> "$RELATIO" 2>&1 || return 1
            bash ./systema/uefi/construe_uefi.sh >> "$RELATIO" 2>&1 || return 1
            printf '%s\n' 'RECTE: Systema BIOS et UEFI post migrationem SCRIBE regenerata sunt.' >> "$RELATIO"

            bash ./tests/run_tests.sh >> "$RELATIO" 2>&1
            SR=$?
            printf 'PROBATIONES REGRESSIONALES: status=%s.\n' "$SR" >> "$RELATIO"
            [ "$SR" -eq 0 ] || return 1

            printf '%s\n' 'RECTE: SCRIBE non amplius bufferum fixum in pila requirit.' >> "$RELATIO"
            return 0
          }

          proba
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            SUCCESSUS=1
          else
            printf 'ERRATUM: migratio SCRIBE nondum canonica est; status=%s.\n' "$STATUS" >> "$RELATIO"
          fi

          cd "$GITHUB_WORKSPACE" || exit 0
          VIA_RELATIONIS="$RADIX/instrumenta/RELATIO-SCRIBE-053.md"
          {
            printf '%s\n\n' '# VINDEX 0.53 — Relatio SCRIBE dynamici'
            printf '%s\n\n' 'Migratio bufferi SCRIBE e pila fixa ad memoriam dynamicam, punctum fixum et regressiones hic comprobantur.'
            printf '%s\n' '```text'
            cat "$RELATIO"
            printf '%s\n' '```'
          } > "$VIA_RELATIONIS"

          git config user.name 'VINDEX Centurio'
          git config user.email 'actions@users.noreply.github.com'
          if [ "$SUCCESSUS" -eq 1 ]; then
            git add "$RADIX/src/compilator_vindex.vindex" "$RADIX/compilator_vindex" "$RADIX/officina_vindex" "$RADIX/salutatio_vindex" "$RADIX/nucleus_systema.elf" "$RADIX/systema_vindex.img" "$RADIX/BOOTX64.EFI" "$RADIX/systema_vindex_uefi.img" "$VIA_RELATIONIS"
          else
            git checkout -- "$RADIX/src/compilator_vindex.vindex" "$RADIX/compilator_vindex" "$RADIX/officina_vindex" "$RADIX/salutatio_vindex" "$RADIX/nucleus_systema.elf" "$RADIX/systema_vindex.img" "$RADIX/BOOTX64.EFI" "$RADIX/systema_vindex_uefi.img" 2>/dev/null || true
            git add "$VIA_RELATIONIS"
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'VINDEX 0.53: SCRIBE dynamicum comproba'
            git push origin HEAD:chatgpt/vindex-053-compilator-dynamicus
          fi
          exit 0
