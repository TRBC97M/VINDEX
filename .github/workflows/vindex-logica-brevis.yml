name: VINDEX — Logica brevis

on:
  push:
    branches:
      - chatgpt/vindex-logica-brevis
  workflow_dispatch:

permissions:
  contents: write

jobs:
  logica-brevis:
    name: Operatores logici breves VINDEX certificantur
    runs-on: ubuntu-24.04
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v5
        with:
          ref: chatgpt/vindex-logica-brevis
          fetch-depth: 0

      - name: Mutationem logicam applica
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          python3 "$RADIX/instrumenta/applica_logicam_brevem.py"
          grep -Fq 'FUNCTIO ANALYSA_COMPARATIO_SIMPLEX REDDENS NUMERUS.' "$RADIX/src/compilator_vindex.vindex"
          grep -Fq 'FUNCTIO ANALYSA_CONIUNCTIO_LOGICA REDDENS NUMERUS.' "$RADIX/src/compilator_vindex.vindex"
          grep -Fq 'FUNCTIO EST_DISIUNCTIO_LOGICA REDDENS NUMERUS.' "$RADIX/src/compilator_vindex.vindex"

      - name: Probationem VINDEX verifica
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          python3 "$RADIX/instrumenta/vindex_verifica.py" "$RADIX/probationes/logica_brevis.vindex"

      - name: Auto-hospitium et punctum fixum comproba
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          chmod +x "$RADIX/compilator_vindex"
          "$RADIX/compilator_vindex" "$RADIX/src/compilator_vindex.vindex" /tmp/g1
          chmod +x /tmp/g1
          /tmp/g1 "$RADIX/src/compilator_vindex.vindex" /tmp/g2
          chmod +x /tmp/g2
          /tmp/g2 "$RADIX/src/compilator_vindex.vindex" /tmp/g3
          cmp -s /tmp/g2 /tmp/g3
          cp /tmp/g3 "$RADIX/compilator_vindex"
          chmod 755 "$RADIX/compilator_vindex"
          printf '%s\n' 'RECTE: G2 et G3 identici sunt.'

      - name: Aestimationem brevem exsequere
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          "$RADIX/compilator_vindex" "$RADIX/probationes/logica_brevis.vindex" /tmp/logica_brevis
          chmod +x /tmp/logica_brevis
          timeout 10s /tmp/logica_brevis
          printf '%s\n' 'RECTE: dextra pars periculosa non aestimatur et ordo && ante || servatur.'

      - name: Fenestrale I cum compilatore novo comproba
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          cd "$RADIX"
          ./compilator_vindex probationes/fenestrale_purus_i_fenestrae.vindex /tmp/fenestrale_i
          chmod +x /tmp/fenestrale_i
          timeout 10s /tmp/fenestrale_i
          printf '%s\n' 'RECTE: LXXX fenestrae etiam cum logica nova transeunt.'

      - name: Regressionem generalem exsequere
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          cd "$RADIX"
          bash tests/run_tests.sh

      - name: Compilatorem certificatum conserva
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          git config user.name 'VINDEX Centurio'
          git config user.email 'actions@users.noreply.github.com'
          git add "$RADIX/src/compilator_vindex.vindex" "$RADIX/compilator_vindex"
          if ! git diff --cached --quiet; then
            git commit -m 'VINDEX: && et || aestimationem brevem accipiunt'
            git push origin HEAD:chatgpt/vindex-logica-brevis
          fi
