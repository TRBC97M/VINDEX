name: Sylvia OS — Fenestrale II Purus E canonicus

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_ii_purus.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_ii_superficies.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/programmata_clientis_e.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/fenestrale_ii_purus_e.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/fenestrale_purus_e_*.vindex'
      - 'documenta/sylvia/FENESTRALE_II_PVRVS_E.md'
      - '.github/workflows/sylvia-fenestrale-vindex-purus-e.yml'

jobs:
  vindex-purus-e:
    name: Eventa clientis Fenestralis E VINDEX certificantur
    runs-on: ubuntu-24.04
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v4

      - name: Puritatem Sylviae verifica
        shell: bash
        run: |
          set -euo pipefail
          python3 instrumenta/verifica_puritatem_sylviae.py

      - name: Fontes VINDEX verifica
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          python3 instrumenta/vindex_verifica.py systema/fenestrale_ii_purus_e.vindex
          python3 instrumenta/vindex_verifica.py probationes/fenestrale_purus_e_clientis.vindex

      - name: Contractum clientis verifica
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          c='bibliotheca/programmata_clientis_e.vindex'
          f='systema/fenestrale_ii_purus_e.vindex'
          for signum in 'FUNCTIO PE_CLICK' 'FUNCTIO PE_RENDE' 'TABULA.VXNAT' 'NOVUM' 'EDITE' 'NOMEN' 'DELE'; do
            grep -Fq "$signum" "$c" || { echo "ERRATUM: $signum deest"; exit 1; }
          done
          for signum in \
            'IMPORTA "bibliotheca/programmata_clientis_e.vindex"' \
            's[31]=0' 'PE_RENDE(s[30],s[31])' \
            'PE_CLICK(s[30],s[31],lx-10,ly-52)' \
            's[31]=novus' 'FUNCTIO FE_PROGRAMMATA' 'FUNCTIO FE_REDDE'
          do
            grep -Fq "$signum" "$f" || { echo "ERRATUM: $signum deest"; exit 1; }
          done
          ! grep -Eq '(^|[^A-Z0-9_])POLLE\(\)' "$c"
          ! grep -Eq '(^|[^A-Z0-9_])POLLE\(\)' "$f"

      - name: Probationem clientis compila
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          chmod +x compilator_vindex
          ./compilator_vindex probationes/fenestrale_purus_e_clientis.vindex /tmp/fenestrale_purus_e_clientis.elf
          file /tmp/fenestrale_purus_e_clientis.elf | grep -q 'ELF 64-bit'

      - name: Fenestrale E totum compila
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex systema/fenestrale_ii_purus_e.vindex /tmp/fenestrale_ii_purus_e.elf
          file /tmp/fenestrale_ii_purus_e.elf | grep -q 'ELF 64-bit'
          test "$(stat -c '%s' /tmp/fenestrale_ii_purus_e.elf)" -lt 196608
          printf '%s\n' 'RECTE: Fenestrale II Purus E eventa clientis VINDEX certificat.'
