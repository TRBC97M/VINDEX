name: VINDEX 0.53 — Renovatio documentorum R5

on:
  push:
    branches:
      - chatgpt/vindex-053-r5-instrumenta

permissions:
  contents: write

jobs:
  documenta:
    runs-on: ubuntu-latest
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v4

      - name: CONSILIUM et AUDITIO ad statum R5 renova
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          consilium = Path('CONSILIUM.md')
          c = consilium.read_text(encoding='utf-8')
          vetus = '''## P2 — Reconciliatio VINDEX 0.53 cum linea canonica

**Status:** `PARATUM`, sed P1 ante mutationes magnas recensendum est.  
**Fontes principales:** ramus historicus VINDEX 0.53 et rami reconciliationis.  
**Causa:** 0.53 multas facultates maturas continet — fontes et buffers dynamicos, functiones et locales dynamicos, contextum compilationis explicitum, Win64 PE32+, argumenta plura ABI, PROIECTUM, diagnostica, ARGV et alia — sed ramus historicus non est directe miscendus cum `main`.

**Actio proxima:** facultates 0.53 inventariare contra `main`, deinde eas parvis commitibus portare, auto-hospitio et regressionibus ELF/PE/UEFI post singulos gradus verificatis.

**Criterium victoriae:** compilator canonicus modernus omnes facultates probatas 0.53 retinet, structuram praesentem observat, auto-hospitium punctum fixum servat et targeta ELF, PE/Win64 atque UEFI non regreditur.
'''
          novum = '''## P2 — Reconciliatio VINDEX 0.53 cum linea canonica

**Status:** `IMPEDITUM a P1 post R5`; gradus R0–R5 `PERFECTUM`.  
**Fontes principales:** ramus historicus VINDEX 0.53, probationes canonicae R1–R5 et opus UEFI reservatum P1.  
**Causa:** facultates maturae 0.53 recuperandae erant selective, sine fusione monolithica neque regressione architecturae praesentis.

**Perfectum:**  
- R0 — inventarium et matrix migrationis;
- R1 — baseline dynamicorum, septem argumenta SysV, magnae frames et punctum fixum;
- R2 — diagnostica `FONS/LINEA/COLUMNA/NUNTIUS` et origo importorum;
- R3 — `PROIECTUM`, viae relativae et destinationes ELF/PE;
- R4 — `argc/argv` Win64 nativum et certificatio sub Windows vero;
- R5 — verificator PE et comparator binarius in VINDEX, matrice ELF/PE et auto-hospitio.

**Actio proxima P2:** R6 — harmonizatio UEFI — manet `RESERVATUM P1`; nihil ibi agendum est donec Claude a usuario resumatur et ramus eius denuo inspectus sit. Interim aliud opus independens ex `CONSILIUM` eligendum est.

**Criterium victoriae:** compilator canonicus modernus omnes facultates probatas 0.53 retinet, structuram praesentem observat, auto-hospitium punctum fixum servat et targeta ELF, PE/Win64 atque UEFI non regreditur.
'''
          if vetus not in c:
              raise SystemExit('ERRATUM: sectio P2 CONSILII expectata non inventa est')
          c = c.replace(vetus, novum, 1)
          consilium.write_text(c, encoding='utf-8')

          auditio = Path('documenta/vindex/AUDITIO_RECONCILIATIONIS_053.md')
          a = auditio.read_text(encoding='utf-8')
          status = {
              '## Gradus R1 — Baseline et regressiones fundamentorum iam praesentium\n\n': '**Status: `PERFECTUM`.** Baseline canonica R1 custodias dynamicorum, septem argumenta SysV, magnas frames et punctum fixum continet.\n\n',
              '## Gradus R2 — Diagnostica et origo fontium\n\n': '**Status: `PERFECTUM`.** Diagnostica locata et origo fontium/importorum in linea canonica probata sunt.\n\n',
              '## Gradus R3 — PROIECTUM\n\n': '**Status: `PERFECTUM`.** Manifestum, viae relativae, ELF/PE et diagnostica proiecti in linea canonica probata sunt.\n\n',
              '## Gradus R4 — Argumenta programmatum et refinimenta Win64\n\n': '**Status: `PERFECTUM`.** `argc/argv` Win64, quotationes, fluitantia et compilator PE se utens sub Windows vero probata sunt.\n\n',
              '## Gradus R5 — Instrumenta probationis et auto-hospitium\n\n': '**Status: `PERFECTUM`.** Verificator PE et comparator binarius in VINDEX compilantur et ad PE, ELF atque punctum fixum probandum adhibentur.\n\n',
          }
          for caput, linea in status.items():
              if caput not in a:
                  raise SystemExit(f'ERRATUM: caput auditum deest: {caput.strip()}')
              if caput + linea not in a:
                  a = a.replace(caput, caput + linea, 1)
          auditio.write_text(a, encoding='utf-8')
          PY

      - name: Mutationes documentorum persiste
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- CONSILIUM.md documenta/vindex/AUDITIO_RECONCILIATIONIS_053.md; then
            echo 'RECTE: documenta iam recentia sunt.'
            exit 0
          fi
          git config user.name 'TRBC97M'
          git config user.email 'trbc97m@protonmail.com'
          git add CONSILIUM.md documenta/vindex/AUDITIO_RECONCILIATIONIS_053.md
          git commit -m 'R5: reconciliationem usque ad R5 perfectam registra'
          git push origin HEAD:chatgpt/vindex-053-r5-instrumenta
