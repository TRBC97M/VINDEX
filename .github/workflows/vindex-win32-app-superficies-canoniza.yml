name: VINDEX — Canonizatio Superficiei Win32 App

on:
  pull_request:
    paths:
      - 'instrumenta/corrige_win32_app_superficies.py'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/win32_app.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/casus/win32_app.vindex'
      - '.github/workflows/vindex-win32-app-superficies-canoniza.yml'

permissions:
  contents: write

jobs:
  applica:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Superficiem applica
        shell: bash
        run: |
          set -euo pipefail
          python3 instrumenta/corrige_win32_app_superficies.py
      - name: Mutationem repone
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/win32_app.vindex' \
                  'Vindex Chat-GPT/vindex_final_v51/tests/casus/win32_app.vindex'
          if git diff --cached --quiet; then
            echo 'RECTE: nihil novum commitendum est.'
            exit 0
          fi
          git commit -m 'P11-E: superficiem Win32 App canoniza'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
