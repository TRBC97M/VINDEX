name: VINDEX 0.53 — Transplantatio R3

on:
  push:
    branches:
      - chatgpt/vindex-053-r3-proiectum

permissions:
  contents: write

jobs:
  transplanta:
    name: PROIECTUM 0.53 in compilatorem canonicum transplantatur
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v4

      - name: PROIECTUM per ancra verificata transplanta
        run: python3 instrumenta/transplanta_proiectum_r3.py

      - name: Compilatorem ex fonte novo recrea
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          chmod +x compilator_vindex
          ./compilator_vindex src/compilator_vindex.vindex /tmp/compilator_r3_g2
          chmod +x /tmp/compilator_r3_g2
          /tmp/compilator_r3_g2 src/compilator_vindex.vindex /tmp/compilator_r3_g3
          cmp /tmp/compilator_r3_g2 /tmp/compilator_r3_g3
          cp /tmp/compilator_r3_g2 compilator_vindex
          chmod +x compilator_vindex

      - name: R3, R2 et R1 exsequere
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests/test_proiectum_053.py -v
          python3 -m unittest tests/test_diagnostica_053.py -v
          python3 -m unittest tests/test_baseline_053.py -v

      - name: Mutationem probatam persiste
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex' 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'; then
            echo 'RECTE: nulla mutatio nova persistenda est.'
            exit 0
          fi
          git config user.name 'TRBC97M'
          git config user.email 'trbc97m@protonmail.com'
          git add -- 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex' 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
          git commit -m 'R3: PROIECTUM in compilatorem canonicum restitue'
          git push origin HEAD:chatgpt/vindex-053-r3-proiectum
