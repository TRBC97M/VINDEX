name: P16-XI — Reparatio fontium temporaria

on:
  push:
    branches:
      - chatgpt/p16-xi-bureau-lucidum-ii
    paths:
      - '.github/workflows/p16-xi-reparatio-temporaria.yml'

permissions:
  contents: write

jobs:
  repara:
    name: Syntaxim canonicam et limen aeneum restitue
    runs-on: ubuntu-24.04
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v5
        with:
          ref: chatgpt/p16-xi-bureau-lucidum-ii
          fetch-depth: 0

      - name: Fontes canonice repara
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          radix = Path('Vindex Chat-GPT/vindex_final_v51/bibliotheca')

          graphica = radix / 'fenestrale_graphica_viii.vindex'
          s = graphica.read_text(encoding='utf-8')
          substitutiones = {
              'FUNCTIO GVIII_RECT_W REDDENS NUMERUS. ACCIPIT r SICUT NUMERUS. REDDE (r>>32)&65535. FIN-FUNCTIO.': '''FUNCTIO GVIII_RECT_W REDDENS NUMERUS.\n    ACCIPIT r SICUT NUMERUS.\n    REDDE (r>>32)&65535.\nFIN-FUNCTIO.''',
              'FUNCTIO GVIII_RECT_H REDDENS NUMERUS. ACCIPIT r SICUT NUMERUS. REDDE (r>>48)&65535. FIN-FUNCTIO.': '''FUNCTIO GVIII_RECT_H REDDENS NUMERUS.\n    ACCIPIT r SICUT NUMERUS.\n    REDDE (r>>48)&65535.\nFIN-FUNCTIO.''',
              'FUNCTIO GVIII_MARGO_SIN REDDENS NUMERUS. ACCIPIT m SICUT NUMERUS. REDDE m&65535. FIN-FUNCTIO.': '''FUNCTIO GVIII_MARGO_SIN REDDENS NUMERUS.\n    ACCIPIT m SICUT NUMERUS.\n    REDDE m&65535.\nFIN-FUNCTIO.''',
              'FUNCTIO GVIII_MARGO_SUP REDDENS NUMERUS. ACCIPIT m SICUT NUMERUS. REDDE (m>>16)&65535. FIN-FUNCTIO.': '''FUNCTIO GVIII_MARGO_SUP REDDENS NUMERUS.\n    ACCIPIT m SICUT NUMERUS.\n    REDDE (m>>16)&65535.\nFIN-FUNCTIO.''',
              'FUNCTIO GVIII_MARGO_DEX REDDENS NUMERUS. ACCIPIT m SICUT NUMERUS. REDDE (m>>32)&65535. FIN-FUNCTIO.': '''FUNCTIO GVIII_MARGO_DEX REDDENS NUMERUS.\n    ACCIPIT m SICUT NUMERUS.\n    REDDE (m>>32)&65535.\nFIN-FUNCTIO.''',
              'FUNCTIO GVIII_MARGO_INF REDDENS NUMERUS. ACCIPIT m SICUT NUMERUS. REDDE (m>>48)&65535. FIN-FUNCTIO.': '''FUNCTIO GVIII_MARGO_INF REDDENS NUMERUS.\n    ACCIPIT m SICUT NUMERUS.\n    REDDE (m>>48)&65535.\nFIN-FUNCTIO.''',
              'GVIII_SUPERFICIES_SCALA_LINEARIS_FB': 'GVIII_SUPERF_SCALA_LINEARIS_FB',
          }
          for vetus, novum in substitutiones.items():
              if vetus not in s:
                  raise SystemExit(f'DEFECIT: exemplar Graphica VIII deest: {vetus}')
              s = s.replace(vetus, novum)
          graphica.write_text(s, encoding='utf-8')

          materia = radix / 'materia_ui_viii.vindex'
          s = materia.read_text(encoding='utf-8')
          vetus = '''            SI dx>0 && dy>0 TUNC\n                DECLARA d2 SICUT NUMERUS VALENS dx*dx+dy*dy.\n                SI d2>=64 TUNC a=0.\n                ALITER SI d2>=49 TUNC a=(64-d2)*17. FIN-SI.\n                FIN-SI.\n            FIN-SI.'''
          novum = '''            SI dx>0 && dy>0 TUNC\n                DECLARA d2 SICUT NUMERUS VALENS dx*dx+dy*dy.\n                SI d2>=64 TUNC\n                    a=0.\n                ALITER\n                    SI d2>=49 TUNC\n                        a=(64-d2)*17.\n                    FIN-SI.\n                FIN-SI.\n            FIN-SI.'''
          if vetus not in s:
              raise SystemExit('DEFECIT: conditio materiae VIII expectata deest')
          materia.write_text(s.replace(vetus, novum), encoding='utf-8')

          bureau = radix / 'fenestrale_bureau_xi.vindex'
          s = bureau.read_text(encoding='utf-8')
          vetus = '''            SI TVIII_FONS_VALIDUS(fons)!=0 TUNC\n                f=TVIII_TEXTUM_FB(fons,GVIII_RECT_CREA(x+10,y+68,7,9),0,AI_NODUS_NOMEN(nodus),graphite,255).\n            ALITER\n                f=FV_TEXTUM(x+8,y+66,AI_NODUS_NOMEN(nodus),graphite).\n            FIN-SI.\n            index=index+1.'''
          novum = '''            SI TVIII_FONS_VALIDUS(fons)!=0 TUNC\n                f=TVIII_TEXTUM_FB(fons,GVIII_RECT_CREA(x+10,y+68,7,9),0,AI_NODUS_NOMEN(nodus),graphite,255).\n            ALITER\n                f=FV_TEXTUM(x+8,y+66,AI_NODUS_NOMEN(nodus),graphite).\n            FIN-SI.\n            // Clavis aenea canonica post materiam pingitur ut #B58A54 exactum maneat.\n            f=FV_RECT(x+8,y+alt-3,lat-16,1,bronzeum).\n            index=index+1.'''
          if vetus not in s:
              raise SystemExit('DEFECIT: finis tesserae Bureau expectatus deest')
          bureau.write_text(s.replace(vetus, novum), encoding='utf-8')
          PY

          git config user.name 'TRBC97M'
          git config user.email 'trbc97m@protonmail.com'
          git add 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_graphica_viii.vindex' \
                  'Vindex Chat-GPT/vindex_final_v51/bibliotheca/materia_ui_viii.vindex' \
                  'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_bureau_xi.vindex'
          git diff --cached --check
          git commit -m 'P16-XI: syntaxim Graphica VIII et clavem aeneam canonicas fac'
          git push origin HEAD:chatgpt/p16-xi-bureau-lucidum-ii
