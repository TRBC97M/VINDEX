name: Sylvia OS — Tempus et Motus X

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_tempus_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_motus_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/tempus_motus_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/showroom_tempus_motus_x*.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/proba_showroom_tempus_motus_x*'
      - 'documenta/sylvia/JL_UX_FUNDAMENTUM_GRAPHICUM_MODERNUM.md'
      - '.github/workflows/sylvia-tempus-motus-x.yml'
  push:
    branches:
      - main
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_tempus_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_motus_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/tempus_motus_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/showroom_tempus_motus_x*.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/proba_showroom_tempus_motus_x*'
      - 'documenta/sylvia/JL_UX_FUNDAMENTUM_GRAPHICUM_MODERNUM.md'
      - '.github/workflows/sylvia-tempus-motus-x.yml'

permissions:
  contents: read

jobs:
  tempus-motus-x:
    name: Horologium frame et motus interruptibilis certificantur
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v5

      - name: Compilatorem para
        shell: bash
        run: |
          chmod +x 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'

      - name: Puritatem Sylviae verifica
        shell: bash
        run: |
          set -euo pipefail
          python3 instrumenta/verifica_puritatem_sylviae.py

      - name: Tempus et motum native VINDEX exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex probationes/tempus_motus_x.vindex /tmp/tempus-motus-x
          file /tmp/tempus-motus-x | grep -q 'ELF 64-bit'
          chmod +x /tmp/tempus-motus-x
          timeout 30s /tmp/tempus-motus-x
          printf '%s\n' 'RECTE: horologium manuale, interpolationes et retargetatio interruptibilis probata sunt.'

      - name: Scenam XII-B iterum exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex probationes/scena_compositoris_x.vindex /tmp/scena-x
          chmod +x /tmp/scena-x
          timeout 30s /tmp/scena-x

      - name: Regressionem canonicam VINDEX exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          bash tests/run_tests.sh
