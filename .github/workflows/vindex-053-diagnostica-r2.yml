name: VINDEX 0.53 — Diagnostica R2

on:
  pull_request:
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/test_diagnostica_053.py'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/casus/erratum_*.vindex'
      - '.github/workflows/vindex-053-diagnostica-r2.yml'

jobs:
  diagnostica:
    name: Fontes et loci diagnosticorum probantur
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v4
      - name: Compilatorem para
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: chmod +x compilator_vindex
      - name: Diagnostica R2 exsequere
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: python3 -m unittest tests/test_diagnostica_053.py -v
      - name: Baseline R1 non regrediatur
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: python3 -m unittest tests/test_baseline_053.py -v
