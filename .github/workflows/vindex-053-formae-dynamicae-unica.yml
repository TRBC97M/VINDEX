# Probatio unica formarum et camporum crescentium.
name: VINDEX 0.53 — Formae dynamicae

on:
  push:
    branches:
      - chatgpt/vindex-053-compilator-dynamicus
    paths:
      - '.github/workflows/vindex-053-formae-dynamicae-unica.yml'
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/applica_formas_dynamicas_053.py'

permissions:
  contents: write

jobs:
  formae-dynamicae:
    runs-on: ubuntu-latest
    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5
        with:
          ref: chatgpt/vindex-053-compilator-dynamicus
          fetch-depth: 0

      - name: Formas et campos dynamicos comproba
        shell: bash
        run: |
          set +e
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          RELATIO=/tmp/relatio_formae_053
          : > "$RELATIO"
          SUCCESSUS=0

          integrum() {
            VIA="$1"
            [ -s "$VIA" ] || return 1
            A=$(stat -c '%s' "$VIA" 2>/dev/null)
            B=$(od -An -tu8 -j96 -N8 "$VIA" 2>/dev/null | tr -d '[:space:]')
            [ -n "$A" ] && [ "$A" = "$B" ]
          }

          proba() {
            chmod 755 "$RADIX/compilator_vindex"
            python3 "$RADIX/instrumenta/applica_formas_dynamicas_053.py" >> "$RELATIO" 2>&1 || return 1

            if grep -q 'tabula\[950\|tabula\[1000\|tabula\[1050\|tabula\[1100\|tabula\[2500\|tabula\[2530\|tabula\[200 +' "$RADIX/src/compilator_vindex.vindex"; then
              printf '%s\n' 'ERRATUM: metadata formarum fixa adhuc manet.' >> "$RELATIO"
              return 1
            fi

            "$RADIX/compilator_vindex" "$RADIX/src/compilator_vindex.vindex" /tmp/g1 >> "$RELATIO" 2>&1
            S1=$?
            printf 'STATUS G1: %s.\n' "$S1" >> "$RELATIO"
            [ "$S1" -eq 0 ] && integrum /tmp/g1 || return 1

            chmod 755 /tmp/g1
            /tmp/g1 "$RADIX/src/compilator_vindex.vindex" /tmp/g2 >> "$RELATIO" 2>&1
            S2=$?
            printf 'STATUS G2: %s.\n' "$S2" >> "$RELATIO"
            [ "$S2" -eq 0 ] && integrum /tmp/g2 || return 1

            chmod 755 /tmp/g2
            /tmp/g2 "$RADIX/src/compilator_vindex.vindex" /tmp/g3 >> "$RELATIO" 2>&1
            S3=$?
            printf 'STATUS G3: %s.\n' "$S3" >> "$RELATIO"
            [ "$S3" -eq 0 ] && integrum /tmp/g3 || return 1
            cmp -s /tmp/g2 /tmp/g3 || return 1
            printf '%s\n' 'RECTE: formae dynamicae punctum fixum compilatoris servant.' >> "$RELATIO"

            cp /tmp/g3 "$RADIX/compilator_vindex"
            chmod 755 "$RADIX/compilator_vindex"

            python3 - <<'PY'
          from pathlib import Path
          lineae = []
          for i in range(40):
              lineae.extend([
                  f'FORMA Forma{i}.',
                  '    CAMPUS valor SICUT NUMERUS.',
                  'FIN-FORMA.',
                  '',
              ])
          lineae.append('FORMA Magna.')
          for i in range(80):
              lineae.append(f'    CAMPUS c{i} SICUT NUMERUS.')
          lineae.extend([
              'FIN-FORMA.',
              '',
              'FUNCTIO PRINCIPALIS REDDENS NUMERUS.',
              '    DECLARA ultima SICUT Forma39.',
              '    valor DE ultima = 39.',
              '    PROCLAMA valor DE ultima.',
              '    DECLARA magna SICUT Magna.',
              '    c79 DE magna = 777.',
              '    PROCLAMA c79 DE magna.',
              '    REDDE 0.',
              'FIN-FUNCTIO.',
              '',
          ])
          Path('/tmp/formae_magnae_053.vindex').write_text('\n'.join(lineae), encoding='utf-8')
          PY

            "$RADIX/compilator_vindex" /tmp/formae_magnae_053.vindex /tmp/formae_magnae_053 >> "$RELATIO" 2>&1
            SF=$?
            printf 'COMPILATIO XL FORMARUM ET LXXX CAMPORUM: status=%s.\n' "$SF" >> "$RELATIO"
            [ "$SF" -eq 0 ] && integrum /tmp/formae_magnae_053 || return 1
            chmod 755 /tmp/formae_magnae_053
            OF=$(/tmp/formae_magnae_053 2>>"$RELATIO"); EF=$?
            printf 'EXECUTIO FORMARUM MAGNARUM: status=%s exitus=[%s].\n' "$EF" "$OF" >> "$RELATIO"
            [ "$EF" -eq 0 ] || return 1
            [ "$OF" = $'39\n777' ] || return 1
            printf '%s\n' 'RECTE: limites XV formarum et XXVI camporum remoti sunt.' >> "$RELATIO"

            cd "$RADIX" || return 1
            ./compilator_vindex src/officina_vindex.vindex /tmp/officina_nova >> "$RELATIO" 2>&1 || return 1
            ./compilator_vindex src/salutatio_vindex.vindex /tmp/salutatio_nova >> "$RELATIO" 2>&1 || return 1
            cp /tmp/officina_nova ./officina_vindex
            cp /tmp/salutatio_nova ./salutatio_vindex

            find . -type f -name '*.sh' -exec chmod 755 {} +
            chmod 755 ./vindexc ./vindex_graphica ./officina_vindex ./salutatio_vindex ./compilator_vindex ./vindex-officina ./vindex-salutatio ./vindex-systema

            bash ./systema/construe_systema.sh >> "$RELATIO" 2>&1 || return 1
            bash ./systema/uefi/construe_uefi.sh >> "$RELATIO" 2>&1 || return 1
            printf '%s\n' 'RECTE: Systema BIOS et UEFI post migrationem formarum regenerata sunt.' >> "$RELATIO"

            bash ./tests/run_tests.sh >> "$RELATIO" 2>&1
            SR=$?
            printf 'PROBATIONES REGRESSIONALES: status=%s.\n' "$SR" >> "$RELATIO"
            [ "$SR" -eq 0 ] || return 1

            printf '%s\n' 'RECTE: formae et campi descriptoribus crescentibus utuntur.' >> "$RELATIO"
            return 0
          }

          proba
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            SUCCESSUS=1
          else
            printf 'ERRATUM: migratio formarum dynamicarum nondum canonica est; status=%s.\n' "$STATUS" >> "$RELATIO"
          fi

          cd "$GITHUB_WORKSPACE" || exit 0
          VIA_RELATIONIS="$RADIX/instrumenta/RELATIO-FORMAE-DYNAMICAE-053.md"
          {
            printf '%s\n\n' '# VINDEX 0.53 — Relatio formarum dynamicarum'
            printf '%s\n\n' 'Formae et campi crescibiles, auto-hospitium, punctum fixum et regressiones hic comprobantur.'
            printf '%s\n' '```text'
            cat "$RELATIO"
            printf '%s\n' '```'
          } > "$VIA_RELATIONIS"

          git config user.name 'VINDEX Centurio'
          git config user.email 'actions@users.noreply.github.com'
          if [ "$SUCCESSUS" -eq 1 ]; then
            git add "$RADIX/src/compilator_vindex.vindex" "$RADIX/compilator_vindex" "$RADIX/officina_vindex" "$RADIX/salutatio_vindex" "$RADIX/nucleus_systema.elf" "$RADIX/systema_vindex.img" "$RADIX/BOOTX64.EFI" "$RADIX/systema_vindex_uefi.img" "$VIA_RELATIONIS"
          else
            git checkout -- "$RADIX/src/compilator_vindex.vindex" "$RADIX/compilator_vindex" "$RADIX/officina_vindex" "$RADIX/salutatio_vindex" "$RADIX/nucleus_systema.elf" "$RADIX/systema_vindex.img" "$RADIX/BOOTX64.EFI" "$RADIX/systema_vindex_uefi.img" 2>/dev/null || true
            git add "$VIA_RELATIONIS"
          fi
          if ! git diff --cached --quiet; then
            if [ "$SUCCESSUS" -eq 1 ]; then
              git commit -m 'VINDEX 0.53: formas dynamicas comproba'
            else
              git commit -m 'VINDEX 0.53: formas dynamicas diagnostica'
            fi
            git push origin HEAD:chatgpt/vindex-053-compilator-dynamicus
          fi
          exit 0
