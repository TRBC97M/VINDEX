# Causam PROCLAMA numerici Win64 in fonte temporario corrigit et sub Windows vero probat.
name: VINDEX 0.53 — PROCLAMA numericum sub Windows

on:
  push:
    branches:
      - chatgpt/proclama-win-verificatio-053
  pull_request:
    branches:
      - claude/pe-integration-053-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5

      - name: Correctionem diagnosticam applica
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          python3 -m py_compile "$RADIX/instrumenta/corrige_proclama_numericum_win64_053.py"
          python3 "$RADIX/instrumenta/corrige_proclama_numericum_win64_053.py" \
              "$RADIX/src/compilator_vindex.vindex" \
              "$RUNNER_TEMP/compilator_proclama.vindex"
          grep -Fq 'COMPONE_IMPRIME_NUMERUS(codex, CONTENTUM(pos_codicis), intervallum_scratch, contextus_parseris)' "$RUNNER_TEMP/compilator_proclama.vindex"

      - name: Auto-hospitium confirma
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          FONS="$RUNNER_TEMP/compilator_proclama.vindex"
          chmod 755 "$RADIX/compilator_vindex"
          "$RADIX/compilator_vindex" "$FONS" "$RUNNER_TEMP/gen1"
          chmod 755 "$RUNNER_TEMP/gen1"
          "$RUNNER_TEMP/gen1" "$FONS" "$RUNNER_TEMP/gen2"
          chmod 755 "$RUNNER_TEMP/gen2"
          "$RUNNER_TEMP/gen2" "$FONS" "$RUNNER_TEMP/gen3"
          chmod 755 "$RUNNER_TEMP/gen3"
          cmp "$RUNNER_TEMP/gen2" "$RUNNER_TEMP/gen3"
          sha256sum "$RUNNER_TEMP/gen2"
          printf '%s\n' 'RECTE: compilator correctus ad punctum fixum pervenit.'

      - name: Tres probationes PE construe
        shell: bash
        run: |
          set -euo pipefail
          COMP="$RUNNER_TEMP/gen2"

          cat >"$RUNNER_TEMP/solum.vindex" <<'VINDEX'
          FUNCTIO PRINCIPALIS REDDENS NUMERUS.
              PROCLAMA 999.
              REDDE 9.
          FIN-FUNCTIO.
          VINDEX

          cat >"$RUNNER_TEMP/mixtum.vindex" <<'VINDEX'
          FUNCTIO PRINCIPALIS REDDENS NUMERUS.
              PROCLAMA "Premier".
              PROCLAMA 999.
              PROCLAMA "Dernier".
              REDDE 7.
          FIN-FUNCTIO.
          VINDEX

          cat >"$RUNNER_TEMP/tensio.vindex" <<'VINDEX'
          FUNCTIO PRINCIPALIS REDDENS NUMERUS.
              PROCLAMA "Initium".
              PROCLAMA 1.
              PROCLAMA 22.
              PROCLAMA 333.
              PROCLAMA 4444.
              PROCLAMA 55555.
              PROCLAMA "Finis".
              REDDE 5.
          FIN-FUNCTIO.
          VINDEX

          "$COMP" "$RUNNER_TEMP/solum.vindex" "$RUNNER_TEMP/solum.exe" pe
          "$COMP" "$RUNNER_TEMP/mixtum.vindex" "$RUNNER_TEMP/mixtum.exe" pe
          "$COMP" "$RUNNER_TEMP/tensio.vindex" "$RUNNER_TEMP/tensio.exe" pe
          file "$RUNNER_TEMP/solum.exe" "$RUNNER_TEMP/mixtum.exe" "$RUNNER_TEMP/tensio.exe"
          if objdump -d "$RUNNER_TEMP/solum.exe" | grep -Eq '[[:space:]]syscall([[:space:]]|$)'; then
            printf '%s\n' 'ERRATUM: PE numericum adhuc instructionem syscall continet.' >&2
            exit 1
          fi
          printf '%s\n' 'RECTE: PE numericum nullum syscall Linux continet.'

      - name: Executabilia conserva
        uses: actions/upload-artifact@v4
        with:
          name: vindex-proclama-numericum-windows
          path: |
            ${{ runner.temp }}/solum.exe
            ${{ runner.temp }}/mixtum.exe
            ${{ runner.temp }}/tensio.exe
          if-no-files-found: error

  windows:
    needs: construe
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Executabilia accipe
        uses: actions/download-artifact@v4
        with:
          name: vindex-proclama-numericum-windows
          path: pe

      - name: PROCLAMA sub Windows vero verifica
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Proba-Vindex([string]$nomen, [int]$status, [string]$exspectatum) {
            $via = Join-Path $PWD ("pe\" + $nomen + ".exe")
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = $via
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $processus = [System.Diagnostics.Process]::new()
            $processus.StartInfo = $psi
            [void]$processus.Start()
            $stdout = $processus.StandardOutput.ReadToEnd()
            $stderr = $processus.StandardError.ReadToEnd()
            $processus.WaitForExit()
            $normalis = $stdout -replace "`r`n", "`n"
            Write-Host "$nomen -> status $($processus.ExitCode)"
            Write-Host ("stdout=[" + ($normalis -replace "`n", "\\n") + "]")
            if ($stderr.Length -gt 0) { Write-Host ("stderr=[" + $stderr + "]") }
            if ($processus.ExitCode -ne $status) {
              throw "ERRATUM: $nomen status $($processus.ExitCode); $status exspectabatur."
            }
            if ($normalis -ne $exspectatum) {
              throw "ERRATUM: $nomen exitus textus differt."
            }
          }

          Proba-Vindex 'solum' 9 "999`n"
          Proba-Vindex 'mixtum' 7 "Premier`n999`nDernier`n"
          Proba-Vindex 'tensio' 5 "Initium`n1`n22`n333`n4444`n55555`nFinis`n"
          Write-Host 'RECTE: PROCLAMA numericum, mixtum et tensionis sub Windows vero omnia recta sunt.'
