# Diagnostica unica basium memoriae fontium.
name: VINDEX 0.53 — Diagnostica basium

on:
  push:
    branches: [chatgpt/vindex-053-compilator-dynamicus]
    paths:
      - '.github/workflows/vindex-053-fontes-adressen.yml'

permissions:
  contents: write

jobs:
  diagnostica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/vindex-053-compilator-dynamicus
          fetch-depth: 0
      - shell: bash
        run: |
          set +e
          RADIX='Vindex Chat-GPT/vindex_final_v51'; R=/tmp/r; : >"$R"
          chmod 755 "$RADIX/compilator_vindex"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'); t=p.read_text(encoding='utf-8')
          Path('/tmp/pontis.vindex').write_text(t.replace('213001','524289').replace('213000','524288').replace('212999','524287'),encoding='utf-8')
          PY
          "$RADIX/compilator_vindex" /tmp/pontis.vindex /tmp/pontis >>"$R" 2>&1
          chmod 755 /tmp/pontis
          python3 "$RADIX/instrumenta/applica_fontes_dynamicos_053.py" >>"$R" 2>&1
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'); t=p.read_text(encoding='utf-8')
          t=t.replace('''            SI numerus + pars > capacitas TUNC\n                DECLARA nova_capacitas SICUT NUMERUS VALENS capacitas * 2.\n''','''            SI numerus + pars > capacitas TUNC\n                PROCLAMA 9101.\n                PROCLAMA numerus.\n                PROCLAMA capacitas.\n                PROCLAMA basis.\n                DECLARA nova_capacitas SICUT NUMERUS VALENS capacitas * 2.\n''',1)
          t=t.replace('''                DECLARA nova_basis SICUT NUMERUS VALENS RESERVA_OCTETA(nova_capacitas).\n                SI nova_basis < 0 TUNC\n''','''                DECLARA nova_basis SICUT NUMERUS VALENS RESERVA_OCTETA(nova_capacitas).\n                PROCLAMA 9102.\n                PROCLAMA nova_basis.\n                SI nova_basis < 0 TUNC\n''',1)
          t=t.replace('''                basis = nova_basis.\n                capacitas = nova_capacitas.\n''','''                basis = nova_basis.\n                capacitas = nova_capacitas.\n                PROCLAMA 9103.\n                PROCLAMA basis.\n                PROCLAMA capacitas.\n''',1)
          t=t.replace('''    CONTENTUM(longitudo) = numerus.\n    REDDE basis.\nFIN-FUNCTIO.\n\nFUNCTIO ASSECURA_BUFFERUM''','''    PROCLAMA 9104.\n    PROCLAMA basis.\n    PROCLAMA numerus.\n    CONTENTUM(longitudo) = numerus.\n    REDDE basis.\nFIN-FUNCTIO.\n\nFUNCTIO ASSECURA_BUFFERUM''',1)
          t=t.replace('''    DECLARA nova_basis SICUT NUMERUS VALENS RESERVA_OCTETA(nova_capacitas).\n    SI nova_basis < 0 TUNC\n''','''    DECLARA nova_basis SICUT NUMERUS VALENS RESERVA_OCTETA(nova_capacitas).\n    PROCLAMA 9201.\n    PROCLAMA basis.\n    PROCLAMA nova_basis.\n    PROCLAMA longitudo.\n    PROCLAMA necessaria.\n    SI nova_basis < 0 TUNC\n''',1)
          Path('/tmp/dynamic_diag.vindex').write_text(t,encoding='utf-8')
          PY
          /tmp/pontis /tmp/dynamic_diag.vindex /tmp/g1 >>"$R" 2>&1; C=$?; printf 'COMPILATIO G1=%s.\n' "$C" >>"$R"
          chmod 755 /tmp/g1 2>/dev/null
          printf '%s\n' '--- EXECUTIO G1 ---' >>"$R"
          /tmp/g1 /tmp/dynamic_diag.vindex /tmp/g2 >>"$R" 2>&1; E=$?; printf 'EXECUTIO G1=%s.\n' "$E" >>"$R"
          if command -v strace >/dev/null 2>&1; then
            strace -f -o /tmp/s /tmp/g1 /tmp/dynamic_diag.vindex /tmp/g2s >/tmp/out 2>&1
            printf '%s\n' '--- STRACE FINIS ---' >>"$R"; tail -n 50 /tmp/s >>"$R"
          fi
          cd "$GITHUB_WORKSPACE"; F="$RADIX/instrumenta/RELATIO-ADRESSES-FONTIUM-053.md"; { printf '%s\n\n' '# VINDEX 0.53 — Diagnostica basium fontium'; printf '%s\n' '```text'; cat "$R"; printf '%s\n' '```'; } >"$F"
          git config user.name 'VINDEX Centurio'; git config user.email 'actions@users.noreply.github.com'; git add "$F"; if ! git diff --cached --quiet; then git commit -m 'VINDEX 0.53: bases fontium diagnostica'; git push origin HEAD:chatgpt/vindex-053-compilator-dynamicus; fi
          exit 0
