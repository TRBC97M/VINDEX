name: Sylvia OS — Contractus exsecutoris X

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_backend_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/contractus_exsecutoris_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/backend_accelerabilis_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/verifica_abi_graphica_viii.py'
      - 'documenta/sylvia/JL_UX_FUNDAMENTUM_GRAPHICUM_MODERNUM.md'
      - 'CONSILIUM.md'
      - '.github/workflows/sylvia-contractus-exsecutoris-x.yml'

permissions:
  contents: read

jobs:
  contractus-exsecutoris:
    name: Submissiones, completiones et defectus probantur
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v5

      - name: Instrumenta para
        shell: bash
        run: chmod +x 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'

      - name: Puritatem et ABI verifica
        shell: bash
        run: |
          set -euo pipefail
          python3 instrumenta/verifica_puritatem_sylviae.py
          python3 'Vindex Chat-GPT/vindex_final_v51/instrumenta/verifica_abi_graphica_viii.py'

      - name: Contractum exsecutoris native exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex probationes/contractus_exsecutoris_x.vindex /tmp/contractus-exsecutoris-x
          chmod +x /tmp/contractus-exsecutoris-x
          timeout 25s /tmp/contractus-exsecutoris-x
          printf '%s\n' 'RECTE: exsecutor submissiones, completiones et defectus gubernat.'

      - name: Incrementa F1 ad F5 iterum exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          for fons in backend_accelerabilis_x cache_texturarum_x coda_compositionis_x vita_texturarum_x cache_vita_texturarum_x scena_compositoris_x; do
            ./compilator_vindex "probationes/$fons.vindex" "/tmp/$fons"
            chmod +x "/tmp/$fons"
            timeout 25s "/tmp/$fons"
          done

      - name: Payload Sylviae integrum compila
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex systema/fenestrale_ii_purus_i.vindex /tmp/fenestrale-xiif6
          file /tmp/fenestrale-xiif6 | grep -q 'ELF 64-bit'

      - name: Regressionem canonicam exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: bash tests/run_tests.sh
