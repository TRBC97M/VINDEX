name: VINDEX — ATMOS La Passe Genocidaire

on:
  pull_request:
    paths:
      - 'PROGRAMMATA/ATMOS_TERMINAL_DEPTH/**'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/**'
      - 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
      - '.github/workflows/vindex-atmos-passe-genocidaire.yml'
      - 'documenta/vindex/ATMOS_PASSE_GENOCIDAIRE_I.md'

jobs:
  puritas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nullum fontem runtime alienae linguae in ATMOS admitte
        shell: bash
        run: |
          set -euo pipefail
          aliena=$(git ls-files 'PROGRAMMATA/ATMOS_TERMINAL_DEPTH/**' | grep -Ei '\.(c|h|cc|cpp|cxx|rs|cs|fs|vb|js|jsx|ts|tsx|py|go|java|kt|kts|asm|s|html|css)$' || true)
          if [ -n "$aliena" ]; then
            echo 'ERRATUM: fontes non-VINDEX in arbore canonica ATMOS:'
            printf '%s\n' "$aliena"
            exit 1
          fi
          echo 'RECTE: arbor canonica ATMOS nullum fontem runtime alienae linguae habet.'

      - name: Importa applicationis solum VINDEX esse confirma
        shell: bash
        run: |
          set -euo pipefail
          files=(
            'PROGRAMMATA/ATMOS_TERMINAL_DEPTH/POC_VI/ludus.vindex'
            'PROGRAMMATA/ATMOS_TERMINAL_DEPTH/COMMUNE/nucleus.vindex'
            'PROGRAMMATA/ATMOS_TERMINAL_DEPTH/COMMUNE/mundus.vindex'
            'PROGRAMMATA/ATMOS_TERMINAL_DEPTH/COMMUNE/interactio.vindex'
            'PROGRAMMATA/ATMOS_TERMINAL_DEPTH/COMMUNE/win32_stabilitas.vindex'
            'Vindex Chat-GPT/vindex_final_v51/bibliotheca/textus.vindex'
            'Vindex Chat-GPT/vindex_final_v51/bibliotheca/conversio.vindex'
            'Vindex Chat-GPT/vindex_final_v51/bibliotheca/win32_ffi.vindex'
            'Vindex Chat-GPT/vindex_final_v51/bibliotheca/win32_app.vindex'
            'Vindex Chat-GPT/vindex_final_v51/bibliotheca/aleatorium.vindex'
          )
          for f in "${files[@]}"; do
            test -f "$f"
            bad=$(grep -E '^IMPORTA ' "$f" | grep -Ev '\.vindex"\.$' || true)
            if [ -n "$bad" ]; then
              echo "ERRATUM: importatio non-VINDEX in $f"
              printf '%s\n' "$bad"
              exit 1
            fi
          done
          echo 'RECTE: clausura fontium applicationis VINDEX pura est.'

      - name: Compilatorem VINDEX ex VINDEX ad punctum fixum regenera
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          chmod +x compilator_vindex
          ./compilator_vindex src/compilator_vindex.vindex /tmp/g2
          chmod +x /tmp/g2
          /tmp/g2 src/compilator_vindex.vindex /tmp/g3
          chmod +x /tmp/g3
          /tmp/g3 src/compilator_vindex.vindex /tmp/g4
          chmod +x /tmp/g4
          cmp /tmp/g3 /tmp/g4
          echo 'RECTE: compilator ipse VINDEX est et G3 = G4.'

      - name: ATMOS solo compilatore auto-hospite VINDEX genera
        working-directory: PROGRAMMATA/ATMOS_TERMINAL_DEPTH/POC_VI
        shell: bash
        run: |
          set -euo pipefail
          /tmp/g4 ludus.vindex /tmp/atmos_purus.exe pe
          file /tmp/atmos_purus.exe

      - name: PE runtime alienum ne importet
        shell: bash
        run: |
          set -euo pipefail
          objdump -p /tmp/atmos_purus.exe > /tmp/pe.txt
          echo 'DLL imports:'
          grep -E 'DLL Name:' /tmp/pe.txt || true
          if grep -Eiq 'DLL Name:.*(msvcrt|ucrtbase|vcruntime|mscoree|libstdc\+\+|libgcc|python|node)' /tmp/pe.txt; then
            echo 'ERRATUM: runtime alienum repertum est.'
            exit 1
          fi
          dlls=$(grep -E 'DLL Name:' /tmp/pe.txt | sed 's/.*DLL Name: *//' | tr '[:lower:]' '[:upper:]' | sort -u)
          extra=$(printf '%s\n' "$dlls" | grep -Ev '^(KERNEL32\.DLL)?$' || true)
          if [ -n "$extra" ]; then
            echo 'ERRATUM: importatio PE praeter KERNEL32 directa inventa est:'
            printf '%s\n' "$extra"
            exit 1
          fi
          echo 'RECTE: nullus CRT, .NET aut runtime tertiae linguae in PE est.'

      - uses: actions/upload-artifact@v4
        with:
          name: atmos-poc-vi-purus-vindex
          path: /tmp/atmos_purus.exe
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: puritas
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atmos-poc-vi-purus-vindex
          path: atmos
      - name: Executabile ex catena VINDEX pura sub Windows exerce
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location (Resolve-Path '.\atmos')
          Remove-Item '.\atmos.sav' -Force -ErrorAction SilentlyContinue
          Remove-Item '.\atmos.world' -Force -ErrorAction SilentlyContinue
          $out = & .\atmos_purus.exe smoke 2>&1
          $code = $LASTEXITCODE
          $text = ($out -join "`n")
          Write-Host $text
          if ($code -ne 0) { throw "ATMOS purus exitus $code" }
          if ($text -notmatch 'RECTE: ATMOS POC VI STABILITAS WIN64') { throw 'executio pura non confirmata est' }
          Write-Host 'RECTE: LA PASSE GENOCIDAIRE — runtime ATMOS applicationisque codex proprius C percentum VINDEX est.'
