name: P3 — Allocator UEFI dissectio temporaria

on:
  push:
    branches:
      - chatgpt/p3-fenestrale-uefi-purum

permissions:
  contents: write

jobs:
  disseca:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v5

      - name: Emissionem allocatoris monstra
        shell: bash
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        run: |
          set -euo pipefail
          echo '=== COMPONE_RESERVA_OCTETA ==='
          grep -n -A45 -B5 'FUNCTIO COMPONE_RESERVA_OCTETA REDDENS NUMERUS' src/compilator_vindex.vindex
          echo '=== COMPONE_RESERVA_OCTETA_DYNAMICA ==='
          grep -n -A35 -B5 'FUNCTIO COMPONE_RESERVA_OCTETA_DYNAMICA REDDENS NUMERUS' src/compilator_vindex.vindex
          echo '=== RESERVA_OCTETA parser ==='
          grep -n -A25 -B8 'fons\[CONTENTUM(pos_fontis)\] == 82.*RESERVA_OCTETA' src/compilator_vindex.vindex || true
          echo '=== MODUS_PE ==='
          grep -n -A10 -B5 'MODUS_PE_LEGE(contextus_parseris)' src/compilator_vindex.vindex | head -n 180
