name: P3 — Mappa functionum G3 temporaria

on:
  push:
    branches:
      - chatgpt/p3-fenestrale-uefi-purum

jobs:
  mappa:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: G3 construe et prologos cum fontibus compara
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/compilator_vindex.vindex')
          t=p.read_text(encoding='utf-8')
          a=t.index('FUNCTIO COMPONE_RESERVA_OCTETA REDDENS NUMERUS.')
          b=t.index('\nFUNCTIO COMPONE_RESERVA_OCTETA_DYNAMICA REDDENS NUMERUS.',a)
          n='''FUNCTIO COMPONE_RESERVA_OCTETA REDDENS NUMERUS.
              ACCIPIT codex SICUT ACUS<NUMERUS>.
              ACCIPIT pos SICUT NUMERUS.
              DECLARA p_mem SICUT NUMERUS VALENS pos.
              p_mem = COMPONE_TRANSCRIBE(codex, p_mem, 6, 0).
              p_mem = COMPONE_ONERA(codex, p_mem, 1, 33554432).
              p_mem = COMPONE_SUME_INDIRECTUM(codex, p_mem, 0, 1).
              p_mem = COMPONE_SERVA_INDIRECTUM(codex, p_mem, 0, 6).
              p_mem = COMPONE_TRANSCRIBE(codex, p_mem, 3, 0).
              p_mem = COMPONE_ONERA(codex, p_mem, 2, 8).
              p_mem = COMPONE_ADD(codex, p_mem, 0, 2).
              p_mem = COMPONE_IMPONE(codex, p_mem, 0).
              p_mem = COMPONE_TRANSCRIBE(codex, p_mem, 0, 3).
              p_mem = COMPONE_ONERA(codex, p_mem, 2, 8).
              p_mem = COMPONE_ADD(codex, p_mem, 0, 2).
              p_mem = COMPONE_ADD(codex, p_mem, 0, 6).
              p_mem = COMPONE_VERIFICA_TAS(codex, p_mem).
              p_mem = COMPONE_ONERA(codex, p_mem, 1, 33554432).
              p_mem = COMPONE_SERVA_INDIRECTUM(codex, p_mem, 1, 0).
              p_mem = COMPONE_AUFER(codex, p_mem, 0).
              REDDE p_mem.
          FIN-FUNCTIO.
          '''
          p.write_text(t[:a]+n+t[b:],encoding='utf-8')
          PY
          ./compilator_vindex src/compilator_vindex.vindex /tmp/g2
          chmod +x /tmp/g2
          /tmp/g2 src/compilator_vindex.vindex /tmp/g3
          chmod +x /tmp/g3
          python3 - <<'PY'
          import re
          from pathlib import Path
          src=Path('src/compilator_vindex.vindex').read_text(encoding='utf-8')
          names=re.findall(r'(?m)^FUNCTIO\s+([A-Z0-9_]+)\s+REDDENS',src)
          data=Path('/tmp/g3').read_bytes()
          pats=[b'\x55\x48\x89\xe5', b'\x55\x48\x89\xe5\x48\x81\xec']
          hits=[]
          i=0
          while True:
              i=data.find(pats[0],i)
              if i<0: break
              hits.append(i); i+=1
          target=0x432c34-0x400000
          print('FUNCT_NUM',len(names),'PROLOG_NUM',len(hits),'TARGET_FILE',hex(target))
          near=[(idx,off) for idx,off in enumerate(hits) if abs(off-target)<0x4000]
          for idx,off in near:
              nm=names[idx] if idx<len(names) else '?'
              print('PROLOG',idx,hex(0x400000+off),nm,'delta',hex(target-off))
          # etiam omnes nomina cum ASSECURA/BUFFER/LIMEN ordine monstrantur
          for idx,n in enumerate(names):
              if any(k in n for k in ('ASSECURA','BUFFER','CODEX','FORMAS','PARES','LOCA')):
                  print('NOMEN',idx,n)
          PY
