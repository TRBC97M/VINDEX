name: P3 — Liberatio acervi dissectio temporaria

on:
  push:
    branches:
      - chatgpt/p3-fenestrale-uefi-purum

permissions:
  contents: write

jobs:
  disseca:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v5
      - name: Liberationem et usum acervi monstra
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -u
          echo '=== OMNES 33554440 ==='
          grep -n -A35 -B25 '33554440' src/compilator_vindex.vindex || true
          echo '=== OMNES syscall 11 (munmap) ==='
          grep -n -A15 -B20 'COMPONE_ONERA(codex, .*0, 11)' src/compilator_vindex.vindex || true
          echo '=== verba LIBERA in fonte ==='
          grep -n -i -A30 -B20 'libera' src/compilator_vindex.vindex || true
          echo '=== RESERVA_OCTETA in fonte compilatoris ==='
          grep -n 'RESERVA_OCTETA' src/compilator_vindex.vindex | head -n 120 || true
