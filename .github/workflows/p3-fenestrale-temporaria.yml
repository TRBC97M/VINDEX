name: P3 — Praecertificatio Fenestralis UEFI

on:
  push:
    branches:
      - chatgpt/p3-fenestrale-uefi-purum

permissions:
  contents: write

jobs:
  proba:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Instrumenta UEFI institue
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf file

      - name: P3 Fenestrale additive applica
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/p3_fenestrale.py

      - name: Descriptores corrige et compilatorem converge
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/compilator_vindex.vindex')
          t=p.read_text(encoding='utf-8')

          # Structurae internae infra campis in OCTETIS definitae sunt.
          # Earum addressa ergo NUMERUS sunt, non ACUS<NUMERUS>, ne
          # arithmetica acus offseta per VIII multiplicet.
          n_cod=t.count('ACCIPIT codex SICUT ACUS<NUMERUS>.')
          n_ctx=t.count('ACCIPIT contextus_parseris SICUT ACUS<NUMERUS>.')
          t=t.replace('ACCIPIT codex SICUT ACUS<NUMERUS>.','ACCIPIT codex SICUT NUMERUS.')
          t=t.replace('DECLARA codex SICUT ACUS<NUMERUS> VALENS','DECLARA codex SICUT NUMERUS VALENS')
          t=t.replace('ACCIPIT contextus_parseris SICUT ACUS<NUMERUS>.','ACCIPIT contextus_parseris SICUT NUMERUS.')
          t=t.replace('DECLARA contextus_parseris SICUT ACUS<NUMERUS> VALENS','DECLARA contextus_parseris SICUT NUMERUS VALENS')
          t,n_desc=re.subn(r'ACCIPIT (descriptor(?:_[A-Za-z0-9_]+)?) SICUT ACUS<NUMERUS>\.',r'ACCIPIT \1 SICUT NUMERUS.',t)
          print('REFRACTIONES codex=',n_cod,'contextus=',n_ctx,'descriptor=',n_desc)

          # RESERVA_OCTETA ELF: acervus VINDEX nativus ad 0x02000000.
          # Nullus syscall Linux et nullum registrum argumenti destruitur.
          a=t.index('FUNCTIO COMPONE_RESERVA_OCTETA REDDENS NUMERUS.')
          b=t.index('\nFUNCTIO COMPONE_RESERVA_OCTETA_DYNAMICA REDDENS NUMERUS.',a)
          n='''FUNCTIO COMPONE_RESERVA_OCTETA REDDENS NUMERUS.
              ACCIPIT codex SICUT NUMERUS.
              ACCIPIT pos SICUT NUMERUS.
              DECLARA p_mem SICUT NUMERUS VALENS pos.
              p_mem = COMPONE_IMPONE(codex, p_mem, 10).
              p_mem = COMPONE_IMPONE(codex, p_mem, 0).
              p_mem = COMPONE_ONERA(codex, p_mem, 10, 33554432).
              p_mem = COMPONE_SUME_INDIRECTUM(codex, p_mem, 0, 10).
              p_mem = COMPONE_AUFER(codex, p_mem, 10).
              p_mem = COMPONE_SERVA_INDIRECTUM(codex, p_mem, 0, 10).
              p_mem = COMPONE_IMPONE(codex, p_mem, 10).
              p_mem = COMPONE_ONERA(codex, p_mem, 10, 8).
              p_mem = COMPONE_ADD(codex, p_mem, 0, 10).
              p_mem = COMPONE_AUFER(codex, p_mem, 10).
              p_mem = COMPONE_IMPONE(codex, p_mem, 0).
              p_mem = COMPONE_ADD(codex, p_mem, 0, 10).
              p_mem = COMPONE_ONERA(codex, p_mem, 10, 7).
              p_mem = COMPONE_ADD(codex, p_mem, 0, 10).
              p_mem = COMPONE_ONERA(codex, p_mem, 10, -8).
              p_mem = COMPONE_AND(codex, p_mem, 0, 10).
              p_mem = COMPONE_ONERA(codex, p_mem, 10, 33554432).
              p_mem = COMPONE_SERVA_INDIRECTUM(codex, p_mem, 10, 0).
              p_mem = COMPONE_AUFER(codex, p_mem, 0).
              p_mem = COMPONE_AUFER(codex, p_mem, 10).
              REDDE p_mem.
          FIN-FUNCTIO.
          '''
          p.write_text(t[:a]+n+t[b:],encoding='utf-8')
          PY

          chmod +x ./compilator_vindex
          ./compilator_vindex src/compilator_vindex.vindex /tmp/g2
          chmod +x /tmp/g2
          timeout 20s /tmp/g2 src/compilator_vindex.vindex /tmp/g3
          chmod +x /tmp/g3
          timeout 20s /tmp/g3 src/compilator_vindex.vindex /tmp/g4
          chmod +x /tmp/g4
          cmp /tmp/g3 /tmp/g4
          printf '%s\n' 'RECTE: G3 = G4; compilator ad punctum fixum convergit.'

          cp /tmp/g4 ./compilator_vindex
          chmod +x ./compilator_vindex
          bash ./tests/run_tests.sh

      - name: Catena historica Sylviae et PS2
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        env:
          MORA_INITII: '28'
        run: |
          set -euo pipefail
          bash ./instrumenta/proba_catenam_uefi_053.sh

      - name: Fenestrale II cum PS2 sub UEFI
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        env:
          MORA_INITII: '28'
        run: |
          set -euo pipefail
          bash ./instrumenta/proba_fenestrale_uefi_purum.sh

      - name: Statum probatum in ramo serva
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          git diff --check
          git status --short
          git add \
            "$RADIX/src/compilator_vindex.vindex" \
            "$RADIX/compilator_vindex" \
            "$RADIX/systema/rectores/murus_ps2.vindex" \
            "$RADIX/bibliotheca/fenestrale_input_i.vindex" \
            "$RADIX/systema/fenestrale_ii_purus_i.vindex" \
            "$RADIX/systema/uefi/construe_uefi_purum.sh" \
            "$RADIX/instrumenta/proba_fenestrale_uefi_purum.py"
          git diff --cached --quiet && { printf '%s\n' 'RECTE: nihil novum servandum.'; exit 0; }
          git config user.name 'TRBC97M'
          git config user.email 'trbc97m@protonmail.com'
          git commit -m 'P3: Fenestrale II cum PS/2 UEFI puro coniunge [skip ci]'
          git push origin HEAD:chatgpt/p3-fenestrale-uefi-purum
