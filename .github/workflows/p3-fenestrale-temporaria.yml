name: P3 — Descriptorum mutationes

on:
  push:
    branches:
      - chatgpt/p3-fenestrale-uefi-purum

jobs:
  proba:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Initia descriptorum singillatim registra
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/compilator_vindex.vindex')
          t=p.read_text(encoding='utf-8')
          a=t.index('FUNCTIO COMPONE_RESERVA_OCTETA REDDENS NUMERUS.')
          b=t.index('\nFUNCTIO COMPONE_RESERVA_OCTETA_DYNAMICA REDDENS NUMERUS.',a)
          n='''FUNCTIO COMPONE_RESERVA_OCTETA REDDENS NUMERUS.
              ACCIPIT codex SICUT ACUS<NUMERUS>.
              ACCIPIT pos SICUT NUMERUS.
              DECLARA p_mem SICUT NUMERUS VALENS pos.
              p_mem = COMPONE_IMPONE(codex, p_mem, 10).
              p_mem = COMPONE_IMPONE(codex, p_mem, 0).
              p_mem = COMPONE_ONERA(codex, p_mem, 10, 33554432).
              p_mem = COMPONE_SUME_INDIRECTUM(codex, p_mem, 0, 10).
              p_mem = COMPONE_AUFER(codex, p_mem, 10).
              p_mem = COMPONE_SERVA_INDIRECTUM(codex, p_mem, 0, 10).
              p_mem = COMPONE_IMPONE(codex, p_mem, 10).
              p_mem = COMPONE_ONERA(codex, p_mem, 10, 8).
              p_mem = COMPONE_ADD(codex, p_mem, 0, 10).
              p_mem = COMPONE_AUFER(codex, p_mem, 10).
              p_mem = COMPONE_IMPONE(codex, p_mem, 0).
              p_mem = COMPONE_ADD(codex, p_mem, 0, 10).
              p_mem = COMPONE_ONERA(codex, p_mem, 10, 7).
              p_mem = COMPONE_ADD(codex, p_mem, 0, 10).
              p_mem = COMPONE_ONERA(codex, p_mem, 10, -8).
              p_mem = COMPONE_AND(codex, p_mem, 0, 10).
              p_mem = COMPONE_ONERA(codex, p_mem, 10, 33554432).
              p_mem = COMPONE_SERVA_INDIRECTUM(codex, p_mem, 10, 0).
              p_mem = COMPONE_AUFER(codex, p_mem, 0).
              p_mem = COMPONE_AUFER(codex, p_mem, 10).
              REDDE p_mem.
          FIN-FUNCTIO.
          '''
          t=t[:a]+n+t[b:]
          old='''    DECLARA status_locorum_dynam SICUT NUMERUS VALENS INITIA_LOCA_DYNAMICA(DESCRIPTOR_LOCALIUM_LEGE(contextus_parseris)).
              SI status_locorum_dynam != 0 TUNC
                  PROCLAMA "ERRATUM: memoria symbolorum localium reservata non est".
                  REDDE 71.
              FIN-SI.
              DECLARA status_functionum_dynam SICUT NUMERUS VALENS INITIA_PARES_DYNAMICA(DESCRIPTOR_FUNCTIONUM_LEGE(contextus_parseris), 64).
              DECLARA status_pendentium_dynam SICUT NUMERUS VALENS INITIA_PARES_DYNAMICA(DESCRIPTOR_PENDENTIUM_LEGE(contextus_parseris), 64).
              DECLARA status_pos_pend_dynam SICUT NUMERUS VALENS INITIA_PARES_DYNAMICA(POSITIONES_PENDENTES_LEGE(contextus_parseris), 64).
          '''
          new='''    DECLARA status_locorum_dynam SICUT NUMERUS VALENS INITIA_LOCA_DYNAMICA(DESCRIPTOR_LOCALIUM_LEGE(contextus_parseris)).
              PROCLAMA 9101.
              PROCLAMA descriptor_functionum_contextus.
              PROCLAMA CONTENTUM(descriptor_functionum_contextus).
              PROCLAMA CONTENTUM(descriptor_functionum_contextus + 8).
              PROCLAMA descriptor_localium_contextus.
              PROCLAMA CONTENTUM(descriptor_localium_contextus).
              PROCLAMA CONTENTUM(descriptor_localium_contextus + 8).
              SI status_locorum_dynam != 0 TUNC
                  PROCLAMA "ERRATUM: memoria symbolorum localium reservata non est".
                  REDDE 71.
              FIN-SI.
              DECLARA status_functionum_dynam SICUT NUMERUS VALENS INITIA_PARES_DYNAMICA(DESCRIPTOR_FUNCTIONUM_LEGE(contextus_parseris), 64).
              PROCLAMA 9102.
              PROCLAMA descriptor_functionum_contextus.
              PROCLAMA CONTENTUM(descriptor_functionum_contextus).
              PROCLAMA CONTENTUM(descriptor_functionum_contextus + 8).
              PROCLAMA descriptor_localium_contextus.
              PROCLAMA CONTENTUM(descriptor_localium_contextus).
              PROCLAMA CONTENTUM(descriptor_localium_contextus + 8).
              DECLARA status_pendentium_dynam SICUT NUMERUS VALENS INITIA_PARES_DYNAMICA(DESCRIPTOR_PENDENTIUM_LEGE(contextus_parseris), 64).
              PROCLAMA 9103.
              PROCLAMA CONTENTUM(descriptor_localium_contextus).
              PROCLAMA CONTENTUM(descriptor_localium_contextus + 8).
              DECLARA status_pos_pend_dynam SICUT NUMERUS VALENS INITIA_PARES_DYNAMICA(POSITIONES_PENDENTES_LEGE(contextus_parseris), 64).
              PROCLAMA 9104.
              PROCLAMA CONTENTUM(descriptor_localium_contextus).
              PROCLAMA CONTENTUM(descriptor_localium_contextus + 8).
          '''
          if old not in t:
              raise SystemExit('ERRATUM: series initiorum non inventa')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          ./compilator_vindex src/compilator_vindex.vindex /tmp/g2
          chmod +x /tmp/g2
          /tmp/g2 src/compilator_vindex.vindex /tmp/g3 > /tmp/g2.out 2>&1
          echo '=== G2 ==='
          cat /tmp/g2.out
          chmod +x /tmp/g3
          echo '=== G3 ==='
          timeout 3s /tmp/g3 src/compilator_vindex.vindex /tmp/g4 > /tmp/g3.out 2>&1 || true
          cat /tmp/g3.out
