name: P3 — Descriptor allocator minima probatio

on:
  push:
    branches:
      - chatgpt/p3-fenestrale-uefi-purum

jobs:
  proba:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Compilatorem G2 nativo emissore construe et microprobationem exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/compilator_vindex.vindex')
          t=p.read_text(encoding='utf-8')
          a=t.index('FUNCTIO COMPONE_RESERVA_OCTETA REDDENS NUMERUS.')
          b=t.index('\nFUNCTIO COMPONE_RESERVA_OCTETA_DYNAMICA REDDENS NUMERUS.',a)
          n='''FUNCTIO COMPONE_RESERVA_OCTETA REDDENS NUMERUS.
              ACCIPIT codex SICUT ACUS<NUMERUS>.
              ACCIPIT pos SICUT NUMERUS.
              DECLARA p_mem SICUT NUMERUS VALENS pos.
              p_mem = COMPONE_TRANSCRIBE(codex, p_mem, 6, 0).
              p_mem = COMPONE_ONERA(codex, p_mem, 1, 33554432).
              p_mem = COMPONE_SUME_INDIRECTUM(codex, p_mem, 0, 1).
              p_mem = COMPONE_SERVA_INDIRECTUM(codex, p_mem, 0, 6).
              p_mem = COMPONE_TRANSCRIBE(codex, p_mem, 3, 0).
              p_mem = COMPONE_ONERA(codex, p_mem, 2, 8).
              p_mem = COMPONE_ADD(codex, p_mem, 0, 2).
              p_mem = COMPONE_IMPONE(codex, p_mem, 0).
              p_mem = COMPONE_TRANSCRIBE(codex, p_mem, 0, 3).
              p_mem = COMPONE_ONERA(codex, p_mem, 2, 8).
              p_mem = COMPONE_ADD(codex, p_mem, 0, 2).
              p_mem = COMPONE_ADD(codex, p_mem, 0, 6).
              p_mem = COMPONE_VERIFICA_TAS(codex, p_mem).
              p_mem = COMPONE_ONERA(codex, p_mem, 1, 33554432).
              p_mem = COMPONE_SERVA_INDIRECTUM(codex, p_mem, 1, 0).
              p_mem = COMPONE_AUFER(codex, p_mem, 0).
              REDDE p_mem.
          FIN-FUNCTIO.
          '''
          p.write_text(t[:a]+n+t[b:],encoding='utf-8')
          Path('/tmp/proba.vindex').write_text('''FUNCTIO INITIA REDDENS NUMERUS.
              ACCIPIT descriptor SICUT ACUS<NUMERUS>.
              DECLARA limen SICUT NUMERUS VALENS 64.
              DECLARA basis SICUT NUMERUS VALENS RESERVA_OCTETA(limen * 48).
              CONTENTUM(descriptor) = basis.
              CONTENTUM(descriptor + 8) = limen.
              CONTENTUM(descriptor + 16) = 0.
              REDDE 0.
          FIN-FUNCTIO.

          FUNCTIO PRINCIPALIS REDDENS NUMERUS.
              DECLARA descriptor SICUT ACUS<NUMERUS> VALENS RESERVA_OCTETA(24).
              PROCLAMA descriptor.
              DECLARA s SICUT NUMERUS VALENS INITIA(descriptor).
              PROCLAMA CONTENTUM(descriptor).
              PROCLAMA CONTENTUM(descriptor + 8).
              PROCLAMA CONTENTUM(descriptor + 16).
              DECLARA aliud SICUT NUMERUS VALENS RESERVA_OCTETA(80).
              PROCLAMA aliud.
              PROCLAMA CONTENTUM(descriptor + 8).
              REDDE 0.
          FIN-FUNCTIO.
          ''',encoding='utf-8')
          PY
          ./compilator_vindex src/compilator_vindex.vindex /tmp/g2
          chmod +x /tmp/g2
          /tmp/g2 /tmp/proba.vindex /tmp/proba
          chmod +x /tmp/proba
          echo '=== MICROPROBATIO ==='
          timeout 5s /tmp/proba
          echo '=== FINIS ==='
