name: P3 — Allocator nativus dissectio temporaria

on:
  push:
    branches:
      - chatgpt/p3-fenestrale-uefi-purum

permissions:
  contents: write

jobs:
  disseca:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v5
      - name: Allocatoris nativi partes monstra
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -u
          echo '=== VERIFICA_TAS ==='
          grep -n -A35 -B5 'FUNCTIO COMPONE_VERIFICA_TAS REDDENS NUMERUS' src/compilator_vindex.vindex || true
          echo '=== RESERVA typata ==='
          grep -n -A85 -B20 'numerus_campi_reserva SICUT NUMERUS' src/compilator_vindex.vindex || true
          echo '=== LIBERA parser ==='
          grep -n -A90 -B20 'LIBERA' src/compilator_vindex.vindex | grep -A90 -B20 '33554440' | head -n 180 || true
          echo '=== BITWISE helpers ==='
          grep -n 'FUNCTIO COMPONE_.*AND\|FUNCTIO COMPONE_.*ET\|FUNCTIO COMPONE_.*DIV\|FUNCTIO COMPONE_.*MUL' src/compilator_vindex.vindex | head -n 80 || true
