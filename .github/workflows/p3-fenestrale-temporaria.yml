name: P3 — Descriptoris scriptor detegitur

on:
  push:
    branches:
      - chatgpt/p3-fenestrale-uefi-purum

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: GDB institue
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gdb
      - name: Sedem veram detege et campum custodi
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/compilator_vindex.vindex')
          t=p.read_text(encoding='utf-8')
          a=t.index('FUNCTIO COMPONE_RESERVA_OCTETA REDDENS NUMERUS.')
          b=t.index('\nFUNCTIO COMPONE_RESERVA_OCTETA_DYNAMICA REDDENS NUMERUS.',a)
          n='''FUNCTIO COMPONE_RESERVA_OCTETA REDDENS NUMERUS.
              ACCIPIT codex SICUT ACUS<NUMERUS>.
              ACCIPIT pos SICUT NUMERUS.
              DECLARA p_mem SICUT NUMERUS VALENS pos.
              p_mem = COMPONE_TRANSCRIBE(codex, p_mem, 6, 0).
              p_mem = COMPONE_ONERA(codex, p_mem, 1, 33554432).
              p_mem = COMPONE_SUME_INDIRECTUM(codex, p_mem, 0, 1).
              p_mem = COMPONE_SERVA_INDIRECTUM(codex, p_mem, 0, 6).
              p_mem = COMPONE_TRANSCRIBE(codex, p_mem, 3, 0).
              p_mem = COMPONE_ONERA(codex, p_mem, 2, 8).
              p_mem = COMPONE_ADD(codex, p_mem, 0, 2).
              p_mem = COMPONE_IMPONE(codex, p_mem, 0).
              p_mem = COMPONE_TRANSCRIBE(codex, p_mem, 0, 3).
              p_mem = COMPONE_ONERA(codex, p_mem, 2, 8).
              p_mem = COMPONE_ADD(codex, p_mem, 0, 2).
              p_mem = COMPONE_ADD(codex, p_mem, 0, 6).
              p_mem = COMPONE_VERIFICA_TAS(codex, p_mem).
              p_mem = COMPONE_ONERA(codex, p_mem, 1, 33554432).
              p_mem = COMPONE_SERVA_INDIRECTUM(codex, p_mem, 1, 0).
              p_mem = COMPONE_AUFER(codex, p_mem, 0).
              REDDE p_mem.
          FIN-FUNCTIO.
          '''
          t=t[:a]+n+t[b:]
          old='''    DECLARA status_locorum_dynam SICUT NUMERUS VALENS INITIA_LOCA_DYNAMICA(DESCRIPTOR_LOCALIUM_LEGE(contextus_parseris)).
              SI status_locorum_dynam != 0 TUNC
          '''
          new='''    DECLARA status_locorum_dynam SICUT NUMERUS VALENS INITIA_LOCA_DYNAMICA(DESCRIPTOR_LOCALIUM_LEGE(contextus_parseris)).
              PROCLAMA DESCRIPTOR_LOCALIUM_LEGE(contextus_parseris).
              PROCLAMA CONTENTUM(DESCRIPTOR_LOCALIUM_LEGE(contextus_parseris) + 8).
              SI status_locorum_dynam != 0 TUNC
          '''
          if old not in t: raise SystemExit('ERRATUM: initium locorum non inventum')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          ./compilator_vindex src/compilator_vindex.vindex /tmp/g2
          chmod +x /tmp/g2
          /tmp/g2 src/compilator_vindex.vindex /tmp/g3
          chmod +x /tmp/g3

          echo '=== CURSUS AD SEDEM DETEGENDAM ==='
          set +e
          timeout 2s /tmp/g3 src/compilator_vindex.vindex /tmp/g4 > /tmp/out.txt 2>&1
          set -e
          cat /tmp/out.txt
          descriptor=$(grep -E '^[0-9]+$' /tmp/out.txt | head -n1)
          capacitas=$(grep -E '^[0-9]+$' /tmp/out.txt | sed -n '2p')
          test -n "$descriptor"
          test "$capacitas" = 64
          campus=$((descriptor+8))
          printf 'DESCRIPTOR=%d CAMPUS=0x%x CAPACITAS=%s\n' "$descriptor" "$campus" "$capacitas"

          cat >/tmp/watch.gdb <<GDB
          set pagination off
          set confirm off
          set args src/compilator_vindex.vindex /tmp/g4b
          starti
          watch *(long long*)$campus
          continue
          printf "=== HIT1 ===\\n"
          x/gx $campus
          info registers rip rax rbx rcx rdx rsi rdi rsp rbp
          x/18i \$rip-28
          continue
          printf "=== HIT2 ===\\n"
          x/gx $campus
          info registers rip rax rbx rcx rdx rsi rdi rsp rbp
          x/18i \$rip-28
          continue
          printf "=== HIT3 ===\\n"
          x/gx $campus
          info registers rip rax rbx rcx rdx rsi rdi rsp rbp
          x/18i \$rip-28
          quit
          GDB
          timeout 20s gdb -q -batch -x /tmp/watch.gdb /tmp/g3 || true
