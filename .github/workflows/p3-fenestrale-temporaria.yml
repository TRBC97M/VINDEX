name: P3 — Arithmetica ACUS comprobatur

on:
  push:
    branches:
      - chatgpt/p3-fenestrale-uefi-purum

jobs:
  proba:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: ACUS NUMERUS contra octeta
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/acus.vindex <<'EOF'
          FUNCTIO PRINCIPALIS REDDENS NUMERUS.
              DECLARA d SICUT ACUS<NUMERUS> VALENS RESERVA_OCTETA(128).
              DECLARA brutum SICUT NUMERUS VALENS d.
              CONTENTUM(d + 8) = 77.
              PROCLAMA d.
              PROCLAMA brutum.
              PROCLAMA CONTENTUM(brutum + 8).
              PROCLAMA CONTENTUM(brutum + 64).
              REDDE 0.
          FIN-FUNCTIO.
          EOF
          ./compilator_vindex /tmp/acus.vindex /tmp/acus
          chmod +x /tmp/acus
          /tmp/acus | tee /tmp/out
          mapfile -t v < /tmp/out
          test "${v[2]}" = 0
          test "${v[3]}" = 77
          echo 'ACUS_NUMERUS_SCALA=8'
