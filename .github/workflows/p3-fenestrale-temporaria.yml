name: P3 — Descriptoris scripturae machinales

on:
  push:
    branches:
      - chatgpt/p3-fenestrale-uefi-purum

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: GDB institue
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gdb
      - name: G3 construe, sedem detege, scripturas observa
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/compilator_vindex.vindex')
          t=p.read_text(encoding='utf-8')
          a=t.index('FUNCTIO COMPONE_RESERVA_OCTETA REDDENS NUMERUS.')
          b=t.index('\nFUNCTIO COMPONE_RESERVA_OCTETA_DYNAMICA REDDENS NUMERUS.',a)
          n='''FUNCTIO COMPONE_RESERVA_OCTETA REDDENS NUMERUS.
              ACCIPIT codex SICUT ACUS<NUMERUS>.
              ACCIPIT pos SICUT NUMERUS.
              DECLARA p_mem SICUT NUMERUS VALENS pos.
              p_mem = COMPONE_TRANSCRIBE(codex, p_mem, 6, 0).
              p_mem = COMPONE_ONERA(codex, p_mem, 1, 33554432).
              p_mem = COMPONE_SUME_INDIRECTUM(codex, p_mem, 0, 1).
              p_mem = COMPONE_SERVA_INDIRECTUM(codex, p_mem, 0, 6).
              p_mem = COMPONE_TRANSCRIBE(codex, p_mem, 3, 0).
              p_mem = COMPONE_ONERA(codex, p_mem, 2, 8).
              p_mem = COMPONE_ADD(codex, p_mem, 0, 2).
              p_mem = COMPONE_IMPONE(codex, p_mem, 0).
              p_mem = COMPONE_TRANSCRIBE(codex, p_mem, 0, 3).
              p_mem = COMPONE_ONERA(codex, p_mem, 2, 8).
              p_mem = COMPONE_ADD(codex, p_mem, 0, 2).
              p_mem = COMPONE_ADD(codex, p_mem, 0, 6).
              p_mem = COMPONE_VERIFICA_TAS(codex, p_mem).
              p_mem = COMPONE_ONERA(codex, p_mem, 1, 33554432).
              p_mem = COMPONE_SERVA_INDIRECTUM(codex, p_mem, 1, 0).
              p_mem = COMPONE_AUFER(codex, p_mem, 0).
              REDDE p_mem.
          FIN-FUNCTIO.
          '''
          p.write_text(t[:a]+n+t[b:],encoding='utf-8')
          PY
          ./compilator_vindex src/compilator_vindex.vindex /tmp/g2
          chmod +x /tmp/g2
          /tmp/g2 src/compilator_vindex.vindex /tmp/g3
          chmod +x /tmp/g3
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true

          /tmp/g3 src/compilator_vindex.vindex /tmp/g4probe &
          pid=$!
          sleep 0.35
          gdb -q -batch -ex "attach $pid" -ex 'printf "DESC %lld\n", $rdi' -ex detach > /tmp/desc.txt 2>&1 || true
          cat /tmp/desc.txt
          desc=$(grep '^DESC ' /tmp/desc.txt | awk '{print $2}')
          test -n "$desc"
          kill -9 "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          c0=$desc
          c1=$((desc+8))
          c2=$((desc+16))
          printf 'WATCH descriptor=0x%x fields=0x%x,0x%x,0x%x\n' "$desc" "$c0" "$c1" "$c2"

          cat >/tmp/watch.gdb <<GDB
          set pagination off
          set confirm off
          set args src/compilator_vindex.vindex /tmp/g4watch
          starti
          watch *(long long*)$c0
          commands 1
            silent
            printf "W0 rip=0x%llx value=%lld\\n", \$rip, *(long long*)$c0
            x/8i \$rip-12
            continue
          end
          watch *(long long*)$c1
          commands 2
            silent
            printf "W1 rip=0x%llx value=%lld\\n", \$rip, *(long long*)$c1
            x/8i \$rip-12
            continue
          end
          watch *(long long*)$c2
          commands 3
            silent
            printf "W2 rip=0x%llx value=%lld\\n", \$rip, *(long long*)$c2
            x/8i \$rip-12
            continue
          end
          continue
          GDB
          timeout 8s gdb -q -batch -x /tmp/watch.gdb /tmp/g3 || true
