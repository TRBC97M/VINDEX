name: P3 — Allocator G3 debug temporarius

on:
  push:
    branches:
      - chatgpt/p3-fenestrale-uefi-purum

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v5
      - name: GDB institue
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gdb binutils
      - name: G3 construe et congelatum inspice
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/compilator_vindex.vindex')
          t=p.read_text(encoding='utf-8')
          a=t.index('FUNCTIO COMPONE_RESERVA_OCTETA REDDENS NUMERUS.')
          b=t.index('\nFUNCTIO COMPONE_RESERVA_OCTETA_DYNAMICA REDDENS NUMERUS.',a)
          n='''FUNCTIO COMPONE_RESERVA_OCTETA REDDENS NUMERUS.
              ACCIPIT codex SICUT ACUS<NUMERUS>.
              ACCIPIT pos SICUT NUMERUS.
              DECLARA p_mem SICUT NUMERUS VALENS pos.
              p_mem = COMPONE_TRANSCRIBE(codex, p_mem, 6, 0).
              p_mem = COMPONE_ONERA(codex, p_mem, 1, 33554432).
              p_mem = COMPONE_SUME_INDIRECTUM(codex, p_mem, 0, 1).
              p_mem = COMPONE_SERVA_INDIRECTUM(codex, p_mem, 0, 6).
              p_mem = COMPONE_TRANSCRIBE(codex, p_mem, 3, 0).
              p_mem = COMPONE_ONERA(codex, p_mem, 2, 8).
              p_mem = COMPONE_ADD(codex, p_mem, 0, 2).
              p_mem = COMPONE_IMPONE(codex, p_mem, 0).
              p_mem = COMPONE_TRANSCRIBE(codex, p_mem, 0, 3).
              p_mem = COMPONE_ONERA(codex, p_mem, 2, 8).
              p_mem = COMPONE_ADD(codex, p_mem, 0, 2).
              p_mem = COMPONE_ADD(codex, p_mem, 0, 6).
              p_mem = COMPONE_VERIFICA_TAS(codex, p_mem).
              p_mem = COMPONE_ONERA(codex, p_mem, 1, 33554432).
              p_mem = COMPONE_SERVA_INDIRECTUM(codex, p_mem, 1, 0).
              p_mem = COMPONE_AUFER(codex, p_mem, 0).
              REDDE p_mem.
          FIN-FUNCTIO.
          '''
          p.write_text(t[:a]+n+t[b:],encoding='utf-8')
          PY
          ./compilator_vindex src/compilator_vindex.vindex /tmp/g2
          chmod +x /tmp/g2
          /tmp/g2 src/compilator_vindex.vindex /tmp/g3
          chmod +x /tmp/g3
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true
          /tmp/g3 src/compilator_vindex.vindex /tmp/g4 &
          pid=$!
          echo "PID=$pid"
          sleep 1
          ps -o pid,stat,etime,time,rss,vsz,pcpu,comm -p "$pid" || true
          echo '=== MAPPA ==='
          cat "/proc/$pid/maps" | head -n 40 || true
          echo '=== STATUS ==='
          grep -E 'State|VmRSS|VmSize|voluntary|nonvoluntary' "/proc/$pid/status" || true
          echo '=== GDB ==='
          gdb -q -batch \
            -ex "attach $pid" \
            -ex 'set pagination off' \
            -ex 'x/8gx 0x02000000' \
            -ex 'info registers rip rax rbx rcx rdx rsi rdi r8 r9 r10 r11 r12 rsp rbp' \
            -ex 'x/24i $rip-32' \
            -ex 'x/24gx $rsp' \
            -ex 'bt' \
            -ex 'detach' || true
          echo '=== OBJDUMP circa RIP (textus totus grep postea) ==='
          objdump -d -Mintel /tmp/g3 > /tmp/g3.asm
          wc -l /tmp/g3.asm
          kill -9 "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
