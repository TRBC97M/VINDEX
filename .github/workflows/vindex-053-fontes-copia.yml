# Diagnostica unica copiae finalis fontium.
name: VINDEX 0.53 — Diagnostica copiae

on:
  push:
    branches: [chatgpt/vindex-053-compilator-dynamicus]
    paths:
      - '.github/workflows/vindex-053-fontes-copia.yml'

permissions:
  contents: write

jobs:
  diagnostica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/vindex-053-compilator-dynamicus
          fetch-depth: 0
      - shell: bash
        run: |
          set +e
          RADIX='Vindex Chat-GPT/vindex_final_v51'; R=/tmp/r; : >"$R"
          chmod 755 "$RADIX/compilator_vindex"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'); t=p.read_text(encoding='utf-8')
          Path('/tmp/pontis.vindex').write_text(t.replace('213001','524289').replace('213000','524288').replace('212999','524287'),encoding='utf-8')
          PY
          "$RADIX/compilator_vindex" /tmp/pontis.vindex /tmp/pontis >>"$R" 2>&1; chmod 755 /tmp/pontis
          python3 "$RADIX/instrumenta/applica_fontes_dynamicos_053.py" >>"$R" 2>&1
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'); t=p.read_text(encoding='utf-8')
          old='''    basis_fons = basis_finalis.\n    DECLARA m2_imp SICUT NUMERUS VALENS 0.\n    DUM m2_imp < n PERFICE\n        SCRIBE_OCTETUM_AB(basis_fons + pos_out_imp, OCTETUS_AB(basis_fons_brut + m2_imp)).\n        pos_out_imp = pos_out_imp + 1.\n        m2_imp = m2_imp + 1.\n    FIN-DUM.\n'''
          new='''    basis_fons = basis_finalis.\n    PROCLAMA 9300.\n    PROCLAMA basis_fons_brut.\n    PROCLAMA basis_fons.\n    PROCLAMA n.\n    PROCLAMA capacitas_fons.\n    DECLARA m2_imp SICUT NUMERUS VALENS 0.\n    DUM m2_imp < n PERFICE\n        SI m2_imp == 0 || m2_imp == 65535 || m2_imp == 65536 || m2_imp == 131071 || m2_imp == 131072 || m2_imp == 196607 || m2_imp == 196608 TUNC\n            PROCLAMA 9301.\n            PROCLAMA m2_imp.\n            PROCLAMA basis_fons_brut + m2_imp.\n            PROCLAMA basis_fons + pos_out_imp.\n        FIN-SI.\n        SCRIBE_OCTETUM_AB(basis_fons + pos_out_imp, OCTETUS_AB(basis_fons_brut + m2_imp)).\n        pos_out_imp = pos_out_imp + 1.\n        m2_imp = m2_imp + 1.\n    FIN-DUM.\n    PROCLAMA 9302.\n'''
          if old not in t: raise SystemExit('ancora copiae deest')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          /tmp/pontis "$RADIX/src/compilator_vindex.vindex" /tmp/g1 >>"$R" 2>&1; C=$?; printf 'G1 C=%s.\n' "$C" >>"$R"; chmod 755 /tmp/g1 2>/dev/null
          printf '%s\n' '--- EXECUTIO ---' >>"$R"
          /tmp/g1 "$RADIX/src/compilator_vindex.vindex" /tmp/g2 >>"$R" 2>&1; E=$?; printf 'G1 E=%s.\n' "$E" >>"$R"
          printf '%s\n' '--- STRACE ET EXITUS ---' >>"$R"
          strace -f -o /tmp/s /tmp/g1 "$RADIX/src/compilator_vindex.vindex" /tmp/g2s >/tmp/out 2>&1; ES=$?
          cat /tmp/out >>"$R"; printf 'STRACE STATUS=%s.\n' "$ES" >>"$R"; grep -E 'mmap\(|SIGBUS|SIGSEGV' /tmp/s | tail -n 30 >>"$R"
          cd "$GITHUB_WORKSPACE"; F="$RADIX/instrumenta/RELATIO-COPIA-FONTIUM-053.md"; { printf '%s\n\n' '# VINDEX 0.53 — Diagnostica copiae fontium'; printf '%s\n' '```text'; cat "$R"; printf '%s\n' '```'; } >"$F"
          git config user.name 'VINDEX Centurio'; git config user.email 'actions@users.noreply.github.com'; git add "$F"; if ! git diff --cached --quiet; then git commit -m 'VINDEX 0.53: copiam fontium diagnostica'; git push origin HEAD:chatgpt/vindex-053-compilator-dynamicus; fi
          exit 0
