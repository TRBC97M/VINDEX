name: VINDEX — ATMOS NATIVUM GUI

on:
  pull_request:
    paths:
      - 'PROGRAMMATA/ATMOS_TERMINAL_DEPTH/NATIVUM/**'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/**'
      - 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
      - '.github/workflows/vindex-atmos-nativum-gui.yml'

jobs:
  genera-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ATMOS et minimum GUI ex VINDEX compila
        working-directory: PROGRAMMATA/ATMOS_TERMINAL_DEPTH/NATIVUM
        shell: bash
        run: |
          set -euo pipefail
          COMP='../../../Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
          chmod +x "$COMP"
          "$COMP" ludus.vindex /tmp/ATMOS_NATIVUM.exe gui
          cat > /tmp/gui_min.vindex <<'EOF'
          FUNCTIO PRINCIPALIS REDDENS NUMERUS.
              ACCIPIT argc SICUT NUMERUS.
              ACCIPIT argv SICUT ACUS<NUMERUS>.
              REDDE 0.
          FIN-FUNCTIO.
          EOF
          "$COMP" /tmp/gui_min.vindex /tmp/GUI_MIN.exe gui
          "$COMP" /tmp/gui_min.vindex /tmp/CONSOLE_MIN.exe pe

          for exe in /tmp/ATMOS_NATIVUM.exe /tmp/GUI_MIN.exe; do
            file "$exe"
            objdump -p "$exe" > /tmp/gui-pe.txt
            grep -E 'Subsystem.*Windows GUI' /tmp/gui-pe.txt
            if grep -Eiq 'DLL Name:.*(msvcrt|ucrtbase|vcruntime|mscoree|libstdc\+\+|libgcc|python|node)' /tmp/gui-pe.txt; then
              echo 'ERRATUM: runtime alienum in GUI repertum est.'
              exit 1
            fi
          done
          objdump -p /tmp/CONSOLE_MIN.exe | grep -E 'Subsystem.*Windows CUI'
          echo 'RECTE: GUI=2 et console=3 distincta manent; bina GUI sine CRT generata sunt.'

      - uses: actions/upload-artifact@v4
        with:
          name: atmos-nativum-gui-purum-vindex
          path: |
            /tmp/ATMOS_NATIVUM.exe
            /tmp/GUI_MIN.exe
          if-no-files-found: error
          retention-days: 14

  windows-gui:
    needs: genera-gui
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atmos-nativum-gui-purum-vindex
          path: atmos

      - name: Bootstrap GUI minimum et ExitProcess exerce
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location (Resolve-Path '.\atmos')
          $m = Start-Process -FilePath '.\GUI_MIN.exe' -Wait -PassThru
          if ($m.ExitCode -ne 0) { throw "GUI minimum exitus $($m.ExitCode)" }
          Write-Host 'RECTE: bootstrap VINDEX Windows GUI minimum per ExitProcess(0) terminat.'

      - name: ATMOS GUI sine consola exerce
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location (Resolve-Path '.\atmos')
          $p = Start-Process -FilePath '.\ATMOS_NATIVUM.exe' -ArgumentList 'smoke','quiet' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "ATMOS GUI exitus $($p.ExitCode)" }
          Write-Host 'RECTE: ATMOS NATIVUM GUI sub Windows sine processu console probatum est.'
