name: Sylvia OS — Fenestrale II Gradus K

on:
  pull_request:
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/systema/fenestrale_ii_compositor_k_abi.h'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/uefi/fenestrale_native_k.c'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/uefi/construe_fenestrale_native_k.sh'
      - 'Vindex Chat-GPT/vindex_final_v51/src/programmata_fenestrale_ii_k_runtime.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/src/tabula_fenestrale_ii_k_runtime.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/proba_fenestrale_ii_k.py'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/proba_fenestrale_ii_k_runtime.c'
      - 'documenta/sylvia/FENESTRALE_II_GRADUS_K.md'
      - '.github/workflows/sylvia-fenestrale-gradus-k.yml'
  push:
    branches: [main]
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/systema/fenestrale_ii_compositor_k_abi.h'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/uefi/fenestrale_native_k.c'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/uefi/construe_fenestrale_native_k.sh'
      - 'Vindex Chat-GPT/vindex_final_v51/src/programmata_fenestrale_ii_k_runtime.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/src/tabula_fenestrale_ii_k_runtime.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/proba_fenestrale_ii_k.py'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/proba_fenestrale_ii_k_runtime.c'
      - 'documenta/sylvia/FENESTRALE_II_GRADUS_K.md'
      - '.github/workflows/sylvia-fenestrale-gradus-k.yml'

jobs:
  constructio:
    name: Resize et eventa clientium construuntur
    runs-on: ubuntu-latest
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v4
      - name: Regressiones D–J verifica
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          python3 tests/proba_fenestrale_ii_abi_d.py
          python3 tests/proba_fenestrale_ii_compositor_g.py
          python3 tests/proba_fenestrale_ii_h.py
          python3 tests/proba_fenestrale_ii_i.py
          python3 tests/proba_fenestrale_ii_j.py
      - name: Probationes generales exsequere
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: ./tests/run_tests.sh
      - name: Gradum K verifica
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: python3 tests/proba_fenestrale_ii_k.py
      - name: Clientes K exsequere
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          python3 instrumenta/vindex_verifica.py src/programmata_fenestrale_ii_k_runtime.vindex
          python3 instrumenta/vindex_verifica.py src/tabula_fenestrale_ii_k_runtime.vindex
          ./compilator_vindex src/programmata_fenestrale_ii_k_runtime.vindex /tmp/programmata_k.elf
          ./compilator_vindex src/tabula_fenestrale_ii_k_runtime.vindex /tmp/tabula_k.elf
          gcc -std=c11 -O2 -Wall -Wextra -Werror -I systema \
            tests/proba_fenestrale_ii_k_runtime.c -o /tmp/proba_fenestrale_k_runtime
          /tmp/proba_fenestrale_k_runtime /tmp/programmata_k.elf /tmp/tabula_k.elf
      - name: Compositorium K construe
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          bash systema/uefi/construe_fenestrale_native_k.sh \
            /tmp/FENESTRALEK.EFI \
            /tmp/fenestrale_k_uefi.img
      - name: Exitus verifica
        run: |
          file /tmp/FENESTRALEK.EFI
          objdump -p /tmp/FENESTRALEK.EFI | grep 'Subsystem.*EFI application'
          test -s /tmp/fenestrale_k_uefi.img
          test "$(stat -c %s /tmp/fenestrale_k_uefi.img)" -ge 67108864
