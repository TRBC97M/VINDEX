name: VINDEX — Canonizatio MITTE LITTERA

on:
  pull_request:
    paths:
      - 'instrumenta/applica_mitte_littera_patch.py'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/proba_mitte_littera.vindex'
      - '.github/workflows/vindex-mitte-littera-canoniza.yml'

permissions:
  contents: write

jobs:
  canoniza:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ramum ipsum accipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Correctio MITTE LITTERA applica
        shell: bash
        run: |
          set -euo pipefail
          python3 instrumenta/applica_mitte_littera_patch.py

      - name: Compilatorem ad punctum fixum regenera
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          chmod +x compilator_vindex
          ./compilator_vindex src/compilator_vindex.vindex /tmp/g2
          chmod +x /tmp/g2
          /tmp/g2 src/compilator_vindex.vindex /tmp/g3
          chmod +x /tmp/g3
          /tmp/g3 src/compilator_vindex.vindex /tmp/g4
          chmod +x /tmp/g4
          cmp /tmp/g3 /tmp/g4
          cp /tmp/g4 compilator_vindex
          chmod +x compilator_vindex
          ./compilator_vindex src/compilator_vindex.vindex /tmp/g5
          cmp compilator_vindex /tmp/g5
          echo 'RECTE: G3 = G4 = G5 post correctionem MITTE.'

      - name: Regressionem MITTE LITTERA proba
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex tests/proba_mitte_littera.vindex /tmp/proba_mitte_littera
          chmod +x /tmp/proba_mitte_littera
          cd /tmp
          output="$(./proba_mitte_littera)"
          printf '%s\n' "$output"
          case "$output" in
            ATD1*'RECTE: MITTE LITTERA'*) ;;
            *) echo 'ERRATUM: stdout MITTE/LITTERA' >&2; exit 31 ;;
          esac
          python3 -c "from pathlib import Path; b=Path('/tmp/proba_mitte_littera.bin').read_bytes(); assert b == bytes([65,84,68,49,1]), b; print('RECTE: fasciculus MITTE LITTERA exactus est.')"

      - name: Mutationem canonicam in ramum repone
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex' \
                  'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
          if git diff --cached --quiet; then
            echo 'RECTE: nihil novum commitendum est.'
            exit 0
          fi
          git commit -m 'P9: MITTE stride LITTERA canoniza'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
