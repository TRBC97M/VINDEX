name: Sylvia OS — Effectus Productionis X

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_graphica_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_effectus_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_effectus_productio_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_compositor_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/effectus_productio_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/showroom_effectus_productio_x*.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/proba_showroom_effectus_productio_x*'
      - 'documenta/sylvia/JL_UX_FUNDAMENTUM_GRAPHICUM_MODERNUM.md'
      - '.github/workflows/sylvia-effectus-productio-x.yml'
  push:
    branches:
      - main
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_effectus_productio_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/effectus_productio_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/showroom_effectus_productio_x*.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/proba_showroom_effectus_productio_x*'
      - 'documenta/sylvia/JL_UX_FUNDAMENTUM_GRAPHICUM_MODERNUM.md'
      - '.github/workflows/sylvia-effectus-productio-x.yml'

permissions:
  contents: read

jobs:
  effectus-productio-x:
    name: Cache, backdrop, masca, clip et gloss certificantur
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v5

      - name: QEMU et OVMF institue
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf file

      - name: Compilatorem et instrumenta para
        shell: bash
        run: |
          chmod +x 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
          chmod +x 'Vindex Chat-GPT/vindex_final_v51/instrumenta/proba_showroom_effectus_productio_x_uefi.sh'

      - name: Puritatem Sylviae verifica
        shell: bash
        run: |
          set -euo pipefail
          python3 instrumenta/verifica_puritatem_sylviae.py

      - name: Fundamentum XII-A iterum exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex probationes/fundamentum_graphicum_x.vindex /tmp/graphica-x-a
          chmod +x /tmp/graphica-x-a
          timeout 25s /tmp/graphica-x-a

      - name: Scenam XII-B iterum exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex probationes/scena_compositoris_x.vindex /tmp/compositor-x-b
          chmod +x /tmp/compositor-x-b
          timeout 25s /tmp/compositor-x-b

      - name: Effectus productionis native VINDEX exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex probationes/effectus_productio_x.vindex /tmp/effectus-productio-x-test
          file /tmp/effectus-productio-x-test | grep -q 'ELF 64-bit'
          chmod +x /tmp/effectus-productio-x-test
          timeout 30s /tmp/effectus-productio-x-test
          printf '%s\n' 'RECTE: cache, backdrop, masca, clip, gloss et blur adaptivus probata sunt.'

      - name: Regressionem canonicam VINDEX exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          bash tests/run_tests.sh

      - name: Showroom Effectuum Productionis sub QEMU et OVMF
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        env:
          MORA_INITII: '20'
          SERVA_CAPTURAS: '${{ github.workspace }}/qemu-effectus-productio-x'
        run: |
          set -euo pipefail
          bash ./instrumenta/proba_showroom_effectus_productio_x_uefi.sh

      - name: Capturam conserva
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-effectus-productio-x-${{ github.sha }}
          path: |
            qemu-effectus-productio-x/*.ppm
            qemu-effectus-productio-x/*.log
          if-no-files-found: warn
          retention-days: 7
