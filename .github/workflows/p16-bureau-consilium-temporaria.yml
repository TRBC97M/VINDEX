name: P16-III — CONSILIUM temporarium

on:
  push:
    branches:
      - chatgpt/p16-bureau-iii

permissions:
  contents: write

jobs:
  reconcilia:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: CONSILIUM reconcilia
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/p16_bureau_consilium.py
          git diff --check
          git add CONSILIUM.md
          git diff --cached --quiet && { printf '%s\n' 'RECTE: nihil mutandum.'; exit 0; }
          git config user.name 'TRBC97M'
          git config user.email 'trbc97m@protonmail.com'
          git commit -m 'P16-III: CONSILIUM ad bureau functionale reconcilia [skip ci]'
          git push origin HEAD:chatgpt/p16-bureau-iii
