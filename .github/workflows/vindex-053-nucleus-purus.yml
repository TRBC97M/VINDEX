# Custodia externa nuclei VINDEX purificati.
name: VINDEX 0.53 — Nucleus purus

on:
  push:
    branches:
      - infrastructura/vindex-053-ci-diagnostica-loci
  pull_request:
    branches:
      - infrastructura/vindex-053-ci-diagnostica-loci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nucleus:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Nucleum purum accipe
        uses: actions/checkout@v5
        with:
          ref: chatgpt/vindex-053-diagnostica-loci

      - name: Compilatorem para
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 ./compilator_vindex

      - name: Comparatorem VINDEX construe
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex tests/compara_fasciculos_053.vindex "$RUNNER_TEMP/compara_fasciculos"
          chmod 755 "$RUNNER_TEMP/compara_fasciculos"

      - name: Punctum fixum native comproba
        shell: bash
        run: |
          set -euo pipefail
          F='src/compilator_vindex.vindex'
          ./compilator_vindex "$F" "$RUNNER_TEMP/gen1"
          chmod 755 "$RUNNER_TEMP/gen1"
          "$RUNNER_TEMP/gen1" "$F" "$RUNNER_TEMP/gen2"
          chmod 755 "$RUNNER_TEMP/gen2"
          "$RUNNER_TEMP/gen2" "$F" "$RUNNER_TEMP/gen3"
          chmod 755 "$RUNNER_TEMP/gen3"
          "$RUNNER_TEMP/compara_fasciculos" "$RUNNER_TEMP/gen2" "$RUNNER_TEMP/gen3"
          "$RUNNER_TEMP/compara_fasciculos" ./compilator_vindex "$RUNNER_TEMP/gen2"
          sha256sum "$RUNNER_TEMP/gen2"
          printf '%s\n' 'RECTE: compilator VINDEX sine Python punctum fixum servat.'

      - name: Casus semanticos native exsequere
        shell: bash
        run: |
          set -euo pipefail
          C='./compilator_vindex'

          proba() {
            nomen="$1"; fons="$2"; exspectatum="$3"; shift 3
            exe="$RUNNER_TEMP/$nomen"
            "$C" "tests/casus/$fons" "$exe"
            chmod 755 "$exe"
            productum="$($exe "$@")"
            status=$?
            test "$status" -eq 0
            if [ "$productum" != "$exspectatum" ]; then
              printf 'ERRATUM %s: [%s] != [%s]\n' "$nomen" "$productum" "$exspectatum" >&2
              exit 1
            fi
            printf 'RECTE  %s\n' "$nomen"
          }

          proba salve salve.vindex 'Salve, VINDEX!'
          proba calculus calculus.vindex "$(printf '42\n1\n2\n3\n-42\n2')"
          proba fluitans fluitans.vindex "$(printf '4.640000\n1')"
          proba importa importa.vindex '49'
          proba structura-acus structura_acus.vindex "$(printf '150\n99')"
          proba recursio recursio.vindex '720'
          proba argumenta argumenta.vindex "$(printf '2\n90')" Zeta
          proba argumenta-septem argumenta_septem.vindex '28'
          proba ordo-partem ordo_partem.vindex "$(printf '83\n65\n76\n86\n69')"
          proba vocationes-nullae vocationes_nullae.vindex '7168'
          proba desine-imbrique desine_imbrique.vindex '48'
          proba lectio-contextus lectio_contextus.vindex '66'

      - name: Diagnostica nativa comproba
        shell: bash
        run: |
          set -euo pipefail
          C='./compilator_vindex'

          reice() {
            nomen="$1"; fons="$2"; status_exspectatus="$3"; via="$4"; linea="$5"; columna="$6"; nuntius="$7"
            exe="$RUNNER_TEMP/$nomen"
            log="$RUNNER_TEMP/$nomen.log"
            set +e
            "$C" "tests/casus/$fons" "$exe" >"$log" 2>&1
            status=$?
            set -e
            test "$status" -eq "$status_exspectatus"
            test ! -e "$exe"
            productum="$(cat "$log")"
            exspectatum="$(printf 'DIAGNOSTICUM VINDEX\nFONS\n%s\nLINEA\n%s\nCOLUMNA\n%s\nNUNTIUS\n%s' "$via" "$linea" "$columna" "$nuntius")"
            test "$productum" = "$exspectatum"
            printf 'RECTE  %s\n' "$nomen"
          }

          reice nativum-instructio erratum_instructio.vindex 65 tests/casus/erratum_instructio.vindex 2 5 'ERRATUM: instructio ignota est'
          reice nativum-functio erratum_functio.vindex 65 tests/casus/erratum_functio.vindex 2 11 'ERRATUM: functio vocata non inventa est'
          reice nativum-principalis erratum_principalis.vindex 65 tests/casus/erratum_principalis.vindex 1 1 'ERRATUM: FUNCTIO PRINCIPALIS deest'
          reice nativum-importa erratum_importa.vindex 66 tests/casus/erratum_importa.vindex 1 1 'ERRATUM: fons importatus aperiri non potest'
          reice nativum-importatum erratum_importatum.vindex 65 tests/casus/erratum_bibliotheca.vindex 2 11 'ERRATUM: functio vocata non inventa est'

      - name: CRLF native comproba
        shell: bash
        run: |
          set -euo pipefail
          F='src/compilator_vindex.vindex'
          sed 's/$/\r/' "$F" > "$RUNNER_TEMP/compilator_crlf.vindex"
          ./compilator_vindex "$RUNNER_TEMP/compilator_crlf.vindex" "$RUNNER_TEMP/compilator_crlf"
          chmod 755 "$RUNNER_TEMP/compilator_crlf"
          printf '%s\n' 'RECTE: CRLF sine Python compilatur.'
