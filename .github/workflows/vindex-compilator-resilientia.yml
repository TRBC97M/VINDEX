name: VINDEX — Resilientia Compilatoris

on:
  pull_request:
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/casus/identificatores_longi.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/casus/forma_commentum_non_falsum.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/casus/functiones_lxx.vindex'
      - '.github/workflows/vindex-compilator-resilientia.yml'

jobs:
  elf-et-pe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Tres regressiones sub ELF exerce et PE genera
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          chmod +x compilator_vindex

          ./compilator_vindex tests/casus/identificatores_longi.vindex /tmp/identificatores_longi
          chmod +x /tmp/identificatores_longi
          /tmp/identificatores_longi | tee /tmp/identificatores.log
          grep -F 'IDENTIFICATORES LONGI RECTE' /tmp/identificatores.log

          ./compilator_vindex tests/casus/forma_commentum_non_falsum.vindex /tmp/forma_commentum
          chmod +x /tmp/forma_commentum
          /tmp/forma_commentum | tee /tmp/forma.log
          grep -F 'FORMA COMMENTUM RECTE' /tmp/forma.log

          ./compilator_vindex tests/casus/functiones_lxx.vindex /tmp/functiones_lxx
          chmod +x /tmp/functiones_lxx
          /tmp/functiones_lxx | tee /tmp/functiones.log
          grep -F 'FUNCTIONES LXX RECTE' /tmp/functiones.log
          grep -qx '196' /tmp/functiones.log

          ./compilator_vindex tests/casus/identificatores_longi.vindex /tmp/identificatores_longi.exe pe
          ./compilator_vindex tests/casus/forma_commentum_non_falsum.vindex /tmp/forma_commentum.exe pe
          ./compilator_vindex tests/casus/functiones_lxx.vindex /tmp/functiones_lxx.exe pe
          file /tmp/identificatores_longi.exe /tmp/forma_commentum.exe /tmp/functiones_lxx.exe

      - uses: actions/upload-artifact@v4
        with:
          name: resilientia-compilatoris-pe
          path: |
            /tmp/identificatores_longi.exe
            /tmp/forma_commentum.exe
            /tmp/functiones_lxx.exe
          if-no-files-found: error
          retention-days: 1

  windows:
    needs: elf-et-pe
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: resilientia-compilatoris-pe
          path: proba
      - name: Tres regressiones sub Windows vero exerce
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Proba([string]$via, [string]$signum) {
            $out = & (Resolve-Path $via) 2>&1
            $code = $LASTEXITCODE
            $text = ($out -join "`n")
            Write-Host $text
            if ($code -ne 0) { throw "$via exitus $code" }
            if ($text -notmatch [regex]::Escape($signum)) { throw "$signum deest" }
          }

          Proba '.\proba\identificatores_longi.exe' 'IDENTIFICATORES LONGI RECTE'
          Proba '.\proba\forma_commentum.exe' 'FORMA COMMENTUM RECTE'
          Proba '.\proba\functiones_lxx.exe' 'FUNCTIONES LXX RECTE'
