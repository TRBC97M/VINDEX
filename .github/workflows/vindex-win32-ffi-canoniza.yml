name: VINDEX — Canonizatio FFI Win64

on:
  pull_request:
    paths:
      - 'instrumenta/applica_win32_ffi_patch.py'
      - 'instrumenta/corrige_win32_ffi_textus.py'
      - 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/proba_pe_structuram_053.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/proba_win32_ffi.vindex'
      - '.github/workflows/vindex-win32-ffi-canoniza.yml'

permissions:
  contents: write

jobs:
  canoniza:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ramum ipsum accipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: FFI Win64 applica
        shell: bash
        run: |
          set -euo pipefail
          python3 instrumenta/applica_win32_ffi_patch.py
          python3 instrumenta/corrige_win32_ffi_textus.py

      - name: Compilatorem ad punctum fixum regenera
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          chmod +x compilator_vindex
          ./compilator_vindex src/compilator_vindex.vindex /tmp/g2
          chmod +x /tmp/g2
          /tmp/g2 src/compilator_vindex.vindex /tmp/g3
          chmod +x /tmp/g3
          /tmp/g3 src/compilator_vindex.vindex /tmp/g4
          chmod +x /tmp/g4
          cmp /tmp/g3 /tmp/g4
          cp /tmp/g4 compilator_vindex
          chmod +x compilator_vindex
          ./compilator_vindex src/compilator_vindex.vindex /tmp/g5
          cmp compilator_vindex /tmp/g5
          echo 'RECTE: G3 = G4 = G5 post FFI Win64.'

      - name: PE FFI structuram proba
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex tests/proba_win32_ffi.vindex /tmp/proba_win32_ffi.exe pe
          ./compilator_vindex tests/proba_pe_structuram_053.vindex /tmp/proba_pe_structuram
          chmod +x /tmp/proba_pe_structuram
          /tmp/proba_pe_structuram /tmp/proba_win32_ffi.exe

      - name: Mutationem canonicam repone
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex' \
                  'Vindex Chat-GPT/vindex_final_v51/compilator_vindex' \
                  'Vindex Chat-GPT/vindex_final_v51/tests/proba_pe_structuram_053.vindex'
          if git diff --cached --quiet; then
            echo 'RECTE: nihil novum commitendum est.'
            exit 0
          fi
          git commit -m 'P11-C: FFI Win64 canoniza'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
