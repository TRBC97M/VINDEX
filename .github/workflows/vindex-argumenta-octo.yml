name: VINDEX — Argumenta VIII

on:
  pull_request:
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/tests/casus/argumenta_octo.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
      - '.github/workflows/vindex-argumenta-octo.yml'

jobs:
  elf-et-pe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: VIII argumenta sub ELF proba et PE genera
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          chmod +x compilator_vindex
          ./compilator_vindex tests/casus/argumenta_octo.vindex /tmp/proba_octo
          chmod +x /tmp/proba_octo
          /tmp/proba_octo | tee /tmp/octo.log
          grep -F 'ARGUMENTA OCTO RECTE' /tmp/octo.log
          ./compilator_vindex tests/casus/argumenta_octo.vindex /tmp/proba_octo.exe pe
          file /tmp/proba_octo.exe
      - uses: actions/upload-artifact@v4
        with:
          name: proba-argumenta-octo
          path: /tmp/proba_octo.exe
          if-no-files-found: error
          retention-days: 1

  windows:
    needs: elf-et-pe
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: proba-argumenta-octo
          path: proba
      - name: VIII argumenta sub Windows vero proba
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path '.\proba\proba_octo.exe').Path
          $out = & $exe 2>&1
          $code = $LASTEXITCODE
          $text = ($out -join "`n")
          Write-Host $text
          if ($code -ne 0) { throw "proba_octo exitus $code" }
          if ($text -notmatch 'ARGUMENTA OCTO RECTE') { throw 'confirmatio octo argumentorum deest' }
          $numeri = @($out | Where-Object { $_ -match '^\d+$' })
          if ($numeri.Count -lt 1 -or [int64]$numeri[-1] -ne 87654321) { throw 'valor positionalium falsus est' }
