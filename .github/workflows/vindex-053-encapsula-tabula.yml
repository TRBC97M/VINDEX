# Migratio semel currenda: accessus 227 et 2999 encapsulat, compilatorem
# reconstructum probat atque tantum post probationes rami artefacta canonica scribit.
name: VINDEX 0.53 — Encapsulatio tabulae

on:
  push:
    branches:
      - chatgpt/vindex-053-compilator-dynamicus
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/encapsula_reliquias_tabulae_053.py'
      - '.github/workflows/vindex-053-encapsula-tabula.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  encapsulatio:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5
        with:
          ref: chatgpt/vindex-053-compilator-dynamicus
          fetch-depth: 0

      - name: Dependencias graphicas para
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          if apt-cache show libgtk-3-0t64 >/dev/null 2>&1; then
            sudo apt-get install -y libgtk-3-0t64
          else
            sudo apt-get install -y libgtk-3-0
          fi

      - name: Encapsulationem applica et compilatorem reconstrue
        id: migratio
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          FONS="$RADIX/src/compilator_vindex.vindex"

          find "$RADIX" -type f -name '*.sh' -exec chmod 755 {} +
          chmod 755 \
            "$RADIX/vindexc" \
            "$RADIX/vindex-officina" \
            "$RADIX/vindex-salutatio" \
            "$RADIX/vindex-systema" \
            "$RADIX/compilator_vindex" \
            "$RADIX/vindex_graphica" \
            "$RADIX/officina_vindex" \
            "$RADIX/salutatio_vindex"

          python3 "$RADIX/instrumenta/encapsula_reliquias_tabulae_053.py"

          if git diff --quiet -- "$FONS"; then
            printf '%s\n' 'RECTE: nulla migratio nova necessaria est.'
            echo 'mutatum=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'mutatum=true' >> "$GITHUB_OUTPUT"
          timeout 30s bash "$RADIX/bootstrap/reconstruit.sh" /tmp/compilator_vindex_novus
          chmod 755 /tmp/compilator_vindex_novus
          cp /tmp/compilator_vindex_novus "$RADIX/compilator_vindex"
          chmod 755 "$RADIX/compilator_vindex"

      - name: Reliquias post encapsulationem metire
        if: steps.migratio.outputs.mutatum == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          python3 "$RADIX/instrumenta/inventaria_tabula_053.py" \
            --verifica "$RADIX/instrumenta/TABULA-LITTERALIA-053.txt"
          N227=$(grep -o 'tabula\[227\]' "$RADIX/src/compilator_vindex.vindex" | wc -l)
          N2999=$(grep -o 'tabula\[2999\]' "$RADIX/src/compilator_vindex.vindex" | wc -l)
          test "$N227" -eq 2
          test "$N2999" -eq 2
          printf 'RECTE: accessus directi 227=%s, 2999=%s.\n' "$N227" "$N2999"

      - name: XXIII regressiones exsequere
        if: steps.migratio.outputs.mutatum == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd 'Vindex Chat-GPT/vindex_final_v51'
          bash tests/run_tests.sh

      - name: CRLF et pilam magnam comproba
        if: steps.migratio.outputs.mutatum == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'

          python3 -c 'from pathlib import Path; import sys; f=Path(sys.argv[1]).read_bytes().replace(b"\r\n",b"\n").replace(b"\r",b"\n"); Path(sys.argv[2]).write_bytes(f.replace(b"\n",b"\r\n"))' \
            "$RADIX/src/compilator_vindex.vindex" /tmp/compilator_crlf.vindex
          timeout 10s "$RADIX/compilator_vindex" \
            /tmp/compilator_crlf.vindex /tmp/compilator_crlf

          python3 "$RADIX/instrumenta/genera_probationem_pilae_053.py" \
            /tmp/pila_magna_053.vindex
          timeout 15s "$RADIX/compilator_vindex" \
            /tmp/pila_magna_053.vindex /tmp/pila_magna_053
          chmod 755 /tmp/pila_magna_053
          EX=$(timeout 5s /tmp/pila_magna_053)
          test "$EX" = "$(printf '39\n777')"
          python3 "$RADIX/instrumenta/verifica_pilam_binariam_053.py" \
            /tmp/pila_magna_053

      - name: Mutationem canonicam committe
        if: steps.migratio.outputs.mutatum == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          git config user.name 'VINDEX Automatum'
          git config user.email 'actions@users.noreply.github.com'
          git add -- \
            "$RADIX/src/compilator_vindex.vindex" \
            "$RADIX/compilator_vindex"
          git commit -m 'VINDEX 0.53: reliquias 227 et 2999 encapsula'
          git push origin HEAD:chatgpt/vindex-053-compilator-dynamicus
