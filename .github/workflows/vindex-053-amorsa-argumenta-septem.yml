# Migratio semel currenda: amorsam Python ad septem argumenta System V extendit.
name: VINDEX 0.53 — Amorsa argumenta septem

on:
  push:
    branches:
      - chatgpt/vindex-053-compilator-dynamicus
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/corrige_amorsam_argumenta_septem_053.py'
      - '.github/workflows/vindex-053-amorsa-argumenta-septem.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  amorsa-septem:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5
        with:
          ref: chatgpt/vindex-053-compilator-dynamicus
          fetch-depth: 0

      - name: Amorsam corrige
        id: migratio
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          python3 "$RADIX/instrumenta/corrige_amorsam_argumenta_septem_053.py"
          if git diff --quiet -- "$RADIX/bootstrap/python/generateur.py"; then
            echo 'mutatum=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'mutatum=true' >> "$GITHUB_OUTPUT"

      - name: Septem argumenta ab amorsa proba
        if: steps.migratio.outputs.mutatum == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          python3 "$RADIX/bootstrap/python/compilateur_053.py" \
            "$RADIX/tests/casus/argumenta_septem.vindex" /tmp/amorsa_septem
          EX=$(timeout 5s /tmp/amorsa_septem)
          test "$EX" = '28'
          printf '%s\n' 'RECTE: amorsa septem argumenta 28 reddit.'

      - name: Compilatorem reconstructum compara
        if: steps.migratio.outputs.mutatum == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          find "$RADIX" -type f -name '*.sh' -exec chmod 755 {} +
          chmod 755 "$RADIX/compilator_vindex"
          timeout 30s bash "$RADIX/bootstrap/reconstruit.sh" /tmp/compilator_reconstructus
          chmod 755 /tmp/compilator_reconstructus
          cmp "$RADIX/compilator_vindex" /tmp/compilator_reconstructus
          printf '%s\n' 'RECTE: correctio amorsae punctum fixum non mutat.'

      - name: Mutationem committe
        if: steps.migratio.outputs.mutatum == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          git config user.name 'VINDEX Automatum'
          git config user.email 'actions@users.noreply.github.com'
          git add -- "$RADIX/bootstrap/python/generateur.py"
          git commit -m 'VINDEX 0.53: amorsam ad septem argumenta extende'
          git push origin HEAD:chatgpt/vindex-053-compilator-dynamicus
