# Migratio semel currenda: statum lectionis e tabula in contextum parseris transfert.
name: VINDEX 0.53 — Contextus lectionis

on:
  push:
    branches:
      - chatgpt/vindex-053-compilator-dynamicus
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/migra_lectionem_contextum_053.py'
      - '.github/workflows/vindex-053-migra-lectionem.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contextus-lectionis:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5
        with:
          ref: chatgpt/vindex-053-compilator-dynamicus
          fetch-depth: 0

      - name: Dependencias graphicas para
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          if apt-cache show libgtk-3-0t64 >/dev/null 2>&1; then
            sudo apt-get install -y libgtk-3-0t64
          else
            sudo apt-get install -y libgtk-3-0
          fi

      - name: Contextum lectionis migra et reconstrue
        id: migratio
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          FONS="$RADIX/src/compilator_vindex.vindex"
          BASIS="$RADIX/instrumenta/TABULA-LITTERALIA-053.txt"

          find "$RADIX" -type f -name '*.sh' -exec chmod 755 {} +
          chmod 755 \
            "$RADIX/vindexc" \
            "$RADIX/vindex-officina" \
            "$RADIX/vindex-salutatio" \
            "$RADIX/vindex-systema" \
            "$RADIX/compilator_vindex" \
            "$RADIX/vindex_graphica" \
            "$RADIX/officina_vindex" \
            "$RADIX/salutatio_vindex"

          python3 "$RADIX/instrumenta/migra_lectionem_contextum_053.py"
          if git diff --quiet -- "$FONS" "$BASIS"; then
            echo 'mutatum=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'mutatum=true' >> "$GITHUB_OUTPUT"

          ! grep -Fq 'tabula[227]' "$FONS"
          ! grep -Fq 'tabula[2999]' "$FONS"
          ! grep -Fq 'contextus_desine' "$FONS"
          grep -Fq 'STATUS_LECTIONIS_LEGE(contextus_parseris)' "$FONS"
          grep -Fq 'ACCIPIT contextus_parseris SICUT ACUS<NUMERUS>.' "$FONS"
          python3 "$RADIX/instrumenta/inventaria_tabula_053.py" --verifica "$BASIS"

          timeout 30s bash "$RADIX/bootstrap/reconstruit.sh" /tmp/compilator_vindex_novus
          chmod 755 /tmp/compilator_vindex_novus
          cp /tmp/compilator_vindex_novus "$RADIX/compilator_vindex"
          chmod 755 "$RADIX/compilator_vindex"

      - name: XXV regressiones exsequere
        if: steps.migratio.outputs.mutatum == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd 'Vindex Chat-GPT/vindex_final_v51'
          bash tests/run_tests.sh

      - name: Contextum lectionis directe comproba
        if: steps.migratio.outputs.mutatum == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          "$RADIX/compilator_vindex" "$RADIX/tests/casus/lectio_contextus.vindex" /tmp/lectio_contextus
          chmod 755 /tmp/lectio_contextus
          EX=$(cd "$RADIX" && timeout 5s /tmp/lectio_contextus)
          test "$EX" = '66'
          printf '%s\n' 'RECTE: LEGE et OCTETUS per contextum parseris transeunt.'

      - name: Amorsam septem argumentorum comproba
        if: steps.migratio.outputs.mutatum == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          python3 "$RADIX/bootstrap/python/compilateur_053.py" \
            "$RADIX/tests/casus/argumenta_septem.vindex" /tmp/amorsa_septem
          EX=$(timeout 5s /tmp/amorsa_septem)
          test "$EX" = '28'

      - name: CRLF et pilam magnam comproba
        if: steps.migratio.outputs.mutatum == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          python3 -c 'from pathlib import Path; import sys; f=Path(sys.argv[1]).read_bytes().replace(b"\r\n",b"\n").replace(b"\r",b"\n"); Path(sys.argv[2]).write_bytes(f.replace(b"\n",b"\r\n"))' \
            "$RADIX/src/compilator_vindex.vindex" /tmp/compilator_crlf.vindex
          timeout 10s "$RADIX/compilator_vindex" /tmp/compilator_crlf.vindex /tmp/compilator_crlf

          python3 "$RADIX/instrumenta/genera_probationem_pilae_053.py" /tmp/pila_magna_053.vindex
          timeout 15s "$RADIX/compilator_vindex" /tmp/pila_magna_053.vindex /tmp/pila_magna_053
          chmod 755 /tmp/pila_magna_053
          EX=$(timeout 5s /tmp/pila_magna_053)
          test "$EX" = "$(printf '39\n777')"
          python3 "$RADIX/instrumenta/verifica_pilam_binariam_053.py" /tmp/pila_magna_053

      - name: Mutationem canonicam committe
        if: steps.migratio.outputs.mutatum == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          git config user.name 'VINDEX Automatum'
          git config user.email 'actions@users.noreply.github.com'
          git add -- \
            "$RADIX/src/compilator_vindex.vindex" \
            "$RADIX/compilator_vindex" \
            "$RADIX/instrumenta/TABULA-LITTERALIA-053.txt"
          git commit -m 'VINDEX 0.53: statum lectionis e tabula remove'
          git push origin HEAD:chatgpt/vindex-053-compilator-dynamicus
