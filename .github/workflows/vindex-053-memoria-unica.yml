# Probatio fontium dynamicorum; mutationes pertinentes ipsam probationem excitant.
name: VINDEX 0.53 — Fontes dynamici canonici

on:
  push:
    branches:
      - chatgpt/vindex-053-compilator-dynamicus
    paths:
      - '.github/workflows/vindex-053-memoria-unica.yml'
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/applica_fontes_dynamicos_053.py'
      - 'Vindex Chat-GPT/vindex_final_v51/bootstrap/python/compilateur_053.py'
      - 'Vindex Chat-GPT/vindex_final_v51/bootstrap/reconstruit.sh'

permissions:
  contents: write

jobs:
  fontes-dynamici:
    runs-on: ubuntu-latest
    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5
        with:
          ref: chatgpt/vindex-053-compilator-dynamicus
          fetch-depth: 0

      - name: Fontes dynamicos auto-hospitio comproba
        shell: bash
        run: |
          set +e
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          RELATIO=/tmp/relatio_vindex_053
          : > "$RELATIO"
          SUCCESSUS=0

          integrum() {
            VIA="$1"
            [ -s "$VIA" ] || return 1
            A=$(stat -c '%s' "$VIA" 2>/dev/null)
            B=$(od -An -tu8 -j96 -N8 "$VIA" 2>/dev/null | tr -d '[:space:]')
            [ -n "$A" ] && [ "$A" = "$B" ]
          }

          proba() {
            chmod 755 "$RADIX/compilator_vindex"

            # Pons unicus veteri compilatori spatium tantum ad migrationem ipsam praebet.
            python3 - <<'PY'
          from pathlib import Path
          p=Path('Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex')
          t=p.read_text(encoding='utf-8')
          Path('/tmp/pontis.vindex').write_text(
              t.replace('213001','524289').replace('213000','524288').replace('212999','524287'),
              encoding='utf-8'
          )
          PY
            "$RADIX/compilator_vindex" /tmp/pontis.vindex /tmp/pontis >> "$RELATIO" 2>&1
            SP=$?
            printf 'STATUS PONTIS: %s.\n' "$SP" >> "$RELATIO"
            [ "$SP" -eq 0 ] && integrum /tmp/pontis || return 1
            chmod 755 /tmp/pontis

            python3 "$RADIX/instrumenta/applica_fontes_dynamicos_053.py" >> "$RELATIO" 2>&1 || return 1

            if grep -q 'CAPACITAS 213000\|LEGE(fd, 213001)\|LEGE(fd_imp2, 213001)\|ACCIPIT fons SICUT ORDO DE LITTERA' "$RADIX/src/compilator_vindex.vindex"; then
              printf '%s\n' 'ERRATUM: limes fontium vel conventio ORDO adhuc manet.' >> "$RELATIO"
              return 1
            fi

            MENSURA=$(stat -c '%s' "$RADIX/src/compilator_vindex.vindex")
            printf 'MENSURA FONTIS DYNAMICI: %s octeta.\n' "$MENSURA" >> "$RELATIO"
            [ "$MENSURA" -gt 212999 ] || return 1

            /tmp/pontis "$RADIX/src/compilator_vindex.vindex" /tmp/g1 >> "$RELATIO" 2>&1
            S1=$?
            printf 'STATUS G1: %s.\n' "$S1" >> "$RELATIO"
            [ "$S1" -eq 0 ] && integrum /tmp/g1 || return 1

            chmod 755 /tmp/g1
            /tmp/g1 "$RADIX/src/compilator_vindex.vindex" /tmp/g2 >> "$RELATIO" 2>&1
            S2=$?
            printf 'STATUS G2: %s.\n' "$S2" >> "$RELATIO"
            [ "$S2" -eq 0 ] && integrum /tmp/g2 || return 1

            chmod 755 /tmp/g2
            /tmp/g2 "$RADIX/src/compilator_vindex.vindex" /tmp/g3 >> "$RELATIO" 2>&1
            S3=$?
            printf 'STATUS G3: %s.\n' "$S3" >> "$RELATIO"
            [ "$S3" -eq 0 ] && integrum /tmp/g3 || return 1
            cmp -s /tmp/g2 /tmp/g3 || return 1
            printf '%s\n' 'RECTE: fontes dynamici punctum fixum servant.' >> "$RELATIO"

            cp /tmp/g3 "$RADIX/compilator_vindex"
            chmod 755 "$RADIX/compilator_vindex"

            python3 - <<'PY'
          from pathlib import Path
          praefixum='// ' + ('a' * 300000) + '\n'
          corpus='''FUNCTIO PRINCIPALIS REDDENS NUMERUS.\n    PROCLAMA 53.\n    REDDE 0.\nFIN-FUNCTIO.\n'''
          Path('/tmp/fons_magnus_053.vindex').write_text(praefixum + corpus, encoding='utf-8')
          PY
            ./"$RADIX/compilator_vindex" /tmp/fons_magnus_053.vindex /tmp/fons_magnus_053 >> "$RELATIO" 2>&1
            SF=$?
            printf 'FONS > 300000 COMPILATIO: %s.\n' "$SF" >> "$RELATIO"
            [ "$SF" -eq 0 ] && integrum /tmp/fons_magnus_053 || return 1
            chmod 755 /tmp/fons_magnus_053
            OF=$(/tmp/fons_magnus_053 2>>"$RELATIO"); EF=$?
            printf 'FONS > 300000 EXECUTIO: status=%s exitus=[%s].\n' "$EF" "$OF" >> "$RELATIO"
            [ "$EF" -eq 0 ] && [ "$OF" = '53' ] || return 1

            cd "$RADIX" || return 1
            ./compilator_vindex examples/memoria_dynamica_053.vindex /tmp/memoria_053 >> "$RELATIO" 2>&1 || return 1
            chmod 755 /tmp/memoria_053
            OM=$(/tmp/memoria_053 2>>"$RELATIO"); EM=$?
            printf 'MEMORIA XXXII MiB: status=%s exitus=[%s].\n' "$EM" "$OM" >> "$RELATIO"
            [ "$EM" -eq 0 ] && [ "$OM" = $'86\n88' ] || return 1

            ./compilator_vindex src/officina_vindex.vindex /tmp/officina_nova >> "$RELATIO" 2>&1 || return 1
            ./compilator_vindex src/salutatio_vindex.vindex /tmp/salutatio_nova >> "$RELATIO" 2>&1 || return 1
            cp /tmp/officina_nova ./officina_vindex
            cp /tmp/salutatio_nova ./salutatio_vindex

            find . -type f -name '*.sh' -exec chmod 755 {} +
            chmod 755 ./vindexc ./vindex_graphica ./officina_vindex ./salutatio_vindex ./compilator_vindex ./vindex-officina ./vindex-salutatio ./vindex-systema

            bash ./systema/construe_systema.sh >> "$RELATIO" 2>&1 || return 1
            bash ./systema/uefi/construe_uefi.sh >> "$RELATIO" 2>&1 || return 1
            printf '%s\n' 'RECTE: Systema BIOS et UEFI regenerata sunt.' >> "$RELATIO"

            bash ./tests/run_tests.sh >> "$RELATIO" 2>&1
            SR=$?
            printf 'PROBATIONES REGRESSIONALES: status=%s.\n' "$SR" >> "$RELATIO"
            [ "$SR" -eq 0 ] || return 1

            printf '%s\n' 'RECTE: limes fontis 212999 octetorum remotus est.' >> "$RELATIO"
            return 0
          }

          proba
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            SUCCESSUS=1
          else
            printf 'ERRATUM: migratio fontium dynamicorum nondum canonica est; status=%s.\n' "$STATUS" >> "$RELATIO"
          fi

          cd "$GITHUB_WORKSPACE" || exit 0
          VIA_RELATIONIS="$RADIX/instrumenta/RELATIO-VINDEX-053.md"
          {
            printf '%s\n\n' '# VINDEX 0.53 — Relatio fontium dynamicorum'
            printf '%s\n\n' 'Limes historicus fontis 212999 octetorum, auto-hospitium et regressiones hic comprobantur.'
            printf '%s\n' '```text'
            cat "$RELATIO"
            printf '%s\n' '```'
          } > "$VIA_RELATIONIS"

          git config user.name 'VINDEX Centurio'
          git config user.email 'actions@users.noreply.github.com'
          if [ "$SUCCESSUS" -eq 1 ]; then
            git add "$RADIX/src/compilator_vindex.vindex" "$RADIX/compilator_vindex" "$RADIX/officina_vindex" "$RADIX/salutatio_vindex" "$RADIX/nucleus_systema.elf" "$RADIX/systema_vindex.img" "$RADIX/BOOTX64.EFI" "$RADIX/systema_vindex_uefi.img" "$VIA_RELATIONIS"
          else
            git checkout -- "$RADIX/src/compilator_vindex.vindex" "$RADIX/compilator_vindex" "$RADIX/officina_vindex" "$RADIX/salutatio_vindex" "$RADIX/nucleus_systema.elf" "$RADIX/systema_vindex.img" "$RADIX/BOOTX64.EFI" "$RADIX/systema_vindex_uefi.img" 2>/dev/null || true
            git add "$VIA_RELATIONIS"
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'VINDEX 0.53: fontes dynamicos comproba'
            git push origin HEAD:chatgpt/vindex-053-compilator-dynamicus
          fi
          exit 0
