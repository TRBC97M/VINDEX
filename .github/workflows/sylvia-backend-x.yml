name: Sylvia OS — Backend X accelerabilis

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_coda_graphica.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_backend_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_commandos_viii.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_compositor_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/backend_accelerabilis_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/coda_graphica_viii.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/scena_compositoris_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/fenestrale_ii_purus_i.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/verifica_abi_graphica_viii.py'
      - 'documenta/sylvia/JL_UX_FUNDAMENTUM_GRAPHICUM_MODERNUM.md'
      - 'CONSILIUM.md'
      - '.github/workflows/sylvia-backend-x.yml'

permissions:
  contents: read

jobs:
  backend-x:
    name: Contractus, coda, fallback et praesentia QEMU probantur
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v5

      - name: QEMU et OVMF institue
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf file

      - name: Instrumenta para
        shell: bash
        run: |
          chmod +x 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
          chmod +x 'Vindex Chat-GPT/vindex_final_v51/instrumenta/proba_showroom_compositor_x_uefi.sh'

      - name: Puritatem et ABI verifica
        shell: bash
        run: |
          set -euo pipefail
          python3 instrumenta/verifica_puritatem_sylviae.py
          python3 'Vindex Chat-GPT/vindex_final_v51/instrumenta/verifica_abi_graphica_viii.py'

      - name: Coda et backend native exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex probationes/coda_graphica_viii.vindex /tmp/coda-viii
          ./compilator_vindex probationes/backend_accelerabilis_x.vindex /tmp/backend-x
          ./compilator_vindex probationes/scena_compositoris_x.vindex /tmp/scena-x
          chmod +x /tmp/coda-viii /tmp/backend-x /tmp/scena-x
          timeout 25s /tmp/coda-viii
          timeout 25s /tmp/backend-x
          timeout 25s /tmp/scena-x

      - name: Payload Sylviae integrum compila
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex systema/fenestrale_ii_purus_i.vindex /tmp/fenestrale-xiif
          file /tmp/fenestrale-xiif | grep -q 'ELF 64-bit'

      - name: Showroom Compositor X sub QEMU et OVMF
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        env:
          MORA_INITII: '18'
          SERVA_CAPTURAS: '${{ github.workspace }}/qemu-backend-x'
        run: |
          set -euo pipefail
          bash ./instrumenta/proba_showroom_compositor_x_uefi.sh

      - name: Capturam conserva
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-backend-x-${{ github.sha }}
          path: |
            qemu-backend-x/*.ppm
            qemu-backend-x/*.log
          if-no-files-found: warn
          retention-days: 7
