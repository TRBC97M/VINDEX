name: VINDEX — Identitas exacta Phase 0-bis

on:
  workflow_dispatch:
  push:
    branches:
      - 'chatgpt/phase0bis-identitas-exacta'
    paths:
      - '.github/workflows/vindex-identitas-exacta.yml'
      - 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/identificatores_collisionis*.vindex'
  pull_request:
    paths:
      - '.github/workflows/vindex-identitas-exacta.yml'
      - 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/identificatores_collisionis*.vindex'

permissions:
  contents: read

jobs:
  identitas:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Collisiones nominum exacta identitate distingue
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./compilator_vindex

          ./compilator_vindex probationes/identificatores_collisionis.vindex /tmp/collisio-localis
          chmod +x /tmp/collisio-localis
          test "$(/tmp/collisio-localis)" = $'111\n222'

          ./compilator_vindex probationes/identificatores_collisionis_functionum.vindex /tmp/collisio-functionum
          chmod +x /tmp/collisio-functionum
          test "$(/tmp/collisio-functionum)" = $'111\n222'

          ./compilator_vindex probationes/identificatores_collisionis_formarum.vindex /tmp/collisio-formarum
          chmod +x /tmp/collisio-formarum
          test "$(/tmp/collisio-formarum)" = $'11\n22\n33'

          ./compilator_vindex probationes/identificatores_collisionis_camporum.vindex /tmp/collisio-camporum
          chmod +x /tmp/collisio-camporum
          test "$(/tmp/collisio-camporum)" = $'111\n222'

      - name: Auto-hospitium fixum conserva
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex src/compilator_vindex.vindex /tmp/g2
          chmod +x /tmp/g2
          /tmp/g2 src/compilator_vindex.vindex /tmp/g3
          cmp ./compilator_vindex /tmp/g2
          cmp /tmp/g2 /tmp/g3

      - name: Regressionem canonicam conserva
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          ./tests/run_tests.sh | tee /tmp/tests.log
          grep -Fq '35 probationes rectae; 0 errata.' /tmp/tests.log
