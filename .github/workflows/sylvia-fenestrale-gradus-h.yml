name: Sylvia OS — Fenestrale II Gradus H

on:
  pull_request:
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/systema/uefi/fenestrale_native_h.c'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/uefi/construe_fenestrale_native_h.sh'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/fenestrale_ii_compositor_abi.h'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_ii_compositor.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/src/programmata_fenestrale_ii_g.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/proba_fenestrale_ii_h.py'
      - 'documenta/sylvia/FENESTRALE_II_GRADUS_H.md'
      - '.github/workflows/sylvia-fenestrale-gradus-h.yml'
  push:
    branches: [main]
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/systema/uefi/fenestrale_native_h.c'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/uefi/construe_fenestrale_native_h.sh'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/proba_fenestrale_ii_h.py'
      - '.github/workflows/sylvia-fenestrale-gradus-h.yml'

jobs:
  constructio:
    name: Compositor H et PROGRAMMATA G construuntur
    runs-on: ubuntu-latest
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v4

      - name: ABI Gradus D verifica
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: python3 tests/proba_fenestrale_ii_abi_d.py

      - name: Regressionem Gradus F verifica
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: python3 tests/proba_programmata_fenestrale_f.py

      - name: Contractum Gradus G verifica
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: python3 tests/proba_fenestrale_ii_compositor_g.py

      - name: Contractum Gradus H verifica
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: python3 tests/proba_fenestrale_ii_h.py

      - name: Compositorium Gradus H construe
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          bash systema/uefi/construe_fenestrale_native_h.sh \
            /tmp/FENESTRALEH.EFI \
            /tmp/fenestrale_h_uefi.img

      - name: Exitus verifica
        run: |
          file /tmp/FENESTRALEH.EFI
          objdump -p /tmp/FENESTRALEH.EFI | grep 'Subsystem.*EFI application'
          test -s /tmp/fenestrale_h_uefi.img
          test "$(stat -c %s /tmp/fenestrale_h_uefi.img)" -ge 67108864
