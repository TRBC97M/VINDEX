name: Sylvia OS — Interruptiones MSI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/vindex_verifica.py'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/rectores/pci.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/rectores/mmio.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/rectores/interruptiones.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/interruptiones_abi.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/proba_interruptiones_msi.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/proba_interruptiones_abi_053.sh'
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/proba_interruptiones_msi_053.sh'
      - 'documenta/vindex/INTERRUPTIONES.md'
      - 'CONSILIUM.md'
      - '.github/workflows/sylvia-interruptiones-msi.yml'

permissions:
  contents: read

jobs:
  interruptiones-msi:
    name: ABI, IDT, MSI et IRETQ probantur
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v5

      - name: QEMU et OVMF institue
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf file

      - name: Instrumenta para
        shell: bash
        run: |
          chmod +x 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
          chmod +x 'Vindex Chat-GPT/vindex_final_v51/instrumenta/proba_interruptiones_abi_053.sh'
          chmod +x 'Vindex Chat-GPT/vindex_final_v51/instrumenta/proba_interruptiones_msi_053.sh'

      - name: Puritatem et ABI verifica
        shell: bash
        run: |
          set -euo pipefail
          python3 instrumenta/verifica_puritatem_sylviae.py
          cd 'Vindex Chat-GPT/vindex_final_v51'
          bash ./instrumenta/proba_interruptiones_abi_053.sh

      - name: Auto-hospitium punctum fixum
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex src/compilator_vindex.vindex /tmp/gen2
          chmod +x /tmp/gen2
          /tmp/gen2 src/compilator_vindex.vindex /tmp/gen3
          chmod +x /tmp/gen3
          cmp -s /tmp/gen2 /tmp/gen3
          cmp -s ./compilator_vindex /tmp/gen3
          printf '%s\n' 'RECTE: compilator canonicus = G2 = G3.'

      - name: Regressiones canonicas exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: bash tests/run_tests.sh

      - name: Interruptio MSI sub firmware exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: bash ./instrumenta/proba_interruptiones_msi_053.sh
