name: Sylvia OS — Fenestrale II Gradus D

on:
  pull_request:
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/systema/fenestrale_ii_abi.h'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_ii.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/proba_fenestrale_ii_abi_d.py'
      - 'documenta/sylvia/FENESTRALE_II_GRADUS_D.md'
      - '.github/workflows/sylvia-fenestrale-gradus-d.yml'
  push:
    branches: [main]
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/systema/fenestrale_ii_abi.h'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_ii.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/proba_fenestrale_ii_abi_d.py'
      - '.github/workflows/sylvia-fenestrale-gradus-d.yml'

jobs:
  abi:
    name: Contractus C et VINDEX concordat
    runs-on: ubuntu-latest
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v4
      - name: Concordantiam numericam verifica
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: python3 tests/proba_fenestrale_ii_abi_d.py
      - name: Caput C compila
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          cat > /tmp/proba_fenestrale_abi.c <<'EOF'
          #include "systema/fenestrale_ii_abi.h"
          int main(void) {
              FENESTRALE2_DESCRIPTOR d = {0};
              FENESTRALE2_EVENTUM e = {0};
              return (int)(d.magic + e.typus);
          }
          EOF
          gcc -std=c11 -Wall -Wextra -Werror -I. /tmp/proba_fenestrale_abi.c -o /tmp/proba_fenestrale_abi
          /tmp/proba_fenestrale_abi
      - name: Bibliothecam VINDEX compila
        working-directory: Vindex Chat-GPT/vindex_final_v51
        run: |
          cat bibliotheca/fenestrale_ii.vindex > /tmp/proba_fenestrale_ii.vindex
          cat >> /tmp/proba_fenestrale_ii.vindex <<'EOF'
          FUNCTIO PRINCIPALIS REDDENS NUMERUS.
              REDDE 0.
          FIN-FUNCTIO.
          EOF
          ./compilator_vindex /tmp/proba_fenestrale_ii.vindex /tmp/proba_fenestrale_ii
          test -s /tmp/proba_fenestrale_ii
