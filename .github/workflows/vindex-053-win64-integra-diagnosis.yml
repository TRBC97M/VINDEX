# Strata PE, PROCLAMA numericum et fasciculos coniunctim probat ante canonizationem.
name: VINDEX 0.53 — Win64 integratio diagnostica

on:
  push:
    branches:
      - chatgpt/pe-fasciculi-053
  pull_request:
    branches:
      - claude/pe-integration-053-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integra:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5

      - name: Tria strata applica
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          FONS="$RUNNER_TEMP/compilator_win64.vindex"
          cp "$RADIX/src/compilator_vindex.vindex" "$FONS"
          python3 "$RADIX/instrumenta/corrige_proclama_numericum_win64_053.py" "$FONS" "$RUNNER_TEMP/proclama.vindex"
          mv "$RUNNER_TEMP/proclama.vindex" "$FONS"
          python3 "$RADIX/instrumenta/applica_fasciculos_win64_053.py" "$FONS"
          python3 "$RADIX/instrumenta/corrige_alignationem_api_win64_053.py" "$FONS"
          grep -Fq 'COMPONE_IMPRIME_NUMERUS(codex, CONTENTUM(pos_codicis), intervallum_scratch, contextus_parseris)' "$FONS"
          grep -Fq 'COMPONE_APERI_FASCICULUM_PE' "$FONS"

      - name: Compilatorem ad punctum fixum reconstrue
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          FONS="$RUNNER_TEMP/compilator_win64.vindex"
          chmod 755 "$RADIX/compilator_vindex"
          "$RADIX/compilator_vindex" "$FONS" "$RUNNER_TEMP/gen1"
          chmod 755 "$RUNNER_TEMP/gen1"
          "$RUNNER_TEMP/gen1" "$FONS" "$RUNNER_TEMP/gen2"
          chmod 755 "$RUNNER_TEMP/gen2"
          "$RUNNER_TEMP/gen2" "$FONS" "$RUNNER_TEMP/gen3"
          chmod 755 "$RUNNER_TEMP/gen3"
          cmp "$RUNNER_TEMP/gen2" "$RUNNER_TEMP/gen3"
          sha256sum "$RUNNER_TEMP/gen2"
          cp "$RUNNER_TEMP/gen2" "$RADIX/compilator_vindex"
          cp "$FONS" "$RADIX/src/compilator_vindex.vindex"
          chmod 755 "$RADIX/compilator_vindex"

      - name: Artefacta VINDEX derivata reconstrue
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          (
            cd "$RADIX"
            ./compilator_vindex src/officina_vindex.vindex "$RUNNER_TEMP/officina_vindex"
            ./compilator_vindex src/salutatio_vindex.vindex "$RUNNER_TEMP/salutatio_vindex"
          )
          mv "$RUNNER_TEMP/officina_vindex" "$RADIX/officina_vindex"
          mv "$RUNNER_TEMP/salutatio_vindex" "$RADIX/salutatio_vindex"
          chmod 755 "$RADIX/officina_vindex" "$RADIX/salutatio_vindex"
          printf '%s\n' 'RECTE: Officina et Salutatio cum compilatore novo reconstructae sunt.'

      - name: Permissiones probationum restitue
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          chmod 755 \
            "$RADIX/tests/run_tests.sh" \
            "$RADIX/vindexc" \
            "$RADIX/compilator_vindex" \
            "$RADIX/bootstrap/reconstruit.sh" \
            "$RADIX/installa_officinam.sh" \
            "$RADIX/vindex-officina" \
            "$RADIX/vindex-salutatio" \
            "$RADIX/vindex-systema" \
            "$RADIX/vindex_graphica" \
            "$RADIX/officina_vindex" \
            "$RADIX/salutatio_vindex" \
            "$RADIX/systema/construe_systema.sh" \
            "$RADIX/systema/uefi/construe_uefi.sh"

      - name: Calculum prius solum proba
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          EXE="$RUNNER_TEMP/calculus"
          "$RADIX/compilator_vindex" "$RADIX/tests/casus/calculus.vindex" "$EXE"
          chmod 755 "$EXE"
          PRODUCTUM="$($EXE)"
          EXPECTATUM=$'42\n1\n2\n3\n-42\n2'
          test "$PRODUCTUM" = "$EXPECTATUM"
          printf '%s\n' 'RECTE: calculus sine ruina compilatur et exsequitur.'

      - name: XXV probationes canonicas exsequere
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          set +e
          "$RADIX/tests/run_tests.sh" | tee "$RUNNER_TEMP/probationes.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          cat "$RUNNER_TEMP/probationes.log"
          exit "$STATUS"
