# Custodia externa argumentorum Win64 nuclei VINDEX.
name: VINDEX 0.53 — Argumenta Win64

on:
  push:
    branches:
      - infrastructura/vindex-053-ci-argumenta-win64
  pull_request:
    branches:
      - infrastructura/vindex-053-ci-argumenta-win64
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Nucleum purum accipe
        uses: actions/checkout@v5
        with:
          ref: chatgpt/vindex-053-argumenta-win64

      - name: Compilatorem para
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 ./compilator_vindex

      - name: Comparatorem VINDEX construe
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex tests/compara_fasciculos_053.vindex "$RUNNER_TEMP/compara_fasciculos"
          chmod 755 "$RUNNER_TEMP/compara_fasciculos"

      - name: Punctum fixum comproba
        shell: bash
        run: |
          set -euo pipefail
          F='src/compilator_vindex.vindex'
          ./compilator_vindex "$F" "$RUNNER_TEMP/gen1"
          chmod 755 "$RUNNER_TEMP/gen1"
          "$RUNNER_TEMP/gen1" "$F" "$RUNNER_TEMP/gen2"
          chmod 755 "$RUNNER_TEMP/gen2"
          "$RUNNER_TEMP/gen2" "$F" "$RUNNER_TEMP/gen3"
          chmod 755 "$RUNNER_TEMP/gen3"
          "$RUNNER_TEMP/compara_fasciculos" "$RUNNER_TEMP/gen2" "$RUNNER_TEMP/gen3"
          "$RUNNER_TEMP/compara_fasciculos" ./compilator_vindex "$RUNNER_TEMP/gen2"

      - name: Verificatorem PE VINDEX construe
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex tests/proba_pe_structuram_053.vindex "$RUNNER_TEMP/proba_pe"
          chmod 755 "$RUNNER_TEMP/proba_pe"

      - name: PE finalia et compilatorem construe
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/vindex_win64_argumenta"
          mkdir -p "$STAGE"
          cat > "$RUNNER_TEMP/proclama_finalis.vindex" <<'VINDEX'
          FUNCTIO PRINCIPALIS REDDENS NUMERUS.
              PROCLAMA "Initium".
              PROCLAMA 999.
              PROCLAMA -2.71828.
              DECLARA x SICUT FLUITANS VALENS 3.14.
              PROCLAMA x.
              PROCLAMA "Finis".
              REDDE 7.
          FIN-FUNCTIO.
          VINDEX
          ./compilator_vindex "$RUNNER_TEMP/proclama_finalis.vindex" "$RUNNER_TEMP/proclama_finalis.exe" pe
          ./compilator_vindex tests/casus/fasciculi_portabiles.vindex "$RUNNER_TEMP/fasciculi_finalis.exe" pe
          ./compilator_vindex src/compilator_vindex.vindex "$STAGE/compilator_vindex.exe" pe
          ./compilator_vindex tests/casus/argumenta.vindex "$STAGE/argumenta.exe" pe
          cp tests/casus/salve.vindex "$STAGE/salve fons.vindex"
          "$RUNNER_TEMP/proba_pe" "$RUNNER_TEMP/proclama_finalis.exe"
          "$RUNNER_TEMP/proba_pe" "$RUNNER_TEMP/fasciculi_finalis.exe"
          "$RUNNER_TEMP/proba_pe" "$STAGE/compilator_vindex.exe"
          "$RUNNER_TEMP/proba_pe" "$STAGE/argumenta.exe"

      - name: PE conserva
        uses: actions/upload-artifact@v4
        with:
          name: vindex-win64-purus
          path: |
            ${{ runner.temp }}/proclama_finalis.exe
            ${{ runner.temp }}/fasciculi_finalis.exe
            ${{ runner.temp }}/vindex_win64_argumenta
          if-no-files-found: error

  windows:
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - name: PE accipe
        uses: actions/download-artifact@v4
        with:
          name: vindex-win64-purus
          path: pe

      - name: Exsecutionem realem verifica
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Exsequere-Vindex([string]$via, [string[]]$argumenta = @()) {
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = $via
            foreach ($argumentum in $argumenta) {
              [void]$psi.ArgumentList.Add($argumentum)
            }
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $p = [System.Diagnostics.Process]::new()
            $p.StartInfo = $psi
            [void]$p.Start()
            $stdout = $p.StandardOutput.ReadToEnd()
            $stderr = $p.StandardError.ReadToEnd()
            $p.WaitForExit()
            return @($p.ExitCode, $stdout, $stderr)
          }

          $r = Exsequere-Vindex (Join-Path $PWD 'pe\proclama_finalis.exe')
          $status = [int]$r[0]
          $out = ([string]$r[1] -replace "`r`n", "`n").TrimEnd("`n")
          if ($status -ne 7) { throw "ERRATUM: PROCLAMA status $status." }
          if ($out -ne "Initium`n999`n-2.718280`n3.140000`nFinis") {
            throw "ERRATUM: PROCLAMA exitus differt: [$out]"
          }

          $dir = Join-Path $PWD 'fasciculi-finales'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item (Join-Path $PWD 'pe\fasciculi_finalis.exe') (Join-Path $dir 'fasciculi_finalis.exe')
          $pf = Start-Process -FilePath (Join-Path $dir 'fasciculi_finalis.exe') -WorkingDirectory $dir -Wait -PassThru -NoNewWindow
          if ($pf.ExitCode -ne 0) { throw "ERRATUM: fasciculi status $($pf.ExitCode)." }
          $textus = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes((Join-Path $dir 'vindex-pe-io.tmp')))
          if ($textus -ne 'VINX') { throw "ERRATUM: fasciculus continet [$textus]." }

          $argumenta = Exsequere-Vindex (Join-Path $PWD 'pe\vindex_win64_argumenta\argumenta.exe') @('Zeta Nova')
          $statusArgumentorum = [int]$argumenta[0]
          $outArgumentorum = ([string]$argumenta[1] -replace "`r`n", "`n").TrimEnd("`n")
          if ($statusArgumentorum -ne 0) { throw "ERRATUM: argumenta status $statusArgumentorum." }
          if ($outArgumentorum -ne "2`n90") {
            throw "ERRATUM: argumenta citata differunt: [$outArgumentorum]"
          }

          $radix = Join-Path $PWD 'probatio argumentorum'
          New-Item -ItemType Directory -Force -Path $radix | Out-Null
          $compilator = Join-Path $radix 'compilator vindex.exe'
          $fons = Join-Path $radix 'salve fons.vindex'
          $exitus = Join-Path $radix 'salve compilatum.exe'
          Copy-Item (Join-Path $PWD 'pe\vindex_win64_argumenta\compilator_vindex.exe') $compilator
          Copy-Item (Join-Path $PWD 'pe\vindex_win64_argumenta\salve fons.vindex') $fons

          $compilatio = Exsequere-Vindex $compilator @($fons, $exitus, 'pe')
          $statusCompilationis = [int]$compilatio[0]
          if ($statusCompilationis -ne 0) {
            throw "ERRATUM: compilator Win64 status $statusCompilationis; stderr [$([string]$compilatio[2])]."
          }
          if (-not (Test-Path $exitus -PathType Leaf)) {
            throw 'ERRATUM: compilator Win64 nullum PE produxit.'
          }

          $salve = Exsequere-Vindex $exitus
          $statusSalutationis = [int]$salve[0]
          $outSalutationis = ([string]$salve[1] -replace "`r`n", "`n").TrimEnd("`n")
          if ($statusSalutationis -ne 0) { throw "ERRATUM: PE compilatum status $statusSalutationis." }
          if ($outSalutationis -ne 'Salve, VINDEX!') {
            throw "ERRATUM: PE compilatum produxit [$outSalutationis]."
          }
          Write-Host 'RECTE: compilator VINDEX Win64 argumenta citata accipit et aliud programma VINDEX compilat.'
