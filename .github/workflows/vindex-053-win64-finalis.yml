# Verificatio backend Win64: generator et verificator PE ambo VINDEX sunt.
name: VINDEX 0.53 — Win64 purus

on:
  push:
    branches:
      - chatgpt/vindex-053-purificatio
  pull_request:
    branches:
      - chatgpt/vindex-053-compilator-dynamicus
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5

      - name: Compilatorem para
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'

      - name: Punctum fixum comproba
        shell: bash
        run: |
          set -euo pipefail
          R='Vindex Chat-GPT/vindex_final_v51'
          F="$R/src/compilator_vindex.vindex"
          "$R/compilator_vindex" "$F" "$RUNNER_TEMP/gen1"
          chmod 755 "$RUNNER_TEMP/gen1"
          "$RUNNER_TEMP/gen1" "$F" "$RUNNER_TEMP/gen2"
          chmod 755 "$RUNNER_TEMP/gen2"
          "$RUNNER_TEMP/gen2" "$F" "$RUNNER_TEMP/gen3"
          cmp "$RUNNER_TEMP/gen2" "$RUNNER_TEMP/gen3"
          cmp "$R/compilator_vindex" "$RUNNER_TEMP/gen2"

      - name: Verificatorem PE VINDEX construe
        shell: bash
        run: |
          set -euo pipefail
          R='Vindex Chat-GPT/vindex_final_v51'
          "$R/compilator_vindex" "$R/tests/proba_pe_structuram_053.vindex" "$RUNNER_TEMP/proba_pe"
          chmod 755 "$RUNNER_TEMP/proba_pe"

      - name: PE finalia construe et VINDEX verificet
        shell: bash
        run: |
          set -euo pipefail
          R='Vindex Chat-GPT/vindex_final_v51'
          cat > "$RUNNER_TEMP/proclama_finalis.vindex" <<'VINDEX'
          FUNCTIO PRINCIPALIS REDDENS NUMERUS.
              PROCLAMA "Initium".
              PROCLAMA 999.
              PROCLAMA -2.71828.
              DECLARA x SICUT FLUITANS VALENS 3.14.
              PROCLAMA x.
              PROCLAMA "Finis".
              REDDE 7.
          FIN-FUNCTIO.
          VINDEX
          "$R/compilator_vindex" "$RUNNER_TEMP/proclama_finalis.vindex" "$RUNNER_TEMP/proclama_finalis.exe" pe
          "$R/compilator_vindex" "$R/tests/casus/fasciculi_portabiles.vindex" "$RUNNER_TEMP/fasciculi_finalis.exe" pe
          "$RUNNER_TEMP/proba_pe" "$RUNNER_TEMP/proclama_finalis.exe"
          "$RUNNER_TEMP/proba_pe" "$RUNNER_TEMP/fasciculi_finalis.exe"

      - name: PE conserva
        uses: actions/upload-artifact@v4
        with:
          name: vindex-win64-purus
          path: |
            ${{ runner.temp }}/proclama_finalis.exe
            ${{ runner.temp }}/fasciculi_finalis.exe
          if-no-files-found: error

  windows:
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - name: PE accipe
        uses: actions/download-artifact@v4
        with:
          name: vindex-win64-purus
          path: pe

      - name: Exsecutionem realem verifica
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Exsequere-Vindex([string]$via) {
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = $via
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $p = [System.Diagnostics.Process]::new()
            $p.StartInfo = $psi
            [void]$p.Start()
            $stdout = $p.StandardOutput.ReadToEnd()
            $stderr = $p.StandardError.ReadToEnd()
            $p.WaitForExit()
            return @($p.ExitCode, $stdout, $stderr)
          }

          $r = Exsequere-Vindex (Join-Path $PWD 'pe\proclama_finalis.exe')
          $status = [int]$r[0]
          $out = ([string]$r[1] -replace "`r`n", "`n").TrimEnd("`n")
          if ($status -ne 7) { throw "ERRATUM: PROCLAMA status $status." }
          if ($out -ne "Initium`n999`n-2.718280`n3.140000`nFinis") {
            throw "ERRATUM: PROCLAMA exitus differt: [$out]"
          }

          $dir = Join-Path $PWD 'fasciculi-finales'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item (Join-Path $PWD 'pe\fasciculi_finalis.exe') (Join-Path $dir 'fasciculi_finalis.exe')
          $pf = Start-Process -FilePath (Join-Path $dir 'fasciculi_finalis.exe') -WorkingDirectory $dir -Wait -PassThru -NoNewWindow
          if ($pf.ExitCode -ne 0) { throw "ERRATUM: fasciculi status $($pf.ExitCode)." }
          $textus = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes((Join-Path $dir 'vindex-pe-io.tmp')))
          if ($textus -ne 'VINX') { throw "ERRATUM: fasciculus continet [$textus]." }
          Write-Host 'RECTE: backend Win64 a compilatore et verificatore VINDEX confirmatus est.'
