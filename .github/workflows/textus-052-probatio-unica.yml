name: VINDEX 0.52 — Emendatio spatii MITTE

# Unus cursus tantum cum hoc ipsum fasciculum mutatur.
on:
  push:
    branches:
      - chatgpt/vindex-052-textus
    paths:
      - '.github/workflows/textus-052-probatio-unica.yml'

permissions:
  contents: write

jobs:
  probatio:
    runs-on: ubuntu-latest
    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5
        with:
          ref: chatgpt/vindex-052-textus
          fetch-depth: 0

      - name: MITTE corrige et TEXTUS comproba
        shell: bash
        run: |
          set +e
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          RELATIO=/tmp/relatio_textus_052
          : > "$RELATIO"

          exsecutabile_integrum() {
            VIA="$1"
            [ -s "$VIA" ] || return 1
            RE_VERA=$(stat -c '%s' "$VIA" 2>/dev/null)
            DECLARATA=$(od -An -tu8 -j96 -N8 "$VIA" 2>/dev/null | tr -d '[:space:]')
            [ -n "$RE_VERA" ] && [ "$RE_VERA" = "$DECLARATA" ]
          }

          conserva() {
            SUCCESSUS="$1"
            cd "$GITHUB_WORKSPACE"
            VIA_RELATIONIS="$RADIX/instrumenta/RELATIO-TEXTUS-052.md"
            {
              printf '%s\n\n' '# VINDEX 0.52 — Relatio emendationis MITTE'
              printf '%s\n\n' 'Collisio inter bufferum temporarium `MITTE` et variabilem `pos` examinatur.'
              printf '%s\n' '```text'
              cat "$RELATIO"
              printf '%s\n' '```'
            } > "$VIA_RELATIONIS"

            git config user.name 'VINDEX Centurio'
            git config user.email 'actions@users.noreply.github.com'
            git add "$VIA_RELATIONIS"
            if [ "$SUCCESSUS" = '1' ]; then
              git add "$RADIX/src/compilator_vindex.vindex" "$RADIX/compilator_vindex"
            fi

            if ! git diff --cached --quiet; then
              if [ "$SUCCESSUS" = '1' ]; then
                git commit -m 'VINDEX 0.52: collisionem bufferi MITTE remove'
              else
                git commit -m 'VINDEX 0.52: relationem emendationis MITTE conserva'
              fi
              git push origin HEAD:chatgpt/vindex-052-textus
            fi
            exit 0
          }

          python3 "$RADIX/instrumenta/corrige_spatium_mitte_052.py" >> "$RELATIO" 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            printf 'EMENDATIO APPLICARI NON POTUIT: %s.\n' "$STATUS" >> "$RELATIO"
            conserva 0
          fi
          git diff --check >> "$RELATIO" 2>&1
          if [ "$?" -ne 0 ]; then
            printf '%s\n' 'DIFFERENTIAE FORMAM RECTAM NON HABENT.' >> "$RELATIO"
            conserva 0
          fi

          chmod +x "$RADIX/compilator_vindex"

          "$RADIX/compilator_vindex" "$RADIX/src/compilator_vindex.vindex" /tmp/compilator_052_1 >> "$RELATIO" 2>&1
          STATUS1=$?
          if [ "$STATUS1" -eq 74 ] && exsecutabile_integrum /tmp/compilator_052_1; then
            printf '%s\n' 'MONITUM: compilator vetus adhuc codicem 74 reddit; exsecutabile tamen integrum est.' >> "$RELATIO"
          elif [ "$STATUS1" -ne 0 ]; then
            printf 'GRADUS I CECIDIT: %s.\n' "$STATUS1" >> "$RELATIO"
            conserva 0
          fi
          chmod +x /tmp/compilator_052_1

          /tmp/compilator_052_1 "$RADIX/src/compilator_vindex.vindex" /tmp/compilator_052_2 >> "$RELATIO" 2>&1
          STATUS2=$?
          printf 'STATUS GRADUS II: %s.\n' "$STATUS2" >> "$RELATIO"
          if [ "$STATUS2" -ne 0 ]; then
            printf '%s\n' 'ERRATUM: compilator emendatus adhuc scripturam falsam refert.' >> "$RELATIO"
            conserva 0
          fi
          chmod +x /tmp/compilator_052_2

          cmp /tmp/compilator_052_1 /tmp/compilator_052_2 >> "$RELATIO" 2>&1
          if [ "$?" -ne 0 ]; then
            printf '%s\n' 'ERRATUM: punctum fixum auto-hospitii non obtentum est.' >> "$RELATIO"
            conserva 0
          fi
          printf '%s\n' 'RECTE: punctum fixum auto-hospitii obtentum est sine codice 74.' >> "$RELATIO"

          /tmp/compilator_052_2 "$RADIX/examples/textus_litterale_052.vindex" /tmp/textus_litterale >> "$RELATIO" 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            printf 'LITTERALE TEXTUS COMPILARI NON POTUIT: %s.\n' "$STATUS" >> "$RELATIO"
            conserva 0
          fi
          chmod +x /tmp/textus_litterale
          /tmp/textus_litterale > /tmp/exitus_litteralis 2>> "$RELATIO"
          printf 'Sylvia\n' > /tmp/exspectatum_litteralis
          if [ "$?" -ne 0 ] || ! cmp /tmp/exspectatum_litteralis /tmp/exitus_litteralis >> "$RELATIO" 2>&1; then
            printf '%s\n' 'ERRATUM: litterale TEXTUS exitum falsum dedit.' >> "$RELATIO"
            conserva 0
          fi
          printf '%s\n' 'RECTE: litterale TEXTUS et PROCLAMA operantur.' >> "$RELATIO"

          /tmp/compilator_052_2 "$RADIX/examples/textus_longitudo_052.vindex" /tmp/textus_longitudo >> "$RELATIO" 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            printf 'LONGITUDO COMPILARI NON POTUIT: %s.\n' "$STATUS" >> "$RELATIO"
            conserva 0
          fi
          chmod +x /tmp/textus_longitudo
          /tmp/textus_longitudo > /tmp/exitus_longitudinis 2>> "$RELATIO"
          printf '6\n' > /tmp/exspectatum_longitudinis
          if [ "$?" -ne 0 ] || ! cmp /tmp/exspectatum_longitudinis /tmp/exitus_longitudinis >> "$RELATIO" 2>&1; then
            printf '%s\n' 'ERRATUM: LONGITUDO exitum falsum dedit.' >> "$RELATIO"
            conserva 0
          fi
          printf '%s\n' 'RECTE: LONGITUDO operatur.' >> "$RELATIO"

          cp /tmp/compilator_052_2 "$RADIX/compilator_vindex"
          printf '%s\n' 'RECTE: VINDEX 0.52 hunc gradum sine collisione MITTE perficit.' >> "$RELATIO"
          conserva 1
