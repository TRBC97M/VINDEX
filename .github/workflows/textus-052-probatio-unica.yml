name: VINDEX 0.52 — Gradus IV TEXTUS

on:
  push:
    branches:
      - chatgpt/vindex-052-textus
    paths:
      - '.github/workflows/textus-052-probatio-unica.yml'

permissions:
  contents: write

jobs:
  gradus-quartus:
    runs-on: ubuntu-latest
    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5
        with:
          ref: chatgpt/vindex-052-textus
          fetch-depth: 0

      - name: Concatenationem et comparationem TEXTUS comproba
        shell: bash
        run: |
          set +e
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          RELATIO=/tmp/relatio_textus_052
          : > "$RELATIO"
          SUCCESSUS=0

          integrum() {
            VIA="$1"
            [ -s "$VIA" ] || return 1
            A=$(stat -c '%s' "$VIA" 2>/dev/null)
            B=$(od -An -tu8 -j96 -N8 "$VIA" 2>/dev/null | tr -d '[:space:]')
            [ -n "$A" ] && [ "$A" = "$B" ]
          }

          proba() {
            python3 "$RADIX/instrumenta/corrige_spatium_mitte_052.py" >> "$RELATIO" 2>&1 || return 1
            python3 "$RADIX/instrumenta/applica_textus_052_gradus4.py" >> "$RELATIO" 2>&1 || return 1
            python3 "$RADIX/instrumenta/verifica_textus_052_gradus4.py" >> "$RELATIO" 2>&1 || return 1

            chmod +x "$RADIX/compilator_vindex"
            "$RADIX/compilator_vindex" "$RADIX/src/compilator_vindex.vindex" /tmp/g1 >> "$RELATIO" 2>&1
            S1=$?
            printf 'STATUS G1: %s.\n' "$S1" >> "$RELATIO"
            [ "$S1" -eq 0 ] && integrum /tmp/g1 || return 1

            chmod +x /tmp/g1
            /tmp/g1 "$RADIX/src/compilator_vindex.vindex" /tmp/g2 >> "$RELATIO" 2>&1
            S2=$?
            printf 'STATUS G2: %s.\n' "$S2" >> "$RELATIO"
            [ "$S2" -eq 0 ] && integrum /tmp/g2 || return 1

            chmod +x /tmp/g2
            /tmp/g2 "$RADIX/src/compilator_vindex.vindex" /tmp/g3 >> "$RELATIO" 2>&1
            S3=$?
            printf 'STATUS G3: %s.\n' "$S3" >> "$RELATIO"
            [ "$S3" -eq 0 ] && integrum /tmp/g3 || return 1
            cmp -s /tmp/g2 /tmp/g3 || return 1
            printf '%s\n' 'RECTE: auto-hospitium et punctum fixum gradus IV transeunt.' >> "$RELATIO"

            cp /tmp/g3 "$RADIX/compilator_vindex"
            chmod 755 "$RADIX/compilator_vindex"
            cd "$RADIX" || return 1

            ./compilator_vindex examples/textus_litterale_052.vindex /tmp/t_lit >> "$RELATIO" 2>&1 || return 1
            chmod +x /tmp/t_lit
            OL=$(/tmp/t_lit 2>>"$RELATIO"); EL=$?
            printf 'LITTERALE: status=%s exitus=[%s].\n' "$EL" "$OL" >> "$RELATIO"
            [ "$EL" -eq 0 ] && [ "$OL" = 'Sylvia' ] || return 1

            ./compilator_vindex examples/textus_longitudo_052.vindex /tmp/t_long >> "$RELATIO" 2>&1 || return 1
            chmod +x /tmp/t_long
            OG=$(/tmp/t_long 2>>"$RELATIO"); EG=$?
            printf 'LONGITUDO: status=%s exitus=[%s].\n' "$EG" "$OG" >> "$RELATIO"
            [ "$EG" -eq 0 ] && [ "$OG" = '6' ] || return 1

            ./compilator_vindex examples/textus_concatena_052.vindex /tmp/t_concat >> "$RELATIO" 2>&1 || return 1
            chmod +x /tmp/t_concat
            OC=$(/tmp/t_concat 2>>"$RELATIO"); EC=$?
            printf 'CONCATENATIO: status=%s exitus=[%s].\n' "$EC" "$OC" >> "$RELATIO"
            [ "$EC" -eq 0 ] && [ "$OC" = $'Salve, Sylvia.\n14' ] || return 1

            ./compilator_vindex examples/textus_comparatio_052.vindex /tmp/t_cmp >> "$RELATIO" 2>&1 || return 1
            chmod +x /tmp/t_cmp
            OP=$(/tmp/t_cmp 2>>"$RELATIO"); EP=$?
            printf 'COMPARATIO: status=%s exitus=[%s].\n' "$EP" "$OP" >> "$RELATIO"
            [ "$EP" -eq 0 ] && [ "$OP" = 'RECTE' ] || return 1

            ./compilator_vindex examples/textus_052.vindex /tmp/t_totum >> "$RELATIO" 2>&1 || return 1
            chmod +x /tmp/t_totum
            OT=$(/tmp/t_totum 2>>"$RELATIO"); ET=$?
            printf 'TEXTUS TOTUS: status=%s exitus=[%s].\n' "$ET" "$OT" >> "$RELATIO"
            [ "$ET" -eq 0 ] && [ "$OT" = $'Sylvia OS\n9\nSalve, Sylvia.' ] || return 1

            bash ./tests/run_tests.sh >> "$RELATIO" 2>&1
            SR=$?
            printf 'PROBATIONES REGRESSIONALES: status=%s.\n' "$SR" >> "$RELATIO"
            cp /tmp/g3 ./compilator_vindex
            chmod 755 ./compilator_vindex
            [ "$SR" -eq 0 ] || return 1

            printf '%s\n' 'RECTE: concatenatio, comparatio contenti et regressiones plenae transeunt.' >> "$RELATIO"
            return 0
          }

          proba
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            SUCCESSUS=1
          else
            printf 'ERRATUM: gradus IV TEXTUS nondum canonicus est; status=%s.\n' "$STATUS" >> "$RELATIO"
          fi

          cd "$GITHUB_WORKSPACE" || exit 0
          VIA_RELATIONIS="$RADIX/instrumenta/RELATIO-TEXTUS-052.md"
          {
            printf '%s\n\n' '# VINDEX 0.52 — Relatio gradus IV TEXTUS'
            printf '%s\n\n' 'Concatenatio, comparatio secundum contentum, auto-hospitium, punctum fixum et regressiones hic comprobantur.'
            printf '%s\n' '```text'
            cat "$RELATIO"
            printf '%s\n' '```'
          } > "$VIA_RELATIONIS"

          git config user.name 'VINDEX Centurio'
          git config user.email 'actions@users.noreply.github.com'
          if [ "$SUCCESSUS" -eq 1 ]; then
            git add "$RADIX/src/compilator_vindex.vindex" "$RADIX/compilator_vindex" "$VIA_RELATIONIS"
          else
            git checkout -- "$RADIX/src/compilator_vindex.vindex" "$RADIX/compilator_vindex" 2>/dev/null || true
            git add "$VIA_RELATIONIS"
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'VINDEX 0.52: relationem gradus IV TEXTUS conserva'
            git push origin HEAD:chatgpt/vindex-052-textus
          fi
          exit 0
