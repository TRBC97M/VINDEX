name: VINDEX 0.52 — Canonica emendatio MITTE

on:
  push:
    branches:
      - chatgpt/vindex-052-textus
    paths:
      - '.github/workflows/textus-052-probatio-unica.yml'

permissions:
  contents: write

jobs:
  canonica:
    runs-on: ubuntu-latest
    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5
        with:
          ref: chatgpt/vindex-052-textus
          fetch-depth: 0

      - name: Emendationem MITTE canonice applica et comproba
        shell: bash
        run: |
          set +e
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          RELATIO=/tmp/relatio_textus_052
          : > "$RELATIO"

          integrum() {
            VIA="$1"
            [ -s "$VIA" ] || return 1
            A=$(stat -c '%s' "$VIA" 2>/dev/null)
            B=$(od -An -tu8 -j96 -N8 "$VIA" 2>/dev/null | tr -d '[:space:]')
            [ -n "$A" ] && [ "$A" = "$B" ]
          }

          python3 "$RADIX/instrumenta/corrige_spatium_mitte_052.py" >> "$RELATIO" 2>&1 || exit 1
          chmod +x "$RADIX/compilator_vindex"

          "$RADIX/compilator_vindex" "$RADIX/src/compilator_vindex.vindex" /tmp/gradus1 >> "$RELATIO" 2>&1
          S1=$?
          printf 'STATUS GRADUS I: %s.\n' "$S1" >> "$RELATIO"
          if ! { [ "$S1" -eq 0 ] || { [ "$S1" -eq 74 ] && integrum /tmp/gradus1; }; }; then
            printf '%s\n' 'ERRATUM: gradus I invalidus est.' >> "$RELATIO"
            exit 1
          fi

          chmod +x /tmp/gradus1
          /tmp/gradus1 "$RADIX/src/compilator_vindex.vindex" /tmp/gradus2 >> "$RELATIO" 2>&1
          S2=$?
          printf 'STATUS GRADUS II: %s.\n' "$S2" >> "$RELATIO"
          if ! { [ "$S2" -eq 0 ] || { [ "$S2" -eq 74 ] && integrum /tmp/gradus2; }; }; then
            printf '%s\n' 'ERRATUM: gradus II invalidus est.' >> "$RELATIO"
            exit 1
          fi

          chmod +x /tmp/gradus2
          /tmp/gradus2 "$RADIX/src/compilator_vindex.vindex" /tmp/gradus3 >> "$RELATIO" 2>&1
          S3=$?
          printf 'STATUS GRADUS III: %s.\n' "$S3" >> "$RELATIO"
          if [ "$S3" -ne 0 ] || ! integrum /tmp/gradus3; then
            printf '%s\n' 'ERRATUM: gradus III emendationem nondum confirmat.' >> "$RELATIO"
            exit 1
          fi
          if ! cmp -s /tmp/gradus2 /tmp/gradus3; then
            printf '%s\n' 'ERRATUM: punctum fixum nondum obtentum est.' >> "$RELATIO"
            exit 1
          fi
          printf '%s\n' 'RECTE: gradus III status 0 reddit et punctum fixum obtentum est.' >> "$RELATIO"

          cp /tmp/gradus3 "$RADIX/compilator_vindex"
          chmod 755 "$RADIX/compilator_vindex"

          cd "$RADIX"
          ./compilator_vindex examples/textus_litterale_052.vindex /tmp/textus_litterale >> "$RELATIO" 2>&1
          SL=$?
          chmod +x /tmp/textus_litterale 2>/dev/null
          OL=$(/tmp/textus_litterale 2>>"$RELATIO")
          EL=$?
          printf 'TEXTUS LITTERALE: compilatio=%s exsecutio=%s exitus=[%s].\n' "$SL" "$EL" "$OL" >> "$RELATIO"

          ./compilator_vindex examples/textus_longitudo_052.vindex /tmp/textus_longitudo >> "$RELATIO" 2>&1
          SG=$?
          chmod +x /tmp/textus_longitudo 2>/dev/null
          OG=$(/tmp/textus_longitudo 2>>"$RELATIO")
          EG=$?
          printf 'TEXTUS LONGITUDO: compilatio=%s exsecutio=%s exitus=[%s].\n' "$SG" "$EG" "$OG" >> "$RELATIO"

          if [ "$SL" -ne 0 ] || [ "$EL" -ne 0 ] || [ "$OL" != 'Sylvia' ]; then
            printf '%s\n' 'ERRATUM: probatio litteralis TEXTUS deficit.' >> "$RELATIO"
            exit 1
          fi
          if [ "$SG" -ne 0 ] || [ "$EG" -ne 0 ] || [ "$OG" != '6' ]; then
            printf '%s\n' 'ERRATUM: probatio LONGITUDO deficit.' >> "$RELATIO"
            exit 1
          fi
          printf '%s\n' 'RECTE: litterale, PROCLAMA et LONGITUDO transeunt.' >> "$RELATIO"

          cd "$GITHUB_WORKSPACE"
          VIA_RELATIONIS="$RADIX/instrumenta/RELATIO-TEXTUS-052.md"
          {
            printf '%s\n\n' '# VINDEX 0.52 — Relatio emendationis canonicae MITTE'
            printf '%s\n\n' 'Bufferum internum `MITTE` ad -6500000 remotum est, deinde auto-hospitium, punctum fixum et probationes minimae TEXTUS comprobata sunt.'
            printf '%s\n' '```text'
            cat "$RELATIO"
            printf '%s\n' '```'
          } > "$VIA_RELATIONIS"

          git config user.name 'VINDEX Centurio'
          git config user.email 'actions@users.noreply.github.com'
          git add "$RADIX/src/compilator_vindex.vindex" "$RADIX/compilator_vindex" "$VIA_RELATIONIS"
          if ! git diff --cached --quiet; then
            git commit -m 'VINDEX 0.52: collisionem bufferi MITTE canonice corrige'
            git push origin HEAD:chatgpt/vindex-052-textus
          fi
