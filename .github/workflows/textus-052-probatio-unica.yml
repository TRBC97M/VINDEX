name: VINDEX 0.52 — Diagnostica immediatorum MITTE

on:
  push:
    branches:
      - chatgpt/vindex-052-textus
    paths:
      - '.github/workflows/textus-052-probatio-unica.yml'

permissions:
  contents: write

jobs:
  diagnostica:
    runs-on: ubuntu-latest
    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5
        with:
          ref: chatgpt/vindex-052-textus
          fetch-depth: 0

      - name: Immediata MITTE inspice
        shell: bash
        run: |
          set +e
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          RELATIO=/tmp/relatio_textus_052
          : > "$RELATIO"

          python3 "$RADIX/instrumenta/corrige_spatium_mitte_052.py" >> "$RELATIO" 2>&1
          python3 - <<'PY' >> "$RELATIO" 2>&1
          from pathlib import Path
          p = Path('Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex')
          s = p.read_text(encoding='utf-8')
          print('FONS -6000000:', s.count('0 - 6000000'))
          print('FONS -6500000:', s.count('0 - 6500000'))
          PY

          chmod +x "$RADIX/compilator_vindex"
          "$RADIX/compilator_vindex" "$RADIX/src/compilator_vindex.vindex" /tmp/compilator_motus >> "$RELATIO" 2>&1
          printf 'STATUS COMPILATIONIS: %s.\n' "$?" >> "$RELATIO"

          python3 - <<'PY' >> "$RELATIO" 2>&1
          from pathlib import Path
          p = Path('/tmp/compilator_motus')
          if not p.exists():
              print('ERRATUM: binarium deest.')
          else:
              b = p.read_bytes()
              vetus = bytes.fromhex('8072a4ff')   # -6000000, little-endian i32
              novum = bytes.fromhex('60d19cff')   # -6500000, little-endian i32
              print('BINARIUM immediata -6000000:', b.count(vetus))
              print('BINARIUM immediata -6500000:', b.count(novum))
              print('MAGNITUDO BINARII:', len(b))
          PY

          cd "$GITHUB_WORKSPACE"
          VIA_RELATIONIS="$RADIX/instrumenta/RELATIO-TEXTUS-052.md"
          {
            printf '%s\n\n' '# VINDEX 0.52 — Relatio immediatorum MITTE'
            printf '%s\n\n' 'Immediata intervallorum in fonte et binario generato numerantur.'
            printf '%s\n' '```text'
            cat "$RELATIO"
            printf '%s\n' '```'
          } > "$VIA_RELATIONIS"

          git config user.name 'VINDEX Centurio'
          git config user.email 'actions@users.noreply.github.com'
          git add "$VIA_RELATIONIS"
          if ! git diff --cached --quiet; then
            git commit -m 'VINDEX 0.52: immediata MITTE relata conserva'
            git push origin HEAD:chatgpt/vindex-052-textus
          fi
          exit 0
