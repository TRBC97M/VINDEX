name: VINDEX 0.52 — Gradus tertius MITTE

on:
  push:
    branches:
      - chatgpt/vindex-052-textus
    paths:
      - '.github/workflows/textus-052-probatio-unica.yml'

permissions:
  contents: write

jobs:
  diagnostica:
    runs-on: ubuntu-latest
    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5
        with:
          ref: chatgpt/vindex-052-textus
          fetch-depth: 0

      - name: Gradum tertium post mutationem MITTE inspice
        shell: bash
        run: |
          set +e
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          RELATIO=/tmp/relatio_textus_052
          : > "$RELATIO"

          integrum() {
            VIA="$1"
            [ -s "$VIA" ] || return 1
            A=$(stat -c '%s' "$VIA" 2>/dev/null)
            B=$(od -An -tu8 -j96 -N8 "$VIA" 2>/dev/null | tr -d '[:space:]')
            [ -n "$A" ] && [ "$A" = "$B" ]
          }

          python3 "$RADIX/instrumenta/corrige_spatium_mitte_052.py" >> "$RELATIO" 2>&1

          python3 - <<'PY'
          from pathlib import Path
          p = Path('Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex')
          s = p.read_text(encoding='utf-8')
          vetus = '''    DECLARA scriptum SICUT NUMERUS VALENS MITTE(fd_scriptio, codex, pos).\n    CLAUDE(fd_scriptio).\n    SI scriptum != pos TUNC\n'''
          novum = '''    PROCLAMA SEDES(argc).\n    PROCLAMA SEDES(pos).\n    PROCLAMA pos.\n    DECLARA scriptum SICUT NUMERUS VALENS MITTE(fd_scriptio, codex, pos).\n    PROCLAMA scriptum.\n    PROCLAMA SEDES(pos).\n    PROCLAMA pos.\n    PROCLAMA SEDES(scriptum).\n    PROCLAMA CONTENTUM(SEDES(pos)).\n    CLAUDE(fd_scriptio).\n    SI scriptum != pos TUNC\n'''
          if s.count(vetus) != 1:
              raise SystemExit('ERRATUM: locus finalis non unicus est')
          Path('/tmp/compilator_diag.vindex').write_text(s.replace(vetus, novum, 1), encoding='utf-8')
          PY

          chmod +x "$RADIX/compilator_vindex"
          "$RADIX/compilator_vindex" /tmp/compilator_diag.vindex /tmp/gradus1 >> "$RELATIO" 2>&1
          S1=$?
          printf 'STATUS GRADUS I: %s.\n' "$S1" >> "$RELATIO"

          if [ "$S1" -eq 0 ] || { [ "$S1" -eq 74 ] && integrum /tmp/gradus1; }; then
            chmod +x /tmp/gradus1
            printf '%s\n' '--- GRADUS II: compilator adhuc MITTE vetere utitur dum novum compilat ---' >> "$RELATIO"
            /tmp/gradus1 /tmp/compilator_diag.vindex /tmp/gradus2 >> "$RELATIO" 2>&1
            S2=$?
            printf 'STATUS GRADUS II: %s.\n' "$S2" >> "$RELATIO"
          else
            S2=255
            printf '%s\n' 'GRADUS I INTEGRUM NON EST.' >> "$RELATIO"
          fi

          if [ "$S2" -eq 0 ] || { [ "$S2" -eq 74 ] && integrum /tmp/gradus2; }; then
            chmod +x /tmp/gradus2
            printf '%s\n' '--- GRADUS III: compilator cum MITTE ad -6500000 iam ipse exsequitur ---' >> "$RELATIO"
            /tmp/gradus2 /tmp/compilator_diag.vindex /tmp/gradus3 >> "$RELATIO" 2>&1
            S3=$?
            printf 'STATUS GRADUS III: %s.\n' "$S3" >> "$RELATIO"
            if integrum /tmp/gradus3; then
              printf '%s\n' 'GRADUS III INTEGRUM EST.' >> "$RELATIO"
            else
              printf '%s\n' 'GRADUS III INTEGRUM NON EST.' >> "$RELATIO"
            fi
            if cmp -s /tmp/gradus2 /tmp/gradus3; then
              printf '%s\n' 'PUNCTUM FIXUM GRADUUM II ET III: RECTE.' >> "$RELATIO"
            else
              printf '%s\n' 'PUNCTUM FIXUM GRADUUM II ET III: NONDUM.' >> "$RELATIO"
            fi
          else
            printf '%s\n' 'GRADUS II INTEGRUM NON EST.' >> "$RELATIO"
          fi

          cd "$GITHUB_WORKSPACE"
          VIA_RELATIONIS="$RADIX/instrumenta/RELATIO-TEXTUS-052.md"
          {
            printf '%s\n\n' '# VINDEX 0.52 — Relatio gradus tertii MITTE'
            printf '%s\n\n' 'Gradus tertius probat utrum compilator qui iam bufferum `MITTE` ad -6500000 habet corruptionem `pos` vitet atque punctum fixum attingat.'
            printf '%s\n' '```text'
            cat "$RELATIO"
            printf '%s\n' '```'
          } > "$VIA_RELATIONIS"

          git config user.name 'VINDEX Centurio'
          git config user.email 'actions@users.noreply.github.com'
          git add "$VIA_RELATIONIS"
          if ! git diff --cached --quiet; then
            git commit -m 'VINDEX 0.52: gradum tertium MITTE relata conserva'
            git push origin HEAD:chatgpt/vindex-052-textus
          fi
          exit 0
