name: VINDEX 0.52 — Diagnostica scripturae

# Unus cursus tantum cum hoc ipsum fasciculum mutatur.
on:
  push:
    branches:
      - chatgpt/vindex-052-textus
    paths:
      - '.github/workflows/textus-052-probatio-unica.yml'

permissions:
  contents: write

jobs:
  diagnostica:
    runs-on: ubuntu-latest
    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5
        with:
          ref: chatgpt/vindex-052-textus
          fetch-depth: 0

      - name: Momentum corruptionis pos inspice
        shell: bash
        run: |
          set +e
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          RELATIO=/tmp/relatio_textus_052
          : > "$RELATIO"

          exsecutabile_integrum() {
            VIA="$1"
            [ -s "$VIA" ] || return 1
            RE_VERA=$(stat -c '%s' "$VIA" 2>/dev/null)
            DECLARATA=$(od -An -tu8 -j96 -N8 "$VIA" 2>/dev/null | tr -d '[:space:]')
            [ -n "$RE_VERA" ] && [ "$RE_VERA" = "$DECLARATA" ]
          }

          python3 - <<'PY'
          from pathlib import Path
          via = Path('Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex')
          textus = via.read_text(encoding='utf-8')
          vetus = '''    DECLARA scriptum SICUT NUMERUS VALENS MITTE(fd_scriptio, codex, pos).\n    CLAUDE(fd_scriptio).\n    SI scriptum != pos TUNC\n'''
          novum = '''    PROCLAMA pos.\n    DECLARA scriptum SICUT NUMERUS VALENS MITTE(fd_scriptio, codex, pos).\n    PROCLAMA scriptum.\n    PROCLAMA pos.\n    CLAUDE(fd_scriptio).\n    PROCLAMA pos.\n    SI scriptum != pos TUNC\n'''
          if textus.count(vetus) != 1:
              raise SystemExit('ERRATUM: locus scripturae non unicus est')
          Path('/tmp/compilator_diag.vindex').write_text(textus.replace(vetus, novum, 1), encoding='utf-8')
          PY
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            printf 'DIAGNOSTICA PARARI NON POTUIT: %s.\n' "$STATUS" >> "$RELATIO"
          else
            chmod +x "$RADIX/compilator_vindex"
            "$RADIX/compilator_vindex" /tmp/compilator_diag.vindex /tmp/compilator_diag >> "$RELATIO" 2>&1
            STATUS=$?
            printf 'COMPILATIO DIAGNOSTICAE: status=%s.\n' "$STATUS" >> "$RELATIO"
            if [ "$STATUS" -eq 0 ] || { [ "$STATUS" -eq 74 ] && exsecutabile_integrum /tmp/compilator_diag; }; then
              chmod +x /tmp/compilator_diag

              printf '%s\n' '--- PROGRAMMA PARVUM: ante MITTE, post MITTE scriptum, post MITTE pos, post CLAUDE pos ---' >> "$RELATIO"
              /tmp/compilator_diag "$RADIX/examples/textus_litterale_052.vindex" /tmp/textus_diag >> "$RELATIO" 2>&1
              STATUS_PARVUS=$?
              printf 'STATUS PARVUS: %s.\n' "$STATUS_PARVUS" >> "$RELATIO"

              printf '%s\n' '--- COMPILATOR MAGNUS: ante MITTE, post MITTE scriptum, post MITTE pos, post CLAUDE pos ---' >> "$RELATIO"
              /tmp/compilator_diag /tmp/compilator_diag.vindex /tmp/compilator_diag_2 >> "$RELATIO" 2>&1
              STATUS_MAGNUS=$?
              printf 'STATUS MAGNUS: %s.\n' "$STATUS_MAGNUS" >> "$RELATIO"
              if [ -f /tmp/compilator_diag_2 ]; then
                printf 'MAGNITUDO MAGNA: ' >> "$RELATIO"
                stat -c '%s' /tmp/compilator_diag_2 >> "$RELATIO" 2>&1
              fi
            else
              printf '%s\n' 'EXSECUTABILE DIAGNOSTICUM INTEGRUM NON EST.' >> "$RELATIO"
            fi
          fi

          cd "$GITHUB_WORKSPACE"
          VIA_RELATIONIS='Vindex Chat-GPT/vindex_final_v51/instrumenta/RELATIO-TEXTUS-052.md'
          {
            printf '%s\n\n' '# VINDEX 0.52 — Relatio diagnostica corruptionis `pos`'
            printf '%s\n\n' 'Valor `pos` ante et post `MITTE`, deinde post `CLAUDE`, observatur.'
            printf '%s\n' '```text'
            cat "$RELATIO"
            printf '%s\n' '```'
          } > "$VIA_RELATIONIS"

          git config user.name 'VINDEX Centurio'
          git config user.email 'actions@users.noreply.github.com'
          git add "$VIA_RELATIONIS"
          if ! git diff --cached --quiet; then
            git commit -m 'VINDEX 0.52: momentum corruptionis pos conserva'
            git push origin HEAD:chatgpt/vindex-052-textus
          fi
          exit 0
