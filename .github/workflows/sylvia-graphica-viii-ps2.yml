name: Sylvia OS — Graphica VIII PS/2

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/metire_murem_graphica_viii.py'
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/metire_murem_graphica_viii_uefi.sh'
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/proba_murem_uefi_053.py'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/fenestrale_ii_purus_i.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/rectores/murus_ps2.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/uefi/**'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_*.vindex'
      - '.github/workflows/sylvia-graphica-viii-ps2.yml'
  push:
    branches:
      - main
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/metire_murem_graphica_viii.py'
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/metire_murem_graphica_viii_uefi.sh'
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/proba_murem_uefi_053.py'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/fenestrale_ii_purus_i.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/rectores/murus_ps2.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/uefi/**'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_*.vindex'
      - '.github/workflows/sylvia-graphica-viii-ps2.yml'

permissions:
  contents: read

jobs:
  responsivitas:
    name: Mora eventus PS/2 sub QEMU/OVMF
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v5

      - name: Instrumenta QEMU institue
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf file

      - name: Compilator exsecutabilis sit
        shell: bash
        run: chmod +x 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'

      - name: Responsivitatem PS/2 metire
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          bash ./instrumenta/metire_murem_graphica_viii_uefi.sh
