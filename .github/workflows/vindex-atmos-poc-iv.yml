name: VINDEX — ATMOS Terminal Depth POC IV

on:
  pull_request:
    paths:
      - 'PROGRAMMATA/ATMOS_TERMINAL_DEPTH/COMMUNE/**'
      - 'PROGRAMMATA/ATMOS_TERMINAL_DEPTH/POC_IV/**'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/conversio.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/textus.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/win32_ffi.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
      - '.github/workflows/vindex-atmos-poc-iv.yml'

jobs:
  genera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ATMOS POC IV ex VINDEX compila
        working-directory: PROGRAMMATA/ATMOS_TERMINAL_DEPTH/POC_IV
        shell: bash
        run: |
          set -euo pipefail
          COMP='../../../Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
          chmod +x "$COMP"
          "$COMP" ludus.vindex /tmp/atmos_poc_iv.exe pe
          file /tmp/atmos_poc_iv.exe
      - uses: actions/upload-artifact@v4
        with:
          name: atmos-poc-iv
          path: /tmp/atmos_poc_iv.exe
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: genera
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atmos-poc-iv
          path: atmos
      - name: Ludum HUD et persistentiam sub Windows vero proba
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = (Resolve-Path '.\atmos').Path
          $exe = Join-Path $dir 'atmos_poc_iv.exe'
          Set-Location $dir
          Remove-Item '.\atmos.sav' -Force -ErrorAction SilentlyContinue

          $out = & $exe smoke 2>&1
          $code = $LASTEXITCODE
          $text = ($out -join "`n")
          Write-Host $text
          if ($code -ne 0) { throw "atmos_poc_iv exitus $code" }
          if ($text -notmatch 'RECTE: ATMOS POC IV WIN64') { throw 'confirmatio POC IV deest' }

          $numeri = @($out | Where-Object { $_ -match '^\d+$' } | ForEach-Object { [int64]$_ })
          if ($numeri.Count -lt 7) { throw 'status finalis incompletus est' }
          $finis = $numeri[($numeri.Count-7)..($numeri.Count-1)]
          $expectata = @(4,120,87,75,100,300,0)
          for ($i=0; $i -lt 7; $i++) {
            if ($finis[$i] -ne $expectata[$i]) { throw "status index $i falsus: $($finis[$i])" }
          }

          if (!(Test-Path '.\atmos.sav')) { throw 'atmos.sav deest' }
          $b = [IO.File]::ReadAllBytes((Resolve-Path '.\atmos.sav'))
          if ($b.Length -ne 48) { throw "mensura save falsa: $($b.Length)" }
          if ($b[0] -ne 65 -or $b[1] -ne 84 -or $b[2] -ne 68 -or $b[3] -ne 49 -or $b[4] -ne 1) { throw 'caput ATD1 v1 falsum est' }
          function U32([int]$o) { return [BitConverter]::ToUInt32($b,$o) }
          if ((U32 8) -ne 4 -or (U32 12) -ne 120 -or (U32 16) -ne 87 -or (U32 20) -ne 75 -or (U32 24) -ne 100 -or (U32 28) -ne 300 -or (U32 32) -ne 0) {
            throw 'status persistens POC IV falsus est'
          }
          Write-Host 'RECTE: POC IV HUD + nucleus + ATD1 sub Windows probata sunt.'
