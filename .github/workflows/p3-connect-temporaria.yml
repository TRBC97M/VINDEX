name: P3 — Integratio moderatorum temporaria

on:
  push:
    branches:
      - chatgpt/p3-connect-controller-purus

permissions:
  contents: write

jobs:
  integra:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v5

      - name: Instrumenta UEFI institue
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf file

      - name: Moderatores et rectorem PS2 pure porta
        run: python3 .github/p3_connect.py

      - name: Probationes canonicas exsequere
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        run: bash ./tests/run_tests.sh

      - name: Catenam cum mure PS2 proba
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        env:
          MORA_INITII: '28'
        run: bash ./instrumenta/proba_catenam_uefi_053.sh

      - name: Mutationes probatas persiste et scaffolding remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@openai.local'
          git rm .github/p3_connect.py .github/workflows/p3-connect-temporaria.yml
          git add 'Vindex Chat-GPT/vindex_final_v51/systema/uefi/ponticulus_uefi_purus.vindex' \
                  'Vindex Chat-GPT/vindex_final_v51/systema/nucleus.vindex' \
                  'Vindex Chat-GPT/vindex_final_v51/systema/rectores/murus_ps2.vindex' \
                  'Vindex Chat-GPT/vindex_final_v51/instrumenta/proba_catenam_uefi_053.sh' \
                  'Vindex Chat-GPT/vindex_final_v51/instrumenta/proba_murem_uefi_053.py' \
                  '.github/workflows/catena-uefi-vindex.yml'
          git commit -m 'P3: rectorem muris PS2 VINDEX nativum canoniza'
          git push origin HEAD:chatgpt/p3-connect-controller-purus
