# Custodia canonica VINDEX 0.53: regressiones, auto-hospitium, CRLF et pila magna.
# Artefacta canonica UEFI in Ubuntu Resolute genita sunt; eadem familia
# instrumentorum hic consulto figitur, ne versiones ld/objcopy sectiones PE
# aliter disponant et falsam regressionem binariam efficiant.
name: VINDEX 0.53 — Regressio canonica

on:
  push:
    branches:
      - chatgpt/vindex-053-compilator-dynamicus
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vindex-053-regressio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressio-canonica:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ambitum Ubuntu Resolute para et omnia comproba
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            ubuntu:25.10 \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                gcc binutils python3 libgtk-3-0t64 ca-certificates

              RADIX="Vindex Chat-GPT/vindex_final_v51"

              find "$RADIX" -type f -name "*.sh" -exec chmod 755 {} +
              chmod 755 \
                "$RADIX/vindexc" \
                "$RADIX/vindex-officina" \
                "$RADIX/vindex-salutatio" \
                "$RADIX/vindex-systema" \
                "$RADIX/compilator_vindex" \
                "$RADIX/vindex_graphica" \
                "$RADIX/officina_vindex" \
                "$RADIX/salutatio_vindex"

              printf "%s\n" "=== I. RELIQUIAE TABULAE ==="
              python3 "$RADIX/instrumenta/inventaria_tabula_053.py" \
                --verifica "$RADIX/instrumenta/TABULA-LITTERALIA-053.txt"

              printf "%s\n" "=== II. XXII PROBATIONES CANONICAE ==="
              (
                cd "$RADIX"
                bash tests/run_tests.sh
              )

              printf "%s\n" "=== III. AMORSA ET BINARIUM DISTRIBUTUM ==="
              bash "$RADIX/bootstrap/reconstruit.sh" /tmp/compilator_reconstructus
              chmod 755 /tmp/compilator_reconstructus
              cmp "$RADIX/compilator_vindex" /tmp/compilator_reconstructus
              printf "%s\n" "RECTE: compilator distributus reconstructioni canonicae congruit."

              printf "%s\n" "=== IV. CRLF SINE TARDITATE ==="
              python3 - "$RADIX/src/compilator_vindex.vindex" /tmp/compilator_crlf.vindex <<"PY"
from pathlib import Path
import sys

fons = Path(sys.argv[1]).read_bytes().replace(b"\r\n", b"\n").replace(b"\r", b"\n")
Path(sys.argv[2]).write_bytes(fons.replace(b"\n", b"\r\n"))
PY
              timeout 10s "$RADIX/compilator_vindex" \
                /tmp/compilator_crlf.vindex /tmp/compilator_crlf
              chmod 755 /tmp/compilator_crlf
              printf "%s\n" "RECTE: fons CRLF intra terminum compilatus est."

              printf "%s\n" "=== V. PILA MAIOR UNO MIB ==="
              python3 "$RADIX/instrumenta/genera_probationem_pilae_053.py" \
                /tmp/pila_magna_053.vindex
              timeout 15s "$RADIX/compilator_vindex" \
                /tmp/pila_magna_053.vindex /tmp/pila_magna_053
              chmod 755 /tmp/pila_magna_053
              EX=$(timeout 5s /tmp/pila_magna_053)
              test "$EX" = "$(printf "39\n777")"
              python3 - /tmp/pila_magna_053 <<"PY"
from pathlib import Path
import sys

data = Path(sys.argv[1]).read_bytes()
frames = []
for i in range(len(data) - 55):
    if (
        data[i:i+2] == b"\x49\xbb"
        and data[i+10:i+17] == b"\x49\x81\xfb\x00\x10\x00\x00"
        and data[i+17:i+19] == b"\x76\x1c"
    ):
        frames.append(int.from_bytes(data[i+2:i+10], "little"))
if len(frames) != 2:
    raise SystemExit(f"ERRATUM: duo prologi pilae exspectabantur: {frames}")
if any(frame % 16 for frame in frames):
    raise SystemExit(f"ERRATUM: fasciculus non ordinatus est: {frames}")
if max(frames) < 1024 * 1024:
    raise SystemExit(f"ERRATUM: fasciculus unum MiB non superat: {frames}")
print("RECTE: pila magna et ordinatio probatae sunt: " + ",".join(map(str, frames)))
PY
            '
