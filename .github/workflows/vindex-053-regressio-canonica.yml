# Custodia canonica VINDEX 0.53: regressiones, auto-hospitium, CRLF et pila magna.
name: VINDEX 0.53 — Regressio canonica

on:
  push:
    branches:
      - chatgpt/vindex-053-compilator-dynamicus
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vindex-053-regressio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressio-canonica:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Fontes accipe
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Dependencias graphicas para
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          if apt-cache show libgtk-3-0t64 >/dev/null 2>&1; then
            sudo apt-get install -y libgtk-3-0t64
          else
            sudo apt-get install -y libgtk-3-0
          fi

      - name: Modos exsecutionis restitue
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          find "$RADIX" -type f -name '*.sh' -exec chmod 755 {} +
          chmod 755 \
            "$RADIX/vindexc" \
            "$RADIX/vindex-officina" \
            "$RADIX/vindex-salutatio" \
            "$RADIX/vindex-systema" \
            "$RADIX/compilator_vindex" \
            "$RADIX/vindex_graphica" \
            "$RADIX/officina_vindex" \
            "$RADIX/salutatio_vindex"

      - name: Reliquias tabulae custodi
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          python3 "$RADIX/instrumenta/inventaria_tabula_053.py" \
            --verifica "$RADIX/instrumenta/TABULA-LITTERALIA-053.txt"

      - name: XXV probationes canonicas exsequere
        shell: bash
        run: |
          set -euo pipefail
          cd 'Vindex Chat-GPT/vindex_final_v51'
          bash tests/run_tests.sh

      - name: Binarium distributum cum amorsa compara
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          bash "$RADIX/bootstrap/reconstruit.sh" /tmp/compilator_reconstructus
          chmod 755 /tmp/compilator_reconstructus
          cmp "$RADIX/compilator_vindex" /tmp/compilator_reconstructus
          printf '%s\n' 'RECTE: compilator distributus reconstructioni canonicae congruit.'

      - name: Septem argumenta ab amorsa proba
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          python3 "$RADIX/bootstrap/python/compilateur_053.py" \
            "$RADIX/tests/casus/argumenta_septem.vindex" /tmp/amorsa_septem
          EX=$(timeout 5s /tmp/amorsa_septem)
          test "$EX" = '28'
          printf '%s\n' 'RECTE: amorsa septem argumenta 28 reddit.'

      - name: CRLF sine tarditate comproba
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          python3 -c 'from pathlib import Path; import sys; f=Path(sys.argv[1]).read_bytes().replace(b"\r\n",b"\n").replace(b"\r",b"\n"); Path(sys.argv[2]).write_bytes(f.replace(b"\n",b"\r\n"))' \
            "$RADIX/src/compilator_vindex.vindex" /tmp/compilator_crlf.vindex
          timeout 10s "$RADIX/compilator_vindex" \
            /tmp/compilator_crlf.vindex /tmp/compilator_crlf
          chmod 755 /tmp/compilator_crlf
          printf '%s\n' 'RECTE: fons CRLF intra terminum compilatus est.'

      - name: Pilam maiorem uno MiB comproba
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          python3 "$RADIX/instrumenta/genera_probationem_pilae_053.py" \
            /tmp/pila_magna_053.vindex
          timeout 15s "$RADIX/compilator_vindex" \
            /tmp/pila_magna_053.vindex /tmp/pila_magna_053
          chmod 755 /tmp/pila_magna_053
          EX=$(timeout 5s /tmp/pila_magna_053)
          test "$EX" = "$(printf '39\n777')"
          python3 "$RADIX/instrumenta/verifica_pilam_binariam_053.py" \
            /tmp/pila_magna_053

      - name: Contextum functionis custodi
        shell: bash
        run: |
          set -euo pipefail
          FONS='Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'
          grep -Fq 'FUNCTIO STATUS_DESINE_LEGE REDDENS NUMERUS.' "$FONS"
          grep -Fq 'FUNCTIO STATUS_LECTIONIS_LEGE REDDENS NUMERUS.' "$FONS"
          grep -Fq 'FUNCTIO CURSOR_PILAE_LEGE REDDENS NUMERUS.' "$FONS"
          grep -Fq 'FUNCTIO CURSOR_PILAE_SCRIBE REDDENS NUMERUS.' "$FONS"
          grep -Fq 'ACCIPIT contextus_parseris SICUT ACUS<NUMERUS>.' "$FONS"
          grep -Fq 'CONTENTUM(contextus_parseris + 8)' "$FONS"
          grep -Fq 'CONTENTUM(contextus_parseris + 16)' "$FONS"
          grep -Fq 'RESERVA_OCTETA(24)' "$FONS"
          ! grep -Fq 'contextus_desine' "$FONS"
          ! grep -Fq 'tabula[227]' "$FONS"
          ! grep -Fq 'tabula[2999]' "$FONS"
          ! grep -Fq 'tabula[51]' "$FONS"
          printf '%s\n' 'RECTE: DESINE, lectio et cursor pilae extra tabulam in contextu explicito sunt.'
