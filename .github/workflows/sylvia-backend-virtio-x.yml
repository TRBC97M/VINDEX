name: Sylvia OS — Backend VirtIO Graphica X

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_backend_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_backend_virtio_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_compositor_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/fenestrale_ii_purus_i.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/proba_backend_virtio_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/rectores/pci.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/rectores/mmio.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/rectores/paginae_dma.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/rectores/virtio_pci.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/rectores/virtio_gpu.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/rectores/virtio_gpu_2d.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/backend_virtio_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/superficies_dma_directa_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/proba_backend_virtio_x_053.sh'
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/verifica_abi_graphica_viii.py'
      - 'documenta/sylvia/JL_UX_FUNDAMENTUM_GRAPHICUM_MODERNUM.md'
      - 'CONSILIUM.md'
      - '.github/workflows/sylvia-backend-virtio-x.yml'

permissions:
  contents: read

jobs:
  backend-virtio:
    name: Compositionem DMA et scanout hardware probat
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v5

      - name: QEMU et OVMF institue
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Instrumenta para
        shell: bash
        run: |
          chmod +x 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
          chmod +x 'Vindex Chat-GPT/vindex_final_v51/instrumenta/proba_backend_virtio_x_053.sh'

      - name: Puritatem et ABI verifica
        shell: bash
        run: |
          set -euo pipefail
          python3 instrumenta/verifica_puritatem_sylviae.py
          python3 'Vindex Chat-GPT/vindex_final_v51/instrumenta/verifica_abi_graphica_viii.py'

      - name: Backend VirtIO native et sub QEMU exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: ./instrumenta/proba_backend_virtio_x_053.sh

      - name: Superficiem DMA directam native exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex probationes/superficies_dma_directa_x.vindex /tmp/superficies-dma-directa-x
          chmod +x /tmp/superficies-dma-directa-x
          timeout 25s /tmp/superficies-dma-directa-x
          printf '%s\n' 'RECTE: backbuffer DMA adoptatus, solutus et non duplicatus est.'

      - name: Incrementa F1 ad F6 iterum exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          for fons in backend_accelerabilis_x cache_texturarum_x coda_compositionis_x vita_texturarum_x cache_vita_texturarum_x contractus_exsecutoris_x scena_compositoris_x; do
            ./compilator_vindex "probationes/$fons.vindex" "/tmp/$fons"
            chmod +x "/tmp/$fons"
            timeout 25s "/tmp/$fons"
          done

      - name: Payload Sylviae integrum compila
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex systema/fenestrale_ii_purus_i.vindex /tmp/fenestrale-xiif7
          file /tmp/fenestrale-xiif7 | grep -q 'ELF 64-bit'

      - name: Regressionem canonicam exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: bash tests/run_tests.sh
