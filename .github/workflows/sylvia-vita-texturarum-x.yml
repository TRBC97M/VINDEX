name: Sylvia OS — Vita texturarum X

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_backend_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/bibliotheca/fenestrale_coda_graphica.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/vita_texturarum_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/coda_compositionis_x.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/verifica_abi_graphica_viii.py'
      - 'documenta/sylvia/JL_UX_FUNDAMENTUM_GRAPHICUM_MODERNUM.md'
      - 'CONSILIUM.md'
      - '.github/workflows/sylvia-vita-texturarum-x.yml'

permissions:
  contents: read

jobs:
  vita-texturarum:
    name: Crea, renova, libera et rollback probantur
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v5

      - name: Instrumenta para
        shell: bash
        run: chmod +x 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'

      - name: Puritatem et ABI verifica
        shell: bash
        run: |
          set -euo pipefail
          python3 instrumenta/verifica_puritatem_sylviae.py
          python3 'Vindex Chat-GPT/vindex_final_v51/instrumenta/verifica_abi_graphica_viii.py'

      - name: Vitam texturarum native exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex probationes/vita_texturarum_x.vindex /tmp/vita-texturarum-x
          chmod +x /tmp/vita-texturarum-x
          timeout 25s /tmp/vita-texturarum-x
          printf '%s\n' 'RECTE: CREA, RENOVA, LIBERA et rollback resource probata sunt.'

      - name: Incrementa F1 ad F3 iterum exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          for fons in backend_accelerabilis_x cache_texturarum_x coda_compositionis_x scena_compositoris_x; do
            ./compilator_vindex "probationes/$fons.vindex" "/tmp/$fons"
            chmod +x "/tmp/$fons"
            timeout 25s "/tmp/$fons"
          done

      - name: Payload Sylviae integrum compila
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex systema/fenestrale_ii_purus_i.vindex /tmp/fenestrale-xiif4
          file /tmp/fenestrale-xiif4 | grep -q 'ELF 64-bit'

      - name: Regressionem canonicam exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: bash tests/run_tests.sh
