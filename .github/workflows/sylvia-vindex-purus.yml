name: Sylvia VINDEX purum

on:
  push:
    branches:
      - main
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/**'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/uefi_voca6.vindex'
      - 'instrumenta/verifica_puritatem_sylviae.py'
      - '.github/workflows/sylvia-vindex-purus.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/**'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/uefi_voca6.vindex'
      - 'instrumenta/verifica_puritatem_sylviae.py'
      - '.github/workflows/sylvia-vindex-purus.yml'

permissions:
  contents: read

jobs:
  puritas:
    name: Nulla exceptio non-VINDEX in Sylvia
    runs-on: ubuntu-24.04
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v5

      - name: Puritatem absolutam verifica
        shell: bash
        run: python3 instrumenta/verifica_puritatem_sylviae.py

      - name: Compilatorem canonicum usa
        shell: bash
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        run: chmod +x ./compilator_vindex

      - name: Intrinsecum UEFI_VOCA6 compila et ABI inspice
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex probationes/uefi_voca6.vindex /tmp/uefi_voca6
          python3 - <<'PY'
          from pathlib import Path
          data = Path('/tmp/uefi_voca6').read_bytes()
          sig = bytes.fromhex('41 54 49 89 e4 48 83 e4 f0 48 83 ec 30 4c 89 54 24 20 4c 89 5c 24 28 ff d0 4c 89 e4 41 5c')
          if sig not in data:
              raise SystemExit('ERRATUM: series ABI Microsoft x64 pro UEFI_VOCA6 in binario non inventa est')
          print('RECTE: ABI UEFI_VOCA6 in binario inventa est.')
          PY

      - name: Nucleum VINDEX purum compila
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex systema/nucleus.vindex /tmp/nucleus_vindex_purus.elf
          test -s /tmp/nucleus_vindex_purus.elf
          stat -c 'Nucleus: %s octeta' /tmp/nucleus_vindex_purus.elf

      - name: Applicationem et imaginem UEFI sine C construe
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x systema/uefi/construe_uefi_purum.sh
          systema/uefi/construe_uefi_purum.sh /tmp/systema_vindex_uefi.img /tmp/BOOTX64.EFI
          file /tmp/BOOTX64.EFI | grep -q 'PE32+.*EFI application'
          test -s /tmp/systema_vindex_uefi.img
          python3 ../../../instrumenta/verifica_puritatem_sylviae.py
