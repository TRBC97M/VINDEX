name: Sylvia VINDEX purum

on:
  push:
    branches:
      - chatgpt/custos-vindex-purus
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  puritas:
    runs-on: ubuntu-latest
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v4

      - name: Nucleum ad runtime VINDEX purum migra
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '(^|[^A-Z0-9_])POLLE\(\)' 'Vindex Chat-GPT/vindex_final_v51/systema/nucleus.vindex'; then
            # Instrumentum transitorium adhuc compilatorem 0.51 tangit; ille mox 0.53 canonico substituitur.
            sed -i 's/if "POLLE()" in nuc:/if "= POLLE()" in nuc:/' instrumenta/custos_patch_vindex_purus.py
            python3 instrumenta/custos_patch_vindex_purus.py
          fi
          python3 instrumenta/custos_reloca_textus_sylviae.py

      - name: Compilatorem VINDEX 0.53 canonicum usa et UEFI verifica
        shell: bash
        run: |
          set -euo pipefail
          chmod +x 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
          python3 instrumenta/custos_patch_vindex_053_uefi.py
          ! grep -q '50333704' 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'

      - name: Fontes runtime hereditatos ex exemplari CI remove
        shell: bash
        run: |
          set -euo pipefail
          find 'Vindex Chat-GPT/vindex_final_v51/systema' -type f \
            \( -name '*.c' -o -name '*.h' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' -o -name '*.S' -o -name '*.s' -o -name '*.asm' -o -name '*.rs' \) \
            ! -path '*/systema/uefi/bootstrap_uefi.c' -delete
          python3 instrumenta/verifica_puritatem_sylviae.py

      - name: Compilatorem VINDEX 0.53 extensum se ipsum compilare verifica
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          wc -c src/compilator_vindex.vindex
          ./compilator_vindex src/compilator_vindex.vindex /tmp/compilator_vindex_novus
          chmod +x /tmp/compilator_vindex_novus
          /tmp/compilator_vindex_novus src/compilator_vindex.vindex /tmp/compilator_vindex_bis
          cmp /tmp/compilator_vindex_novus /tmp/compilator_vindex_bis

      - name: Intrinsecum UEFI_VOCA6 compila et ABI inspice
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          /tmp/compilator_vindex_novus probationes/uefi_voca6.vindex /tmp/uefi_voca6
          python3 - <<'PY'
          from pathlib import Path
          data = Path('/tmp/uefi_voca6').read_bytes()
          sig = bytes.fromhex('41 54 49 89 e4 48 83 e4 f0 48 83 ec 30 4c 89 54 24 20 4c 89 5c 24 28 ff d0 4c 89 e4 41 5c')
          if sig not in data:
              raise SystemExit('ERRATUM: series ABI Microsoft x64 pro UEFI_VOCA6 in binario non inventa est')
          print('RECTE: ABI UEFI_VOCA6 in binario inventa est.')
          PY

      - name: Nucleum VINDEX purum compila
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          /tmp/compilator_vindex_novus systema/nucleus.vindex /tmp/nucleus_vindex_purus.elf
          test -s /tmp/nucleus_vindex_purus.elf
          stat -c 'Nucleus: %s octeta' /tmp/nucleus_vindex_purus.elf

      - name: Applicatio UEFI cum bootstrap minimo construe
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/compilator_vindex_novus compilator_vindex
          chmod +x compilator_vindex systema/uefi/construe_uefi.sh
          systema/uefi/construe_uefi.sh /tmp/systema_vindex_uefi.img /tmp/BOOTX64.EFI
          file /tmp/BOOTX64.EFI
          test -s /tmp/systema_vindex_uefi.img

      - name: Nulla regressio POLLE aut runtime non-VINDEX
        shell: bash
        run: |
          set -euo pipefail
          python3 instrumenta/verifica_puritatem_sylviae.py

      - name: Mutationes probatas in ramo persiste
        if: github.event_name == 'push' && github.ref == 'refs/heads/chatgpt/custos-vindex-purus'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex' \
            'Vindex Chat-GPT/vindex_final_v51/compilator_vindex' \
            'Vindex Chat-GPT/vindex_final_v51/systema'
          if ! git diff --cached --quiet; then
            git commit -m 'Sylvia OS: runtime non-VINDEX expurgatur'
            git push origin HEAD:chatgpt/custos-vindex-purus
          else
            printf '%s\n' 'RECTE: mutationes probatae iam in ramo persistunt.'
          fi
