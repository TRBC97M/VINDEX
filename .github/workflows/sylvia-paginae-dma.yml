name: Sylvia OS — Paginae DMA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/systema/rectores/mmio.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/rectores/paginae_dma.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/probationes/paginae_dma.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/systema/proba_paginae_dma.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/instrumenta/proba_paginae_dma_053.sh'
      - 'documenta/vindex/MMIO.md'
      - 'documenta/vindex/PAGINAE_DMA.md'
      - 'CONSILIUM.md'
      - '.github/workflows/sylvia-paginae-dma.yml'

permissions:
  contents: read

jobs:
  paginae-dma:
    name: Proprietas, cache et liberatio probantur
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v5

      - name: QEMU et OVMF institue
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf file

      - name: Instrumenta para
        shell: bash
        run: |
          chmod +x 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
          chmod +x 'Vindex Chat-GPT/vindex_final_v51/instrumenta/proba_paginae_dma_053.sh'

      - name: Puritatem et fontes verifica
        shell: bash
        run: |
          set -euo pipefail
          python3 instrumenta/verifica_puritatem_sylviae.py
          cd 'Vindex Chat-GPT/vindex_final_v51'
          python3 instrumenta/vindex_verifica.py probationes/paginae_dma.vindex
          cd systema
          python3 ../instrumenta/vindex_verifica.py proba_paginae_dma.vindex

      - name: Descriptor DMA native exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          ./compilator_vindex probationes/paginae_dma.vindex /tmp/paginae-dma
          chmod +x /tmp/paginae-dma
          /tmp/paginae-dma
          printf '%s\n' 'RECTE: descriptor DMA native probatus est.'

      - name: Regressiones canonicas exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: bash tests/run_tests.sh

      - name: Paginas DMA sub firmware exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: bash ./instrumenta/proba_paginae_dma_053.sh
