name: TEMP — localis F9-II layout diag
on:
  push:
    paths:
      - '.github/workflows/tmp-localis-rama-diag.yml'
permissions:
  contents: read
jobs:
  proba:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Reproduce layout F9-II sine GPU post FNV
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./compilator_vindex
          cat >/tmp/localis.vindex <<'VX'
          FUNCTIO RECTE REDDENS NUMERUS.
              REDDE 1.
          FIN-FUNCTIO.

          FUNCTIO CASUS_F9 REDDENS NUMERUS.
              ACCIPIT systema SICUT NUMERUS.
              ACCIPIT bus SICUT NUMERUS.
              ACCIPIT apparatus SICUT NUMERUS.
              ACCIPIT functio SICUT NUMERUS.
              DECLARA gestor SICUT NUMERUS VALENS 9001.
              DECLARA pura SICUT NUMERUS VALENS 1.
              DECLARA vp SICUT NUMERUS VALENS 123456.
              SI RECTE()==0 TUNC
                  DECLARA x0 SICUT NUMERUS VALENS 0.
                  REDDE 40.
              FIN-SI.
              DECLARA oblatae SICUT NUMERUS VALENS 257.
              SI RECTE()==0 TUNC
                  DECLARA x1 SICUT NUMERUS VALENS 0.
                  REDDE 41.
              FIN-SI.
              DECLARA acceptae SICUT NUMERUS VALENS oblatae.
              SI RECTE()==0 TUNC
                  DECLARA x2 SICUT NUMERUS VALENS 0.
                  REDDE 42.
              FIN-SI.
              SI vp!=123456 TUNC REDDE 24. FIN-SI.
              SI gestor!=9001 TUNC REDDE 25. FIN-SI.
              SI pura!=1 TUNC REDDE 26. FIN-SI.
              SI oblatae!=257 TUNC REDDE 27. FIN-SI.
              SI acceptae!=257 TUNC REDDE 28. FIN-SI.
              SI systema!=11 TUNC REDDE 29. FIN-SI.
              SI bus!=22 TUNC REDDE 30. FIN-SI.
              SI apparatus!=33 TUNC REDDE 31. FIN-SI.
              SI functio!=44 TUNC REDDE 32. FIN-SI.
              REDDE 0.
          FIN-FUNCTIO.

          FUNCTIO CASUS_STAGIATUS REDDENS NUMERUS.
              ACCIPIT systema SICUT NUMERUS.
              ACCIPIT bus SICUT NUMERUS.
              ACCIPIT apparatus SICUT NUMERUS.
              ACCIPIT functio SICUT NUMERUS.
              DECLARA gestor SICUT NUMERUS VALENS 9001.
              DECLARA pura SICUT NUMERUS VALENS 1.
              DECLARA vp SICUT NUMERUS VALENS 123456.
              SI RECTE()==0 TUNC DECLARA x0 SICUT NUMERUS VALENS 0. REDDE 40. FIN-SI.
              DECLARA oblatae SICUT NUMERUS VALENS 257.
              SI RECTE()==0 TUNC DECLARA x1 SICUT NUMERUS VALENS 0. REDDE 41. FIN-SI.
              DECLARA acceptae SICUT NUMERUS VALENS oblatae.
              DECLARA init_status SICUT NUMERUS VALENS RECTE().
              SI init_status==0 TUNC REDDE 42. FIN-SI.
              SI vp!=123456 TUNC REDDE 24. FIN-SI.
              REDDE 0.
          FIN-FUNCTIO.

          FUNCTIO PRINCIPALIS REDDENS NUMERUS.
              DECLARA r SICUT NUMERUS VALENS CASUS_F9(11,22,33,44).
              SI r!=0 TUNC REDDE r. FIN-SI.
              r=CASUS_STAGIATUS(11,22,33,44).
              SI r!=0 TUNC REDDE 100+r. FIN-SI.
              REDDE 0.
          FIN-FUNCTIO.
          VX
          ./compilator_vindex /tmp/localis.vindex /tmp/localis
          chmod +x /tmp/localis
          set +e
          /tmp/localis
          rc=$?
          set -e
          echo "LOCALIS_F9_POST_FNV_RC=$rc"
          test "$rc" -eq 0
