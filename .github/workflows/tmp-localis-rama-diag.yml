name: TEMP — localis in ramo diag
on:
  push:
    paths:
      - '.github/workflows/tmp-localis-rama-diag.yml'
permissions:
  contents: read
jobs:
  proba:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Reproduce sine GPU
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./compilator_vindex
          cat >/tmp/localis.vindex <<'VX'
          FUNCTIO CASUS_A REDDENS NUMERUS.
              DECLARA a SICUT NUMERUS VALENS 111.
              SI 0==1 TUNC
                  DECLARA x SICUT NUMERUS VALENS 0.
                  REDDE 9.
              FIN-SI.
              SI a!=111 TUNC REDDE 1. FIN-SI.
              REDDE 0.
          FIN-FUNCTIO.

          FUNCTIO AUX REDDENS NUMERUS.
              REDDE 7.
          FIN-FUNCTIO.

          FUNCTIO CASUS_B REDDENS NUMERUS.
              DECLARA a SICUT NUMERUS VALENS 111.
              DECLARA q SICUT NUMERUS VALENS AUX().
              SI q==0 TUNC
                  DECLARA x SICUT NUMERUS VALENS 0.
                  REDDE 9.
              FIN-SI.
              SI a!=111 TUNC REDDE 2. FIN-SI.
              SI q!=7 TUNC REDDE 3. FIN-SI.
              REDDE 0.
          FIN-FUNCTIO.

          FUNCTIO CASUS_C REDDENS NUMERUS.
              DECLARA a SICUT NUMERUS VALENS 111.
              SI AUX()==0 TUNC
                  DECLARA x SICUT NUMERUS VALENS 0.
                  REDDE 9.
              FIN-SI.
              SI a!=111 TUNC REDDE 4. FIN-SI.
              REDDE 0.
          FIN-FUNCTIO.

          FUNCTIO PRINCIPALIS REDDENS NUMERUS.
              DECLARA r SICUT NUMERUS VALENS CASUS_A().
              SI r!=0 TUNC REDDE 10+r. FIN-SI.
              r=CASUS_B(). SI r!=0 TUNC REDDE 20+r. FIN-SI.
              r=CASUS_C(). SI r!=0 TUNC REDDE 30+r. FIN-SI.
              REDDE 0.
          FIN-FUNCTIO.
          VX
          ./compilator_vindex /tmp/localis.vindex /tmp/localis
          chmod +x /tmp/localis
          set +e
          /tmp/localis
          rc=$?
          set -e
          echo "LOCALIS_RC=$rc"
          test "$rc" -eq 0
