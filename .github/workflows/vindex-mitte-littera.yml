name: VINDEX — MITTE LITTERA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/compilator_vindex'
      - 'Vindex Chat-GPT/vindex_final_v51/tests/proba_mitte_littera.vindex'
      - '.github/workflows/vindex-mitte-littera.yml'

jobs:
  pe-genera:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v4

      - name: Probationem PE32+ genera
        working-directory: Vindex Chat-GPT/vindex_final_v51
        shell: bash
        run: |
          set -euo pipefail
          chmod +x compilator_vindex
          ./compilator_vindex tests/proba_mitte_littera.vindex /tmp/proba_mitte_littera.exe pe
          file /tmp/proba_mitte_littera.exe

      - name: Productum conserva
        uses: actions/upload-artifact@v4
        with:
          name: proba-mitte-littera-win64
          path: /tmp/proba_mitte_littera.exe
          if-no-files-found: error
          retention-days: 1

  win64:
    needs: pe-genera
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Probationem accipe
        uses: actions/download-artifact@v4
        with:
          name: proba-mitte-littera-win64
          path: proba

      - name: MITTE LITTERA sub Windows vero exerce
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location .\proba
          Remove-Item .\proba_mitte_littera.bin -Force -ErrorAction SilentlyContinue
          $output = & .\proba_mitte_littera.exe 2>&1
          $code = $LASTEXITCODE
          $text = ($output -join "`n")
          Write-Host $text
          if ($code -ne 0) { throw "MITTE LITTERA Win64 exitus $code" }
          if (-not $text.StartsWith('ATD1')) { throw 'stdout non incipit ATD1' }
          if ($text -notmatch 'RECTE: MITTE LITTERA') { throw 'confirmatio deest' }
          if (!(Test-Path .\proba_mitte_littera.bin)) { throw 'fasciculus deest' }
          $b = [IO.File]::ReadAllBytes((Resolve-Path .\proba_mitte_littera.bin))
          $expectata = [byte[]](65,84,68,49,1)
          if ($b.Length -ne 5) { throw "mensura falsa: $($b.Length)" }
          for ($i=0; $i -lt 5; $i++) {
            if ($b[$i] -ne $expectata[$i]) { throw "octetum $i falsum: $($b[$i])" }
          }
          Write-Host 'RECTE: MITTE LITTERA Win64 exactum est.'
