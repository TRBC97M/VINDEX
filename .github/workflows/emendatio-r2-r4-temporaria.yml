name: Emendatio R2 R4 temporaria

on:
  push:
    branches:
      - chatgpt/vindex-r2-r4-fons-win64
    paths:
      - 'instrumenta/emenda_r2_r4_fons.py'
      - '.github/workflows/emendatio-r2-r4-temporaria.yml'

permissions:
  contents: write

jobs:
  emenda:
    name: Fontem compilatoris emenda
    runs-on: ubuntu-latest
    steps:
      - name: Repositorium accipe
        uses: actions/checkout@v4
        with:
          ref: chatgpt/vindex-r2-r4-fons-win64
      - name: Emendationem applica
        shell: bash
        run: |
          set -euo pipefail
          python3 instrumenta/emenda_r2_r4_fons.py
          if git diff --quiet; then
            echo 'RECTE: emendatio iam adest.'
            exit 0
          fi
          git config user.name 'VINDEX Custos'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Vindex Chat-GPT/vindex_final_v51/src/compilator_vindex.vindex'
          git commit -m 'R4: MITTE stdout sub Win64 recte traducitur'
          git push origin HEAD:chatgpt/vindex-r2-r4-fons-win64
