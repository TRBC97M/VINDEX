name: P16-III — Bureau Functionale

on:
  push:
    branches:
      - chatgpt/p16-bureau-iii

permissions:
  contents: write

jobs:
  proba:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Instrumenta UEFI institue
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf file

      - name: Bureau P16-III applica
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/p16_bureau.py
          git diff --check

      - name: Probationes canonicas
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./compilator_vindex
          bash ./tests/run_tests.sh

      - name: P16-I non regreditur
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        env:
          MORA_INITII: '28'
        run: |
          set -euo pipefail
          PROBATOR_FENESTRALIS="$PWD/instrumenta/proba_formam_sylviae_i.py" \
            bash ./instrumenta/proba_fenestrale_uefi_purum.sh

      - name: P16-II INITIUM non regreditur
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        env:
          MORA_INITII: '28'
        run: |
          set -euo pipefail
          PROBATOR_FENESTRALIS="$PWD/instrumenta/proba_initium_sylviae_ii.py" \
            bash ./instrumenta/proba_fenestrale_uefi_purum.sh

      - name: Bureau cum PS2 sub UEFI exerce
        working-directory: 'Vindex Chat-GPT/vindex_final_v51'
        shell: bash
        env:
          MORA_INITII: '28'
        run: |
          set -euo pipefail
          PROBATOR_FENESTRALIS="$PWD/instrumenta/proba_bureau_sylviae_iii.py" \
            bash ./instrumenta/proba_fenestrale_uefi_purum.sh

      - name: Statum probatum in ramo serva
        shell: bash
        run: |
          set -euo pipefail
          RADIX='Vindex Chat-GPT/vindex_final_v51'
          git add \
            "$RADIX/bibliotheca/fenestrale_ii_purus.vindex" \
            "$RADIX/bibliotheca/fenestrale_gestor_i.vindex" \
            "$RADIX/systema/fenestrale_ii_purus_i.vindex" \
            "$RADIX/instrumenta/proba_formam_sylviae_i.py" \
            "$RADIX/instrumenta/proba_bureau_sylviae_iii.py"
          git diff --cached --quiet && { printf '%s\n' 'RECTE: nihil novum servandum.'; exit 0; }
          git config user.name 'TRBC97M'
          git config user.email 'trbc97m@protonmail.com'
          git commit -m 'P16-III: bureau functionale Sylviae adde [skip ci]'
          git push origin HEAD:chatgpt/p16-bureau-iii
